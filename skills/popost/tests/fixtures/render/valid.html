<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;background:#f2f2f2}
  .post{width:300px;height:400px;background:#ffffff;padding:24px;box-sizing:border-box;
        font-family:-apple-system,"PingFang SC",sans-serif;display:flex;flex-direction:column;gap:12px}
  .post h1{font-size:22px;margin:0}
  .post p{font-size:14px;line-height:1.6;margin:0;color:#333}
  .badge{display:inline-block;padding:4px 10px;border-radius:12px;background:#eef;align-self:flex-start}
</style>
</head>
<body>
<div class="post">
  <span class="badge">原创示意</span>
  <h1>测试标题</h1>
  <p>这是一段用于真实截图验收的自包含正文，无外链、无脚本、无裂图。</p>
  <svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="#cdd6ff"/></svg>
</div>
</body>
</html>
