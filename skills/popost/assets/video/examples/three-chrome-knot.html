<!doctype html>
<html><head><meta charset="utf-8"><title>Chrome knot (three.js)</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
</style></head>
<body>
<canvas id="gl"></canvas>
  <script type="application/json" id="popost-params">
{
 "about": "A polished metal knot (or ring) that turns and shows its surroundings in its surface: true 3D with reflections, lit by a drawn environment. For a glossy logo mark or an object a flat stand-in would not pass for.",
 "class": "3d",
 "seconds": 4,
 "tags": [
  "three",
  "3d",
  "chrome",
  "metal",
  "reflection",
  "glossy",
  "knot",
  "torus",
  "webgl"
 ],
 "params": [
  {
   "name": "shape",
   "type": "choice",
   "default": "knot",
   "options": [
    "knot",
    "torus",
    "sphere",
    "capsule"
   ],
   "what": "the object"
  },
  {
   "name": "roughness",
   "type": "number",
   "default": 0.1,
   "min": 0,
   "max": 1,
   "what": "how matte the metal is: 0 a mirror, 0.4 brushed"
  },
  {
   "name": "metalness",
   "type": "number",
   "default": 1,
   "min": 0,
   "max": 1,
   "what": "1 metal, 0 glossy plastic"
  },
  {
   "name": "spinX",
   "type": "number",
   "default": 1.3,
   "min": -6,
   "max": 6,
   "what": "how fast it turns over",
   "unit": "radians a second"
  },
  {
   "name": "spinY",
   "type": "number",
   "default": 0.9,
   "min": -6,
   "max": 6,
   "what": "how fast it turns round",
   "unit": "radians a second"
  },
  {
   "name": "distance",
   "type": "number",
   "default": 9,
   "min": 3,
   "max": 40,
   "what": "how far the camera stands"
  },
  {
   "name": "color",
   "type": "colour",
   "default": "#ffffff",
   "what": "the metal"
  },
  {
   "name": "tint",
   "type": "colour",
   "default": "#3a3aff",
   "what": "the sky it reflects"
  },
  {
   "name": "floor",
   "type": "colour",
   "default": "#ffb38a",
   "what": "the floor it reflects"
  },
  {
   "name": "disc",
   "type": "colour",
   "default": "#ffd936",
   "what": "the disc behind it"
  },
  {
   "name": "ground",
   "type": "colour",
   "default": "#0a0a0c",
   "what": "the background"
  },
  {
   "name": "delay",
   "type": "number",
   "default": 0.2,
   "min": 0,
   "max": 20,
   "unit": "seconds",
   "what": "when the effect starts, from the start of the shot"
  }
 ],
 "values": {}
}
  </script>
  <script src="../lib/three.min.js"></script>
  <script>
    // The parameters of this copy: the declared defaults, then what "values" sets.
    var P = (function () { var b = JSON.parse(document.getElementById('popost-params').textContent), v = {}; b.params.forEach(function (p) { v[p.name] = p['default']; }); for (var k in b.values) v[k] = b.values[k]; return v; })();
    // The canvas, from the size this file declares for html and body: a scene of a later shot loads in a layer that
    // is not displayed, where the page itself measures 0 until its first frame.
    var SIZE = /html, body \{ margin: 0; width: (\d+)px; height: (\d+)px;/.exec(document.querySelector('style').textContent), W = Number(SIZE[1]), H = Number(SIZE[2]), U = Math.min(W, H) / 720;
    // One renderer, made once; every frame is drawn from render(seconds) alone: no animation loop, no clock.
    var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(W, H, false);
    var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 200);
    renderer.setClearColor(P.ground); camera.position.set(0, 0, P.distance);
    // What the metal reflects: a picture drawn on a canvas (a sky, a horizon, a floor and a row of lamps), so that
    // nothing is loaded from the network.
    var envCanvas = document.createElement('canvas'); envCanvas.width = 1024; envCanvas.height = 512;
    var e2 = envCanvas.getContext('2d'), sky = e2.createLinearGradient(0, 0, 0, 512);
    sky.addColorStop(0, '#ffffff'); sky.addColorStop(0.42, P.tint); sky.addColorStop(0.5, '#0b0b12'); sky.addColorStop(1, P.floor);
    e2.fillStyle = sky; e2.fillRect(0, 0, 1024, 512);
    for (var i = 0; i < 10; i++) { e2.fillStyle = '#ffffff'; e2.fillRect(i * 102 + 20, 110, 34, 150); }
    var env = new THREE.CanvasTexture(envCanvas); env.mapping = THREE.EquirectangularReflectionMapping; scene.environment = env;
    var G = { knot: new THREE.TorusKnotGeometry(1.5, 0.42, 220, 32), torus: new THREE.TorusGeometry(1.6, 0.55, 48, 160), sphere: new THREE.SphereGeometry(1.9, 96, 64), capsule: new THREE.CapsuleGeometry(1, 2, 24, 64) };
    var mesh = new THREE.Mesh(G[P.shape], new THREE.MeshStandardMaterial({ metalness: P.metalness, roughness: P.roughness, color: new THREE.Color(P.color) }));
    var disc = new THREE.Mesh(new THREE.CircleGeometry(1.9, 96), new THREE.MeshBasicMaterial({ color: new THREE.Color(P.disc) })); disc.position.z = -2.4;
    scene.add(mesh, disc);
    window.__popostScene = { cues: [{ at: P.delay, cue: 'shimmer', gain: 0.4, effect: 'three' }], render: function (seconds) {
      // In over the first 0.6 s on a spring, then turning for as long as the shot lasts.
      var u = Math.max(0, seconds - P.delay), k = u <= 0 ? 0 : 1 - Math.exp(-7 * u) * Math.cos(9 * u);
      mesh.scale.setScalar(Math.max(0.0001, k)); disc.scale.setScalar(Math.max(0.0001, Math.min(1, u * 3)));
      mesh.rotation.set(u * P.spinX, u * P.spinY, 0);
      renderer.render(scene, camera);
    } };
  </script>
</body></html>
