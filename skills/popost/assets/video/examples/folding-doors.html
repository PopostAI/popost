<!doctype html>
<html><head><meta charset="utf-8"><title>folding doors</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0c0e14; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
  .pic { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .pic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Drawn stand-ins for the two pictures, seen until a slot gives a picture or you put your own HTML inside. */
  .old { background: linear-gradient(#ee6c4d, #ee6c4d) 50% 46% / 42% 9% no-repeat, linear-gradient(#fca311, #fca311) 50% 62% / 18% 3% no-repeat, #14213d; }
  .next { background: linear-gradient(#3d5a80, #3d5a80) 0 0 / 100% 12% no-repeat, linear-gradient(#ee6c4d, #ee6c4d) 9% 30% / 34% 9% no-repeat, linear-gradient(#98c1d9, #98c1d9) 9% 50% / 46% 5% no-repeat,
                      linear-gradient(#98c1d9, #98c1d9) 9% 62% / 38% 5% no-repeat, linear-gradient(#5c7ea8, #5c7ea8) 88% 70% / 32% 44% no-repeat, #f4f5f7; }
  #doors { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .panel { position: absolute; overflow: hidden; }
  .panel .dark { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000000; opacity: 0; }
</style></head>
<body>
  <!-- The old picture is cut into panels that fold away to both sides like doors, and the next picture stands behind
       them. "old" is on the doors, "next" behind: give each a picture with a slot, or put your own HTML into .next. -->
  <div id="stage">
    <div class="pic next"><img data-slot="next" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>
    <div id="doors"></div>
  </div>
  <script type="application/json" id="popost-params">
  {
   "about": "Folding doors: the old picture splits down the middle and its panels fold away to both sides in depth, showing the next picture behind them.",
   "params": [
    { "name": "panels", "type": "choice", "default": 2, "options": [
      2,
      4,
      6,
      8
     ], "what": "how many panels in all: 2 is a pair of doors, more fold like a screen" },
    { "name": "axis", "type": "choice", "default": "vertical", "options": [ "vertical", "horizontal" ], "what": "vertical: upright panels that open sideways; horizontal: panels that open up and down" },
    { "name": "swing", "type": "choice", "default": "toward", "options": [ "toward", "away" ], "what": "whether the doors swing toward the viewer or away" },
    { "name": "depth", "type": "number", "default": 1.6, "min": 0.5, "max": 8, "unit": "canvas widths", "what": "how far the viewer stands: smaller is a stronger perspective" },
    { "name": "shade", "type": "number", "default": 0.5, "min": 0, "max": 1, "unit": "0 to 1", "what": "how dark a panel gets as it turns away from the light" },
    { "name": "duration", "type": "number", "default": 1, "min": 0.1, "max": 20, "unit": "seconds", "what": "how long the doors take to open" },
    { "name": "delay", "type": "number", "default": 0.2, "min": 0, "max": 20, "unit": "seconds", "what": "when the effect starts, from the start of the shot" },
    { "name": "ease", "type": "choice", "default": "in-out", "options": [ "linear", "in", "out", "in-out" ], "what": "how the motion speeds up and slows down" }
   ],
   "values": {}
  }
  </script>
  <script>
    // The declared parameters: each default, replaced by what "values" gives.
    var block = JSON.parse(document.getElementById('popost-params').textContent), P = {};
    block.params.forEach(function (p) { P[p.name] = block.values && block.values[p.name] !== undefined ? block.values[p.name] : p.default; });
    var clamp01 = function (t) { return Math.min(1, Math.max(0, t)); };
    var ease = function (t) {
      t = clamp01(t);
      return P.ease === 'in' ? t * t * t : P.ease === 'out' ? 1 - Math.pow(1 - t, 3) : P.ease === 'in-out' ? (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2) : t;
    };

    // Everything that depends on the size of the canvas is made on the first frame that shows the scene: while a scene
    // waits for its shot it is not laid out, and measures 0.
    function make() {
      var W = document.documentElement.clientWidth, H = document.documentElement.clientHeight;
      if (!W || !H) return null;
      var doors = document.getElementById('doors'), upright = P.axis !== 'horizontal';
      var across = upright ? W : H, n = Number(P.panels), size = across / n, turn = upright ? 'rotateY' : 'rotateX', move = upright ? 'translateX' : 'translateY';
      doors.style.perspective = (P.depth * W) + 'px';
      var panels = [];
      for (var i = 0; i < n; i++) {
        var el = document.createElement('div');
        el.className = 'panel';
        el.style.cssText = upright ? 'top:0;height:' + H + 'px;left:' + (i * size) + 'px;width:' + size + 'px' : 'left:0;width:' + W + 'px;top:' + (i * size) + 'px;height:' + size + 'px';
        // Each panel shows its own part of the old picture.
        el.innerHTML = '<div class="pic old" style="width:' + W + 'px;height:' + H + 'px;' + (upright ? 'left:' : 'top:') + (-i * size) + 'px"><img data-slot="old" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div><div class="dark"></div>';
        doors.appendChild(el);
        panels.push(el);
      }

      return function (seconds) {
        var e = ease((seconds - P.delay) / P.duration), fold = 90 * e, shrink = Math.cos(fold * Math.PI / 180) - 1;
        var way = (P.swing === 'away' ? -1 : 1) * (upright ? 1 : -1);
        panels.forEach(function (el, i) {
          var left = i < n / 2, j = left ? i : n - 1 - i;                 // j: the panel's place counted from the outer edge
          var outer = j % 2 === 0;                                       // hinged on its outer edge, or on its inner one
          var near = left ? (outer ? 0 : 1) : (outer ? 1 : 0);           // which of its two edges holds still: 0 the first, 1 the second
          var shift = (outer ? j : j + 1) * size * shrink * (left ? 1 : -1);
          var angle = fold * way * (left ? 1 : -1) * (outer ? 1 : -1);
          el.style.transformOrigin = upright ? (near ? '100% 50%' : '0% 50%') : (near ? '50% 100%' : '50% 0%');
          el.style.transform = move + '(' + shift.toFixed(2) + 'px) ' + turn + '(' + angle.toFixed(3) + 'deg)';
          el.style.visibility = e >= 1 ? 'hidden' : 'visible';
          el.lastChild.style.opacity = (P.shade * Math.sin(fold * Math.PI / 180) * (outer ? 1 : 0.55)).toFixed(3);
        });
      };
    }
    var drawing = null;
    function draw(seconds) { drawing = drawing || make(); if (drawing) drawing(seconds); }
    window.__popostScene = { render: function (seconds) { draw(seconds); } };
    draw(0);
  </script>
</body></html>
