<!doctype html>
<html><head><meta charset="utf-8"><title>Instanced cube wave with an orbiting camera (three.js)</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
</style></head>
<body>
<canvas id="gl"></canvas>
  <script type="application/json" id="popost-params">
{
 "about": "A field of cubes that rise and fall as a wave travels through them from the middle, drawn as one instanced mesh, while the camera circles: depth, light and shadow that a flat drawing cannot give.",
 "class": "3d",
 "seconds": 5,
 "tags": [
  "three",
  "3d",
  "cubes",
  "wave",
  "instanced",
  "orbit",
  "camera",
  "grid",
  "webgl"
 ],
 "params": [
  {
   "name": "grid",
   "type": "number",
   "default": 18,
   "min": 4,
   "max": 48,
   "what": "cubes along each side"
  },
  {
   "name": "height",
   "type": "number",
   "default": 1.6,
   "min": 0,
   "max": 6,
   "what": "how high the wave lifts a cube"
  },
  {
   "name": "speed",
   "type": "number",
   "default": 2.2,
   "min": 0,
   "max": 12,
   "what": "how fast the wave travels",
   "unit": "radians a second"
  },
  {
   "name": "length",
   "type": "number",
   "default": 0.55,
   "min": 0.05,
   "max": 3,
   "what": "how tight the rings of the wave are"
  },
  {
   "name": "orbit",
   "type": "number",
   "default": 0.25,
   "min": -3,
   "max": 3,
   "what": "how fast the camera circles",
   "unit": "radians a second"
  },
  {
   "name": "elevation",
   "type": "number",
   "default": 0.6,
   "min": 0.1,
   "max": 1.5,
   "what": "how high the camera looks from",
   "unit": "radians"
  },
  {
   "name": "color",
   "type": "colour",
   "default": "#4cc9f0",
   "what": "the low cubes"
  },
  {
   "name": "peak",
   "type": "colour",
   "default": "#f72585",
   "what": "the cubes at the top of the wave"
  },
  {
   "name": "ground",
   "type": "colour",
   "default": "#0b090a",
   "what": "the background"
  },
  {
   "name": "delay",
   "type": "number",
   "default": 0.2,
   "min": 0,
   "max": 20,
   "unit": "seconds",
   "what": "when the effect starts, from the start of the shot"
  }
 ],
 "values": {}
}
  </script>
  <script src="../lib/three.min.js"></script>
  <script>
    // The parameters of this copy: the declared defaults, then what "values" sets.
    var P = (function () { var b = JSON.parse(document.getElementById('popost-params').textContent), v = {}; b.params.forEach(function (p) { v[p.name] = p['default']; }); for (var k in b.values) v[k] = b.values[k]; return v; })();
    // The canvas, from the size this file declares for html and body: a scene of a later shot loads in a layer that
    // is not displayed, where the page itself measures 0 until its first frame.
    var SIZE = /html, body \{ margin: 0; width: (\d+)px; height: (\d+)px;/.exec(document.querySelector('style').textContent), W = Number(SIZE[1]), H = Number(SIZE[2]), U = Math.min(W, H) / 720;
    // One renderer, made once; every frame is drawn from render(seconds) alone: no animation loop, no clock.
    var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(W, H, false);
    var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 200);
    renderer.setClearColor(P.ground);
    var n = Math.round(P.grid), box = new THREE.BoxGeometry(0.82, 1, 0.82); box.translate(0, 0.5, 0);
    var mesh = new THREE.InstancedMesh(box, new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.1 }), n * n);
    var low = new THREE.Color(P.color), high = new THREE.Color(P.peak), tmp = new THREE.Color(), m4 = new THREE.Matrix4();
    scene.add(mesh, new THREE.HemisphereLight(0xffffff, 0x202030, 0.7));
    var sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(6, 12, 4); scene.add(sun);
    window.__popostScene = { cues: [{ at: P.delay, cue: 'swish', gain: 0.4, effect: 'three' }], render: function (seconds) {
      var u = seconds - P.delay, open = Math.min(1, Math.max(0, u / 0.8)), k = 0;
      for (var z = 0; z < n; z++) for (var x = 0; x < n; x++, k++) {
        var px = x - (n - 1) / 2, pz = z - (n - 1) / 2, d = Math.hypot(px, pz), w = 0.5 + 0.5 * Math.sin(d * P.length - u * P.speed);
        // The wave opens from the middle outwards over the first 0.8 s.
        var h = 0.15 + P.height * w * Math.min(1, Math.max(0, open * (n / 1.4) - d));
        m4.makeScale(1, Math.max(0.02, h), 1); m4.setPosition(px, 0, pz); mesh.setMatrixAt(k, m4);
        mesh.setColorAt(k, tmp.copy(low).lerp(high, w * w));
      }
      mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
      var a = 0.7 + seconds * P.orbit, r = n * 1.25;
      camera.position.set(Math.cos(a) * r * Math.cos(P.elevation), r * Math.sin(P.elevation), Math.sin(a) * r * Math.cos(P.elevation)); camera.lookAt(0, 0.4, 0);
      renderer.render(scene, camera);
    } };
  </script>
</body></html>
