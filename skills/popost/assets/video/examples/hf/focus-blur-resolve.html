<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Focus Blur Resolve - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 900px;
        min-height: 500px;
        padding: 64px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~65% of frame */
        transform: scale(2.8);
      }
      .hf-catalog-focus-blur-resolve {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-focus-blur-resolve {
        display: inline-flex;
        gap: 12px;
        font-size: 56px;
        line-height: 1;
      }
      .hf-catalog-focus-blur-resolve span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A premium focus pull from heavy blur to crisp text, then a soft blur-out exit.",
 "class": "camera",
 "tags": [
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Word colour: ink for light frames, paper for dark ones, accent rides --brand."
  },
  {
   "name": "size",
   "type": "choice",
   "default": "standard",
   "options": [
    "compact",
    "standard",
    "display"
   ],
   "what": "Type size of the words, from a caption-scale line to a full display card."
  },
  {
   "name": "blur",
   "type": "choice",
   "default": "standard",
   "options": [
    "soft",
    "standard",
    "heavy"
   ],
   "what": "Scales the blur radius the timeline drives, so the focus pull starts as a light haze or a full smear."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="focus-blur-resolve-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-catalog-focus-blur-resolve"
          data-composition-variables='[
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "size", "type": "enum", "role": "style", "label": "Size", "description": "Type size of the words, from a caption-scale line to a full display card.", "default": "standard", "options": [{ "value": "compact", "label": "Compact" }, { "value": "standard", "label": "Standard" }, { "value": "display", "label": "Display" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Scales the blur radius the timeline drives, so the focus pull starts as a light haze or a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] }
  ]'
        >
          <span>Crystal</span><span>clear</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var tones = { ink: "#18181b", paper: "#fafafa", accent: "var(--brand, #34d399)" };
          var sizes = { compact: "40px", standard: "56px", display: "84px" };
          var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };

          var tone = tones[pick(tones, vars.tone, "ink")];
          var size = sizes[pick(sizes, vars.size, "standard")];
          var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];

          var roots = document.querySelectorAll(".hf-catalog-focus-blur-resolve");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-word-color", tone);
            roots[i].style.setProperty("--hf-word-size", size);
            roots[i].style.setProperty("--hf-word-blur-scale", String(blurScale));
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-focus-blur-resolve span",
          { opacity: 0, "--hf-word-scale": 1.08, "--hf-word-blur": "16px" },
          {
            opacity: 1,
            "--hf-word-scale": 1,
            "--hf-word-blur": "0px",
            duration: 0.52,
            stagger: 0.05,
            ease: "power3.out",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["focus-blur-resolve-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-focus-blur-resolve {
        color: var(--hf-word-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-focus-blur-resolve {
        display: inline-flex;
        gap: 12px;
        font-size: var(--hf-word-size, 56px);
        line-height: 1;
      }
      .hf-catalog-focus-blur-resolve span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(calc(var(--hf-word-blur, 0px) * var(--hf-word-blur-scale, 1)));
        will-change: transform, filter, opacity;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
