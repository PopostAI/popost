<html data-composition-variables='[
    { "id": "progress", "type": "number", "role": "timing", "label": "Draw progress", "description": "Final percentage of the outline that is drawn.", "default": 100, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "thickness", "type": "number", "role": "layout", "label": "Stroke thickness", "description": "Outline stroke in tenths of the host width.", "default": 6, "min": 1, "max": 20, "step": 1, "unit": "0.1cqw" },
    { "id": "radius", "type": "number", "role": "layout", "label": "Corner radius", "description": "Corner radius in tenths of the host smaller dimension.", "default": 24, "min": 0, "max": 80, "step": 1, "unit": "0.1cqmin" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Outline Draw Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #05070d);
      }

      #root {
        --bg: #05070d;
        --surface: #131b2e;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #38bdf8;
        --space-8: 8cqmin;
        --radius-lg: 2.8cqmin;
        --shadow-panel: 0 3.8cqh 8.4cqh rgb(0 0 0 / 45%);
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, var(--surface) 0%, var(--bg) 70%);
      }

      .mount-card {
        width: 64%;
        height: 56%;
        left: 18%;
        top: 22%;
        container-type: size;
        overflow: hidden;
        border: 0.12cqmin solid color-mix(in srgb, var(--border) 75%, transparent);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-panel);
      }

      .mount-card::before {
        content: "PROOF";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--fg);
        font-family: var(--font-display, Inter, system-ui, sans-serif);
        font-size: 8cqh;
        font-weight: 750;
        letter-spacing: 0.08em;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A rounded outline that proves a callout by drawing clockwise as a hollow conic-gradient border with a clean closure.",
 "class": "shape",
 "tags": [
  "motion-primitive",
  "effects",
  "outline",
  "border",
  "mask",
  "proof"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "progress",
   "type": "number",
   "default": 100,
   "min": 0,
   "max": 100,
   "unit": "%",
   "what": "Final percentage of the outline that is drawn."
  },
  {
   "name": "thickness",
   "type": "number",
   "default": 6,
   "min": 1,
   "max": 20,
   "unit": "0.1cqw",
   "what": "Outline stroke in tenths of the host width."
  },
  {
   "name": "radius",
   "type": "number",
   "default": 24,
   "min": 0,
   "max": 80,
   "unit": "0.1cqmin",
   "what": "Corner radius in tenths of the host smaller dimension."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"progress":100,"thickness":10,"radius":42};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="outline-draw-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="outline-draw-mount"
        class="mount-card clip"
        data-composition-id="outline-draw"
       
        data-variable-values='{"progress":100,"thickness":10,"radius":42}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1229"
        data-height="605"
      >
      <div id="root" data-composition-id="outline-draw" data-duration="4" data-fps="30">
        <style>
          @property --od-progress {
            syntax: "<number>";
            inherits: false;
            initial-value: 0;
          }

          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            pointer-events: none;
          }

          .od-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          /* EDIT ZONE: --space-8 controls the safe inset. The public
             thickness and radius variables own the remaining geometry. */
          .od-outline {
            --od-progress: 0;
            --od-thickness: 6;
            --od-radius: 24;
            --od-seam-overlap: 0.5deg;
            position: absolute;
            inset: var(--space-8, 8cqmin);
            border: calc(var(--od-thickness) * 0.1cqw) solid transparent;
            border-radius: calc(var(--od-radius) * 0.1cqmin);
            background: conic-gradient(
              from -90deg,
              var(--accent, #38bdf8) 0deg calc(var(--od-progress) * 3.6deg),
              transparent calc(var(--od-progress) * 3.6deg + var(--od-seam-overlap)) 360deg
            );
            background-clip: border-box;
            background-origin: border-box;
            mask:
              linear-gradient(var(--fg, #f8fafc) 0 0) padding-box,
              linear-gradient(var(--fg, #f8fafc) 0 0) border-box;
            mask-composite: exclude;
            will-change: opacity;
          }

          /* INVARIANT: the 0.5deg feather overlaps the coincident conic
             edges at closure so 0deg and 360deg never expose a hard seam. */
        </style>

        <div
          id="outline-draw-clip"
          class="od-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="od-outline" data-layout-ignore aria-hidden="true"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var outline = root.querySelector(".od-outline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // INVARIANT: invalid values return to declared defaults. Valid
            // zero values survive because each scalar is checked explicitly.
            var progressValue = Number(vars.progress);
            var thicknessValue = Number(vars.thickness);
            var radiusValue = Number(vars.radius);
            var progress = Number.isFinite(progressValue)
              ? Math.max(0, Math.min(100, progressValue))
              : 100;
            var thickness = Number.isFinite(thicknessValue)
              ? Math.max(1, Math.min(20, thicknessValue))
              : 6;
            var radius = Number.isFinite(radiusValue) ? Math.max(0, Math.min(80, radiusValue)) : 24;

            outline.style.setProperty("--od-thickness", String(thickness));
            outline.style.setProperty("--od-radius", String(radius));

            // RETIME RANGE: only these fixed envelope lengths may be tuned.
            // HOLD is the sole elastic phase. Never use timeScale.
            var IN_BASE = 0.8;
            var OUT_BASE = 0.4;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var envelope = IN_BASE + OUT_BASE;
            var scale = duration < envelope ? duration / envelope : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;

            gsap.set(outline, { "--od-progress": 0, opacity: 1 });

            var tl = gsap.timeline({ paused: true });
            // --ease-standard maps to the production GSAP name power2.out.
            // The registered scalar is tweened directly, with no proxy clock.
            tl.to(outline, { "--od-progress": progress, duration: IN, ease: "power2.out" }, 0);
            tl.to(outline, { opacity: 0, duration: OUT, ease: "power2.out" }, OUT_START);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["outline-draw"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["outline-draw-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
