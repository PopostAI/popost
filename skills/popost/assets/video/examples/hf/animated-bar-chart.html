<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Animated Bar Chart - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 52px;
        transform: scale(1.6);
        transform-origin: center center;
      }
      .hf-catalog-animated-bar-chart {
        --hf-accent: var(--accent, #111827);
        --hf-ink: #111827;
        --hf-l1: rgba(17, 24, 39, 0.72);
        --hf-l2: rgba(17, 24, 39, 0.45);
        --hf-l3: rgba(17, 24, 39, 0.18);
        --hf-l4: rgba(17, 24, 39, 0.08);
        --hf-hair: rgba(17, 24, 39, 0.14);
        --hf-muted: #6b7280;
        --hf-surface: #ffffff;
        color: var(--hf-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-catalog-animated-bar-chart {
        width: 760px;
        min-height: 420px;
        border-radius: 28px;
        background: #fff;
        padding: 34px;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.16);
        display: grid;
        gap: 22px;
      }
      .hf-catalog-animated-bar-chart header {
        display: flex;
        justify-content: space-between;
        align-items: end;
      }
      .hf-catalog-animated-bar-chart h3 {
        margin: 0;
        font-size: 34px;
        letter-spacing: -0.04em;
        font-weight: 700;
        color: #111827;
      }
      .hf-catalog-animated-bar-chart header p {
        margin: 6px 0 0;
        font-size: 16px;
        color: #6b7280;
        font-weight: 400;
      }
      .hf-catalog-animated-bar-chart strong {
        font-size: 54px;
        letter-spacing: -0.06em;
        color: var(--hf-accent);
        font-weight: 700;
      }
      .hf-catalog-animated-bar-chart .bars {
        height: 210px;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        align-items: end;
        gap: 14px;
      }
      .hf-catalog-animated-bar-chart .bar {
        height: calc(var(--h) * var(--hf-grow, 1));
        border-radius: 14px 14px 5px 5px;
        background: var(--hf-l1);
      }
      .hf-catalog-animated-bar-chart .chart-footer {
        display: grid;
        gap: 6px;
      }
      .hf-catalog-animated-bar-chart svg {
        width: 100%;
        height: 180px;
        overflow: visible;
      }
      .hf-catalog-animated-bar-chart path {
        color: var(--hf-l2);
        stroke-dasharray: 900;
        stroke-dashoffset: var(--hf-dash, 0);
      }
      .hf-catalog-animated-bar-chart .bar-labels {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: #9ca3af;
        padding: 0 2px;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A compact data card with deterministic bar growth and value callouts.",
 "class": "chart",
 "tags": [
  "data"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"tick","gain":0.35}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="animated-bar-chart-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="hf-catalog-animated-bar-chart">
          <header>
            <div>
              <h3>Animated Bar Chart</h3>
              <p>A compact data card with deterministic bar growth and value callouts.</p>
            </div>
            <strong>+42%</strong>
          </header>
          <div class="bars">
            <span class="bar" style="--h: 42%"></span><span class="bar" style="--h: 72%"></span
            ><span class="bar" style="--h: 56%"></span><span class="bar" style="--h: 88%"></span
            ><span class="bar" style="--h: 64%"></span><span class="bar" style="--h: 95%"></span
            ><span class="bar" style="--h: 78%"></span>
          </div>
          <div class="chart-footer">
            <svg viewBox="0 0 700 210">
              
              <line x1="20" y1="185" x2="680" y2="185" stroke="#e4e4e7" stroke-width="1.5" />
              <path
                d="M20 172 C120 90, 190 118, 260 74 S430 112, 508 42 S620 82, 680 30"
                fill="none"
                stroke="currentColor"
                stroke-width="10"
                stroke-linecap="round"
              />
            </svg>
            <div class="bar-labels">
              <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span
              ><span>Jun</span><span>Jul</span>
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-animated-bar-chart",
          { "--hf-grow": 0, "--hf-dash": 900 },
          { "--hf-grow": 1, "--hf-dash": 0, duration: 1.2, ease: "power3.out" },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["animated-bar-chart-demo"] = tl;
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
