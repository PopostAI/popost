<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Skeleton Reveal - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~60% of frame */
        transform: scale(1.51);
      }
      .hf-transition-skeleton-reveal {
        position: relative;
        width: 400px;
        height: 96px;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-skeleton-reveal .skeleton,
      .hf-transition-skeleton-reveal .content {
        position: absolute;
        inset: 0;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
      }
      .hf-transition-skeleton-reveal .skeleton {
        background: linear-gradient(90deg, #f4f4f5, #e4e4e7, #f4f4f5);
        background-size: 240% 100%;
        opacity: 1;
        box-shadow: none;
      }
      .hf-transition-skeleton-reveal .content {
        display: grid;
        align-content: center;
        gap: 6px;
        padding: 20px 22px;
        opacity: 0;
        color: #18181b;
      }
      .hf-transition-skeleton-reveal strong {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .hf-transition-skeleton-reveal span {
        color: #71717a;
        font-size: 15px;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A skeleton loader transition that pulses, then cross-fades into content",
 "class": "transition",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "skeleton",
  "reveal"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "name",
   "type": "text",
   "default": "Jane Cooper",
   "maxLength": 200,
   "what": "Primary line revealed once the skeleton fades out."
  },
  {
   "name": "detail",
   "type": "text",
   "default": "jane@example.com",
   "maxLength": 200,
   "what": "Secondary line under the name, such as an email or a role."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "light",
   "options": [
    "light",
    "dark"
   ],
   "what": "Card palette. Light is the paper card, dark is a near-black card with the matching skeleton bars and text."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1.3,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="skeleton-reveal-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-skeleton-reveal"
          data-composition-variables='[
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Primary line revealed once the skeleton fades out.", "default": "Jane Cooper" },
    { "id": "detail", "type": "string", "role": "content", "label": "Detail", "description": "Secondary line under the name, such as an email or a role.", "default": "jane@example.com" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Card palette. Light is the paper card, dark is a near-black card with the matching skeleton bars and text.", "default": "light", "options": [{ "value": "light", "label": "Light" }, { "value": "dark", "label": "Dark" }] }
  ]'
        >
          <div class="skeleton"></div>
          <div class="content"><strong>Jane Cooper</strong><span>jane@example.com</span></div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var tones = {
            light: null,
            dark: {
              "--hf-sr-surface": "#18181b",
              "--hf-sr-border": "#27272a",
              "--hf-sr-bar": "#27272a",
              "--hf-sr-bar-strong": "#3f3f46",
              "--hf-sr-ink": "#fafafa",
              "--hf-sr-muted": "#a1a1aa",
            },
          };
          var defaultName = "Jane Cooper";
          var defaultDetail = "jane@example.com";

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          function text(value, fallback) {
            return typeof value === "string" && value.trim() ? value.trim() : fallback;
          }

          var tone = tones[pick(tones, vars.tone, "light")];
          var name = text(vars.name, defaultName);
          var detail = text(vars.detail, defaultDetail);

          var roots = document.querySelectorAll(".hf-transition-skeleton-reveal");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            if (tone) {
              for (var key in tone) root.style.setProperty(key, tone[key]);
            }
            var strong = root.querySelector(".content strong");
            var span = root.querySelector(".content span");
            if (strong) strong.textContent = name;
            if (span) span.textContent = detail;
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.to(
          ".hf-transition-skeleton-reveal .skeleton",
          { backgroundPosition: "100% 0", duration: 0.7, ease: "none" },
          startTime,
        );
        tl.to(
          ".hf-transition-skeleton-reveal .skeleton",
          { opacity: 0, duration: 0.22 },
          startTime + 0.72,
        );
        tl.to(
          ".hf-transition-skeleton-reveal .content",
          { opacity: 1, duration: 0.24 },
          startTime + 0.78,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["skeleton-reveal-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-skeleton-reveal {
        position: relative;
        width: 340px;
        height: 76px;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-skeleton-reveal .skeleton,
      .hf-transition-skeleton-reveal .content {
        position: absolute;
        inset: 0;
        border: 1px solid var(--hf-sr-border, #e4e4e7);
        border-radius: 14px;
        background: var(--hf-sr-surface, #fff);
      }
      .hf-transition-skeleton-reveal .skeleton {
        background: linear-gradient(
          90deg,
          var(--hf-sr-bar, #f4f4f5),
          var(--hf-sr-bar-strong, #e4e4e7),
          var(--hf-sr-bar, #f4f4f5)
        );
        background-size: 240% 100%;
        opacity: 1;
      }
      .hf-transition-skeleton-reveal .content {
        display: grid;
        align-content: center;
        gap: 5px;
        padding: 15px;
        opacity: 0;
        color: var(--hf-sr-ink, #18181b);
      }
      .hf-transition-skeleton-reveal span {
        color: var(--hf-sr-muted, #71717a);
        font-size: 14px;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
