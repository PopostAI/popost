<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Headline", "description": "Text receiving the single shimmer pass.", "default": "Effortless" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Hue of the specular shimmer band.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "sweep_at", "type": "number", "role": "timing", "label": "Sweep start", "description": "Requested start time for the shimmer sweep.", "default": 1.2, "min": 0.2, "max": 2, "step": 0.1, "unit": "s" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Text Shimmer Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #0b0c0e);
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --surface: #15171b;
        --border: #343840;
        --brand: #22c55e;
        --accent: #38bdf8;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --radius: 3cqmin;
        --space-3: 4cqmin;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 45%,
          var(--bg, #181b21) 0%,
          var(--bg, #0b0c0e) 72%
        );
      }

      .mount-card {
        width: 52%;
        height: 34%;
        left: 24%;
        top: 33%;
        container-type: size;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border, #94a3b8) 22%, transparent);
        border-radius: 30px;
        background: var(--surface, #15171b);
        box-shadow: 0 42px 100px color-mix(in srgb, var(--bg, #000000) 48%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A static headline receives one clean specular gradient sweep through its glyphs, then returns to its ordinary text color.",
 "class": "text",
 "tags": [
  "motion-primitive",
  "text-effects",
  "shimmer",
  "specular",
  "emphasis"
 ],
 "seconds": 3,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Effortless",
   "maxLength": 200,
   "what": "Text receiving the single shimmer pass."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Hue of the specular shimmer band."
  },
  {
   "name": "sweep_at",
   "type": "number",
   "default": 1.2,
   "min": 0.2,
   "max": 2,
   "unit": "s",
   "what": "Requested start time for the shimmer sweep."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"Pure momentum","accent":"blue","sweep_at":0.8};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1,"cue":"shimmer","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="text-shimmer-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3"
      data-fps="30"
    >
      <div
        id="text-shimmer-mount"
        class="mount-card clip"
        data-composition-id="text-shimmer"
       
        data-variable-values='{"text":"Pure momentum","accent":"blue","sweep_at":0.8}'
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-width="998"
        data-height="367"
      >
      <div id="root" data-composition-id="text-shimmer" data-duration="3" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, transparent);
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .ts-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: var(--space-3, 4cqmin);
            background: var(--surface, transparent);
          }

          .ts-headline {
            --ts-base: var(--fg, #f8fafc);
            --ts-accent: var(--brand, #22c55e);
            display: block;
            max-width: 90cqw;
            color: transparent;
            font-size: clamp(28px, 16cqmin, 176px);
            font-weight: 780;
            line-height: 0.96;
            letter-spacing: -0.055em;
            overflow-wrap: anywhere;
            text-align: center;
            background-image: linear-gradient(
              110deg,
              var(--ts-base) 0%,
              var(--ts-base) 40%,
              color-mix(in srgb, var(--ts-accent) 58%, var(--fg, white)) 47%,
              var(--fg, white) 50%,
              color-mix(in srgb, var(--ts-accent) 72%, var(--fg, white)) 53%,
              var(--ts-base) 60%,
              var(--ts-base) 100%
            );
            background-position: 100% 50%;
            background-repeat: no-repeat;
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            will-change: background-position;
          }
        </style>

        <div
          id="text-shimmer-clip"
          class="ts-clip clip"
          data-start="0"
          data-duration="3"
          data-track-index="0"
        >
          <span class="ts-headline"></span>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var headline = root.querySelector(".ts-headline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "Effortless" : String(vars.text);
            var accent = vars.accent === "blue" || vars.accent === "violet" ? vars.accent : "green";
            var accentTokens = {
              green: "var(--brand, #22c55e)",
              blue: "var(--accent, #38bdf8)",
              violet: "var(--accent-2, #a78bfa)",
            };
            var accentColor = accentTokens[accent];
            var sweepAtValue = vars.sweep_at;
            var sweepAt =
              typeof sweepAtValue === "number" && Number.isFinite(sweepAtValue)
                ? Math.max(0.2, Math.min(2, sweepAtValue))
                : 1.2;

            headline.textContent = text;
            headline.style.setProperty("--ts-accent", accentColor);

            var SWEEP_BASE = 0.9;
            var durationValue = parseFloat(root.dataset.duration || "3");
            var duration = Number.isFinite(durationValue) ? Math.max(0.001, durationValue) : 3;
            var SWEEP = Math.min(SWEEP_BASE, duration);
            var SWEEP_START = Math.min(sweepAt, Math.max(0, duration - SWEEP));
            var IN = SWEEP_START + SWEEP;
            var HOLD = Math.max(0, duration - IN);

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(
              headline,
              { backgroundPosition: "100% 50%" },
              { backgroundPosition: "0% 50%", duration: SWEEP, ease: "sine.inOut" },
              SWEEP_START,
            );

            if (HOLD > 0) {
              tl.to(
                headline,
                { backgroundPosition: "4% 50%", duration: HOLD, ease: "sine.inOut" },
                IN,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["text-shimmer"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["text-shimmer-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
