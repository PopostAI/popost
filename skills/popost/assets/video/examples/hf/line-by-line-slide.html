<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Line-by-Line Slide - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 900px;
        min-height: 500px;
        padding: 64px;
        /* ponytail: scale wrapper — not a GSAP target, so CSS transform is safe */
        transform: scale(2.8);
        transform-origin: center center;
      }
      .hf-catalog-line-by-line-slide {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-line-by-line-slide {
        display: grid;
        gap: 10px;
        font-size: 64px;
        line-height: 1.05;
        overflow: hidden;
      }
      .hf-catalog-line-by-line-slide span {
        display: block;
        transform: translate(var(--hf-line-x, 0px), var(--hf-line-y, 0px));
        filter: blur(var(--hf-line-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Each line enters from the left with staggered slide and exits to the right.",
 "class": "transition",
 "tags": [
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "size",
   "type": "choice",
   "default": "standard",
   "options": [
    "compact",
    "standard",
    "display"
   ],
   "what": "Type size of the whole stack."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Line colour: ink for light frames, paper for dark ones, accent rides the brand token."
  },
  {
   "name": "density",
   "type": "choice",
   "default": "standard",
   "options": [
    "fine",
    "standard",
    "coarse"
   ],
   "what": "The gap between lines, from a tight block to an airy stack."
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "left",
   "options": [
    "left",
    "right"
   ],
   "what": "Which side the lines slide in from as the timeline drives the offset."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="line-by-line-slide-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-catalog-line-by-line-slide"
          data-composition-variables='[
    {"id": "size", "type": "enum", "role": "layout", "label": "Size", "description": "Type size of the whole stack.", "default": "standard", "options": [{"value": "compact", "label": "Compact"}, {"value": "standard", "label": "Standard"}, {"value": "display", "label": "Display"}]},
    {"id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Line colour: ink for light frames, paper for dark ones, accent rides the brand token.", "default": "ink", "options": [{"value": "ink", "label": "Ink"}, {"value": "paper", "label": "Paper"}, {"value": "accent", "label": "Accent"}]},
    {"id": "density", "type": "enum", "role": "layout", "label": "Density", "description": "The gap between lines, from a tight block to an airy stack.", "default": "standard", "options": [{"value": "fine", "label": "Fine"}, {"value": "standard", "label": "Standard"}, {"value": "coarse", "label": "Coarse"}]},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Which side the lines slide in from as the timeline drives the offset.", "default": "left", "options": [{"value": "left", "label": "Left"}, {"value": "right", "label": "Right"}]}
  ]'
        >
          <span>Design faster</span><span>Render cleaner</span><span>Ship louder</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var sizes = { compact: "40px", standard: "52px", display: "68px" };
          var tones = {
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };
          var gaps = { fine: "4px", standard: "10px", coarse: "20px" };
          var axes = { left: 1, right: -1 };

          var size = sizes[pick(sizes, vars.size, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];
          var gap = gaps[pick(gaps, vars.density, "standard")];
          var axis = axes[pick(axes, vars.direction, "left")];

          var roots = document.querySelectorAll(".hf-catalog-line-by-line-slide");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-line-size", size);
            root.style.setProperty("--hf-line-color", tone);
            root.style.setProperty("--hf-line-gap", gap);
            root.style.setProperty("--hf-line-axis-x", String(axis));
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-line-by-line-slide span",
          { opacity: 0, "--hf-line-x": "-36px", "--hf-line-y": "18px", "--hf-line-blur": "6px" },
          {
            opacity: 1,
            "--hf-line-x": "0px",
            "--hf-line-y": "0px",
            "--hf-line-blur": "0px",
            duration: 0.34,
            stagger: 0.08,
            ease: "power3.out",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["line-by-line-slide-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-line-by-line-slide {
        color: var(--hf-line-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-line-by-line-slide {
        display: grid;
        gap: var(--hf-line-gap, 10px);
        font-size: var(--hf-line-size, 52px);
        line-height: 1;
        overflow: hidden;
      }
      .hf-catalog-line-by-line-slide span {
        display: block;
        transform: translate(
          calc(var(--hf-line-x, 0px) * var(--hf-line-axis-x, 1)),
          var(--hf-line-y, 0px)
        );
        filter: blur(var(--hf-line-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
