<html data-composition-variables='[
    { "id": "axis", "type": "enum", "role": "style", "label": "Axis", "description": "rows smears arrival across horizontal slices; cols across vertical slices.", "default": "rows", "options": [{ "value": "rows", "label": "Rows" }, { "value": "cols", "label": "Columns" }] },
    { "id": "spread", "type": "number", "role": "timing", "label": "Spread", "description": "Maximum sampling offset in seconds across the frame; larger smears further through time.", "default": 0.45 },
    { "id": "resolve_at", "type": "number", "role": "timing", "label": "Resolve at", "description": "Seconds from mount start when the offsets start collapsing to zero. Clamped so the collapse and any exit stay inside the clip.", "default": 2.2 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Subject ring and orbit color: green rides --brand, blue rides --accent, violet rides --accent-2.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "Optional departure. Default none: the resolved mark holds until the frame cuts.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Slit Scan Reveal Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #f5f6f8);
      }

      #root {
        --bg: #f5f6f8;
        --fg: #101318;
        --muted: #5b6472;
        --surface: #ffffff;
        --border: #d7dce4;
        --brand: #14a35e;
        --accent: #2f6fed;
        --accent-2: #7a5cd6;
        --radius: 24px;
        --font-display: "Inter", system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      .mount-stage {
        position: absolute;
        inset: 0;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "The frame's rows sample an authored subject at offset times: a canvas painter draws row slices of one pure position function evaluated at t minus offset(row), smearing arrival through time until the offsets collapse to zero and the mark holds coherent.",
 "class": "transition",
 "tags": [
  "motion-primitive",
  "time",
  "slit-scan",
  "canvas",
  "deterministic",
  "experiment"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "axis",
   "type": "choice",
   "default": "rows",
   "options": [
    "rows",
    "cols"
   ],
   "what": "rows smears arrival across horizontal slices; cols across vertical slices."
  },
  {
   "name": "spread",
   "type": "number",
   "default": 0.45,
   "min": -100000,
   "max": 100000,
   "what": "Maximum sampling offset in seconds across the frame; larger smears further through time."
  },
  {
   "name": "resolve_at",
   "type": "number",
   "default": 2.2,
   "min": -100000,
   "max": 100000,
   "what": "Seconds from mount start when the offsets start collapsing to zero. Clamped so the collapse and any exit stay inside the clip."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Subject ring and orbit color: green rides --brand, blue rides --accent, violet rides --accent-2."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Default none: the resolved mark holds until the frame cuts."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"axis":"cols","spread":1,"resolve_at":2,"accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="slit-scan-reveal-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="slit-scan-reveal-mount"
        class="mount-stage clip"
        data-composition-id="slit-scan-reveal"
       
        data-variable-values='{"axis":"cols","spread":1.0,"resolve_at":2.0,"accent":"violet"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      >
      <div id="root" data-composition-id="slit-scan-reveal" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, "Inter", system-ui, sans-serif);
            pointer-events: none;
          }

          .ssr-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: var(--bg, transparent);
          }

          .ssr-stage {
            position: absolute;
            inset: 0;
            will-change: transform, opacity;
          }

          .ssr-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
          }
        </style>

        <div
          id="slit-scan-reveal-clip"
          class="ssr-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="ssr-stage">
            <canvas class="ssr-canvas" aria-hidden="true"></canvas>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".ssr-stage");
            var canvas = root.querySelector(".ssr-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var axis = vars.axis === "cols" ? "cols" : "rows";
            var spreadRaw = parseFloat(vars.spread);
            var spread = isFinite(spreadRaw) ? Math.min(Math.max(0.1, spreadRaw), 1.2) : 0.45;
            var resolveRaw = parseFloat(vars.resolve_at);
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            // Envelope. The collapse is 0.6s; resolve_at is clamped so the
            // collapse and any exit always fit inside the clip.
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var OUT = exit === "none" ? 0 : 0.45;
            var COLLAPSE = 0.6;
            var resolveAt = isFinite(resolveRaw) ? resolveRaw : 2.2;
            resolveAt = Math.min(
              Math.max(0.4, resolveAt),
              Math.max(0.4, duration - COLLAPSE - OUT - 0.1),
            );
            // The subject's travel ends just before the collapse begins so
            // the zip-shut lands on a resting subject.
            var MOVE_START = 0.25;
            var MOVE_END = Math.max(MOVE_START + 0.6, resolveAt - 0.1);
            var OUT_START = duration - OUT;

            // Canvas raster basis, fixed once at mount (elastic root).
            var dpr = Math.min(2, Math.max(1, Number(window.devicePixelRatio) || 1));
            var box = root.getBoundingClientRect();
            var cssW = Math.max(1, Math.round(box.width) || 640);
            var cssH = Math.max(1, Math.round(box.height) || 360);
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);
            var ctx = canvas.getContext("2d");
            var minDim = Math.min(canvas.width, canvas.height);

            // Resolve tokens to concrete colors once at mount so canvas
            // fills never depend on style recalc during seeks.
            var hostDoc = root.ownerDocument;
            function resolveColor(cssColor, fallback) {
              var probe = hostDoc.createElement("span");
              probe.style.color = cssColor;
              root.appendChild(probe);
              var value = getComputedStyle(probe).color || fallback;
              probe.remove();
              return value;
            }
            var accentColor = resolveColor(accentColors[accent], "#71f5a7");
            var surfaceColor = resolveColor("var(--surface, #14171c)", "#14171c");
            var fgColor = resolveColor("var(--fg, #f8fafc)", "#f8fafc");

            // Seeded per-slice offset jitter: a stable table, computed once.
            var SLICES = 96;
            var jitter = (function () {
              var state = 0x51175c4e;
              function next() {
                state = (Math.imul(1664525, state) + 1013904223) >>> 0;
                return state / 4294967296;
              }
              var rows = [];
              for (var i = 0; i < SLICES; i += 1) {
                rows.push(0.96 + 0.08 * next());
              }
              return rows;
            })();

            function clamp01(v) {
              return v < 0 ? 0 : v > 1 ? 1 : v;
            }

            // The subject's authored motion: ONE pure position function.
            // Cubic-eased sweep from the wing to dead center with a
            // decaying two-cycle sine bob (integer cycles, exactly zero at
            // u = 1) and a settling scale. The sweep runs ACROSS the slice
            // axis (rows: left wing in, cols: top wing down) so every band
            // cuts the travel and the offsets read as a staircase smear,
            // not a local skew. Defined for every t; clamped flat outside
            // [MOVE_START, MOVE_END], so sampled times before mount or
            // into the hold are exact and still.
            function subjectState(t) {
              var u = clamp01((t - MOVE_START) / (MOVE_END - MOVE_START));
              var e = 1 - Math.pow(1 - u, 3);
              var decay = (1 - u) * (1 - u);
              var travel = -0.16 + 0.66 * e;
              var bob = 0.5 + 0.15 * Math.sin(Math.PI * 2 * 2 * u) * decay;
              return {
                x: (axis === "rows" ? travel : bob) * canvas.width,
                y: (axis === "rows" ? bob : travel) * canvas.height,
                rot: 0.5 * Math.sin(Math.PI * 2 * u) * decay,
                scale: 0.82 + 0.18 * e,
                appear: clamp01(u / 0.12),
              };
            }

            // Draw the whole subject (token disc + accent ring + orbit dot)
            // at one sampled state. Callers clip to a slice band first.
            function drawSubject(s) {
              if (s.appear <= 0) return;
              var r = 0.15 * minDim * s.scale;
              ctx.save();
              ctx.translate(s.x, s.y);
              ctx.rotate(s.rot);
              ctx.globalAlpha = s.appear;
              // Disc body.
              ctx.fillStyle = surfaceColor;
              ctx.beginPath();
              ctx.arc(0, 0, r, 0, Math.PI * 2);
              ctx.fill();
              // Accent ring.
              ctx.strokeStyle = accentColor;
              ctx.lineWidth = Math.max(1, 0.016 * minDim);
              ctx.beginPath();
              ctx.arc(0, 0, r, 0, Math.PI * 2);
              ctx.stroke();
              // Inner core.
              ctx.fillStyle = fgColor;
              ctx.globalAlpha = s.appear * 0.92;
              ctx.beginPath();
              ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
              ctx.fill();
              // Orbit dot: the asymmetry that makes the smear legible.
              ctx.fillStyle = accentColor;
              ctx.globalAlpha = s.appear;
              ctx.beginPath();
              ctx.arc(r * 0.72, 0, r * 0.13, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            // Pure repaint: for every slice, clip to its band and draw the
            // subject at t - offset(slice) * collapse(t).
            function paint(t) {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              var collapse = 1 - clamp01((t - resolveAt) / COLLAPSE);
              // Eased collapse: smooth both ends (power2.inOut shape).
              collapse =
                collapse < 0.5 ? 2 * collapse * collapse : 1 - Math.pow(-2 * collapse + 2, 2) / 2;
              if (collapse <= 0) {
                // Resolved: one coherent draw, no per-slice clipping.
                drawSubject(subjectState(t));
                return;
              }
              var along = axis === "rows" ? canvas.height : canvas.width;
              var band = along / SLICES;
              for (var i = 0; i < SLICES; i += 1) {
                var frac = i / (SLICES - 1);
                var offset = spread * frac * jitter[i] * collapse;
                var s = subjectState(t - offset);
                if (s.appear <= 0) continue;
                ctx.save();
                ctx.beginPath();
                if (axis === "rows") {
                  ctx.rect(0, i * band, canvas.width, band + 1);
                } else {
                  ctx.rect(i * band, 0, band + 1, canvas.height);
                }
                ctx.clip();
                drawSubject(s);
                ctx.restore();
              }
            }

            gsap.set(stage, { opacity: 1, y: "0cqh" });

            var tl = gsap.timeline({
              paused: true,
              onUpdate: function () {
                paint(tl.time());
              },
            });

            // Anchor tween: an inert plain-object tween spanning the full
            // authored duration so tl.time() covers [0, D] and onUpdate
            // repaints the canvas on every eventful seek.
            tl.to({ p: 0 }, { p: 1, duration: duration, ease: "none" }, 0);

            // HOLD: truly still. After the collapse every slice samples the
            // same resting state, so the canvas repaints one coherent mark.

            // OUT: optional departure; exit none holds until the frame cuts.
            if (exit === "up") {
              tl.to(stage, { y: "-4cqh", duration: OUT, ease: "power2.in" }, OUT_START);
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            } else if (exit === "fade") {
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            }

            tl.seek(0);
            paint(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["slit-scan-reveal"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["slit-scan-reveal-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
