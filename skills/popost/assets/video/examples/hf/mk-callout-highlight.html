<!doctype html>
<!--

  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; scaled into the canvas; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #mk-ch-root {
        /* ---- mk tokens: override in the host to re-skin the family ---- */
        --mk-font: "Inter", -apple-system, sans-serif;
        --mk-ink: #1d1d1f;
        /* faint = transient pre-sweep tier (tweens up to full ink) — distinct from the family --mk-ink-dim */
        --mk-ink-faint: #bcbcc2;
        --mk-ink-dark: #f5f5f7;
        --mk-ink-faint-dark: rgba(245, 245, 247, 0.32);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent; /* overlays footage or mk-background */
      }
      #mk-ch-center {
        /* CSS centring. The box is a flex item of this full-frame wrapper, so its
           place is laid out by the browser rather than measured from a DOM rect
           taken before web fonts are ready. An explicit CONFIG.x / CONFIG.y turns
           that axis into an edge offset (see the script). No pointer-events:none
           here: it inherits to the word spans and the contrast audit skips them. */
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #mk-ch-box {
        flex: none; /* max-content width, clamped by max-width; never shrunk */
        font-family: var(--mk-font);
        font-weight: 500;
        letter-spacing: -0.015em;
      }
      .mk-ch-word {
        display: inline;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A sentence whose word-by-word emphasis is driven by a single scalar — tween it to sync the highlight with a voiceover",
 "class": "overlay",
 "tags": [
  "typography",
  "karaoke",
  "captions",
  "minimal"
 ],
 "seconds": 7.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"shimmer","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="mk-ch-root"
      data-composition-id="mk-callout-highlight"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mk-ch-center">
        <div id="mk-ch-box" data-layout-allow-occlusion></div>
      </div>
      <div
        id="mk-ch-drv"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ----
           The mechanic: one scalar (highlight progress 0..1) sweeps word-by-word
           emphasis across the sentence — a "highlight amount"
           slider. Tween the scalar over the speaker's sentence to follow speech. */
        var CONFIG = {
          scheme: "light", // "light" (ink on light bg) | "dark" (white on footage)
          text: "Functionality was our goal from the very beginning",
          fontSize: 60,
          lineHeight: 1.3,
          maxWidth: 700, // px; sentence wraps inside this
          x: 1030, // box left edge; null = centered horizontally. Keep x + maxWidth <= 1920:
          //         the box never shrinks (flex: none), so past the frame edge it is clipped
          //         by the root's overflow instead of wrapping earlier.
          y: null, // box top edge; null = centered vertically
          align: "left",
          sweep: { start: 1.2, end: 6.2 }, // block-local seconds, linear
          animationIn: true, // fade/rise entrance before the sweep
          animationOut: true,
        };

        var DUR = 8;
        var root = document.getElementById("mk-ch-root");
        var box = document.getElementById("mk-ch-box");

        var FULL = CONFIG.scheme === "dark" ? "#f5f5f7" : "#1d1d1f";
        var FAINT = CONFIG.scheme === "dark" ? "rgba(245,245,247,0.32)" : "#bcbcc2";

        box.style.fontSize = CONFIG.fontSize + "px";
        box.style.lineHeight = String(CONFIG.lineHeight);
        box.style.maxWidth = CONFIG.maxWidth + "px";
        box.style.textAlign = CONFIG.align;

        /* build word spans */
        var wordEls = [];
        CONFIG.text.split(/\s+/).forEach(function (w, i) {
          if (i > 0) box.appendChild(document.createTextNode(" "));
          var span = document.createElement("span");
          span.id = "mk-ch-w-" + i;
          span.className = "mk-ch-word";
          span.textContent = w;
          span.style.color = FAINT;
          box.appendChild(span);
          wordEls.push(span);
        });

        /* position: #mk-ch-center centres the box with flex (no measurement, so the
           placement does not depend on font timing). A non-null CONFIG.x / CONFIG.y
           switches that axis to an edge offset: the box keeps its content width
           (clamped by maxWidth) and is pushed from the frame edge by a margin. */
        var center = document.getElementById("mk-ch-center");
        if (CONFIG.x !== null) {
          center.style.justifyContent = "flex-start";
          box.style.marginLeft = CONFIG.x + "px";
        }
        if (CONFIG.y !== null) {
          center.style.alignItems = "flex-start";
          box.style.marginTop = CONFIG.y + "px";
        }

        /* state proxy: GSAP animates st.p, render derives every word color from it */
        var st = { p: 0 };
        var mix = gsap.utils.interpolate(FAINT, FULL);
        function render() {
          var k = st.p * wordEls.length;
          for (var i = 0; i < wordEls.length; i++) {
            var f = Math.max(0, Math.min(1, k - i));
            wordEls[i].style.color = mix(f);
          }
        }

        var tl = gsap.timeline({ paused: true });

        /* entrance / exit motion stays a GSAP transform on the box itself: the box
           carries no CSS transform (centring is flex on the parent), so there is
           nothing for the tween to fight. */
        if (CONFIG.animationIn) {
          gsap.set(box, { opacity: 0, y: 24 });
          tl.to(box, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
        }

        /* the highlight sweep — one scalar, linear so it tracks speech evenly.
           To follow a real voiceover, replace with several tweens between
           per-phrase progress values (keyframes on the slider). */
        tl.to(
          st,
          { p: 1, duration: CONFIG.sweep.end - CONFIG.sweep.start, ease: "none" },
          CONFIG.sweep.start,
        );

        if (CONFIG.animationOut) {
          tl.to(box, { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        tl.eventCallback("onUpdate", render);
        render();

        window.__timelines["mk-callout-highlight"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
