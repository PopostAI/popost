  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SVG Stroke Trace Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #0b0c0e);
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --surface: #14171c;
        --border: #343a46;
        --brand: #71f5a7;
        --accent: #61a8ff;
        --accent-2: #c5a3ff;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 2.4cqmin;
        --space-1: 1.2cqmin;
        --space-2: 2.4cqmin;
        --space-3: 4cqmin;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 46%,
          color-mix(in srgb, var(--surface) 88%, var(--accent-2)) 0%,
          var(--bg) 72%
        );
      }

      .mount-card {
        width: 76%;
        height: 62%;
        left: 12%;
        top: 19%;
        container-type: size;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        border-radius: calc(var(--radius) * 1.35);
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        box-shadow: 0 4cqh 12cqh color-mix(in srgb, var(--bg) 58%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "An authored SVG path draws from its measured length, holds with subtle drift, and optionally fills when the path is closed.",
 "class": "shape",
 "tags": [
  "motion-primitive",
  "intro",
  "reveal",
  "svg",
  "stroke",
  "line-draw"
 ],
 "seconds": 3.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "path",
   "type": "text",
   "default": "M 92 328 C 178 142 292 138 366 276 C 430 396 500 414 558 262 C 622 94 724 112 786 274 C 836 406 894 376 930 194",
   "maxLength": 200,
   "what": "SVG path data for the authored mark."
  },
  {
   "name": "stroke_width",
   "type": "number",
   "default": 12,
   "min": 2,
   "max": 32,
   "what": "Width of the traced stroke in SVG viewBox units."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Color used by the trace and optional fill."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Default none: the finished mark holds until the frame cuts."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"path":"M 170 378 L 330 132 L 458 330 L 584 132 L 830 378 L 680 378 L 584 248 L 508 378 L 408 378 L 330 248 L 252 378 Z","stroke_width":16,"accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="svg-stroke-trace-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="svg-stroke-trace-mount"
        class="mount-card clip"
        data-composition-id="svg-stroke-trace"
       
        data-variable-values='{"path":"M 170 378 L 330 132 L 458 330 L 584 132 L 830 378 L 680 378 L 584 248 L 508 378 L 408 378 L 330 248 L 252 378 Z","stroke_width":16,"accent":"violet"}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1459"
        data-height="670"
      >
      <div id="root" data-composition-id="svg-stroke-trace" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            pointer-events: none;
          }

          .sst-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .sst-stage {
            width: 88cqw;
            height: 70cqh;
            opacity: 0;
            will-change: transform, opacity;
          }

          .sst-svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
          }

          .sst-fill,
          .sst-stroke {
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          .sst-fill {
            fill: var(--sst-accent);
            stroke: none;
            opacity: 0;
          }

          .sst-stroke {
            fill: none;
            stroke: var(--sst-accent);
            filter: drop-shadow(
              0 0 1.8cqmin color-mix(in srgb, var(--sst-accent) 34%, transparent)
            );
          }
        </style>

        <div
          id="svg-stroke-trace-clip"
          class="sst-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="sst-stage" role="img">
            <svg
              class="sst-svg"
              viewBox="0 0 1024 520"
              preserveAspectRatio="xMidYMid meet"
              aria-hidden="true"
            >
              <path class="sst-fill"></path>
              <path class="sst-stroke"></path>
            </svg>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFAULT_PATH =
              "M 92 328 C 178 142 292 138 366 276 C 430 396 500 414 558 262 C 622 94 724 112 786 274 C 836 406 894 376 930 194";
            var root = document.getElementById("root");
            var stage = root.querySelector(".sst-stage");
            var fillPath = root.querySelector(".sst-fill");
            var strokePath = root.querySelector(".sst-stroke");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var suppliedPath = vars.path == null ? DEFAULT_PATH : String(vars.path).trim();
            var pathData = suppliedPath || DEFAULT_PATH;
            var widthValue = vars.stroke_width;
            var strokeWidth = Number.isFinite(widthValue)
              ? Math.max(2, Math.min(32, widthValue))
              : 12;
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            root.style.setProperty("--sst-accent", accentColors[accent]);
            fillPath.setAttribute("d", pathData);
            strokePath.setAttribute("d", pathData);
            strokePath.setAttribute("stroke-width", String(strokeWidth));
            stage.setAttribute("aria-label", "Authored SVG path tracing from start to finish");

            var pathLength = strokePath.getTotalLength();
            strokePath.style.strokeDasharray = pathLength + " " + pathLength;
            strokePath.style.strokeDashoffset = String(pathLength);

            // A trailing close command is the single owner of fill behavior.
            // Open signatures and waves never receive an implied closing fill.
            var fillEnabled = /[zZ]\s*$/.test(pathData);

            var IN_BASE = 1.85;
            var OUT_BASE = exit === "none" ? 0 : 0.45;
            var DRAW_SHARE = 0.84;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var fixedTotal = Math.max(0.001, IN_BASE + OUT_BASE);
            var phaseScale = duration < fixedTotal ? duration / fixedTotal : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var DRAW = IN * DRAW_SHARE;
            var FILL = IN - DRAW;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            // IN: the path measurement owns both dash values, so every authored
            // path draws exactly once regardless of its geometry.
            tl.to(stage, { opacity: 1, duration: Math.min(0.28, DRAW), ease: "power2.out" }, 0);
            tl.to(strokePath, { strokeDashoffset: 0, duration: DRAW, ease: "sine.inOut" }, 0);

            if (fillEnabled) {
              tl.to(fillPath, { opacity: 0.16, duration: FILL, ease: "power2.out" }, DRAW);
            }

            // HOLD: one finite drift cycle keeps longer mounts alive.
            if (HOLD > 0) {
              tl.to(
                stage,
                {
                  y: "-0.7cqh",
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                },
                HOLD_START,
              );
            }

            // OUT: optional departure; exit none holds until the frame cuts.
            if (exit === "up") {
              tl.to(
                stage,
                { opacity: 0, y: "-2.4cqh", duration: OUT, ease: "power2.in" },
                OUT_START,
              );
            } else if (exit === "fade") {
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["svg-stroke-trace"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["svg-stroke-trace-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
