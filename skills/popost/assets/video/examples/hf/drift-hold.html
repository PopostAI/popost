<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text displayed in the default centered card.", "default": "Always alive" },
    { "id": "intensity", "type": "enum", "role": "motion", "label": "Intensity", "description": "Amplitude of the ambient rotation, breathing, and light sweep.", "default": "standard", "options": [{ "value": "whisper", "label": "Whisper" }, { "value": "standard", "label": "Standard" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Drift Hold Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --surface: #172033;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --border: #475569;
        --radius: 3.2cqmin;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --space-3: 5cqmin;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #142038 0%, #0b0c0e 72%);
      }

      .mount-card {
        width: 58%;
        height: 54%;
        left: 21%;
        top: 23%;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A centered content card stays subtly alive through loop-exact rotation, scale breathing, and a slow light sweep.",
 "class": "background",
 "tags": [
  "motion-primitive",
  "camera",
  "ambient",
  "drift",
  "hold",
  "loopable"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Always alive",
   "maxLength": 200,
   "what": "Text displayed in the default centered card."
  },
  {
   "name": "intensity",
   "type": "choice",
   "default": "standard",
   "options": [
    "whisper",
    "standard"
   ],
   "what": "Amplitude of the ambient rotation, breathing, and light sweep."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"Quiet momentum","intensity":"whisper"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="drift-hold-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="drift-hold-mount"
        class="mount-card clip"
        data-composition-id="drift-hold"
       
        data-variable-values='{"text":"Quiet momentum","intensity":"whisper"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1114"
        data-height="583"
      >
      <div id="root" data-composition-id="drift-hold" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .dh-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .dh-card {
            position: relative;
            display: grid;
            width: 68cqw;
            min-height: 44cqh;
            place-items: center;
            overflow: hidden;
            padding: var(--space-3, 5cqh) var(--space-3, 6cqw);
            border: 0.16cqmin solid color-mix(in srgb, var(--border, #475569) 82%, transparent);
            border-radius: var(--radius, 3.2cqmin);
            background: color-mix(in srgb, var(--surface, #172033) 94%, var(--accent, #38bdf8));
            box-shadow: 0 3.5cqh 10cqh color-mix(in srgb, var(--bg, #05070d) 58%, transparent);
            transform-origin: 50% 50%;
            will-change: transform;
          }

          .dh-sweep {
            position: absolute;
            top: -45%;
            left: 42%;
            width: 20cqw;
            height: 190%;
            background: linear-gradient(
              90deg,
              transparent 0%,
              color-mix(in srgb, var(--accent, #38bdf8) 10%, transparent) 25%,
              color-mix(in srgb, var(--fg, #f8fafc) 28%, transparent) 50%,
              color-mix(in srgb, var(--accent, #38bdf8) 10%, transparent) 75%,
              transparent 100%
            );
            filter: blur(1.8cqmin);
            will-change: transform, opacity;
          }

          .dh-label {
            position: relative;
            z-index: 1;
            max-width: 56cqw;
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: clamp(20px, 9cqmin, 76px);
            font-weight: 720;
            line-height: 1.05;
            letter-spacing: -0.035em;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
        </style>

        <div
          id="drift-hold-clip"
          class="dh-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="dh-card">
            <div class="dh-sweep" aria-hidden="true"></div>
            <div class="dh-label"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var card = root.querySelector(".dh-card");
            var sweep = root.querySelector(".dh-sweep");
            var label = root.querySelector(".dh-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "Always alive" : String(vars.text);
            var intensity = vars.intensity === "whisper" ? "whisper" : "standard";
            var amplitudes = {
              whisper: { rotation: 0.24, scale: 0.006, sweep: 30, light: 0.04 },
              standard: { rotation: 0.6, scale: 0.015, sweep: 42, light: 0.08 },
            };
            var motion = amplitudes[intensity];

            label.textContent = text;

            var TAU = Math.PI * 2;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var state = { phase: 0 };

            function renderPose() {
              // Literal phase zero at the endpoint removes floating point
              // residue from Math.sin(2 * PI) and makes the seam exact.
              var phase = state.phase === TAU ? 0 : state.phase;
              var rotation = Math.sin(phase + Math.PI / 6) * motion.rotation;
              var scale = 1 + Math.sin(phase + Math.PI / 2) * motion.scale;
              var sweepX = Math.sin(phase - Math.PI / 2) * motion.sweep;
              var sweepOpacity = 0.12 + Math.sin(phase + Math.PI / 3) * motion.light;

              gsap.set(card, { rotation: rotation, scale: scale });
              gsap.set(sweep, {
                x: sweepX + "cqw",
                rotation: 14,
                opacity: sweepOpacity,
              });
            }

            var tl = gsap.timeline({ paused: true });

            // HOLD: uniform phase travel drives only whole-cycle sine motion.
            tl.to(state, { phase: TAU, duration: duration, ease: "none", onUpdate: renderPose }, 0);

            renderPose();
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["drift-hold"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["drift-hold-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
