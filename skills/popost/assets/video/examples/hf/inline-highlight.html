<!doctype html>

  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; scaled into the canvas; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Inline Highlight - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f5f5f4;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
      }
      .copy {
        width: 1200px;
        font-size: 88px;
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -0.025em;
        text-align: left;
      }
      .hf-inline-highlight {
        --hf-highlight-scale: 0;
        --hf-highlight-color: #facc15;
        position: relative;
        display: inline;
        isolation: isolate;
      }
      .hf-inline-highlight::after {
        content: "";
        position: absolute;
        left: -0.05em;
        right: -0.05em;
        bottom: 0.06em;
        height: 0.35em;
        background: var(--hf-highlight-color);
        border-radius: 3px;
        transform: scaleX(var(--hf-highlight-scale));
        transform-origin: left center;
        z-index: -1;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A clean marker-style inline highlight that animates behind text using a CSS scale variable",
 "class": "overlay",
 "tags": [
  "motion-primitive",
  "text",
  "highlight",
  "caption"
 ],
 "seconds": 1.55,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "tint",
   "type": "choice",
   "default": "yellow",
   "options": [
    "yellow",
    "green",
    "blue",
    "violet"
   ],
   "what": "Marker colour. Green, blue and violet ride --brand, --accent and --accent-2."
  },
  {
   "name": "thickness",
   "type": "choice",
   "default": "standard",
   "options": [
    "thin",
    "standard",
    "thick"
   ],
   "what": "Height of the marker band behind the text, as a share of the font size."
  },
  {
   "name": "origin",
   "type": "choice",
   "default": "left",
   "options": [
    "left",
    "right",
    "center"
   ],
   "what": "Edge the marker grows out of as the scale variable runs from 0 to 1."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="inline-highlight-demo"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-composition-variables='[
    { "id": "tint", "type": "enum", "role": "style", "label": "Tint", "description": "Marker colour. Green, blue and violet ride --brand, --accent and --accent-2.", "default": "yellow", "options": [{ "value": "yellow", "label": "Yellow" }, { "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "thickness", "type": "enum", "role": "style", "label": "Thickness", "description": "Height of the marker band behind the text, as a share of the font size.", "default": "standard", "options": [{ "value": "thin", "label": "Thin" }, { "value": "standard", "label": "Standard" }, { "value": "thick", "label": "Thick" }] },
    { "id": "origin", "type": "enum", "role": "motion", "label": "Origin", "description": "Edge the marker grows out of as the scale variable runs from 0 to 1.", "default": "left", "options": [{ "value": "left", "label": "Left" }, { "value": "right", "label": "Right" }, { "value": "center", "label": "Center" }] }
  ]'
    >
      <div class="copy">
        Turn the important words into
        <span class="hf-inline-highlight">animated emphasis</span> without rebuilding the scene.
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var tints = {
            yellow: "#fff06a",
            green: "var(--brand, #34d399)",
            blue: "var(--accent, #38bdf8)",
            violet: "var(--accent-2, #a78bfa)",
          };
          var heights = { thin: "0.22em", standard: "0.38em", thick: "0.62em" };
          var origins = { left: "left center", right: "right center", center: "center" };

          var root = document.documentElement;
          root.style.setProperty("--hf-highlight-color", tints[pick(tints, vars.tint, "yellow")]);
          root.style.setProperty(
            "--hf-highlight-height",
            heights[pick(heights, vars.thickness, "standard")],
          );
          root.style.setProperty(
            "--hf-highlight-origin",
            origins[pick(origins, vars.origin, "left")],
          );
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(".copy", { opacity: 0, y: 24, duration: 0.55, ease: "power3.out" }, 0.3);
        tl.to(
          ".hf-inline-highlight",
          { "--hf-highlight-scale": 1, duration: 0.6, ease: "power2.out" },
          0.95,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["inline-highlight-demo"] = tl;
      </script>
    </div>
    <style
      data-composition-variables='[
    { "id": "tint", "type": "enum", "role": "style", "label": "Tint", "description": "Marker colour. Green, blue and violet ride --brand, --accent and --accent-2.", "default": "yellow", "options": [{ "value": "yellow", "label": "Yellow" }, { "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "thickness", "type": "enum", "role": "style", "label": "Thickness", "description": "Height of the marker band behind the text, as a share of the font size.", "default": "standard", "options": [{ "value": "thin", "label": "Thin" }, { "value": "standard", "label": "Standard" }, { "value": "thick", "label": "Thick" }] },
    { "id": "origin", "type": "enum", "role": "motion", "label": "Origin", "description": "Edge the marker grows out of as the scale variable runs from 0 to 1.", "default": "left", "options": [{ "value": "left", "label": "Left" }, { "value": "right", "label": "Right" }, { "value": "center", "label": "Center" }] }
  ]'
    >
      .hf-inline-highlight {
        --hf-highlight-scale: 0;
        position: relative;
        display: inline;
        z-index: 0;
      }
      .hf-inline-highlight::after {
        content: "";
        position: absolute;
        left: -0.08em;
        right: -0.08em;
        bottom: 0.05em;
        height: var(--hf-highlight-height, 0.38em);
        background: var(--hf-highlight-color, #fff06a);
        transform: scaleX(var(--hf-highlight-scale));
        transform-origin: var(--hf-highlight-origin, left center);
        z-index: -1;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
