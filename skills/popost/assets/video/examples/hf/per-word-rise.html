<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text whose words or characters rise into place.", "default": "WORDS IN MOTION" },
    { "id": "split", "type": "enum", "role": "content", "label": "Split", "description": "Animate the text as words or individual characters.", "default": "word", "options": [{ "value": "word", "label": "Word" }, { "value": "char", "label": "Character" }] },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds (from mount start) for each unit landing. Empty keeps the authored cascade rhythm.", "default": "" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Contract accent token used for the text color.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "Optional departure. Default none: the line holds until the frame cuts.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Per Word Rise Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #0b0c0e);
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --surface: #14171c;
        --border: #343a46;
        --brand: #71f5a7;
        --accent: #61a8ff;
        --accent-2: #c5a3ff;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 3cqmin;
        --space-1: 1.8cqw;
        --space-2: 2.8cqh;
        --space-3: 4cqh;
        --dur-beat: 0.5s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 42%,
          color-mix(in srgb, var(--surface) 88%, var(--accent-2)) 0%,
          var(--bg) 72%
        );
      }

      .mount-card {
        width: 76%;
        height: 50%;
        left: 12%;
        top: 25%;
        container-type: size;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
        border-radius: calc(var(--radius) * 1.3);
        background: var(--bg);
        box-shadow: 0 4cqh 12cqh color-mix(in srgb, var(--bg) 68%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Words or characters rise into place in a controlled blur-to-sharp cascade, settle softly on landing, and hold still until the cut (optional fade or up exit).",
 "class": "text",
 "tags": [
  "motion-primitive",
  "text-effects",
  "typography",
  "stagger",
  "reveal"
 ],
 "seconds": 1.36,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "WORDS IN MOTION",
   "maxLength": 200,
   "what": "Text whose words or characters rise into place."
  },
  {
   "name": "split",
   "type": "choice",
   "default": "word",
   "options": [
    "word",
    "char"
   ],
   "what": "Animate the text as words or individual characters."
  },
  {
   "name": "cues",
   "type": "text",
   "default": "",
   "maxLength": 200,
   "what": "Comma-separated seconds (from mount start) for each unit landing. Empty keeps the authored cascade rhythm."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Contract accent token used for the text color."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Default none: the line holds until the frame cuts."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"EVERY FRAME MATTERS","split":"char","accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="per-word-rise-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="per-word-rise-mount"
        class="mount-card clip"
        data-composition-id="per-word-rise"
       
        data-variable-values='{"text":"EVERY FRAME MATTERS","split":"char","accent":"violet"}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1459"
        data-height="540"
      >
      <div id="root" data-composition-id="per-word-rise" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .pwr-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #0b0c0e);
          }

          .pwr-stage {
            display: flex;
            width: 88cqw;
            max-width: 88cqw;
            align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
            column-gap: var(--space-1, 1.8cqw);
            row-gap: var(--space-2, 2.8cqh);
            color: var(--pwr-accent);
            font-size: var(--pwr-font-size);
            font-weight: 780;
            line-height: 1.08;
            letter-spacing: -0.035em;
            text-align: center;
          }

          .pwr-stage.pwr-char {
            column-gap: 0.045em;
            letter-spacing: 0;
          }

          .pwr-unit {
            display: inline-block;
            flex: 0 0 auto;
            filter: blur(var(--pwr-blur, 0cqh));
            will-change: transform, filter, opacity;
          }

          .pwr-space {
            width: 0.36em;
          }
        </style>

        <div
          id="per-word-rise-clip"
          class="pwr-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="pwr-stage" role="img"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".pwr-stage");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "WORDS IN MOTION" : String(vars.text);
            var split = vars.split === "char" ? "char" : "word";
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";
            var cuesValue = vars.cues == null ? "" : String(vars.cues);
            var cues = cuesValue.split(",").reduce(function (result, token) {
              var trimmed = token.trim();
              if (trimmed === "") return result;
              var seconds = Number(trimmed);
              if (!Number.isFinite(seconds) || seconds < 0) return result;
              result.push(seconds);
              return result;
            }, []);

            root.style.setProperty("--pwr-accent", accentColors[accent]);
            stage.classList.toggle("pwr-char", split === "char");
            stage.setAttribute("aria-label", text);

            var characterCount = Math.max(1, Array.from(text).length);
            var fittedCqw = Math.min(9.5, 126 / characterCount);
            root.style.setProperty(
              "--pwr-font-size",
              "min(" + fittedCqw.toFixed(3) + "cqw, 15cqh)",
            );

            var segments = split === "char" ? Array.from(text) : text.trim().split(/\s+/);
            if (segments.length === 0) segments = [""];

            var units = segments.map(function (segment, index) {
              var unit = document.createElement("span");
              unit.id = "per-word-rise-unit-" + index;
              unit.className = "pwr-unit";
              if (split === "char" && /\s/.test(segment)) {
                unit.classList.add("pwr-space");
                unit.textContent = "\u00a0";
              } else {
                unit.textContent = segment;
              }
              unit.setAttribute("aria-hidden", "true");
              stage.appendChild(unit);
              return unit;
            });

            var IN_BASE = 1.45;
            var OUT_BASE = exit === "none" ? 0 : 0.5;
            var RISE_BASE = 0.74;
            var STAGGER_BASE = 0.62;
            var EXIT_STAGGER_BASE = 0.14;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var totalBase = Math.max(0.001, IN_BASE + OUT_BASE);
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var RISE = RISE_BASE * scale;
            var STAGGER = units.length > 1 ? STAGGER_BASE * scale : 0;
            var EXIT_STAGGER = units.length > 1 ? EXIT_STAGGER_BASE * scale : 0;
            var EXIT_MOVE = Math.max(0.001, OUT - EXIT_STAGGER);

            // Landing ease: overshoot-free decel with a settle tail. A plain
            // power3.out slams from fast to imperceptible in ~2 frames and the
            // words stop dead; this piecewise cubic keeps ~7% of the travel for
            // the last 22% of the duration and is C1-continuous at the seam,
            // so the word glides its final few pixels over the closing frames
            // (a settle) with monotonic velocity: no stall, no hop, no
            // overshoot. Pure function of progress, so it stays seek-safe.
            var LAND_SPLIT = 0.78; // progress where the settle tail begins
            var LAND_RESIDUAL = 0.07; // fraction of travel left for the tail
            var LAND_SEAM_SLOPE = ((1 - LAND_RESIDUAL) / LAND_SPLIT) * 0.5; // shared velocity at the seam
            function landEase(p) {
              if (p <= 0) return 0;
              if (p >= 1) return 1;
              if (p < LAND_SPLIT) {
                var x = p / LAND_SPLIT;
                var inv = 1 - x;
                // Half cubic-out, half linear: keeps end velocity for the seam.
                return (1 - LAND_RESIDUAL) * (0.5 * (1 - inv * inv * inv) + 0.5 * x);
              }
              var u = (p - LAND_SPLIT) / (1 - LAND_SPLIT);
              var b = LAND_SEAM_SLOPE * (1 - LAND_SPLIT);
              var c = 3 * LAND_RESIDUAL - 2 * b;
              var d = b - 2 * LAND_RESIDUAL;
              return 1 - LAND_RESIDUAL + b * u + c * u * u + d * u * u * u;
            }

            // Cues own the word landings when provided; the authored cascade
            // otherwise. Landings beyond the cue list extrapolate at the cue
            // list's own gap, and every landing clamps ahead of any exit.
            var riseEnd = IN;
            var landings;
            if (cues.length > 0) {
              var lastCue = cues[cues.length - 1];
              var cueGap =
                cues.length >= 2
                  ? Math.max(0.05, (lastCue - cues[0]) / (cues.length - 1))
                  : RISE * 0.4;
              var latestLanding = Math.max(RISE * 0.5, duration - OUT);
              landings = units.map(function (unit, index) {
                var landing =
                  index < cues.length
                    ? cues[index]
                    : lastCue + (index - (cues.length - 1)) * cueGap;
                return Math.min(latestLanding, Math.max(0.05, landing));
              });
              riseEnd = Math.min(duration - OUT, Math.max(IN, Math.max.apply(null, landings)));
            } else {
              // Authored cascade: same left-to-right wave the stagger drew,
              // expressed as explicit landings so every unit gets the settle.
              var step = units.length > 1 ? STAGGER / (units.length - 1) : 0;
              landings = units.map(function (unit, index) {
                return index * step + RISE;
              });
            }
            var HOLD_START = riseEnd;
            var HOLD = Math.max(0, duration - (HOLD_START + OUT));
            var OUT_START = HOLD_START + HOLD;

            gsap.set(units, { opacity: 0, y: "8cqh", "--pwr-blur": "1.4cqh" });

            var tl = gsap.timeline({ paused: true });

            units.forEach(function (unit, index) {
              var landing = landings[index];
              var startAt = Math.max(0, landing - RISE);
              tl.to(
                unit,
                {
                  opacity: 1,
                  y: "0cqh",
                  "--pwr-blur": "0cqh",
                  duration: Math.max(0.08, landing - startAt),
                  ease: landEase,
                },
                startAt,
              );
            });

            // TRUE hold: the finished line is dead still until the exit or
            // the cut. The old 0.55cqh drift was sub-perceptual at 1080p.

            // OUT: optional departure; exit none holds until the frame cuts.
            if (exit === "up") {
              tl.to(
                units,
                {
                  opacity: 0,
                  y: "-4.5cqh",
                  "--pwr-blur": "0.7cqh",
                  duration: EXIT_MOVE,
                  stagger: { amount: EXIT_STAGGER, from: "start" },
                  ease: "power2.in",
                },
                OUT_START,
              );
            } else if (exit === "fade") {
              tl.to(
                units,
                {
                  opacity: 0,
                  duration: EXIT_MOVE,
                  stagger: { amount: EXIT_STAGGER, from: "start" },
                  ease: "power2.in",
                },
                OUT_START,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["per-word-rise"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      var tl = gsap.timeline({ paused: true });
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["per-word-rise-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
