<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Apple Terminal Pro</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        font-family: "SF Mono", Menlo, Monaco, Consolas, "Courier New", monospace;
      }

      #scene {
        width: 1920px;
        height: 1080px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #141414 0%, #000000 70%);
      }

      .terminal-window {
        width: 1400px;
        height: 700px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 30px 80px rgba(136, 255, 103, 0.08),
          0 10px 30px rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
      }

      .titlebar {
        height: 38px;
        background: #1c1c1c;
        display: flex;
        align-items: center;
        padding: 0 14px;
        flex-shrink: 0;
        border-bottom: 1px solid #333333;
        position: relative;
      }

      .traffic-lights {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .traffic-lights span {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        display: inline-block;
      }

      .traffic-lights .close {
        background: #ff5f57;
        border: 1px solid #e0443e;
      }

      .traffic-lights .minimize {
        background: #ffbd2e;
        border: 1px solid #dfa123;
      }

      .traffic-lights .fullscreen {
        background: #28c840;
        border: 1px solid #1aab29;
      }

      .window-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        color: #bbbbbb;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        font-weight: 500;
        letter-spacing: -0.1px;
      }

      .terminal-canvas {
        flex: 1;
        background: #000000;
        padding: 18px 20px;
        overflow: hidden;
        font-size: 14px;
        line-height: 1.6;
        color: #bbbbbb;
      }

      .output-lines {
        margin-bottom: 4px;
      }

      .output-line {
        display: block;
        white-space: pre;
        opacity: 0;
        color: #bbbbbb;
      }

      .output-line.bold {
        font-weight: bold;
        color: #ffffff;
      }

      .output-line.accent {
        color: #88ff67;
        font-weight: bold;
      }

      .output-line.dim {
        color: #666666;
      }

      .input-line {
        display: flex;
        align-items: center;
        white-space: pre;
      }

      .prompt {
        color: #88ff67;
        font-weight: bold;
        user-select: none;
      }

      .typed-command {
        color: #bbbbbb;
      }

      .cursor-block {
        display: inline-block;
        width: 9px;
        height: 16px;
        background: #88ff67;
        vertical-align: text-bottom;
        margin-left: 1px;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Apple Terminal Pro profile: black background with grey text and lime green cursor, per-character typing animation of a shell session.",
 "class": "ui",
 "tags": [
  "code",
  "developer",
  "showcase",
  "terminal",
  "apple",
  "apple-terminal"
 ],
 "seconds": 6.8,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"type","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="scene"
      data-composition-id="code-snippet-apple-terminal-pro"
      data-width="1920"
      data-height="1080"
    >
      <div class="terminal-window">
        <div class="titlebar">
          <div class="traffic-lights">
            <span class="close"></span>
            <span class="minimize"></span>
            <span class="fullscreen"></span>
          </div>
          <span class="window-title">bash — 80×24</span>
        </div>
        <div class="terminal-canvas">
          <div class="output-lines">
            <span class="output-line dim">Last login: Mon Jun 2 09:14:22 on ttys008</span>
            <span class="output-line dim">Building production bundle...</span>
            <span class="output-line"> vite v5.3.1 building for production...</span>
            <span class="output-line"> ✓ 142 modules transformed.</span>
            <span class="output-line"> dist/index.html 0.48 kB</span>
            <span class="output-line"> dist/assets/index-Cv3rN.js 284.12 kB</span>
            <span class="output-line"> dist/assets/index-Du4mP.css 42.08 kB</span>
            <span class="output-line accent"> ✓ built in 2.31s</span>
          </div>
          <div class="input-line">
            <span class="prompt">user@Mac myapp % </span><span class="typed-command"></span
            ><span class="cursor-block"></span>
          </div>
        </div>
      </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const command = "npm run build";
      const typedEl = document.querySelector(".typed-command");
      const cursorEl = document.querySelector(".cursor-block");
      const outputLines = document.querySelectorAll(".output-line");

      const tl = gsap.timeline({ paused: true });

      tl.set(typedEl, { text: "" }, 0);

      const charDuration = 1.5 / command.length;
      command.split("").forEach((char, i) => {
        tl.add(
          () => {
            typedEl.textContent = command.slice(0, i + 1);
          },
          0.5 + i * charDuration,
        );
      });

      tl.set(cursorEl, { opacity: 0 }, 2.2);
      tl.set(outputLines[0], { opacity: 1 }, 2.3);

      tl.add(() => {
        typedEl.textContent = "";
      }, 2.5);

      outputLines.forEach((line, i) => {
        if (i === 0) return;
        tl.set(line, { opacity: 1 }, 2.8 + i * 0.1);
      });

      tl.add(() => {
        const inputLine = document.querySelector(".input-line");
        const newPrompt = document.createElement("div");
        newPrompt.className = "input-line";
        newPrompt.innerHTML =
          '<span class="prompt">user@Mac myapp % </span><span class="typed-command"></span><span class="cursor-block" id="final-cursor"></span>';
        inputLine.style.display = "none";
        inputLine.parentNode.appendChild(newPrompt);
      }, 4.2);

      const blinkTimes = [4.4, 4.8, 5.2, 5.6, 6.0, 6.4];
      blinkTimes.forEach((t, i) => {
        tl.add(() => {
          const fc = document.getElementById("final-cursor");
          if (fc) fc.style.opacity = i % 2 === 0 ? "0" : "1";
        }, t);
      });
      tl.add(() => {
        const fc = document.getElementById("final-cursor");
        if (fc) fc.style.opacity = "1";
      }, 6.8);

      window.__timelines["code-snippet-apple-terminal-pro"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
