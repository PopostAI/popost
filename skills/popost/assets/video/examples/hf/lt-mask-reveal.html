<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Montserrat", sans-serif;
      }

      #root .lt {
        position: absolute;
        left: 130px;
        bottom: 122px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      #root .lt-namewrap {
        position: relative;
        overflow: hidden;
        padding: 2px 0;
      }
      #root .lt-name {
        font-size: 72px;
        font-weight: 900;
        color: #ffffff;
        line-height: 0.98;
        letter-spacing: -0.02em;
        white-space: nowrap;
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.45);
        will-change: clip-path;
      }
      #root .lt-sweep {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 8px;
        background: #ffd23f;
      }
      #root .lt-role {
        font-size: 28px;
        font-weight: 500;
        color: #e7eaf0;
        line-height: 1.2;
        letter-spacing: 0.02em;
        white-space: nowrap;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Cardless lower third: an accent sweep crosses and clip-path-reveals a heavy name, role fades up; for footage",
 "class": "caption",
 "tags": [
  "lower-third",
  "overlay",
  "podcast",
  "interview",
  "bold"
 ],
 "seconds": 4.75,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.12,"cue":"whoosh","gain":0.5},{"at":0.16,"cue":"swish","gain":0.45},{"at":4.3,"cue":"swish","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="lt-mask-reveal"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="4.8"
    >
      <div id="lt-clip" class="clip" data-start="0" data-duration="4.8" data-track-index="0">
        <div id="lt" class="lt">
          <div class="lt-namewrap">
            <div id="lt-name" class="lt-name">Dr. Maya Chen</div>
            <div id="lt-sweep" class="lt-sweep"></div>
          </div>
          <div id="lt-role" class="lt-role">Host · Neuroscientist</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var wrap = document.getElementById("lt");
      var nameEl = document.getElementById("lt-name");
      var sweep = document.getElementById("lt-sweep");
      var role = document.getElementById("lt-role");

      // An accent sweep crosses left→right; the name is revealed by a clip-path wipe behind it; role fades up.
      // Sweep travel: left:"100%" was parent-relative (offsetParent = .lt-namewrap). Since the sweep is
      // only 8px wide, xPercent would travel just 8px, so translate by the container width in pixels instead.
      // The .lt-namewrap shrink-wraps the name "Dr. Maya Chen" to 536px (no horizontal padding/border, so
      // clientWidth == content width), which is exactly what left:"100%" resolved to.
      var SWEEP_TRAVEL = 536;
      gsap.set(nameEl, { clipPath: "inset(0 100% 0 0)" });
      gsap.set(sweep, { x: 0, opacity: 0 });
      gsap.set(role, { y: 14, opacity: 0 });

      tl.to(sweep, { opacity: 1, duration: 0.12, ease: "none" }, 0.1);
      tl.to(sweep, { x: SWEEP_TRAVEL, duration: 0.55, ease: "power2.inOut" }, 0.12);
      tl.to(nameEl, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, 0.16);
      tl.to(sweep, { opacity: 0, duration: 0.15, ease: "none" }, 0.6);
      tl.to(role, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.55);

      // Exit: name un-wipes, role fades, hard kill.
      tl.to(role, { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.25);
      tl.to(nameEl, { clipPath: "inset(0 0 0 100%)", duration: 0.4, ease: "power2.in" }, 4.3);
      tl.set(wrap, { visibility: "hidden" }, 4.75);

      window.__timelines["lt-mask-reveal"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
