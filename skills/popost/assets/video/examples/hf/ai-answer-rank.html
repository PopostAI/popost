      * {

      body {
        width: 1080px;

      }
      #aar-root {
        --aar-ink: #18181b;
        --aar-ground: #fcfcfb;
        --aar-accent: #16a34a;
        --aar-l1: color-mix(in srgb, var(--aar-ink) 72%, transparent);
        --aar-l2: color-mix(in srgb, var(--aar-ink) 45%, transparent);
        --aar-l3: color-mix(in srgb, var(--aar-ink) 18%, transparent);

        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: color-mix(in srgb, var(--aar-ink) 6%, var(--aar-ground));

        font-family: Inter, ui-sans-serif, system-ui, sans-serif;

      #aar-scene {

        align-items: center;
        justify-content: center;

      #aar-card {
        width: 920px;
        padding: 56px 56px 16px;
        border-radius: 44px;

        box-shadow:

        display: flex;
        flex-direction: column;

      /* the bubble is sized by an invisible copy of the whole prompt, so typing never reflows the card */
      #aar-bubble {
        position: relative;
        align-self: flex-end;
        max-width: 720px;
        padding: 24px 32px;
        border-radius: 32px 32px 10px 32px;
        background: var(--aar-l4);
        font-size: 32px;
        line-height: 44px;
        letter-spacing: -0.2px;
        transform-origin: 100% 100%;
      }
      #aar-sizer {
        visibility: hidden;
      }
      #aar-typing {
        position: absolute;
        left: 32px;
        right: 32px;
        top: 24px;
      }
      #aar-caret {
        display: inline-block;
        width: 3px;
        height: 34px;
        margin-left: 2px;
        border-radius: 2px;
        background: var(--aar-ink);
        vertical-align: -6px;
      }

      #aar-answer {
        position: relative;
        margin-top: 48px;
      }
      #aar-lead {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 48px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      #aar-star {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
      }
      #aar-star path {
        fill: var(--aar-ink);
      }
      .aar-w {
        opacity: 0;
      }
      #aar-thinking {
        position: absolute;
        left: 4px;
        top: 17px;
        display: flex;
        gap: 10px;
      }
      .aar-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--aar-l2);
      }

      /* 40px of runway under slot three, masked, so the pick pushed out fades instead of being cut */
      #aar-list {
        position: relative;
        height: 448px;
        margin-top: 28px;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, #000 408px, transparent 448px);
        mask-image: linear-gradient(to bottom, #000 408px, transparent 448px);
      }
      .aar-rank {
        position: absolute;
        left: 0;
        width: 44px;
        height: 124px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--aar-l1);
      }
      .aar-row {
        position: absolute;
        left: 68px;
        right: 0;
        height: 124px;
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 28px;
        border-radius: 28px;
        border: 1.5px solid var(--aar-hair);
      }
      .aar-hl {
        position: absolute;
        inset: -1.5px;
        border-radius: 28px;
        border: 3px solid var(--aar-accent);
        background: color-mix(in srgb, var(--aar-accent) 9%, transparent);
      }
      .aar-tile {
        position: relative;
        flex: 0 0 auto;
        width: 68px;
        height: 68px;
        border-radius: 18px;
        background: var(--aar-l1);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .aar-tile-accent {
        position: absolute;
        inset: 0;
        background: var(--aar-accent);
      }
      .aar-mono {
        position: relative;
        color: var(--aar-ground);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .aar-meta {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
      }
      .aar-name {
        font-size: 36px;
        font-weight: 600;
        line-height: 44px;
        letter-spacing: -0.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .aar-skel {
        height: 12px;
        margin-top: 12px;
        border-radius: 6px;
        background: var(--aar-l3);
      }
      #aar-check {
        position: relative;
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
      }
      #aar-check circle {
        fill: var(--aar-accent);
      }
      #aar-check-path {
        fill: none;
        stroke: var(--aar-ground);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .aar-hidden {
        opacity: 0;
        visibility: hidden;
      }

     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {

    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1080, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));

    <script>
      (function () {
        "use strict";

        var vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};

        function text(value, fallback, max) {
          if (typeof value !== "string") return fallback;
          var t = value.trim();
          if (!t) return fallback;
          return t.length > max ? t.slice(0, max) : t;
        }
        function color(value, fallback) {
          if (typeof value !== "string") return fallback;
          var c = value.trim();
          return c && CSS.supports("color", c) ? c : fallback;
        }
        function monogram(name) {
          var words = name.split(/\s+/).filter(Boolean);
          var letters =
            words.length > 1 ? words[0][0] + words[words.length - 1][0] : name.slice(0, 1);
          return letters.toUpperCase();
        }

        var root = document.getElementById("aar-root");
        root.style.setProperty("--aar-ink", color(vars.ink, "#18181b"));
        root.style.setProperty("--aar-ground", color(vars.ground, "#fcfcfb"));
        root.style.setProperty("--aar-accent", color(vars.accent, "#16a34a"));

        var prompt = text(vars.prompt, "What's the best CRM for a small team?", 90);
        var lead = text(vars.lead, "Here are the top picks:", 48);
        var names = [
          text(vars.rowA, "Brand A", 32),
          text(vars.rowB, "Brand B", 32),
          text(vars.rowC, "Brand C", 32),
        ];
        var brand = text(vars.brand, "Your brand", 32);
        var slot = ["1", "2", "3"].indexOf(String(vars.brandRank));
        if (slot < 0) slot = 0;

        var SLOT = 142;
        var rows = ["#aar-row-a", "#aar-row-b", "#aar-row-c"].map(function (sel, i) {
          var el = document.querySelector(sel);
          el.querySelector(".aar-name").textContent = names[i];
          el.querySelector(".aar-mono").textContent = monogram(names[i]);
          return el;
        });
        var brandRow = document.getElementById("aar-row-brand");
        brandRow.querySelector(".aar-name").textContent = brand;
        brandRow.querySelector(".aar-mono").textContent = monogram(brand);
        brandRow.style.top = slot * SLOT + "px";

        document.getElementById("aar-sizer").textContent = prompt;
        var leadEl = document.getElementById("aar-lead-text");
        leadEl.textContent = "";
        var words = lead.split(/\s+/).map(function (word, i) {
          if (i > 0) leadEl.appendChild(document.createTextNode(" "));
          var span = document.createElement("span");
          span.className = "aar-w";
          span.textContent = word;
          leadEl.appendChild(span);
          return span;
        });

        var checkPath = document.getElementById("aar-check-path");
        var checkLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = String(checkLen);

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#aar-card",
          { autoAlpha: 0, y: 40 },
          { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" },
          0.1,
        );
        tl.fromTo(
          "#aar-bubble",
          { autoAlpha: 0, scale: 0.9 },
          { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" },
          0.5,
        );

        /* uneven keystrokes read as a person typing; the budget keeps long prompts inside 9s */
        var KEY_GAPS = [
          0.05, 0.035, 0.06, 0.04, 0.03, 0.055, 0.045, 0.07, 0.035, 0.05, 0.04, 0.065,
        ];
        var raw = 0;
        for (var n = 1; n < prompt.length; n += 1) raw += KEY_GAPS[n % KEY_GAPS.length];
        var squeeze = Math.min(1, 1.8 / Math.max(raw, 0.001));
        var TYPE_START = 0.8;
        var t = TYPE_START;
        tl.set("#aar-typed", { textContent: "" }, 0.001);
        tl.set("#aar-caret", { autoAlpha: 0 }, 0.001);
        tl.set("#aar-caret", { autoAlpha: 1 }, TYPE_START - 0.15);
        for (var c = 1; c <= prompt.length; c += 1) {
          tl.set("#aar-typed", { textContent: prompt.slice(0, c) }, t);
          t += KEY_GAPS[c % KEY_GAPS.length] * squeeze;
        }
        var typeEnd = t;
        tl.set("#aar-caret", { autoAlpha: 0 }, typeEnd + 0.2);

        var THINK = typeEnd + 0.4;
        tl.fromTo(
          "#aar-thinking",
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.15, ease: "none" },
          THINK,
        );
        gsap.utils.toArray(".aar-dot").forEach(function (dot, i) {
          for (var b = 0; b < 2; b += 1) {
            var at = THINK + 0.1 + b * 0.32 + i * 0.08;
            tl.to(dot, { y: -9, duration: 0.14, ease: "sine.out" }, at);
            tl.to(dot, { y: 0, duration: 0.14, ease: "sine.in" }, at + 0.14);
          }
        });
        var LEAD = THINK + 0.85;
        tl.to("#aar-thinking", { autoAlpha: 0, duration: 0.12, ease: "none" }, LEAD - 0.12);
        tl.fromTo(
          "#aar-star",
          { autoAlpha: 0, scale: 0.3, rotation: -90 },
          { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" },
          LEAD,
        );
        words.forEach(function (w, i) {
          tl.set(w, { opacity: 1 }, LEAD + 0.12 + i * 0.07);
        });

        var ROWS = LEAD + 0.25 + words.length * 0.07;
        rows.forEach(function (row, i) {
          var at = ROWS + i * 0.16;
          tl.fromTo(
            "#aar-rank-" + (i + 1),
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.3, ease: "none" },
            at,
          );
          tl.fromTo(
            row,
            { autoAlpha: 0, y: 24 },
            { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" },
            at,
          );
        });

        /* picks step down rather than trade places, so the eye can follow each one to its new rank */
        var RERANK = ROWS + 0.32 + 0.45 + 0.95;
        rows.forEach(function (row, i) {
          if (i < slot) return;
          tl.to(row, { y: SLOT, duration: 0.55, ease: "power3.inOut" }, RERANK);
          if (i === 2) tl.to(row, { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, RERANK + 0.1);
        });
        /* the brand waits until its slot is mostly clear, so it never lands on the row leaving it */
        tl.fromTo(
          brandRow,
          { autoAlpha: 0, x: 96 },
          { autoAlpha: 1, x: 0, duration: 0.55, ease: "power3.out" },
          RERANK + 0.34,
        );

        var LAND = RERANK + 0.9;
        tl.fromTo(
          "#aar-hl",
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.3, ease: "power1.out" },
          LAND,
        );
        tl.fromTo(
          "#aar-tile-accent",
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.3, ease: "power1.out" },
          LAND,
        );
        tl.fromTo(
          "#aar-check",
          { autoAlpha: 0, scale: 0.4 },
          { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(2.2)" },
          LAND + 0.05,
        );
        tl.fromTo(
          checkPath,
          { strokeDashoffset: checkLen },
          { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
          LAND + 0.2,
        );

        tl.set({}, {}, 9);
        window.__timelines["ai-answer-rank"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
