<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Number Wheel - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #071b16;
        color: #ecfff8;
        font-family: Inter, system-ui, sans-serif;
      }
      .metric {
        text-align: center;
        /* ponytail: zoom scales the non-animated wrapper; GSAP owns .label and .hf-number-wheel-strip transforms */
        zoom: 2.8;
      }
      .label {
        color: #68d8b5;
        font-size: 38px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .hf-number-wheel {
        margin-top: 36px;
        display: inline-flex;
        align-items: baseline;
        gap: 0.02em;
        font-size: 172px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }
      .hf-number-wheel-digit {
        display: inline-block;
        height: 1em;
        overflow: hidden;
      }
      .hf-number-wheel-strip {
        display: grid;
        transform: translateY(0em);
        will-change: transform;
      }
      .hf-number-wheel-strip span {
        height: 1em;
        line-height: 1em;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A rolling digit counter primitive for metrics, prices, counts, and scoreboards",
 "class": "chart",
 "tags": [
  "video-primitive",
  "motion-primitive",
  "number",
  "counter",
  "data"
 ],
 "seconds": 2.09,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "spin",
   "type": "choice",
   "default": "single",
   "options": [
    "single",
    "double",
    "triple"
   ],
   "what": "How many full 0 to 9 revolutions each column adds before it lands, which is how far the reel travels in the same time."
  },
  {
   "name": "spacing",
   "type": "choice",
   "default": "standard",
   "options": [
    "tight",
    "standard",
    "wide"
   ],
   "what": "Gap between the digit columns."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "inherit",
   "options": [
    "inherit",
    "ink",
    "paper",
    "accent"
   ],
   "what": "Digit colour: inherit keeps the surrounding text colour, ink suits light frames, paper suits dark ones, accent rides --brand."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.2,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="number-wheel-demo"
      data-width="1920"
      data-height="1080"
      data-duration="5"
      data-composition-variables='[
    { "id": "spin", "type": "enum", "role": "motion", "label": "Spin", "description": "How many full 0 to 9 revolutions each column adds before it lands, which is how far the reel travels in the same time.", "default": "single", "options": [{ "value": "single", "label": "Single" }, { "value": "double", "label": "Double" }, { "value": "triple", "label": "Triple" }] },
    { "id": "spacing", "type": "enum", "role": "layout", "label": "Spacing", "description": "Gap between the digit columns.", "default": "standard", "options": [{ "value": "tight", "label": "Tight" }, { "value": "standard", "label": "Standard" }, { "value": "wide", "label": "Wide" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Digit colour: inherit keeps the surrounding text colour, ink suits light frames, paper suits dark ones, accent rides --brand.", "default": "inherit", "options": [{ "value": "inherit", "label": "Inherit" }, { "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
    >
      <div class="metric">
        <div class="label">GitHub stars</div>
        <span class="hf-number-wheel" data-value="30222"></span>
      </div>
      <script>
        (function () {
          const vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          const spins = { single: 0, double: 1, triple: 2 };
          const gaps = { tight: "0em", standard: "0.02em", wide: "0.14em" };
          const tones = {
            inherit: "inherit",
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };
          const pick = (table, value, fallback) =>
            Object.prototype.hasOwnProperty.call(table, value) ? table[value] : table[fallback];

          const cycles = pick(spins, vars.spin, "single");
          const gap = pick(gaps, vars.spacing, "standard");
          const tone = pick(tones, vars.tone, "inherit");

          document.querySelectorAll(".hf-number-wheel").forEach((el) => {
            if (el.dataset.hfNumberWheelReady === "1") return;
            el.style.setProperty("--hf-wheel-gap", gap);
            el.style.setProperty("--hf-wheel-color", tone);
            const value = el.dataset.value || "0";
            el.textContent = "";
            for (const char of value) {
              if (!/\d/.test(char)) {
                el.append(document.createTextNode(char));
                continue;
              }
              const stops = cycles * 10 + Number(char);
              const frame = document.createElement("span");
              frame.className = "hf-number-wheel-digit";
              const strip = document.createElement("span");
              strip.className = "hf-number-wheel-strip";
              strip.style.setProperty("--hf-number-target-y", `${-stops}em`);
              for (let i = 0; i <= stops; i++) {
                const step = document.createElement("span");
                step.textContent = String(i % 10);
                strip.appendChild(step);
              }
              frame.appendChild(strip);
              el.appendChild(frame);
            }
            el.dataset.hfNumberWheelReady = "1";
          });
        })();
      </script>
      <script>
        document.querySelectorAll(".hf-number-wheel").forEach((el) => {
          const value = el.dataset.value || "0";
          el.textContent = "";
          for (const char of value) {
            if (!/\d/.test(char)) {
              el.append(document.createTextNode(char));
              continue;
            }
            const digit = Number(char);
            const frame = document.createElement("span");
            frame.className = "hf-number-wheel-digit";
            const strip = document.createElement("span");
            strip.className = "hf-number-wheel-strip";
            strip.style.setProperty("--hf-number-target-y", `${-digit}em`);
            for (let i = 0; i <= digit; i++) {
              const step = document.createElement("span");
              step.textContent = String(i);
              strip.appendChild(step);
            }
            frame.appendChild(strip);
            el.appendChild(frame);
          }
        });
        const tl = gsap.timeline({ paused: true });
        tl.from(".label", { opacity: 0, y: 18, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.to(
          ".hf-number-wheel-strip",
          {
            y: (_, strip) => strip.style.getPropertyValue("--hf-number-target-y"),
            duration: 1.2,
            ease: "power3.out",
            stagger: 0.06,
          },
          0.65,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["number-wheel-demo"] = tl;
      </script>
    </div>
    <style
      data-composition-variables='[
    { "id": "spin", "type": "enum", "role": "motion", "label": "Spin", "description": "How many full 0 to 9 revolutions each column adds before it lands, which is how far the reel travels in the same time.", "default": "single", "options": [{ "value": "single", "label": "Single" }, { "value": "double", "label": "Double" }, { "value": "triple", "label": "Triple" }] },
    { "id": "spacing", "type": "enum", "role": "layout", "label": "Spacing", "description": "Gap between the digit columns.", "default": "standard", "options": [{ "value": "tight", "label": "Tight" }, { "value": "standard", "label": "Standard" }, { "value": "wide", "label": "Wide" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Digit colour: inherit keeps the surrounding text colour, ink suits light frames, paper suits dark ones, accent rides --brand.", "default": "inherit", "options": [{ "value": "inherit", "label": "Inherit" }, { "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
    >
      .hf-number-wheel {
        display: inline-flex;
        align-items: baseline;
        gap: var(--hf-wheel-gap, 0.02em);
        color: var(--hf-wheel-color, inherit);
        font-variant-numeric: tabular-nums;
      }
      .hf-number-wheel-digit {
        display: inline-block;
        height: 1em;
        overflow: hidden;
      }
      .hf-number-wheel-strip {
        display: grid;
        transform: translateY(0em);
        will-change: transform;
      }
      .hf-number-wheel-strip span {
        height: 1em;
        line-height: 1em;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
