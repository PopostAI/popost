<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Accent text", "description": "Word or short label emphasized by the beat hit.", "default": "BOOM" },
    { "id": "flashColor", "type": "enum", "role": "style", "label": "Flash color", "description": "Token-backed accent tone used by the radial flash.", "default": "accent", "options": [{ "value": "accent", "label": "Accent" }, { "value": "soft", "label": "Soft accent" }, { "value": "bright", "label": "Bright accent" }] },
    { "id": "intensity", "type": "number", "role": "timing", "label": "Intensity", "description": "Strength of the scale pulse, flash, and shake.", "default": 1, "min": 0.5, "max": 2, "step": 0.1 }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Beat Accent - Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #17213a 0%, #05070d 72%);
      }

      .mount-card {
        --bg: #101827;
        --surface: #18233a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --brand: #22c55e;
        --accent: #ff4f8b;
        --font-body: Inter, system-ui, sans-serif;
        --font-display: Inter, system-ui, sans-serif;
        width: 52%;
        height: 44%;
        left: 24%;
        top: 28%;
        border-radius: 32px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.52);
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A single music-hit sting: impact flash, micro scale-pulse on the subject, immediate decay.",
 "class": "audio",
 "tags": [
  "motion-primitive",
  "effects",
  "burst",
  "sting",
  "emphasize",
  "impact"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "BOOM",
   "maxLength": 200,
   "what": "Word or short label emphasized by the beat hit."
  },
  {
   "name": "flashColor",
   "type": "choice",
   "default": "accent",
   "options": [
    "accent",
    "soft",
    "bright"
   ],
   "what": "Token-backed accent tone used by the radial flash."
  },
  {
   "name": "intensity",
   "type": "number",
   "default": 1,
   "min": 0.5,
   "max": 2,
   "what": "Strength of the scale pulse, flash, and shake."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"DROP","flashColor":"bright","intensity":1.6};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.25,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="beat-accent-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="beat-accent-mount"
        class="mount-card clip"
        data-composition-id="beat-accent"
       
        data-variable-values='{"text":"DROP","flashColor":"bright","intensity":1.6}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="998"
        data-height="475"
      >
      <div id="root" data-composition-id="beat-accent" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            --ease-slam: cubic-bezier(0.19, 1, 0.22, 1);
            --ba-flash-color: var(--accent, #ff4f8b);
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #0b1120);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, system-ui, sans-serif);
            pointer-events: none;
          }

          .ba-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .ba-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            will-change: transform, opacity;
          }

          .ba-flash {
            position: absolute;
            width: 62cqw;
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(
              circle,
              color-mix(in srgb, var(--ba-flash-color) 92%, transparent) 0%,
              color-mix(in srgb, var(--ba-flash-color) 54%, transparent) 24%,
              color-mix(in srgb, var(--ba-flash-color) 16%, transparent) 48%,
              transparent 72%
            );
            opacity: 0;
            will-change: transform, opacity;
          }

          .ba-flash::after {
            content: "";
            position: absolute;
            inset: 22%;
            border: 0.45cqmin solid color-mix(in srgb, var(--ba-flash-color) 78%, transparent);
            border-radius: 50%;
          }

          .ba-subject {
            position: relative;
            z-index: 1;
            display: block;
            width: 86cqw;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, var(--font-body, system-ui, sans-serif));
            font-size: 20cqmin;
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.055em;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow:
              0 0 2cqmin color-mix(in srgb, var(--accent, #ff4f8b) 46%, transparent),
              0 1.2cqh 3.8cqh color-mix(in srgb, var(--bg, #0b1120) 68%, transparent);
            transform-origin: 50% 50%;
            will-change: transform;
          }
        </style>

        <div
          id="beat-accent-clip"
          class="ba-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="ba-stage">
            <div class="ba-flash" aria-hidden="true"></div>
            <div class="ba-subject"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".ba-stage");
            var flash = root.querySelector(".ba-flash");
            var subject = root.querySelector(".ba-subject");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "BOOM" : String(vars.text);
            var flashChoice =
              vars.flashColor === "soft" || vars.flashColor === "bright"
                ? vars.flashColor
                : "accent";
            var intensityValue = Number(vars.intensity);
            var intensity = Number.isFinite(intensityValue)
              ? Math.max(0.5, Math.min(2, intensityValue))
              : 1;

            var flashColors = {
              accent: "var(--accent, #ff4f8b)",
              soft: "color-mix(in srgb, var(--accent, #ff4f8b) 70%, var(--bg, #0b1120))",
              bright: "color-mix(in srgb, var(--accent, #ff4f8b) 72%, var(--fg, #f8fafc))",
            };

            subject.textContent = text;
            root.style.setProperty("--ba-flash-color", flashColors[flashChoice]);

            var IN_BASE = 0.9;
            var OUT_BASE = 0.4;
            var IMPACT_AT_BASE = 0.25;
            var SNAP_BASE = 0.12;
            var SETTLE_BASE = 0.28;
            var FLASH_IN_BASE = 0.08;
            var FLASH_OUT_BASE = 0.28;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var totalBase = IN_BASE + OUT_BASE;
            var envelopeScale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var IMPACT_AT = IMPACT_AT_BASE * envelopeScale;
            var SNAP = SNAP_BASE * envelopeScale;
            var SETTLE = SETTLE_BASE * envelopeScale;
            var FLASH_IN = FLASH_IN_BASE * envelopeScale;
            var FLASH_OUT = FLASH_OUT_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;

            var restScale = 1 - 0.06 * intensity;
            var peakScale = 1 + 0.18 * intensity;
            var flashPeakScale = 0.78 + 0.3 * intensity;
            var flashEndScale = 1.08 + 0.32 * intensity;
            var flashPeakOpacity = Math.min(0.96, 0.5 + 0.23 * intensity);
            var shakeX = 0.9 * intensity;
            var shakeY = 0.34 * intensity;

            gsap.set(stage, { x: 0, y: 0, opacity: 1 });
            gsap.set(subject, { scale: restScale });
            gsap.set(flash, { scale: 0.25, opacity: 0 });

            var tl = gsap.timeline({ paused: true });

            tl.to(subject, { scale: peakScale, duration: SNAP, ease: "expo.out" }, IMPACT_AT);
            tl.to(subject, { scale: 1, duration: SETTLE, ease: "power3.out" }, IMPACT_AT + SNAP);

            tl.to(
              flash,
              {
                scale: flashPeakScale,
                opacity: flashPeakOpacity,
                duration: FLASH_IN,
                ease: "expo.out",
              },
              IMPACT_AT,
            );
            tl.to(
              flash,
              { scale: flashEndScale, opacity: 0, duration: FLASH_OUT, ease: "power3.out" },
              IMPACT_AT + FLASH_IN,
            );

            tl.to(
              stage,
              {
                x: shakeX + "cqw",
                y: -shakeY + "cqh",
                duration: 0.04 * envelopeScale,
                ease: "none",
              },
              IMPACT_AT,
            );
            tl.to(
              stage,
              {
                x: -shakeX * 0.7 + "cqw",
                y: shakeY * 0.75 + "cqh",
                duration: 0.05 * envelopeScale,
                ease: "none",
              },
              IMPACT_AT + 0.04 * envelopeScale,
            );
            tl.to(
              stage,
              {
                x: shakeX * 0.3 + "cqw",
                y: -shakeY * 0.35 + "cqh",
                duration: 0.05 * envelopeScale,
                ease: "none",
              },
              IMPACT_AT + 0.09 * envelopeScale,
            );
            tl.to(
              stage,
              {
                x: 0,
                y: 0,
                duration: 0.12 * envelopeScale,
                ease: "power3.out",
              },
              IMPACT_AT + 0.14 * envelopeScale,
            );

            tl.call(
              function () {
                root.dispatchEvent(
                  new CustomEvent("hf:sfx", {
                    detail: { id: "impact-hard", t: IMPACT_AT },
                    bubbles: true,
                  }),
                );
              },
              [],
              IMPACT_AT,
            );

            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.out" }, OUT_START);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            // Literal id is required. Mount flattening strips data-composition-id
            // from this inner root, so reading the id from root would register
            // under null and leave the host unable to find this timeline.
            window.__timelines["beat-accent"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["beat-accent-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
