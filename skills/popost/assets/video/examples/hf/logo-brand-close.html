<html data-composition-variables='[
    { "id": "wordmark", "type": "string", "role": "content", "label": "Wordmark", "description": "Brand name whose letters cascade into the centered lockup.", "default": "HYPERFRAMES" },
    { "id": "tagline", "type": "string", "role": "content", "label": "Tagline", "description": "Optional tagline that settles beneath the wordmark. Empty hides it.", "default": "Write HTML. Render video." },
    { "id": "url", "type": "string", "role": "content", "label": "URL", "description": "Optional mono URL line beneath the tagline. Empty hides it.", "default": "hyperframes.heygen.com" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Contract color used by the brand period at the end of the wordmark.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "style", "label": "Exit", "description": "Optional departure. Films end on the still hold, so the default is none.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>logo-brand-close Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #e9e1d2);
      }

      #root {
        --bg: #e9e1d2;
        --fg: #202725;
        --muted: #6c746f;
        --surface: #f8f1e5;
        --border: #c9bfad;
        --brand: #246b63;
        --accent: #31776f;
        --accent-2: #8a6549;
        --font-display: Georgia, "Times New Roman", serif;
        --font-body: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --radius: 0.9cqmin;
        --space-1: 1.1cqmin;
        --space-2: 2.2cqmin;
        --space-3: 3.8cqmin;
        --dur-beat: 0.48s;
        --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1);
        --ease-emphasis: cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 42%,
          var(--surface, #f8f1e5) 0%,
          var(--bg, #e9e1d2) 72%
        );
      }

      .mount-stage {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A display-scale wordmark cascades letter by letter into a centered lockup, the accent brand period lands last, an optional tagline and wide-tracked mono URL settle beneath, and the finished identity holds dead still to the end of the film.",
 "class": "logo",
 "tags": [
  "motion-primitive",
  "typography",
  "brand",
  "logo",
  "end-card",
  "close"
 ],
 "seconds": 2.55,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "wordmark",
   "type": "text",
   "default": "HYPERFRAMES",
   "maxLength": 200,
   "what": "Brand name whose letters cascade into the centered lockup."
  },
  {
   "name": "tagline",
   "type": "text",
   "default": "Write HTML. Render video.",
   "maxLength": 200,
   "what": "Optional tagline that settles beneath the wordmark. Empty hides it."
  },
  {
   "name": "url",
   "type": "text",
   "default": "hyperframes.heygen.com",
   "maxLength": 200,
   "what": "Optional mono URL line beneath the tagline. Empty hides it."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Contract color used by the brand period at the end of the wordmark."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Films end on the still hold, so the default is none."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"wordmark":"FIELDNOTE","tagline":"Slow journalism for fast times.","url":"fieldnote.press","accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.98,"cue":"pop","gain":0.65}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="logo-brand-close-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="logo-brand-close-mount"
        class="mount-stage clip"
        data-composition-id="logo-brand-close"
       
        data-variable-values='{"wordmark":"FIELDNOTE","tagline":"Slow journalism for fast times.","url":"fieldnote.press","accent":"violet"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      >
      <div id="root" data-composition-id="logo-brand-close" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .lbc-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #0b0c0e);
          }

          .lbc-lockup {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100cqw;
            text-align: center;
            will-change: transform, opacity;
          }

          /* Display scale: the JS chars-aware fit targets ~76cqw of set
             width; 40cqh caps it in short, wide mounts. */
          .lbc-wordmark {
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin: 0;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: var(--lbc-wordmark-size, min(10.5cqw, 40cqh));
            font-weight: 600;
            line-height: 1.04;
            letter-spacing: -0.035em;
            white-space: nowrap;
            will-change: transform;
          }

          .lbc-letter {
            display: inline-block;
            flex: 0 0 auto;
            will-change: transform, opacity;
          }

          .lbc-space {
            width: 0.34em;
          }

          .lbc-period {
            color: var(--lbc-accent);
          }

          .lbc-tagline {
            max-width: 88cqw;
            margin: var(--space-2, 3cqmin) 0 0;
            color: var(--fg, #f8fafc);
            font-size: min(3.4cqw, 5.4cqmin);
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: 0.01em;
            will-change: transform, opacity;
          }

          .lbc-url {
            margin: var(--space-3, 4.6cqmin) 0 0;
            color: var(--muted, #94a3b8);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
            font-size: min(2.4cqw, 3.2cqmin);
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.28em;
            will-change: opacity;
          }
        </style>

        <div
          id="logo-brand-close-clip"
          class="lbc-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="lbc-lockup">
            <h2 class="lbc-wordmark"></h2>
            <p class="lbc-tagline"></p>
            <p class="lbc-url"></p>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var lockup = root.querySelector(".lbc-lockup");
            var wordmarkElement = root.querySelector(".lbc-wordmark");
            var taglineElement = root.querySelector(".lbc-tagline");
            var urlElement = root.querySelector(".lbc-url");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var wordmark =
              vars.wordmark == null
                ? "HYPERFRAMES"
                : String(vars.wordmark).trim().replace(/\s+/g, " ");
            if (wordmark.length === 0) wordmark = "HYPERFRAMES";
            var tagline =
              vars.tagline == null
                ? "Write HTML. Render video."
                : String(vars.tagline).trim().replace(/\s+/g, " ");
            var url = vars.url == null ? "hyperframes.heygen.com" : String(vars.url).trim();
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            root.style.setProperty("--lbc-accent", accentColors[accent]);
            wordmarkElement.setAttribute("aria-label", wordmark);
            wordmarkElement.setAttribute("role", "img");

            // The brand period: an accent dot ends the wordmark. If the
            // wordmark already ends with "." that period takes the accent
            // instead of appending a second one.
            var characters = Array.from(wordmark);
            if (characters[characters.length - 1] !== ".") characters.push(".");

            var letters = characters.map(function (character, index) {
              var letter = document.createElement("span");
              letter.id = "logo-brand-close-letter-" + index;
              letter.className = "lbc-letter";
              if (/\s/.test(character)) {
                letter.classList.add("lbc-space");
                letter.textContent = " ";
              } else {
                letter.textContent = character;
              }
              if (index === characters.length - 1) letter.classList.add("lbc-period");
              letter.setAttribute("aria-hidden", "true");
              wordmarkElement.appendChild(letter);
              return letter;
            });
            var periodLetter = letters[letters.length - 1];
            var cascadeLetters = letters.slice(0, -1);

            // Deterministic chars-aware fit: probe the set width at a fixed
            // 100px font (letter-spacing rides in em, so the em ratio is a
            // pure font metric), then size the wordmark so it lands at
            // ~76cqw. The 40cqh term caps it in short, wide mounts. If the
            // probe cannot measure (detached render), fall back to a
            // per-glyph advance estimate.
            wordmarkElement.style.fontSize = "100px";
            var probedWidth = wordmarkElement.getBoundingClientRect().width;
            wordmarkElement.style.fontSize = "";
            var setWidthEm;
            if (probedWidth > 0) {
              setWidthEm = probedWidth / 100;
            } else {
              setWidthEm = characters.reduce(function (total, character) {
                if (/\s/.test(character)) return total + 0.34;
                if (/[.,:;!'’|]/.test(character)) return total + 0.3;
                if (/[Iijlftr]/.test(character)) return total + 0.42;
                if (/[MWmw@]/.test(character)) return total + 0.92;
                return total + 0.64;
              }, 0);
              setWidthEm -= characters.length * 0.035;
            }
            setWidthEm = Math.max(0.3, setWidthEm);
            var wordmarkSize = 76 / setWidthEm;
            root.style.setProperty(
              "--lbc-wordmark-size",
              "min(" + wordmarkSize.toFixed(3) + "cqw, 40cqh)",
            );

            if (tagline.length === 0) taglineElement.remove();
            else taglineElement.textContent = tagline;
            if (url.length === 0) urlElement.remove();
            else urlElement.textContent = url;

            var IN_BASE = 2.6;
            var OUT_BASE = exit === "none" ? 0 : 0.5;
            var CASCADE_RISE_BASE = 1.15;
            var CASCADE_STAGGER_BASE = 0.7;
            var SETTLE_BASE = 2.4;
            var PERIOD_AT_BASE = 0.95;
            var PERIOD_DURATION_BASE = 0.9;
            var TAGLINE_AT_BASE = 1.35;
            var TAGLINE_DURATION_BASE = 0.9;
            var URL_AT_BASE = 1.7;
            var URL_DURATION_BASE = 0.85;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var STAGGER = cascadeLetters.length > 1 ? CASCADE_STAGGER_BASE * scale : 0;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            // IN: per-letter fade plus rise with a long expo tail, while the
            // whole wordmark settles down from a slightly larger scale.
            if (cascadeLetters.length > 0) {
              tl.fromTo(
                cascadeLetters,
                { opacity: 0, y: "0.62em" },
                {
                  opacity: 1,
                  y: "0em",
                  duration: CASCADE_RISE_BASE * scale,
                  stagger: { amount: STAGGER, from: "start" },
                  ease: "expo.out",
                },
                0,
              );
            }

            tl.fromTo(
              wordmarkElement,
              { scale: 1.04, transformOrigin: "50% 100%" },
              { scale: 1, duration: SETTLE_BASE * scale, ease: "expo.out" },
              0,
            );

            // The brand period lands last: a decisive accent pop.
            tl.fromTo(
              periodLetter,
              { opacity: 0, scale: 0.2, y: "0.08em", transformOrigin: "50% 65%" },
              {
                opacity: 1,
                scale: 1,
                y: "0em",
                duration: PERIOD_DURATION_BASE * scale,
                ease: "back.out(1.8)",
              },
              PERIOD_AT_BASE * scale,
            );

            if (taglineElement.isConnected) {
              tl.fromTo(
                taglineElement,
                { opacity: 0, y: "0.9em" },
                {
                  opacity: 1,
                  y: "0em",
                  duration: TAGLINE_DURATION_BASE * scale,
                  ease: "power3.out",
                },
                TAGLINE_AT_BASE * scale,
              );
            }

            if (urlElement.isConnected) {
              tl.fromTo(
                urlElement,
                // scaleX, not letterSpacing: tracking is a layout property, so
                // the browser snaps it to integer device pixels and the
                // ease-out tail stutters under seek-by-frame capture. The
                // widening reads the same and stays on the compositor.
                { opacity: 0, scaleX: 1.06 },
                {
                  opacity: 1,
                  scaleX: 1,
                  duration: URL_DURATION_BASE * scale,
                  ease: "power2.out",
                },
                URL_AT_BASE * scale,
              );
            }

            // HOLD: dead still. No drift, no breath; the confidence is the
            // stillness, and by default the film ends here.

            if (exit === "fade") {
              tl.to(lockup, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            } else if (exit === "up") {
              tl.to(
                lockup,
                { opacity: 0, y: "-5cqh", duration: OUT, ease: "power2.in" },
                OUT_START,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["logo-brand-close"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["logo-brand-close-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
