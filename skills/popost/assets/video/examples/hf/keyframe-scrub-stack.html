<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Keyframe Scrub Stack - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-advanced-keyframe-scrub-stack {
        --hf-accent: var(--accent, rgba(17, 24, 39, 0.72));
        --hf-l1: rgba(17, 24, 39, 0.72);
        --hf-l2: rgba(17, 24, 39, 0.45);
        --hf-l3: rgba(17, 24, 39, 0.18);
        --hf-l4: rgba(17, 24, 39, 0.08);
        --hf-hair: rgba(17, 24, 39, 0.14);
        color: var(--hf-l1);
        font-family: Inter, system-ui, sans-serif;
        /* ponytail: scale wrapper — GSAP only targets .card, not this element */
        transform: scale(2);
        transform-origin: center center;
        width: 560px;
        min-height: 360px;
        border-radius: 20px;
        padding: 32px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.1);
        border: 1px solid #e4e4e7;
        display: grid;
        place-items: center;
      }
      .hf-advanced-keyframe-scrub-stack .stack {
        position: relative;
        width: 460px;
        height: 240px;
      }
      .hf-advanced-keyframe-scrub-stack .card {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        background: linear-gradient(var(--hf-l4), var(--hf-l4)), #ffffff;
        border: 1px solid var(--hf-hair);
        box-shadow: 0 8px 32px rgba(15, 23, 42, 0.1);
        transform: translateY(var(--hf-card-y, 0px)) scale(var(--hf-card-scale, 1));
        opacity: var(--hf-card-opacity, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 22px 16px;
      }
      .hf-advanced-keyframe-scrub-stack .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hf-advanced-keyframe-scrub-stack .card-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--hf-l2);
        flex-shrink: 0;
      }
      .hf-advanced-keyframe-scrub-stack .card-label {
        font-size: 13px;
        font-weight: 600;
        color: #18181b;
        letter-spacing: -0.01em;
      }
      .hf-advanced-keyframe-scrub-stack .card-sub {
        font-size: 11px;
        font-weight: 400;
        color: var(--hf-l1);
        margin-top: 2px;
      }
      .hf-advanced-keyframe-scrub-stack .card-bars {
        display: flex;
        gap: 5px;
        align-items: flex-end;
        height: 36px;
      }
      .hf-advanced-keyframe-scrub-stack .bar {
        width: 8px;
        border-radius: 3px;
        background: var(--hf-l1);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A keyframe-sequenced stack of cards with offset timing and easing presets.",
 "class": "motion",
 "tags": [
  "advanced-motion",
  "anime-inspired",
  "hyperframes-native"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="keyframe-scrub-stack-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="hf-advanced-keyframe-scrub-stack">
        <div class="stack">
          <div class="card" style="--i: 0">
            <div class="card-header">
              <span class="card-dot"></span>
              <div>
                <div class="card-label">Keyframe 3</div>
                <div class="card-sub">t = 1.00s · ease-out</div>
              </div>
            </div>
            <div class="card-bars">
              <div class="bar" style="height: 28px"></div>
              <div class="bar" style="height: 36px"></div>
              <div class="bar" style="height: 20px"></div>
              <div class="bar" style="height: 32px"></div>
              <div class="bar" style="height: 14px"></div>
              <div class="bar" style="height: 24px"></div>
            </div>
          </div>
          <div class="card" style="--i: 1">
            <div class="card-header">
              <span class="card-dot"></span>
              <div>
                <div class="card-label">Keyframe 2</div>
                <div class="card-sub">t = 0.50s · back.out</div>
              </div>
            </div>
            <div class="card-bars">
              <div class="bar" style="height: 18px"></div>
              <div class="bar" style="height: 30px"></div>
              <div class="bar" style="height: 36px"></div>
              <div class="bar" style="height: 22px"></div>
            </div>
          </div>
          <div class="card" style="--i: 2">
            <div class="card-header">
              <span class="card-dot"></span>
              <div>
                <div class="card-label">Keyframe 1</div>
                <div class="card-sub">t = 0.00s · linear</div>
              </div>
            </div>
            <div class="card-bars">
              <div class="bar" style="height: 12px"></div>
              <div class="bar" style="height: 12px"></div>
              <div class="bar" style="height: 12px"></div>
              <div class="bar" style="height: 12px"></div>
              <div class="bar" style="height: 12px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const startTime = 0.5;
      tl.fromTo(
        ".hf-advanced-keyframe-scrub-stack .card",
        { "--hf-card-y": "42px", "--hf-card-scale": 0.88, "--hf-card-opacity": 0 },
        {
          "--hf-card-y": (i) => i * 26 + "px",
          "--hf-card-scale": (i) => 1 - i * 0.04,
          "--hf-card-opacity": 1,
          duration: 0.48,
          stagger: 0.12,
          ease: "back.out(1.6)",
        },
        startTime,
      );
      tl.set({}, {}, 5);
      window.__timelines = window.__timelines || {};
      window.__timelines["keyframe-scrub-stack-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
