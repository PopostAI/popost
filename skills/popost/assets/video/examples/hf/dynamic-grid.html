  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Dynamic Grid - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: linear-gradient(135deg, #07131d, #13312d);
        color: white;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-dynamic-grid {
        --hf-grid-size: 72px;
        --hf-grid-color: rgba(255, 255, 255, 0.16);
        --hf-grid-x: 0px;
        --hf-grid-y: 0px;
        --hf-grid-opacity: 1;
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: var(--hf-grid-opacity);
        background-image:
          linear-gradient(var(--hf-grid-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--hf-grid-color) 1px, transparent 1px);
        background-size: var(--hf-grid-size) var(--hf-grid-size);
        background-position: var(--hf-grid-x) var(--hf-grid-y);
      }
      .content {
        position: absolute;
        left: 180px;
        bottom: 170px;
        width: 1020px;
      }
      .title {
        font-size: 118px;
        line-height: 0.96;
        font-weight: 900;
        letter-spacing: -0.035em;
      }
      .copy {
        margin-top: 34px;
        width: 760px;
        font-size: 38px;
        line-height: 1.2;
        color: rgba(255, 255, 255, 0.65);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A responsive animated grid background driven by CSS variables for SaaS, code, and data scenes",
 "class": "background",
 "tags": [
  "video-primitive",
  "motion-primitive",
  "background",
  "grid",
  "ui"
 ],
 "seconds": 6,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "density",
   "type": "choice",
   "default": "standard",
   "options": [
    "fine",
    "standard",
    "coarse"
   ],
   "what": "Cell size of the grid: fine reads as graph paper, coarse as a few large panels."
  },
  {
   "name": "weight",
   "type": "choice",
   "default": "hairline",
   "options": [
    "hairline",
    "standard",
    "bold"
   ],
   "what": "Thickness of the grid lines, from a hairline rule to a bold structural grid."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "neutral",
   "options": [
    "neutral",
    "green",
    "blue",
    "violet"
   ],
   "what": "Line colour: neutral is the translucent white the original ships with, and the accents ride --brand, --accent and --accent-2."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.25,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="dynamic-grid-demo"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div
        class="hf-dynamic-grid"
        aria-hidden="true"
        data-composition-variables='[
    { "id": "density", "type": "enum", "role": "style", "label": "Density", "description": "Cell size of the grid: fine reads as graph paper, coarse as a few large panels.", "default": "standard", "options": [{ "value": "fine", "label": "Fine" }, { "value": "standard", "label": "Standard" }, { "value": "coarse", "label": "Coarse" }] },
    { "id": "weight", "type": "enum", "role": "style", "label": "Weight", "description": "Thickness of the grid lines, from a hairline rule to a bold structural grid.", "default": "hairline", "options": [{ "value": "hairline", "label": "Hairline" }, { "value": "standard", "label": "Standard" }, { "value": "bold", "label": "Bold" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Line colour: neutral is the translucent white the original ships with, and the accents ride --brand, --accent and --accent-2.", "default": "neutral", "options": [{ "value": "neutral", "label": "Neutral" }, { "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] }
  ]'
      ></div>
      <div class="content">
        <div class="title">Dynamic grid motion</div>
        <div class="copy">
          A web-native background primitive for product demos, explainers, and data scenes.
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var sizes = { fine: "44px", standard: "72px", coarse: "112px" };
          var weights = { hairline: "1px", standard: "2px", bold: "3px" };
          var tones = {
            neutral: "rgba(255, 255, 255, 0.16)",
            green: "color-mix(in srgb, var(--brand, #34d399) 34%, transparent)",
            blue: "color-mix(in srgb, var(--accent, #38bdf8) 34%, transparent)",
            violet: "color-mix(in srgb, var(--accent-2, #a78bfa) 34%, transparent)",
          };

          var size = sizes[pick(sizes, vars.density, "standard")];
          var line = weights[pick(weights, vars.weight, "hairline")];
          var color = tones[pick(tones, vars.tone, "neutral")];

          var roots = document.querySelectorAll(".hf-dynamic-grid");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-grid-size", size);
            roots[i].style.setProperty("--hf-grid-line", line);
            roots[i].style.setProperty("--hf-grid-color", color);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(".content", { opacity: 0, y: 32, duration: 0.7, ease: "power3.out" }, 0.25);
        tl.to(
          ".hf-dynamic-grid",
          { "--hf-grid-x": "72px", "--hf-grid-y": "-72px", duration: 6, ease: "none" },
          0,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["dynamic-grid-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-dynamic-grid {
        --hf-grid-size: 72px;
        --hf-grid-line: 1px;
        --hf-grid-color: rgba(255, 255, 255, 0.16);
        --hf-grid-x: 0px;
        --hf-grid-y: 0px;
        --hf-grid-opacity: 1;
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: var(--hf-grid-opacity);
        background-image:
          linear-gradient(
            var(--hf-grid-color) var(--hf-grid-line),
            transparent var(--hf-grid-line)
          ),
          linear-gradient(
            90deg,
            var(--hf-grid-color) var(--hf-grid-line),
            transparent var(--hf-grid-line)
          );
        background-size: var(--hf-grid-size) var(--hf-grid-size);
        background-position: var(--hf-grid-x) var(--hf-grid-y);
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
