<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: repeating-linear-gradient(45deg, #3d5a80 0 40px, #98c1d9 40px 80px) format("woff2");
        font-weight: 700;
        font-display: block;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #17161a;
        overflow: hidden;
      }
      #hw-t-root {
        /* ---- hw tokens ---- */
        --hw-font-print: "Caveat", cursive;
        --hw-font-script: "Caveat", cursive;
        --hw-ink: #f4f2ec;
        --hw-ink-dark: #26241f;
        --hw-accent-warm: #ffb020;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent; /* overlays footage or a board */
        font-family: var(--hw-font-print, "Caveat", cursive);
      }
      #hw-t-wrap {
        position: absolute;
        pointer-events: none;
      }
      #hw-t-line {
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.4);
      }
      #hw-t-line .w {
        display: inline;
      }
      #hw-t-under {
        overflow: visible;
        display: block;
      }
      #hw-t-under path {
        fill: none;
        stroke: var(--hw-accent-warm);
        stroke-width: 7;
        stroke-linecap: round;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Handwritten display text with a scalar-driven word-by-word highlight sweep and a seeded squiggle underline sized to the text; boils",
 "class": "overlay",
 "tags": [
  "handwritten",
  "typography",
  "title-card",
  "overlay"
 ],
 "placeholders": "1 CSS picture as a gradient",
 "seconds": 5.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":3,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="hw-t-root"
      data-composition-id="hw-title"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="hw-t-wrap">
        <div id="hw-t-line"></div>
        <svg id="hw-t-under" width="10" height="34"><path id="hw-t-under-path"></path></svg>
      </div>
      <div
        id="hw-t-drv"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters ----
           Handwritten title with the highlight-sweep scalar (the shared
           mk-callout-highlight mechanic) + squiggle underline + the boil.
           Demonstrates the dispatcher composing sweep + boil on one
           timeline (learning: one onUpdate — everything through hwOnUpdate). */
        var CONFIG = {
          text: "shine like the star you are",
          fontSize: 120,
          scheme: "chalk", // "chalk" (white, over footage) | "ink" (dark, boards)
          sweep: { enabled: true, start: 0.8, end: 3.2 },
          underline: { enabled: true, wobble: 6 },
          boil: { enabled: true, amp: 1.4, rot: 0.3, frameDrop: 3 },
          seed: 8,
          x: null, // null = centered
          y: null,
          animationIn: true,
          animationOut: true,
        };

        var DUR = 6;
        function clamp(v, lo, hi) {
          return Math.min(hi, Math.max(lo, v));
        }
        var IN = clamp(DUR * 0.08, 0.3, 0.8);
        var OUT = clamp(DUR * 0.06, 0.25, 0.6);

        /* hw family runtime */
        window.hwOnUpdate = function (tl, fn) {
          if (!tl.__hwRenders) {
            tl.__hwRenders = [];
            tl.eventCallback("onUpdate", function () {
              for (var i = 0; i < tl.__hwRenders.length; i++) tl.__hwRenders[i]();
            });
          }
          tl.__hwRenders.push(fn);
          fn();
        };
        window.hwHash = function (n, seed) {
          var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        };
        window.hwBoil = function (tl, target, opts) {
          opts = opts || {};
          var amp = opts.amp !== undefined ? opts.amp : 1.6;
          var rot = opts.rot !== undefined ? opts.rot : 0.5;
          var fps = opts.fps || 30;
          var drop = opts.frameDrop || 3;
          var seed = opts.seed || 1;
          var els = gsap.utils.toArray(target);
          window.hwOnUpdate(tl, function () {
            var step = Math.floor((tl.time() * fps) / drop);
            for (var i = 0; i < els.length; i++) {
              gsap.set(els[i], {
                x: window.hwHash(step * 3 + i * 97, seed) * amp,
                y: window.hwHash(step * 3 + 1 + i * 97, seed) * amp,
                rotation: (opts.baseRot || 0) + window.hwHash(step * 3 + 2 + i * 97, seed) * rot,
              });
            }
          });
        };

        var FULL = CONFIG.scheme === "ink" ? "#26241f" : "#f4f2ec";
        var FAINT = CONFIG.scheme === "ink" ? "rgba(38,36,31,0.3)" : "rgba(244,242,236,0.32)";

        var wrap = document.getElementById("hw-t-wrap");
        var line = document.getElementById("hw-t-line");
        line.style.fontSize = CONFIG.fontSize + "px";

        /* word spans */
        var wordEls = [];
        CONFIG.text.split(/\s+/).forEach(function (w, i) {
          if (i > 0) line.appendChild(document.createTextNode(" "));
          var span = document.createElement("span");
          span.className = "w";
          span.textContent = w;
          span.style.color = CONFIG.sweep.enabled ? FAINT : FULL;
          line.appendChild(span);
          wordEls.push(span);
        });

        /* measure + position; build squiggle underline to match width */
        var rect = line.getBoundingClientRect();
        wrap.style.left =
          (CONFIG.x === null ? Math.round((1920 - rect.width) / 2) : CONFIG.x) + "px";
        wrap.style.top =
          (CONFIG.y === null ? Math.round((1080 - rect.height) / 2) - 20 : CONFIG.y) + "px";

        var underPath = document.getElementById("hw-t-under-path");
        if (CONFIG.underline.enabled) {
          var uw = Math.round(rect.width);
          var svg = document.getElementById("hw-t-under");
          svg.setAttribute("width", uw);
          svg.setAttribute("viewBox", "0 0 " + uw + " 34");
          var segs = Math.max(6, Math.round(uw / 90));
          var d = "M 2 " + (16 + window.hwHash(0, CONFIG.seed) * 4).toFixed(1);
          for (var i = 1; i <= segs; i++) {
            var x = (uw / segs) * i;
            var y = 16 + window.hwHash(i * 5 + 1, CONFIG.seed) * CONFIG.underline.wobble;
            var cxp = x - uw / segs / 2 + window.hwHash(i * 5 + 2, CONFIG.seed) * 10;
            var cyp = 16 + (i % 2 ? -1 : 1) * (8 + window.hwHash(i * 5 + 3, CONFIG.seed) * 4);
            d +=
              " Q " +
              cxp.toFixed(1) +
              " " +
              cyp.toFixed(1) +
              " " +
              x.toFixed(1) +
              " " +
              y.toFixed(1);
          }
          underPath.setAttribute("d", d);
        } else {
          document.getElementById("hw-t-under").style.display = "none";
        }

        var tl = gsap.timeline({ paused: true });

        if (CONFIG.animationIn) {
          gsap.set(wrap, { opacity: 0 });
          tl.to(wrap, { opacity: 1, duration: IN, ease: "power2.out" }, 0.1);
        }

        /* the sweep scalar — registered through the dispatcher so it
           coexists with the boil on the same timeline */
        if (CONFIG.sweep.enabled) {
          var mix = gsap.utils.interpolate(FAINT, FULL);
          var st = { p: 0 };
          window.hwOnUpdate(tl, function () {
            var k = st.p * wordEls.length;
            for (var i = 0; i < wordEls.length; i++) {
              var f = Math.max(0, Math.min(1, k - i));
              wordEls[i].style.color = mix(f);
            }
          });
          tl.to(
            st,
            { p: 1, duration: CONFIG.sweep.end - CONFIG.sweep.start, ease: "none" },
            CONFIG.sweep.start,
          );
        }

        /* underline draws as the sweep lands */
        if (CONFIG.underline.enabled) {
          var len = underPath.getTotalLength();
          gsap.set(underPath, { strokeDasharray: len, strokeDashoffset: len });
          var uAt = CONFIG.sweep.enabled ? CONFIG.sweep.end - 0.2 : 0.8;
          tl.to(underPath, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, uAt);
        }

        if (CONFIG.boil.enabled) {
          window.hwBoil(tl, "#hw-t-wrap", {
            amp: CONFIG.boil.amp,
            rot: CONFIG.boil.rot,
            frameDrop: CONFIG.boil.frameDrop,
            seed: CONFIG.seed,
          });
        }

        if (CONFIG.animationOut) {
          tl.to(wrap, { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
        }
        tl.set("#hw-t-root", { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["hw-title"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
