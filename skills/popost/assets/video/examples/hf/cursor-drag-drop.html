<script type="application/json" id="popost-params">

<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"card_label":"Fix checkout validation","accent":"#0a84ff","tone":"light"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"click","gain":0.5}]</script>

          height: 100%;
        }
      </style>

      <div id="root" data-composition-id="cursor-drag-drop" data-duration="3.6" data-tone="light">
        <div class="dd-stage" id="dd-stage">
          <div class="dd-col" style="left: 380px">
            <div class="dd-col-head">To do <span class="dd-count" id="dd-count-a">4</span></div>
          </div>
          <div class="dd-col" style="left: 1020px">

              In progress <span class="dd-count" id="dd-count-b">0</span>
            </div>
          </div>

            <div class="dd-slot-hot" id="dd-slot-hot"></div>
          </div>

          <div class="dd-card" id="dd-card-0" style="left: 400px; top: 300px">
            <div class="dd-chip" style="--chip: #d9480f">Marketing</div>
            <div class="dd-title">Draft onboarding email</div>
            <div class="dd-meta">Thu <span class="dd-avatar" style="--av: #e8590c">AR</span></div>

          </div>

            <div class="dd-chip" style="--chip: #1971c2">Docs</div>
            <div class="dd-title">Update pricing FAQ</div>
            <div class="dd-meta">Tue <span class="dd-avatar" style="--av: #1c7ed6">SM</span></div>
          </div>
          <div class="dd-card" id="dd-card-1" style="left: 400px; top: 438px; z-index: 10">
            <div class="dd-lift" id="dd-lift"></div>
            <div class="dd-chip" style="--chip: #c2255c">Bug</div>
            <div class="dd-title" id="dd-label"></div>
            <div class="dd-meta">Today <span class="dd-avatar" style="--av: #d6336c">JP</span></div>
          </div>

          <div class="dd-cursor" id="dd-cursor" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M5 3 L5 19 L9 15 L12 22 L15 20.5 L11.5 14 L18 14 Z"

      <script>
        (function () {
          "use strict";

          var html = document.documentElement;
          var root = document.getElementById("root");
          var $ = function (id) {
            return document.getElementById(id);
          };

          var DEFAULTS = {};
          try {
            JSON.parse(html.getAttribute("data-composition-variables") || "[]").forEach(
              function (variable) {
                DEFAULTS[variable.id] = variable.default;
              },
            );
          } catch (error) {
            /* malformed declaration falls back to the inline defaults below */
          }
          var scopedVariables = {};
          try {
            if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
              scopedVariables = window.__hyperframes.getVariables() || {};
            }
          } catch (error) {
            /* no scoped variables API in this context */
          }
          var vars = Object.assign({}, DEFAULTS, window.__hfVariables || {}, scopedVariables);

          // Hardcoded: the compositor rewrites the wrapper's attributes on mount.
          var compositionId = "cursor-drag-drop";
          var duration = Math.max(
            0.001,
            parseFloat(
              root.dataset.duration || html.getAttribute("data-composition-duration") || "3.6",
            ),
          );
          root.setAttribute("data-tone", vars.tone === "dark" ? "dark" : "light");
          if (vars.accent) root.style.setProperty("--dd-accent", String(vars.accent));
          $("dd-label").textContent = String(vars.card_label || "Fix checkout validation");

          var W = root.clientWidth || 1920;
          var H = root.clientHeight || 1080;
          var fit = Math.min(W / 1920, H / 1080);
          var ZOOM = 1.15;
          $("dd-stage").style.transform =
            "translate(" +
            (W - 1920 * fit) / 2 +
            "px," +
            (H - 1080 * fit) / 2 +
            "px) scale(" +
            fit +
            ") translate(960px,545px) scale(" +
            ZOOM +
            ") translate(-960px,-545px)";

          var s = Math.min(1, duration / 3.6);
          var T_ARRIVE = 0.5 * s;
          var T_PRESS = 0.7 * s;
          var T_CARRY = 0.9 * s;
          var T_DROP = 2.0 * s;
          var T_DRIFT = 2.6 * s;
          var T_EXIT = duration - 0.5 * s;

          var easeArrive = gsap.parseEase("power3.out");
          var easeOut = gsap.parseEase("power2.out");
          var easeCarry = gsap.parseEase("power3.inOut");
          var easeExit = gsap.parseEase("power3.in");
          var easeSettle = gsap.parseEase("back.out(2.2)");
          function clamp01(u) {
            return u < 0 ? 0 : u > 1 ? 1 : u;
          }
          function smooth(u) {
            u = clamp01(u);
            return u * u * (3 - 2 * u);
          }
          function arc(p0, p1, bend, u) {
            var cx = (p0.x + p1.x) / 2 - (p1.y - p0.y) * bend;
            var cy = (p0.y + p1.y) / 2 + (p1.x - p0.x) * bend;
            var v = 1 - u;
            return {
              x: v * v * p0.x + 2 * v * u * cx + u * u * p1.x,
              y: v * v * p0.y + 2 * v * u * cy + u * u * p1.y,
            };
          }

          // Board coordinates: the grip point on the card, and where the card lands.
          var GRIP = { x: 730, y: 500 };
          var DROP = { x: 640, y: -138 };
          var ORIGIN = { x: 0, y: 0 };
          var START = { x: 2080, y: 1240 };
          var ASIDE = { x: GRIP.x + DROP.x + 110, y: GRIP.y + DROP.y + 90 };
          // 64px at 1920 wide on screen, in stage units.
          var ARROW = (64 * (W / 1920)) / (fit * ZOOM);
          var ARROW_TIP = { x: (5 / 24) * ARROW, y: (3 / 24) * ARROW };

          function carryAt(t) {
            if (t <= T_CARRY) return ORIGIN;
            if (t >= T_DROP) return DROP;
            return arc(ORIGIN, DROP, -0.12, easeCarry((t - T_CARRY) / (T_DROP - T_CARRY)));
          }
          function pointerAt(t) {
            if (t <= T_ARRIVE) return arc(START, GRIP, 0.18, easeArrive(clamp01(t / T_ARRIVE)));
            if (t <= T_DRIFT) {
              var c = carryAt(t);
              return { x: GRIP.x + c.x, y: GRIP.y + c.y };
            }
            var dropped = { x: GRIP.x + DROP.x, y: GRIP.y + DROP.y };
            if (t <= T_EXIT)
              return arc(dropped, ASIDE, 0.1, easeArrive(clamp01((t - T_DRIFT) / (0.5 * s))));
            return arc(ASIDE, START, -0.1, easeExit(clamp01((t - T_EXIT) / (duration - T_EXIT))));
          }

          function gapAt(t) {
            var c = carryAt(t);
            return Math.hypot(c.x - DROP.x, c.y - DROP.y);
          }
          // First time the card is over the drop column; the slot fades in from here.
          var T_HOT = T_DROP;
          for (var k = 0; k <= 200; k++) {
            var tk = T_CARRY + ((T_DROP - T_CARRY) * k) / 200;
            if (gapAt(tk) < 300) {
              T_HOT = tk;
              break;
            }
          }

          function liftAt(t) {
            if (t < T_PRESS) return 0;
            if (t < T_DROP) return smooth((t - T_PRESS) / (0.2 * s));
            return 1 - clamp01((t - T_DROP) / (0.28 * s));
          }
          function cardScaleAt(t) {
            if (t < T_DROP) return 1 + 0.04 * liftAt(t);
            var u = clamp01((t - T_DROP) / (0.34 * s));
            return 1.04 - 0.04 * easeSettle(u);
          }

          var card = $("dd-card-1");
          var lift = $("dd-lift");
          var below = [$("dd-card-2"), $("dd-card-3")];
          var slotHot = $("dd-slot-hot");
          var slot = $("dd-slot");
          var cursor = $("dd-cursor");
          var countA = $("dd-count-a");
          var countB = $("dd-count-b");
          cursor.style.width = cursor.style.height = ARROW + "px";
          cursor.style.transformOrigin = ARROW_TIP.x + "px " + ARROW_TIP.y + "px";
          // Pivot the lifted card on the grip point so it stays under the arrow tip.
          var gripX = GRIP.x - parseFloat(card.style.left);
          var gripY = GRIP.y - parseFloat(card.style.top);
          card.style.transformOrigin = gripX + "px " + gripY + "px";

          function render(t) {
            var c = carryAt(t);
            var lagged = carryAt(Math.max(0, t - 0.06));
            var ahead = carryAt(Math.min(duration, t + 0.02));
            var vx = (ahead.x - lagged.x) / 0.08;
            var tilt = Math.max(-3, Math.min(3, (vx / 1200) * 3)) * liftAt(t);
            card.style.transform =
              "translate(" +
              c.x.toFixed(2) +
              "px," +
              c.y.toFixed(2) +
              "px) rotate(" +
              tilt.toFixed(2) +
              "deg) scale(" +
              cardScaleAt(t).toFixed(4) +
              ")";
            lift.style.opacity = liftAt(t).toFixed(3);

            var close = easeCarry(clamp01((t - T_CARRY - 0.15 * s) / (0.4 * s)));
            below.forEach(function (el) {
              el.style.transform = "translateY(" + (-138 * close).toFixed(2) + "px)";
            });

            var hot =
              t < T_DROP ? smooth(1 - gapAt(t) / 300) : 1 - clamp01((t - T_DROP) / (0.3 * s));
            slotHot.style.opacity = hot.toFixed(3);
            slot.style.opacity = (
              t < T_DROP ? clamp01((t - T_HOT) / 0.12) : 1 - clamp01((t - T_DROP) / (0.3 * s))
            ).toFixed(3);

            countA.textContent = t >= T_CARRY + 0.15 * s ? "3" : "4";
            countB.textContent = t >= T_DROP ? "1" : "0";

            var p = pointerAt(t);
            // Held down at 0.9 from grab to drop, 100ms each way.
            var press =
              t < T_DROP
                ? 1 - 0.1 * easeOut(clamp01((t - T_PRESS) / 0.1))
                : 0.9 + 0.1 * easeOut(clamp01((t - T_DROP) / 0.1));
            cursor.style.transform =
              "translate(" +
              (p.x - ARROW_TIP.x).toFixed(2) +
              "px," +
              (p.y - ARROW_TIP.y).toFixed(2) +
              "px) scale(" +
              press.toFixed(4) +
              ")";
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(
            clock,
            {
              t: duration,
              duration: duration,
              ease: "none",
              onUpdate: function () {
                render(clock.t);
              },
            },
            0,
          );
          render(0);
          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = tl;
        })();
      </script>
    </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["cursor-drag-drop-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
