<html data-composition-variables='[
    { "id": "beatCount", "type": "number", "role": "content", "label": "Beat count", "description": "Number of beat rows in the sequence.", "default": 4, "min": 2, "max": 6, "step": 1 },
    { "id": "interval", "type": "number", "role": "layout", "label": "Interval", "description": "Base time between consecutive beat markers.", "default": 0.6, "min": 0.2, "max": 2, "step": 0.05, "unit": "s" },
    { "id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "Comma-separated beat titles, one per beat. Extra entries are ignored and missing entries fall back to Beat N.", "default": "One,Two,Three,Four" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Beat Timeline - Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }

      #root {
        --bg: #070b14;
        --fg: #f7f9fc;
        --muted: #91a0b8;
        --surface: #111a2b;
        --border: rgba(145, 160, 184, 0.22);
        --brand: #7dd3fc;
        --accent: #c4b5fd;
        --font-display: Inter, ui-sans-serif, system-ui, sans-serif;
        --font-body: Inter, ui-sans-serif, system-ui, sans-serif;
        --radius: 18px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 32px;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, var(--surface), var(--bg) 66%);
        color: var(--fg);
        font-family: var(--font-body);
      }

      /* Definite percentages resolve against #root's fixed pixel box. This
         avoids the shrink-to-fit feedback collapse of a size-contained mount. */
      .mount-card {
        width: 50%;
        height: 70%;
        left: 25%;
        top: 15%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 30px;
        box-shadow: 0 48px 120px rgba(0, 0, 0, 0.48);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A paused master-timeline orchestration spine that pins titled beat rows to evenly spaced named labels. Each row enters on its label, holds with the sequence, then exits with the group.",
 "class": "audio",
 "tags": [
  "orchestration",
  "transitions",
  "sequencing",
  "bridge",
  "timeline"
 ],
 "seconds": 5.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "beatCount",
   "type": "number",
   "default": 4,
   "min": 2,
   "max": 6,
   "what": "Number of beat rows in the sequence."
  },
  {
   "name": "interval",
   "type": "number",
   "default": 0.6,
   "min": 0.2,
   "max": 2,
   "unit": "s",
   "what": "Base time between consecutive beat markers."
  },
  {
   "name": "labels",
   "type": "text",
   "default": "One,Two,Three,Four",
   "maxLength": 200,
   "what": "Comma-separated beat titles, one per beat. Extra entries are ignored and missing entries fall back to Beat N."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"beatCount":5,"interval":0.5,"labels":"Capture,Draft,Review,Ship,Iterate"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="beat-timeline-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5.5"
      data-fps="30"
    >
      <div
        id="beat-timeline-mount"
        class="mount-card clip"
        data-composition-id="beat-timeline"
       
        data-variable-values='{"beatCount":5,"interval":0.5,"labels":"Capture,Draft,Review,Ship,Iterate"}'
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
        data-width="960"
        data-height="756"
      >
      <div
        id="root"
        data-composition-id="beat-timeline"
        data-start="0"
        data-duration="5.5"
        data-fps="30"
      >
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root is styled by ID for mounted CSS scoping. It owns no stage
             dimensions, only the host box and the container-unit basis. */
          #root {
            --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
            --ease-exit: cubic-bezier(0.55, 0.055, 0.675, 0.19);
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, Canvas);
            color: var(--fg, CanvasText);
            font-family: var(--font-body, system-ui, sans-serif);
          }

          .bt-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
          }

          .bt-stack {
            width: 84cqw;
            display: flex;
            flex-direction: column;
            gap: 1.4cqh;
          }

          /* EDIT ZONE: row geometry only. Motion timing is owned by the script's
             RETIME RANGE below, and theme paint remains token-driven here. */
          .bt-row {
            min-height: 10cqh;
            display: grid;
            grid-template-columns: 6cqw 1fr;
            align-items: center;
            column-gap: 2.6cqw;
            padding: 1.4cqh 2.4cqw;
            border: 0.12cqw solid var(--border, currentColor);
            border-radius: var(--radius, 2cqh);
            background: var(--surface, Canvas);
            box-shadow: 0 1.2cqh 4cqh color-mix(in srgb, var(--bg, Canvas) 52%, transparent);
          }

          .bt-index {
            width: 6cqw;
            height: 6cqw;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--brand, currentColor);
            color: var(--bg, Canvas);
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: 1.8cqw;
            font-weight: 750;
            line-height: 1;
          }

          .bt-copy {
            min-width: 0;
          }

          .bt-title {
            overflow: hidden;
            color: var(--fg, CanvasText);
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: min(4.4cqw, 5.2cqh);
            font-weight: 700;
            line-height: 1.04;
            letter-spacing: -0.08cqw;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .bt-subtitle {
            margin-top: 0.7cqh;
            color: var(--muted, currentColor);
            font-size: min(1.8cqw, 2.2cqh);
            font-weight: 550;
            line-height: 1.15;
            letter-spacing: 0.04cqw;
          }
        </style>

        <div
          id="beat-timeline-clip"
          class="bt-clip clip"
          data-start="0"
          data-duration="5.5"
          data-track-index="0"
        >
          <div class="bt-stack" aria-label="Beat timeline"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            // Literal by contract: mounting strips data-composition-id from the
            // flattened inner root, so reading the attribute post-mount would
            // register under null and fail the timeline lookup.
            var compositionId = "beat-timeline";
            var stack = root.querySelector(".bt-stack");

            // EDIT ZONE: declarations live on <html>; this runtime call is the
            // single owner of declared defaults plus per-instance overrides.
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var parsedBeatCount = Number(vars.beatCount);
            // INVARIANT: exactly 2..6 integer rows reach the DOM and timeline.
            var beatCount = Math.max(
              2,
              Math.min(6, Math.round(Number.isFinite(parsedBeatCount) ? parsedBeatCount : 4)),
            );
            var parsedInterval = Number(vars.interval);
            // INVARIANT: invalid timing falls back once, valid timing clamps to
            // the declared range before duration elasticity is calculated.
            var interval = Math.max(
              0.2,
              Math.min(2, Number.isFinite(parsedInterval) ? parsedInterval : 0.6),
            );
            // INVARIANT: labels is always a string; blank or missing entries
            // fall back per row, while authored extra entries stay unused.
            var labelsValue = vars.labels == null ? "One,Two,Three,Four" : String(vars.labels);
            var suppliedLabels = labelsValue.split(",").map(function (label) {
              return label.trim();
            });

            var parsedDuration = parseFloat(root.dataset.duration || "5.5");
            // INVARIANT: the lifecycle remains finite even under a malformed
            // host duration. The authored and demo durations are both 5.5s.
            var duration = Math.max(0.001, Number.isFinite(parsedDuration) ? parsedDuration : 5.5);

            // RETIME RANGE: these values own the whole pacing decision. The
            // interval and row entrance compress together, never via timeScale.
            var ROW_IN_BASE = 0.4;
            var OUT_BASE = 0.4;
            var baseEntranceSpan = (beatCount - 1) * interval + ROW_IN_BASE;
            var OUT = duration <= OUT_BASE ? duration / 2 : OUT_BASE;
            var entranceBudget = duration - OUT;
            var scale = baseEntranceSpan > entranceBudget ? entranceBudget / baseEntranceSpan : 1;
            var timedInterval = interval * scale;
            var ROW_IN = ROW_IN_BASE * scale;
            var ENTRANCE_SPAN = (beatCount - 1) * timedInterval + ROW_IN;
            var HOLD = Math.max(0, duration - (ENTRANCE_SPAN + OUT));
            var OUT_START = ENTRANCE_SPAN + HOLD;

            function fireSfx(id, t) {
              root.dispatchEvent(
                new CustomEvent("hf:sfx", { detail: { id: id, t: t }, bubbles: true }),
              );
            }

            var rows = [];
            for (var i = 0; i < beatCount; i += 1) {
              var title = suppliedLabels[i] || "Beat " + (i + 1);
              var row = document.createElement("div");
              row.className = "bt-row";
              row.innerHTML =
                '<div class="bt-index" aria-hidden="true"></div>' +
                '<div class="bt-copy"><div class="bt-title"></div><div class="bt-subtitle"></div></div>';
              row.querySelector(".bt-index").textContent = String(i + 1).padStart(2, "0");
              row.querySelector(".bt-title").textContent = title;
              row.querySelector(".bt-subtitle").textContent =
                "Cue " +
                String(i + 1).padStart(2, "0") +
                "  ·  " +
                (i * timedInterval).toFixed(2) +
                "s";
              stack.appendChild(row);
              rows.push(row);
            }

            // Explicit entrance and exit endpoints make a direct seek to t=0
            // correct without ever playing the timeline.
            gsap.set(rows, { opacity: 0, y: "2cqh", scale: 0.98 });

            var tl = gsap.timeline({ paused: true });

            // ORCHESTRATION SPINE: every row tween and its declared cue are
            // pinned to the named label, never to a duplicated numeric offset.
            for (var beatIndex = 0; beatIndex < beatCount; beatIndex += 1) {
              var labelName = "beat" + beatIndex;
              var cueTime = beatIndex * timedInterval;
              var cueId = beatIndex === beatCount - 1 ? "beat-tick-final" : "beat-tick";
              tl.addLabel(labelName, cueTime);
              tl.to(
                rows[beatIndex],
                { opacity: 1, y: "0cqh", scale: 1, duration: ROW_IN, ease: "power2.out" },
                labelName,
              );
              // SFX CUE (IN, beat N): one scene-mixed cue at this beat label.
              tl.call(fireSfx, [cueId, cueTime], labelName);
            }

            // HOLD is deliberately still. OUT accelerates every landed row away
            // together, asymmetrically paired with the power2.out entrances.
            tl.to(rows, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      // The mounted primitive owns all visible motion. This empty paused host
      // timeline satisfies the standalone composition registry contract.
      window.__timelines = window.__timelines || {};
      window.__timelines["beat-timeline-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
