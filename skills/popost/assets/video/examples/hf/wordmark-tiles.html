<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Wordmark", "description": "Text resolved by the tile wave.", "default": "LAUNCH", "maxLength": 12 },
    { "id": "columns", "type": "number", "role": "layout", "label": "Columns", "description": "Number of columns in the wordmark tile grid.", "default": 12, "min": 8, "max": 14, "step": 1 },
    { "id": "waveStagger", "type": "number", "role": "motion", "label": "Wave stagger", "description": "Delay between tile reveals in spatial wave order.", "default": 40, "min": 15, "max": 50, "step": 1, "unit": "ms" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Wordmark Tiles Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        --bg: #070a12;
        --fg: #f5f7ff;
        --muted: #7f8aa3;
        --surface: #151b2b;
        --border: rgba(245, 247, 255, 0.14);
        --brand: #7c9dff;
        --accent: #64e2c2;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, monospace;
        --radius: 16px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 32px;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        --ease-exit: cubic-bezier(0.55, 0.055, 0.675, 0.19);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
      }

      .mount-card {
        width: 64%;
        height: 56%;
        left: 18%;
        top: 22%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) * 1.75);
        background: var(--surface);
        box-shadow: 0 4cqh 10cqh color-mix(in srgb, var(--fg) 12%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A wordmark resolves from deterministic color noise into correctly cropped glyph tiles through a spatially modulated GSAP wave.",
 "class": "logo",
 "tags": [
  "typography",
  "wordmark",
  "tiles",
  "raster",
  "reveal"
 ],
 "seconds": 6.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "LAUNCH",
   "maxLength": 12,
   "what": "Text resolved by the tile wave."
  },
  {
   "name": "columns",
   "type": "number",
   "default": 12,
   "min": 8,
   "max": 14,
   "what": "Number of columns in the wordmark tile grid."
  },
  {
   "name": "waveStagger",
   "type": "number",
   "default": 40,
   "min": 15,
   "max": 50,
   "unit": "ms",
   "what": "Delay between tile reveals in spatial wave order."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"ORBIT","columns":14,"waveStagger":28};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="wordmark-tiles-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6.5"
      data-fps="30"
    >
      <div
        id="wordmark-tiles-mount"
        class="mount-card clip"
        data-composition-id="wordmark-tiles"
       
        data-variable-values='{"text":"ORBIT","columns":14,"waveStagger":28}'
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
        data-width="1229"
        data-height="605"
      >
      <div
        id="root"
        data-composition-id="wordmark-tiles"
        data-start="0"
        data-duration="6.5"
        data-fps="30"
      >
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root fills the host box. Internal layout uses only cqw/cqh, and
             every painted color is owned by the host theme tokens. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f5f7ff);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .wt-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #070a12);
          }

          .wt-stage {
            width: 86cqw;
            height: 48cqh;
            position: relative;
            opacity: 0;
          }

          /* EDIT ZONE: stage proportions above and tile line weight below are
             the visual density controls. The public columns knob owns the grid
             count, and no second density decision exists in CSS. */
          .wt-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(var(--wt-columns), minmax(0, 1fr));
            grid-template-rows: repeat(var(--wt-rows), minmax(0, 1fr));
            overflow: hidden;
            border: min(0.12cqw, 0.22cqh) solid var(--border, rgba(245, 247, 255, 0.14));
            border-radius: var(--radius, 16px);
            background: var(--surface, #151b2b);
          }

          .wt-tile {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            box-shadow: inset 0 0 0 min(0.08cqw, 0.14cqh) var(--border, rgba(245, 247, 255, 0.14));
            background: var(--surface, #151b2b);
          }

          .wt-noise,
          .wt-resolved {
            position: absolute;
            inset: 0;
            display: block;
            transform-origin: center;
          }

          .wt-noise-a {
            background: color-mix(in srgb, var(--surface, #151b2b) 64%, var(--muted, #7f8aa3));
          }

          .wt-noise-b {
            background: color-mix(in srgb, var(--surface, #151b2b) 58%, var(--brand, #7c9dff));
          }

          .wt-noise-c {
            background: color-mix(in srgb, var(--surface, #151b2b) 56%, var(--accent, #64e2c2));
          }

          .wt-resolved {
            overflow: hidden;
            background: color-mix(in srgb, var(--surface, #151b2b) 92%, var(--brand, #7c9dff));
          }

          /* Every tile contains one crop of the same stable wordmark surface.
             JS computes only the crop offsets from the canonical grid shape. */
          .wt-fragment {
            position: absolute;
            left: var(--wt-fragment-x);
            top: var(--wt-fragment-y);
            width: 86cqw;
            height: 48cqh;
            display: grid;
            place-items: center;
            color: var(--fg, #f5f7ff);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: var(--wt-font-size);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.035em;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
          }
        </style>

        <div
          id="wordmark-tiles-clip"
          class="wt-clip clip"
          data-start="0"
          data-duration="6.5"
          data-track-index="0"
        >
          <div class="wt-stage">
            <div class="wt-grid" role="img" aria-label="LAUNCH"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "wordmark-tiles";
            var stage = root.querySelector(".wt-stage");
            var grid = root.querySelector(".wt-grid");

            // EDIT ZONE: declarations above and clamped reads below are the
            // single source of truth for the three public variables.
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "LAUNCH" : String(vars.text).trim().slice(0, 12);
            if (text.length === 0) text = "LAUNCH";

            var rawColumns = Number(vars.columns);
            var columns = Number.isFinite(rawColumns) ? Math.round(rawColumns) : 12;
            columns = Math.max(8, Math.min(14, columns));

            var rawWaveStagger = Number(vars.waveStagger);
            var waveStaggerMs = Number.isFinite(rawWaveStagger) ? rawWaveStagger : 40;
            waveStaggerMs = Math.max(15, Math.min(50, waveStaggerMs));

            // INVARIANT: rows derive only from columns. This keeps one density
            // owner and gives the 86:48 stage near-square tiles at every value.
            var rows = Math.max(4, Math.round((columns * 5) / 12));
            var tileCount = columns * rows;
            var fontSize = Math.max(7, Math.min(19, 86 / Math.max(4, text.length * 0.62)));

            grid.style.setProperty("--wt-columns", String(columns));
            grid.style.setProperty("--wt-rows", String(rows));
            grid.style.setProperty("--wt-font-size", String(fontSize) + "cqw");
            grid.setAttribute("aria-label", text);

            // Fixed-seed LCG. Noise faces vary, while every rebuild with the
            // same variables produces the same tile field and wave order.
            var seed = 0x57a7c1e;
            function seededUnit() {
              seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
              return seed / 4294967296;
            }

            var fragment = document.createDocumentFragment();
            var tiles = [];
            for (var index = 0; index < tileCount; index += 1) {
              var row = Math.floor(index / columns);
              var column = index % columns;
              var tile = document.createElement("span");
              var noise = document.createElement("span");
              var resolved = document.createElement("span");
              var wordmark = document.createElement("span");
              var noiseVariant = 1 + Math.floor(seededUnit() * 3);

              tile.className = "wt-tile";
              tile.setAttribute("aria-hidden", "true");
              tile.dataset.waveRank = String(
                column + row * 0.68 + Math.sin(row * 1.7 + column * 0.42) * 2.15,
              );

              noise.className = "wt-noise wt-noise-" + ["a", "b", "c"][noiseVariant - 1];
              noise.dataset.startOpacity = String(0.72 + seededUnit() * 0.28);

              resolved.className = "wt-resolved";
              wordmark.className = "wt-fragment";
              wordmark.textContent = text;
              wordmark.style.setProperty(
                "--wt-fragment-x",
                String((-86 * column) / columns) + "cqw",
              );
              wordmark.style.setProperty("--wt-fragment-y", String((-48 * row) / rows) + "cqh");

              resolved.appendChild(wordmark);
              tile.appendChild(resolved);
              tile.appendChild(noise);
              fragment.appendChild(tile);
              tiles.push(tile);
            }
            grid.replaceChildren(fragment);

            // The source mechanic combines travel with spatial sine waves.
            // Sorting by the stored rank creates the same rolling behavior,
            // including row reversals and pockets that lead adjacent columns.
            var waveTiles = tiles.slice().sort(function (a, b) {
              return Number(a.dataset.waveRank) - Number(b.dataset.waveRank);
            });
            var resolvedByWave = waveTiles.map(function (tile) {
              return tile.querySelector(".wt-resolved");
            });
            var noiseByWave = waveTiles.map(function (tile) {
              return tile.querySelector(".wt-noise");
            });

            // RETIME RANGE: these five base values own global pacing. HOLD is
            // the only elastic phase, and the reveal never exceeds IN.
            var IN_BASE = 4.8;
            var OUT_BASE = 0.5;
            var STAGE_IN_BASE = 0.38;
            var WAVE_START_BASE = 0.2;
            var TILE_DURATION_BASE = 0.5;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "6.5"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;
            var STAGE_IN = STAGE_IN_BASE * scale;
            var WAVE_START = WAVE_START_BASE * scale;
            var TILE_DURATION = TILE_DURATION_BASE * scale;
            var maxStep = Math.max(
              0,
              (IN - WAVE_START - TILE_DURATION) / Math.max(1, tileCount - 1),
            );
            var STAGGER_SECONDS = Math.min((waveStaggerMs / 1000) * scale, maxStep);

            gsap.set(stage, { opacity: 0 });
            gsap.set(resolvedByWave, { opacity: 0, scale: 0.82 });
            gsap.set(noiseByWave, {
              opacity: function (_index, element) {
                return Number(element.dataset.startOpacity);
              },
              scale: 1,
            });

            var timeline = gsap.timeline({ paused: true });

            timeline.to(stage, { opacity: 1, duration: STAGE_IN, ease: "power2.out" }, 0);

            // IN: each tile resolves with --ease-standard's GSAP owner,
            // power2.out. The spatial rank supplies wave order to the stagger.
            timeline.to(
              resolvedByWave,
              {
                opacity: 1,
                scale: 1,
                duration: TILE_DURATION,
                ease: "power2.out",
                stagger: { each: STAGGER_SECONDS, from: "start" },
              },
              WAVE_START,
            );
            timeline.to(
              noiseByWave,
              {
                opacity: 0,
                scale: 1.18,
                duration: TILE_DURATION,
                ease: "power2.out",
                stagger: { each: STAGGER_SECONDS, from: "start" },
              },
              WAVE_START,
            );

            // HOLD is deliberately still. OUT uses the catalog exit ease.
            timeline.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            timeline.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = timeline;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      // The mounted primitive owns all visible motion. This standalone host
      // registers only the empty paused timeline required for its own id.
      window.__timelines = window.__timelines || {};
      window.__timelines["wordmark-tiles-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
