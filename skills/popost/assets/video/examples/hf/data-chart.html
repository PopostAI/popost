<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Data Chart</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #faf9f6;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Animated bar + line chart with staggered reveal, NYT-style typography, and value labels",
 "class": "chart",
 "tags": [
  "data",
  "chart",
  "statistics"
 ],
 "placeholders": "web fonts are replaced by the fonts of the machine",
 "seconds": 9.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.45},{"at":0.2,"cue":"swish","gain":0.45},{"at":4.5,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="data-chart"
      data-composition-id="data-chart"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="15"
    >
      <div class="chart-container">
        
        <div class="header">
          <h1 class="headline">Monthly Revenue vs. Conversion Rate</h1>
          <p class="subtitle">Jan–Jun 2024, in thousands</p>
          <div class="key">
            <div class="key-item">
              <div class="key-box revenue-box"></div>
              <span class="key-text">Revenue</span>
            </div>
            <div class="key-item">
              <div class="key-line conversion-line"></div>
              <span class="key-text">Conversion Rate</span>
            </div>
          </div>
        </div>

        
        <svg class="chart-svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet">
          
          <g class="gridlines"></g>

          
          <g class="x-axis-labels"></g>

          
          <g class="bars-group"></g>

          
          <g class="bar-labels-group"></g>

          
          <g class="line-group">
            <path class="conversion-path" fill="none" stroke="#326FA8" stroke-width="1.5" />
            <circle class="line-dot" r="5" fill="#326FA8" style="opacity: 0" />
          </g>

          
          <g class="line-labels-group"></g>

          
          <line x1="100" y1="600" x2="1500" y2="600" stroke="black" stroke-width="1" />
        </svg>

        
        <div class="source">Source: Internal analytics</div>
      </div>

      <style>
        [data-composition-id="data-chart"] {
          width: 1920px;
          height: 1080px;
          background-color: #faf9f6;
          font-family: "Libre Franklin", sans-serif;
          color: #333;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }

        [data-composition-id="data-chart"] .chart-container {
          width: 1600px;
          height: 900px;
          display: flex;
          flex-direction: column;
          position: relative;
          transform: scale(1.15);
          transform-origin: center center;
        }

        [data-composition-id="data-chart"] .header {
          margin-bottom: 40px;
          text-align: left;
        }

        [data-composition-id="data-chart"] .headline {
          font-family: "Libre Baskerville", serif;
          font-size: 42px;
          margin: 0;
          padding: 0;
          clip-path: inset(0 100% 0 0);
          white-space: nowrap;
        }

        [data-composition-id="data-chart"] .subtitle {
          font-size: 16px;
          color: #666;
          margin: 8px 0 16px 0;
          clip-path: inset(0 100% 0 0);
          white-space: nowrap;
        }

        [data-composition-id="data-chart"] .key {
          display: flex;
          gap: 24px;
          opacity: 0;
        }

        [data-composition-id="data-chart"] .key-item {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        [data-composition-id="data-chart"] .key-box {
          width: 10px;
          height: 10px;
          background-color: #5c5c5c;
        }

        [data-composition-id="data-chart"] .key-line {
          width: 16px;
          height: 1.5px;
          background-color: #326fa8;
        }

        [data-composition-id="data-chart"] .key-text {
          font-size: 13px;
          color: #666;
        }

        [data-composition-id="data-chart"] .chart-svg {
          width: 100%;
          height: 600px;
          overflow: visible;
        }

        [data-composition-id="data-chart"] .source {
          position: absolute;
          bottom: 0;
          left: 0;
          font-size: 11px;
          color: #999;
          opacity: 0;
        }

        [data-composition-id="data-chart"] .grid-line {
          stroke: #e8e8e8;
          stroke-width: 0.5px;
          opacity: 0;
        }

        [data-composition-id="data-chart"] .axis-label {
          font-size: 14px;
          fill: #666;
          text-anchor: middle;
        }

        [data-composition-id="data-chart"] .bar {
          fill: #5c5c5c;
        }

        [data-composition-id="data-chart"] .bar-label {
          font-size: 14px;
          fill: #333;
          text-anchor: middle;
          opacity: 0;
        }

        [data-composition-id="data-chart"] .line-label {
          font-size: 14px;
          fill: #326fa8;
          font-weight: 600;
          text-anchor: middle;
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const svg = document.querySelector('[data-composition-id="data-chart"] .chart-svg');
          const tl = gsap.timeline({ paused: true });

          // Data
          const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
          const revenueData = [8, 12, 15, 11, 18, 22];
          const conversionData = [2.1, 2.8, 3.2, 2.9, 3.8, 4.2];

          // Chart Dimensions
          const chartWidth = 1400;
          const chartHeight = 500;
          const startX = 100;
          const startY = 600;
          const barWidth = 80;
          const spacing = (chartWidth - barWidth * months.length) / (months.length + 1);

          // Scales
          const maxRevenue = 25;
          const maxConversion = 5;

          const getBarY = (val) => startY - (val / maxRevenue) * chartHeight;
          const getLineY = (val) => startY - (val / maxConversion) * chartHeight;
          const getX = (i) => startX + spacing + i * (barWidth + spacing) + barWidth / 2;

          // Setup Elements
          const gridGroup = svg.querySelector(".gridlines");
          const xAxisGroup = svg.querySelector(".x-axis-labels");
          const barsGroup = svg.querySelector(".bars-group");
          const barLabelsGroup = svg.querySelector(".bar-labels-group");
          const lineLabelsGroup = svg.querySelector(".line-labels-group");
          const conversionPath = svg.querySelector(".conversion-path");
          const lineDot = svg.querySelector(".line-dot");

          // Create Gridlines
          for (let i = 1; i <= 5; i++) {
            const y = startY - i * (chartHeight / 5);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", startX);
            line.setAttribute("y1", y);
            line.setAttribute("x2", startX + chartWidth);
            line.setAttribute("y2", y);
            line.setAttribute("class", "grid-line");
            gridGroup.appendChild(line);
          }

          // Create X-Axis Labels & Bars & Bar Labels
          const linePoints = [];
          months.forEach((month, i) => {
            const x = getX(i);

            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", x);
            label.setAttribute("y", startY + 30);
            label.setAttribute("class", "axis-label");
            label.textContent = month;
            xAxisGroup.appendChild(label);

            const barHeight = (revenueData[i] / maxRevenue) * chartHeight;
            const bar = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            bar.setAttribute("x", x - barWidth / 2);
            bar.setAttribute("y", startY);
            bar.setAttribute("width", barWidth);
            bar.setAttribute("height", 0);
            bar.setAttribute("class", "bar");
            barsGroup.appendChild(bar);

            const barLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            barLabel.setAttribute("x", x);
            barLabel.setAttribute("y", getBarY(revenueData[i]) - 10);
            barLabel.setAttribute("class", "bar-label");
            barLabel.textContent = `${revenueData[i]}K`;
            barLabelsGroup.appendChild(barLabel);

            linePoints.push(`${x},${getLineY(conversionData[i])}`);

            const lineLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            lineLabel.setAttribute("x", x);
            lineLabel.setAttribute("y", getLineY(conversionData[i]) - 15);
            lineLabel.setAttribute("class", "line-label");
            lineLabel.textContent = `${conversionData[i]}%`;
            lineLabelsGroup.appendChild(lineLabel);
          });

          // Set Path Data
          conversionPath.setAttribute("d", `M ${linePoints.join(" L ")}`);
          const pathLength = conversionPath.getTotalLength();
          conversionPath.style.strokeDasharray = pathLength;
          conversionPath.style.strokeDashoffset = pathLength;

          // --- ANIMATION TIMELINE ---

          tl.to(
            '[data-composition-id="data-chart"] .headline',
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1.2,
              ease: "power1.inOut",
            },
            0,
          );

          tl.to(
            '[data-composition-id="data-chart"] .subtitle',
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1.2,
              ease: "power1.inOut",
            },
            0.2,
          );

          tl.to(
            '[data-composition-id="data-chart"] .key',
            {
              opacity: 1,
              duration: 0.4,
              ease: "power2.out",
            },
            1.0,
          );

          tl.to(
            '[data-composition-id="data-chart"] .grid-line',
            {
              opacity: 1,
              duration: 0.5,
              stagger: 0.25,
              ease: "power2.out",
            },
            0.5,
          );

          // Bars
          const bars = barsGroup.querySelectorAll(".bar");
          const barLabels = barLabelsGroup.querySelectorAll(".bar-label");

          bars.forEach((bar, i) => {
            const barHeight = (revenueData[i] / maxRevenue) * chartHeight;
            const startTime = 1.5 + i * 0.5;

            tl.to(
              bar,
              {
                attr: { height: barHeight, y: startY - barHeight },
                duration: 0.8,
                ease: "power2.out",
              },
              startTime,
            );

            tl.to(
              barLabels[i],
              {
                opacity: 1,
                duration: 0.3,
                ease: "power2.out",
              },
              startTime + 0.8,
            );
          });

          // Line
          const lastBarStartTime = 1.5 + (months.length - 1) * 0.5;
          const lineStartTime = lastBarStartTime + 0.5;

          tl.to(
            conversionPath,
            {
              strokeDashoffset: 0,
              duration: 3,
              ease: "none",
            },
            lineStartTime,
          );

          // Line Dot & Labels
          tl.set(
            lineDot,
            {
              opacity: 1,
              attr: { cx: getX(0), cy: getLineY(conversionData[0]) },
            },
            lineStartTime,
          );

          const lineLabels = lineLabelsGroup.querySelectorAll(".line-label");
          months.forEach((_, i) => {
            if (i > 0) {
              const x = getX(i);
              const y = getLineY(conversionData[i]);
              tl.to(
                lineDot,
                {
                  attr: { cx: x, cy: y },
                  duration: 3 / (months.length - 1),
                  ease: "none",
                },
                lineStartTime + ((i - 1) / (months.length - 1)) * 3,
              );
            }

            const labelTime = lineStartTime + (i / (months.length - 1)) * 3 + 0.2;

            lineLabels[i].textContent = "0.0%";

            tl.to(
              lineLabels[i],
              {
                opacity: 1,
                duration: 0.1,
                ease: "power2.out",
              },
              labelTime,
            );

            const dummy = { val: 0 };
            tl.to(
              dummy,
              {
                val: conversionData[i],
                duration: 0.8,
                ease: "power2.out",
                onUpdate: () => {
                  lineLabels[i].textContent = dummy.val.toFixed(1) + "%";
                },
              },
              labelTime,
            );
          });

          // Source Line
          tl.to(
            '[data-composition-id="data-chart"] .source',
            {
              opacity: 1,
              duration: 0.5,
              ease: "power2.out",
            },
            ">+0.5",
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["data-chart"] = tl;
        })();
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
