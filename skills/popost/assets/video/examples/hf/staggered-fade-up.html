<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Staggered Fade Up - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: var(--bg, #f5f5f4);
        font-family: var(--font-body, Inter, system-ui, sans-serif);
      }
      /* ponytail: zoom on .demo-frame (not a GSAP target) to fill ~65% of frame */
      .demo-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 72px 96px;
        zoom: 1.9;
      }
      .demo-label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted, #71717a);
      }
      .hf-catalog-staggered-fade-up {
        color: var(--fg, #18181b);
        font-family: var(--font-display, Inter, system-ui, sans-serif);
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-staggered-fade-up {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 18px;
        font-size: 72px;
        line-height: 1.05;
        max-width: 680px;
        justify-content: center;
      }
      .hf-catalog-staggered-fade-up span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Words fade in and slide up one after another with configurable delay.",
 "class": "text",
 "tags": [
  "video-primitive",
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "up",
   "options": [
    "up",
    "down",
    "left",
    "right"
   ],
   "what": "Where the offset the timeline drives points."
  },
  {
   "name": "distance",
   "type": "choice",
   "default": "standard",
   "options": [
    "close",
    "standard",
    "far"
   ],
   "what": "Scales the travel offset, so the words cover a shorter or longer run in the same time."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Word colour: ink for light frames, paper for dark ones, accent rides --brand."
  },
  {
   "name": "words",
   "type": "text",
   "default": "Staggered fade up",
   "maxLength": 200,
   "what": "The words themselves, split on spaces, one span and one stagger step each."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.4,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="staggered-fade-up-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="demo-label">staggered fade up</div>
        <div
          class="hf-catalog-staggered-fade-up"
          data-composition-variables='[
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Where the offset the timeline drives points.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }, { "value": "left", "label": "Left" }, { "value": "right", "label": "Right" }] },
    { "id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "Scales the travel offset, so the words cover a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "The words themselves, split on spaces, one span and one stagger step each.", "default": "Staggered fade up" }
  ]'
        >
          <span>Motion</span><span>that</span><span>tells</span><span>a</span><span>story</span
          ><span>one</span><span>word</span><span>at</span><span>a</span><span>time</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var axes = {
            up: { x: 0, y: 1 },
            down: { x: 0, y: -1 },
            left: { x: -1, y: 0 },
            right: { x: 1, y: 0 },
          };
          var reaches = { close: 0.5, standard: 1, far: 1.85 };
          var tones = {
            ink: "var(--fg, #18181b)",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var axis = axes[pick(axes, vars.direction, "up")];
          var reach = reaches[pick(reaches, vars.distance, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];
          var words =
            typeof vars.words === "string" && vars.words.trim()
              ? vars.words.trim().split(/\s+/)
              : null;

          var roots = document.querySelectorAll(".hf-catalog-staggered-fade-up");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-word-axis-x", String(axis.x * reach));
            roots[i].style.setProperty("--hf-word-axis-y", String(axis.y * reach));
            roots[i].style.setProperty("--hf-fade-word-color", tone);
            if (words) {
              roots[i].textContent = "";
              for (var j = 0; j < words.length; j += 1) {
                var span = document.createElement("span");
                span.textContent = words[j];
                roots[i].appendChild(span);
              }
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.4;
        tl.fromTo(
          ".hf-catalog-staggered-fade-up span",
          { opacity: 0, "--hf-word-y": "28px", "--hf-word-scale": 0.92, "--hf-word-blur": "6px" },
          {
            opacity: 1,
            "--hf-word-y": "0px",
            "--hf-word-scale": 1,
            "--hf-word-blur": "0px",
            duration: 0.4,
            stagger: 0.18,
            ease: "power3.out",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["staggered-fade-up-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-staggered-fade-up {
        color: var(--hf-fade-word-color, var(--fg, #18181b));
        font-family: var(--font-display, Inter, system-ui, sans-serif);
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-staggered-fade-up {
        display: inline-flex;
        gap: var(--space-1, 12px);
        font-size: 56px;
        line-height: 1;
      }
      .hf-catalog-staggered-fade-up span {
        display: inline-block;
        transform: translate(
            calc(var(--hf-word-x, 0px) + var(--hf-word-y, 0px) * var(--hf-word-axis-x, 0)),
            calc(var(--hf-word-y, 0px) * var(--hf-word-axis-y, 1))
          )
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
