<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Micro Transitions - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      .frame {
        transform: scale(1.12); /* ponytail: was 2.2; reduced so content fits ~65% of frame */
      }
      .hf-micro-transitions {
        --hf-micro-progress: 0;
        --hf-micro-tab: 0;
        position: relative;
        width: min(640px, 100%);
        height: 360px;
        font-family: Inter, system-ui, sans-serif;
        color: #18181b;
      }
      .hf-micro-bell,
      .hf-micro-dropdown,
      .hf-micro-modal,
      .hf-micro-tabs,
      .hf-micro-tooltip,
      .hf-micro-check {
        position: absolute;
        will-change: transform, opacity;
      }
      .hf-micro-bell {
        top: 18px;
        left: 28px;
        width: 54px;
        height: 54px;
        border-radius: 18px;
        background: #18181b;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
      }
      .hf-micro-bell::before {
        content: "";
        position: absolute;
        inset: 15px 17px 13px;
        border: 2px solid #fff;
        border-radius: 12px 12px 9px 9px;
      }
      .hf-micro-bell span {
        position: absolute;
        top: -8px;
        right: -8px;
        min-width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border: 3px solid #fff;
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        font-size: 12px;
        font-weight: 850;
        opacity: var(--hf-micro-progress);
        transform: translate(
            calc((1 - var(--hf-micro-progress)) * -7px),
            calc((1 - var(--hf-micro-progress)) * 10px)
          )
          scale(calc(0.25 + var(--hf-micro-progress) * 0.75));
      }
      .hf-micro-dropdown {
        top: 92px;
        left: 28px;
        width: 210px;
        padding: 18px;
        border: 1px solid #e4e4e7;
        border-radius: 18px;
        background: #fff;
        opacity: var(--hf-micro-progress);
        transform: translateY(calc((1 - var(--hf-micro-progress)) * -12px))
          scale(calc(0.95 + var(--hf-micro-progress) * 0.05));
        transform-origin: top left;
        box-shadow: 0 24px 65px rgba(0, 0, 0, 0.16);
      }
      .hf-micro-dropdown strong,
      .hf-micro-modal strong {
        display: block;
        font-size: 16px;
      }
      .hf-micro-dropdown p,
      .hf-micro-modal span {
        display: block;
        margin: 8px 0 0;
        color: #71717a;
        font-size: 13px;
        line-height: 1.4;
      }
      .hf-micro-modal {
        top: 48px;
        right: 34px;
        width: 260px;
        padding: 22px;
        border: 1px solid #e4e4e7;
        border-radius: 22px;
        background: #fff;
        opacity: var(--hf-micro-progress);
        transform: translateY(calc((1 - var(--hf-micro-progress)) * 18px))
          scale(calc(0.96 + var(--hf-micro-progress) * 0.04));
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.2);
      }
      .hf-micro-tabs {
        left: 260px;
        bottom: 46px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        width: 210px;
        padding: 4px;
        border-radius: 14px;
        background: #f4f4f5;
        opacity: var(--hf-micro-progress);
        transform: translateY(calc((1 - var(--hf-micro-progress)) * 14px));
      }
      .hf-micro-tabs i {
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc((100% - 8px) / 2);
        height: calc(100% - 8px);
        border-radius: 11px;
        background: #fff;
        transform: translateX(calc(var(--hf-micro-tab) * 100%));
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }
      .hf-micro-tabs b {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        height: 38px;
        color: #52525b;
        font-size: 13px;
      }
      .hf-micro-tooltip {
        right: 54px;
        bottom: 48px;
        padding: 8px 11px;
        border-radius: 10px;
        background: #18181b;
        color: #fff;
        font-size: 12px;
        font-weight: 750;
        opacity: var(--hf-micro-progress);
        transform: translateY(calc((1 - var(--hf-micro-progress)) * 6px))
          scale(calc(0.96 + var(--hf-micro-progress) * 0.04));
      }
      .hf-micro-check {
        right: 116px;
        bottom: 92px;
        width: 48px;
        height: 48px;
        fill: none;
        stroke: currentColor;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: var(--hf-micro-progress);
      }
      .hf-micro-check path {
        stroke-dasharray: 42;
        stroke-dashoffset: calc((1 - var(--hf-micro-progress)) * 42);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A transitions.dev-inspired pack of badge, dropdown, modal, tabs, tooltip, and success-check micro transitions",
 "class": "transition",
 "tags": [
  "transition-primitive",
  "motion-primitive",
  "transitions-dev-port",
  "ui",
  "transition",
  "microinteraction"
 ],
 "seconds": 3.74,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "badge",
   "type": "text",
   "default": "3",
   "maxLength": 200,
   "what": "Count inside the notification badge on the bell."
  },
  {
   "name": "tooltip",
   "type": "text",
   "default": "Copied",
   "maxLength": 200,
   "what": "Wording inside the small dark tooltip."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "red",
   "options": [
    "red",
    "amber",
    "violet"
   ],
   "what": "Colour of the notification badge chip."
  },
  {
   "name": "travel",
   "type": "choice",
   "default": "standard",
   "options": [
    "close",
    "standard",
    "far"
   ],
   "what": "Scales how far every panel starts from its resting place before it settles."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.55,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="micro-transitions-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="frame">
        <div
          class="hf-micro-transitions"
          style="--hf-micro-progress: 0; --hf-micro-tab: 0"
          data-composition-variables='[
    {"id": "badge", "type": "string", "role": "content", "label": "Badge", "description": "Count inside the notification badge on the bell.", "default": "3"},
    {"id": "tooltip", "type": "string", "role": "content", "label": "Tooltip", "description": "Wording inside the small dark tooltip.", "default": "Copied"},
    {"id": "tone", "type": "enum", "role": "style", "label": "Badge tone", "description": "Colour of the notification badge chip.", "default": "red", "options": [{"value": "red", "label": "Red"}, {"value": "amber", "label": "Amber"}, {"value": "violet", "label": "Violet"}]},
    {"id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "Scales how far every panel starts from its resting place before it settles.", "default": "standard", "options": [{"value": "close", "label": "Close"}, {"value": "standard", "label": "Standard"}, {"value": "far", "label": "Far"}]}
  ]'
        >
          <div class="hf-micro-bell"><span>3</span></div>
          <div class="hf-micro-dropdown">
            <strong>Actions</strong>
            <p>Export, duplicate, archive</p>
          </div>
          <div class="hf-micro-modal">
            <strong>Ready to publish?</strong><span>All checks passed.</span>
          </div>
          <div class="hf-micro-tabs"><i></i><b>Draft</b><b>Live</b></div>
          <div class="hf-micro-tooltip">Copied</div>
          <svg class="hf-micro-check" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M12 25l8 8 17-19" />
          </svg>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          function text(value, fallback) {
            return typeof value === "string" && value.trim() !== "" ? value.trim() : fallback;
          }

          // The badge is the pack's one accent-carrying element. red and amber are
          // literal alert conventions; violet rides the composition's own token and
          // falls back to ink.
          var tones = { red: "#ef4444", amber: "#f59e0b", violet: "var(--accent-2, #18181b)" };
          var travels = { close: 0.5, standard: 1, far: 1.9 };

          var tone = tones[pick(tones, vars.tone, "red")];
          var travel = travels[pick(travels, vars.travel, "standard")];
          var badgeText = text(vars.badge, "3");
          var tooltipText = text(vars.tooltip, "Copied");

          var roots = document.querySelectorAll(".hf-micro-transitions");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-micro-badge", tone);
            root.style.setProperty("--hf-micro-travel", String(travel));
            var badge = root.querySelector(".hf-micro-bell span");
            var tooltip = root.querySelector(".hf-micro-tooltip");
            if (badge) badge.textContent = badgeText;
            if (tooltip) tooltip.textContent = tooltipText;
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to(
          ".hf-micro-transitions",
          { "--hf-micro-progress": 1, duration: 0.52, ease: "power3.out" },
          0.55,
        );
        tl.to(
          ".hf-micro-transitions",
          { "--hf-micro-tab": 1, duration: 0.36, ease: "power3.out" },
          1.15,
        );
        tl.to(
          ".hf-micro-transitions",
          { "--hf-micro-progress": 0, duration: 0.34, ease: "power2.in" },
          3.4,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["micro-transitions-demo"] = tl;
      </script>
    </div>
