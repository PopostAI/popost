<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Number Pop In - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale non-GSAP wrapper so the stat fills ~65% of the frame */
        transform: scale(1.37);
      }
      .hf-transition-number-pop-in {
        display: inline-flex;
        align-items: baseline;
        gap: 2px;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-transition-number-pop-in span {
        font-size: 96px;
        line-height: 0.9;
        filter: blur(var(--hf-number-blur, 0px));
        transform: translateY(var(--hf-number-y, 0px)) scale(var(--hf-number-scale, 1));
        will-change: transform, filter, opacity;
      }
      .hf-transition-number-pop-in small {
        margin-left: 4px;
        color: #71717a;
        font-size: 42px;
        font-weight: 700;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A transitions.dev-inspired digit pop-in with blur, lift, and staggered value reveal",
 "class": "chart",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "number",
  "pop"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "value",
   "type": "text",
   "default": "5.7",
   "maxLength": 200,
   "what": "The number itself. Every character becomes its own span, so the stagger still lands character by character."
  },
  {
   "name": "unit",
   "type": "text",
   "default": "k",
   "maxLength": 200,
   "what": "Small suffix printed after the number. Pass an empty string to drop it."
  },
  {
   "name": "lift",
   "type": "choice",
   "default": "standard",
   "options": [
    "close",
    "standard",
    "far"
   ],
   "what": "Scales the offset the timeline drives, so the characters cover a shorter or longer run in the same time."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Number colour: ink for light frames, paper for dark ones, accent rides --brand."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"pop","gain":0.65}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="number-pop-in-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-number-pop-in"
          data-composition-variables='[
    { "id": "value", "type": "string", "role": "content", "label": "Value", "description": "The number itself. Every character becomes its own span, so the stagger still lands character by character.", "default": "5.7" },
    { "id": "unit", "type": "string", "role": "content", "label": "Unit", "description": "Small suffix printed after the number. Pass an empty string to drop it.", "default": "k" },
    { "id": "lift", "type": "enum", "role": "motion", "label": "Lift", "description": "Scales the offset the timeline drives, so the characters cover a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Number colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
        >
          <span>5</span><span>.</span><span>7</span><small>k</small>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var lifts = { close: 0.5, standard: 1, far: 1.75 };
          var tones = {
            ink: { number: "#18181b", unit: "#71717a" },
            paper: { number: "#fafafa", unit: "#a1a1aa" },
            accent: { number: "var(--brand, #34d399)", unit: "var(--brand, #34d399)" },
          };

          function text(value, fallback) {
            return typeof value === "string" ? value : fallback;
          }

          var value = text(vars.value, "5.7");
          if (value === "") value = "5.7";
          var unit = text(vars.unit, "k");
          var lift = Object.prototype.hasOwnProperty.call(lifts, vars.lift)
            ? vars.lift
            : "standard";
          var tone = Object.prototype.hasOwnProperty.call(tones, vars.tone) ? vars.tone : "ink";

          var roots = document.querySelectorAll(".hf-transition-number-pop-in");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-number-lift", String(lifts[lift]));
            root.style.setProperty("--hf-number-color", tones[tone].number);
            root.style.setProperty("--hf-number-unit-color", tones[tone].unit);

            var next = [];
            for (var c = 0; c < value.length; c += 1) {
              var span = document.createElement("span");
              span.textContent = value.charAt(c);
              next.push(span);
            }
            if (unit !== "") {
              var small = document.createElement("small");
              small.textContent = unit;
              next.push(small);
            }
            root.replaceChildren.apply(root, next);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-transition-number-pop-in span, .hf-transition-number-pop-in small",
          {
            opacity: 0,
            "--hf-number-y": "24px",
            "--hf-number-scale": 0.82,
            "--hf-number-blur": "8px",
          },
          {
            opacity: 1,
            "--hf-number-y": "0px",
            "--hf-number-scale": 1,
            "--hf-number-blur": "0px",
            duration: 0.34,
            stagger: 0.055,
            ease: "back.out(1.8)",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["number-pop-in-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-number-pop-in {
        display: inline-flex;
        align-items: baseline;
        gap: 2px;
        color: var(--hf-number-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-transition-number-pop-in span {
        font-size: 76px;
        line-height: 0.9;
        filter: blur(var(--hf-number-blur, 0px));
        transform: translateY(calc(var(--hf-number-y, 0px) * var(--hf-number-lift, 1)))
          scale(var(--hf-number-scale, 1));
        will-change: transform, filter, opacity;
      }
      .hf-transition-number-pop-in small {
        margin-left: 2px;
        color: var(--hf-number-unit-color, #71717a);
        font-size: 34px;
        font-weight: 850;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
