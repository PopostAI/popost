<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Headline", "description": "Text displayed as the headline.", "default": "Ship it today" },
    { "id": "accent_word_index", "type": "number", "role": "content", "label": "Accent word index", "description": "Zero-based word index to color. Out of range leaves the headline unaccented.", "default": 1, "step": 1 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Color applied to the selected word.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "shadow", "type": "boolean", "role": "style", "label": "Shadow", "description": "Drop shadow cast under the headline. On by default; set false for a flat matte look.", "default": true }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Headline Slam Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f7f8fa;
        --surface: #15181e;
        --border: #343943;
        --font-display: Inter, system-ui, sans-serif;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 44%, #171a21 0%, var(--bg) 72%);
      }

      .mount-card {
        width: 80%;
        height: 60%;
        left: 10%;
        top: 20%;
        container-type: size;
        overflow: hidden;
        border: 1px solid rgba(247, 248, 250, 0.12);
        border-radius: 32px;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        box-shadow: 0 54px 120px rgba(0, 0, 0, 0.46);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A heavyweight headline scales down into frame, lands with a deterministic three-frame shake, holds with subtle drift, and whips upward on exit.",
 "class": "text",
 "tags": [
  "motion-primitive",
  "typography",
  "headline",
  "slam",
  "impact",
  "exit"
 ],
 "seconds": 3.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Ship it today",
   "maxLength": 200,
   "what": "Text displayed as the headline."
  },
  {
   "name": "accent_word_index",
   "type": "number",
   "default": 1,
   "min": -100000,
   "max": 100000,
   "what": "Zero-based word index to color. Out of range leaves the headline unaccented."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Color applied to the selected word."
  },
  {
   "name": "shadow",
   "type": "choice",
   "default": "true",
   "options": [
    "true",
    "false"
   ],
   "what": "Drop shadow cast under the headline. On by default; set false for a flat matte look."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"Make the moment count","accent_word_index":3,"accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"impact","gain":0.85}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="headline-slam-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="headline-slam-mount"
        class="mount-card clip"
        data-composition-id="headline-slam"
       
        data-variable-values='{"text":"Make the moment count","accent_word_index":3,"accent":"violet"}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1536"
        data-height="648"
      >
      <div id="root" data-composition-id="headline-slam" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .hs-clip,
          .hs-stage {
            position: absolute;
            inset: 0;
            width: 100cqw;
            height: 100cqh;
          }

          .hs-clip {
            overflow: hidden;
          }

          .hs-stage {
            display: grid;
            place-items: center;
            will-change: transform;
          }

          .hs-headline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2cqw;
            width: 90cqw;
            min-height: 22cqh;
            color: var(--fg, #f8fafc);
            font-size: var(--hs-font-size, 10.5cqw);
            font-weight: 900;
            line-height: 0.88;
            letter-spacing: -0.5cqw;
            text-align: center;
            white-space: nowrap;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          /* Shadow is on by default; the shadow variable opts out of it. */
          .hs-headline.hs-shadow {
            text-shadow: 0 1.2cqh 4.5cqh color-mix(in srgb, #000 52%, transparent);
          }

          .hs-word {
            display: inline-block;
          }

          .hs-word-accent {
            color: var(--hs-accent, #71f5a7);
          }
        </style>

        <div
          id="headline-slam-clip"
          class="hs-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="hs-stage">
            <div class="hs-headline" role="heading" aria-level="1"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".hs-stage");
            var headline = root.querySelector(".hs-headline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "Ship it today" : String(vars.text);
            var indexValue = Number(vars.accent_word_index);
            var accentWordIndex = Number.isFinite(indexValue) ? Math.trunc(indexValue) : 1;
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #b895ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var shadow = !(vars.shadow === false || vars.shadow === "false");
            var words = text.trim() === "" ? [] : text.trim().split(/\s+/);

            root.style.setProperty("--hs-accent", accentColors[accent]);
            headline.classList.toggle("hs-shadow", shadow);
            headline.setAttribute("aria-label", text);

            words.forEach(function (word, index) {
              var span = document.createElement("span");
              span.className = index === accentWordIndex ? "hs-word hs-word-accent" : "hs-word";
              span.textContent = word;
              span.setAttribute("aria-hidden", "true");
              headline.appendChild(span);
            });

            // Deterministic fit from character count: DOM measurement is zero at
            // mount time (the template is not laid out yet), so it never fires.
            // 0.62 approximates the average glyph/em width of the bold face; the
            // 56cqw rest-state cap keeps the 1.6x overshoot peak inside 90cqw.
            var approxWidthCqw = text.length * 10.5 * 0.62;
            if (approxWidthCqw > 56) {
              var fitted = Math.max(3.5, 56 / (text.length * 0.62));
              root.style.setProperty("--hs-font-size", fitted.toFixed(2) + "cqw");
            }

            var IN_BASE = 0.72;
            var OUT_BASE = 0.46;
            var LAND_AT_BASE = 0.58;
            var SHAKE_FRAME_BASE = 1 / 30;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var baseTotal = IN_BASE + OUT_BASE;
            var envelopeScale = duration < baseTotal ? duration / baseTotal : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var LAND_AT = LAND_AT_BASE * envelopeScale;
            var SHAKE_FRAME = SHAKE_FRAME_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              headline,
              { scale: 1.6, opacity: 0, y: 0 },
              { scale: 1, opacity: 1, y: 0, duration: LAND_AT, ease: "expo.out" },
              0,
            );

            tl.to(
              stage,
              { x: "0.55cqw", y: "-0.3cqh", duration: SHAKE_FRAME, ease: "power2.out" },
              LAND_AT,
            );
            tl.to(stage, {
              x: "-0.38cqw",
              y: "0.2cqh",
              duration: SHAKE_FRAME,
              ease: "power2.out",
            });
            tl.to(stage, { x: 0, y: 0, duration: SHAKE_FRAME, ease: "power2.out" });

            if (HOLD > 0) {
              tl.fromTo(
                headline,
                { y: 0 },
                {
                  y: "-0.55cqh",
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                  immediateRender: false,
                },
                HOLD_START,
              );
            }

            tl.to(headline, { y: "-120cqh", duration: OUT, ease: "power4.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["headline-slam"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["headline-slam-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
