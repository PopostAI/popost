<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Per-Word Crossfade - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #fafafa;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        width: 1920px;
        height: 1080px;
        padding: 120px 160px;
      }
      /* outgoing phrase — static, fades out */
      .phrase-out {
        display: inline-flex;
        gap: 28px;
        font-size: 128px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #71717a;
        font-family: Inter, system-ui, sans-serif;
        position: relative;
      }
      .phrase-out span {
        display: inline-block;
        will-change: opacity;
      }
      /* incoming phrase — the GSAP-animated element */
      .hf-catalog-per-word-crossfade {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-per-word-crossfade {
        display: inline-flex;
        gap: 28px;
        font-size: 128px;
        line-height: 1;
      }
      .hf-catalog-per-word-crossfade span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
      /* label */
      .demo-label {
        font-size: 26px;
        font-weight: 500;
        color: #a1a1aa;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 24px;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Words gently fade into place with a short vertical drift for calm keynote rhythm.",
 "class": "text",
 "tags": [
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Create once reuse everywhere",
   "maxLength": 200,
   "what": "The line to animate. It is split on whitespace and every word gets its own span, so the stagger picks up the new words."
  },
  {
   "name": "drift",
   "type": "choice",
   "default": "standard",
   "options": [
    "close",
    "standard",
    "far"
   ],
   "what": "Scales the vertical offset, so the words cover a shorter or longer run in the same time."
  },
  {
   "name": "blur",
   "type": "choice",
   "default": "standard",
   "options": [
    "soft",
    "standard",
    "heavy"
   ],
   "what": "Scales the blur radius the timeline drives, from a light haze to a full smear."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Word colour: ink for light frames, paper for dark ones, accent rides --brand."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="per-word-crossfade-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        
        <div class="phrase-out">
          <span>Write</span><span>once</span><span>publish</span><span>anywhere</span>
        </div>
        
        <div
          class="hf-catalog-per-word-crossfade"
          data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "The line to animate. It is split on whitespace and every word gets its own span, so the stagger picks up the new words.", "default": "Create once reuse everywhere" },
    { "id": "drift", "type": "enum", "role": "motion", "label": "Drift", "description": "Scales the vertical offset, so the words cover a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Scales the blur radius the timeline drives, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
        >
          <span>Create</span><span>once</span><span>reuse</span><span>everywhere</span>
        </div>
        <div class="demo-label">per-word crossfade</div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var drifts = { close: 0.5, standard: 1, far: 1.85 };
          var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };
          var tones = {
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var drift = drifts[pick(drifts, vars.drift, "standard")];
          var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];

          var text = typeof vars.text === "string" ? vars.text.trim() : "";
          var words = (text || "Create once reuse everywhere").split(/\s+/);

          var roots = document.querySelectorAll(".hf-catalog-per-word-crossfade");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-word-drift", String(drift));
            root.style.setProperty("--hf-word-blur-scale", String(blurScale));
            root.style.setProperty("--hf-word-color", tone);

            while (root.firstChild) {
              root.removeChild(root.firstChild);
            }
            for (var w = 0; w < words.length; w += 1) {
              var span = document.createElement("span");
              span.textContent = words[w];
              root.appendChild(span);
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;

        // outgoing phrase fades out word-by-word
        tl.to(
          ".phrase-out span",
          {
            opacity: 0,
            duration: 0.25,
            stagger: 0.055,
            ease: "power2.in",
          },
          startTime,
        );

        // incoming phrase fades in word-by-word (the named component)
        tl.fromTo(
          ".hf-catalog-per-word-crossfade span",
          { opacity: 0, "--hf-word-y": "22px", "--hf-word-scale": 0.92, "--hf-word-blur": "5px" },
          {
            opacity: 1,
            "--hf-word-y": "0px",
            "--hf-word-scale": 1,
            "--hf-word-blur": "0px",
            duration: 0.3,
            stagger: 0.055,
            ease: "power3.out",
          },
          startTime + 0.1,
        );

        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["per-word-crossfade-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-per-word-crossfade {
        color: var(--hf-word-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-per-word-crossfade {
        display: inline-flex;
        gap: 12px;
        font-size: 56px;
        line-height: 1;
      }
      .hf-catalog-per-word-crossfade span {
        display: inline-block;
        transform: translate(
            var(--hf-word-x, 0px),
            calc(var(--hf-word-y, 0px) * var(--hf-word-drift, 1))
          )
          scale(var(--hf-word-scale, 1));
        filter: blur(calc(var(--hf-word-blur, 0px) * var(--hf-word-blur-scale, 1)));
        will-change: transform, filter, opacity;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
