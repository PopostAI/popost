<html data-composition-variables='[
    { "id": "progress", "type": "number", "role": "content", "label": "Progress", "description": "Target angular fill from 0 to 100.", "default": 100, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "thickness", "type": "number", "role": "layout", "label": "Thickness", "description": "Ring stroke thickness as a percent of the ring radius.", "default": 12, "min": 4, "max": 30, "step": 1, "unit": "%" },
    { "id": "label", "type": "string", "role": "content", "label": "Center label", "description": "Numeric target shown in the center and counted in sync with the fill.", "default": "100" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Conic Progress Ring Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        --bg: #071018;
        --fg: #f4f7fb;
        --muted: #91a0b3;
        --surface: #1b2938;
        --border: rgba(244, 247, 251, 0.14);
        --brand: #35d6a0;
        --accent: #74b9ff;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, monospace;
        --radius: 4cqh;
        --space-1: 1cqh;
        --space-2: 2cqh;
        --space-3: 3cqh;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      .mount-card {
        position: absolute;
        left: 29%;
        top: 19%;
        width: 42%;
        height: 62%;
        overflow: hidden;
        border: 0.15cqh solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A token-driven conic progress ring whose angular fill and center count settle together from one registered percentage.",
 "class": "chart",
 "tags": [
  "data",
  "progress",
  "ring",
  "conic-gradient",
  "prove",
  "demonstrate"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "progress",
   "type": "number",
   "default": 100,
   "min": 0,
   "max": 100,
   "unit": "%",
   "what": "Target angular fill from 0 to 100."
  },
  {
   "name": "thickness",
   "type": "number",
   "default": 12,
   "min": 4,
   "max": 30,
   "unit": "%",
   "what": "Ring stroke thickness as a percent of the ring radius."
  },
  {
   "name": "label",
   "type": "text",
   "default": "100",
   "maxLength": 200,
   "what": "Numeric target shown in the center and counted in sync with the fill."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"progress":92,"thickness":16,"label":"92"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"tick","gain":0.35}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="conic-progress-ring-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="conic-progress-ring-mount"
        class="mount-card clip"
        data-composition-id="conic-progress-ring"
       
        data-variable-values='{"progress":92,"thickness":16,"label":"92"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="806"
        data-height="670"
      >
      <div id="root" data-composition-id="conic-progress-ring" data-duration="4" data-fps="30">
        <style>
          /* The registration must live in this document-level stylesheet.
             Registrations inside shadow roots are ignored by the platform. */
          @property --ring-progress {
            syntax: "<percentage>";
            inherits: false;
            initial-value: 0%;
          }

          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* INVARIANT: #root is the mount contract owner. The host owns the
             box, and every internal measurement is relative to that box. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f4f7fb);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
          }

          .ring-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
          }

          .ring-stage {
            position: relative;
            width: min(68cqw, 68cqh);
            aspect-ratio: 1;
          }

          /* EDIT ZONE: --ring-thickness is the only geometry control.
             --ring-progress is the only registered animation scalar. Paint
             comes only from the host theme's surface and brand tokens. */
          .ring {
            --ring-thickness: 12%;
            --ring-progress: 0%;
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
              from -90deg,
              var(--brand, #35d6a0) 0 var(--ring-progress),
              var(--surface, #1b2938) var(--ring-progress) 100%
            );
            -webkit-mask: radial-gradient(
              farthest-side,
              transparent calc(100% - var(--ring-thickness)),
              var(--fg, #f4f7fb) 0
            );
            mask: radial-gradient(
              farthest-side,
              transparent calc(100% - var(--ring-thickness)),
              var(--fg, #f4f7fb) 0
            );
          }

          .ring-label {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--fg, #f4f7fb);
            font-size: min(18cqw, 18cqh);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            line-height: 1;
            text-align: center;
          }
        </style>

        <div
          id="conic-progress-ring-clip"
          class="ring-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="ring-stage">
            <div
              class="ring"
              role="progressbar"
              aria-label="Progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            ></div>
            <div class="ring-label" aria-hidden="true">0</div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "conic-progress-ring";
            var stage = root.querySelector(".ring-stage");
            var ring = root.querySelector(".ring");
            var label = root.querySelector(".ring-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            /* INVARIANT: zero is a valid progress value, so missing and zero
               are handled separately. Both numeric controls clamp to their
               declared ranges before they reach layout or animation. */
            var progressValue = Number(vars.progress);
            var targetProgress = Number.isFinite(progressValue)
              ? Math.max(0, Math.min(100, progressValue))
              : 100;
            var thicknessValue = Number(vars.thickness);
            var thickness = Number.isFinite(thicknessValue)
              ? Math.max(4, Math.min(30, thicknessValue))
              : 12;
            var labelText = vars.label == null ? "100" : String(vars.label);
            var labelMatch = labelText.trim().match(/^(-?\d+(?:\.\d+)?)(.*)$/);
            var labelTarget = labelMatch ? Number(labelMatch[1]) : null;
            var labelSuffix = labelMatch ? labelMatch[2] : "";

            ring.style.setProperty("--ring-thickness", thickness + "%");

            function updateLabel(fillPercent) {
              var ratio = targetProgress > 0 ? fillPercent / targetProgress : 1;
              label.textContent =
                labelTarget == null ? labelText : Math.round(labelTarget * ratio) + labelSuffix;
              ring.setAttribute("aria-valuenow", String(Math.round(fillPercent)));
            }

            updateLabel(0);

            /* RETIME RANGE: IN_BASE and OUT_BASE own the lifecycle timing.
               The fill uses --ease-standard's GSAP form, power2.out. */
            var IN_BASE = 1.4;
            var OUT_BASE = 0.5;
            var durationValue = Number(root.dataset.duration);
            var duration = Number.isFinite(durationValue) && durationValue > 0 ? durationValue : 4;
            var scale = duration < IN_BASE + OUT_BASE ? duration / (IN_BASE + OUT_BASE) : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              ring,
              { "--ring-progress": "0%" },
              {
                "--ring-progress": targetProgress + "%",
                duration: IN,
                ease: "power2.out",
                onUpdate: function () {
                  updateLabel(parseFloat(ring.style.getPropertyValue("--ring-progress")) || 0);
                },
              },
              0,
            );
            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["conic-progress-ring-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
