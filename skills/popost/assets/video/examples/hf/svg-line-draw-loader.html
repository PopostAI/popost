<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SVG Line Draw Loader - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: var(--bg, #f4f4f5);
        font-family: var(--font-body, Inter, system-ui, sans-serif);
      }
      .hf-advanced-svg-line-draw-loader {
        color: var(--fg, #18181b);
        font-family: var(--font-body, Inter, system-ui, sans-serif);
      }
      .hf-advanced-svg-line-draw-loader {
        width: 720px;
        min-height: 420px;
        border-radius: 16px;
        padding: 48px;
        background: var(--surface, #ffffff);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.1),
          0 1px 0 var(--border, #e4e4e7) inset;
        border: 1px solid var(--border, #e4e4e7);
        display: grid;
        place-items: center;
        /* ponytail: scale wrapper — GSAP only targets path, not this element */
        transform: scale(1.7);
      }
      .hf-advanced-svg-line-draw-loader .grid {
        display: grid;
        grid-template-columns: repeat(8, 46px);
        gap: 10px;
      }
      .hf-advanced-svg-line-draw-loader .cell {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--fg, #111827) 45%, transparent);
        transform: translateY(var(--hf-cell-y, 0px)) scale(var(--hf-cell-scale, 1));
        opacity: var(--hf-cell-opacity, 1);
      }
      .hf-advanced-svg-line-draw-loader svg {
        width: 520px;
        height: 220px;
        overflow: visible;
      }
      .hf-advanced-svg-line-draw-loader path {
        fill: none;
        stroke: var(--accent, #18181b);
        stroke-width: 12;
        stroke-linecap: round;
        stroke-dasharray: 900;
        stroke-dashoffset: var(--hf-dash, 0);
      }
      .hf-advanced-svg-line-draw-loader .stack {
        position: relative;
        width: 520px;
        height: 260px;
      }
      .hf-advanced-svg-line-draw-loader .card {
        position: absolute;
        inset: 0;
        border-radius: 26px;
        background: linear-gradient(135deg, var(--surface, #fafafa), var(--surface, #e4e4e7));
        border: 1px solid var(--border, rgba(15, 23, 42, 0.08));
        box-shadow: 0 20px 54px rgba(15, 23, 42, 0.14);
        transform: translateY(var(--hf-card-y, 0px)) scale(var(--hf-card-scale, 1));
        opacity: var(--hf-card-opacity, 1);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "An Anime.js-style path drawing loader implemented as a seekable GSAP stroke timeline.",
 "class": "shape",
 "tags": [
  "video-primitive",
  "advanced-motion",
  "anime-inspired",
  "hyperframes-native"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="svg-line-draw-loader-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="hf-advanced-svg-line-draw-loader">
        <svg viewBox="0 0 520 220">
          <path d="M24 160 C90 28, 188 40, 228 128 S356 234, 494 68" />
        </svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const startTime = 0.5;
      tl.fromTo(
        ".hf-advanced-svg-line-draw-loader path",
        { "--hf-dash": 900 },
        { "--hf-dash": 0, duration: 1.35, ease: "power3.inOut" },
        startTime,
      );
      tl.set({}, {}, 5);
      window.__timelines = window.__timelines || {};
      window.__timelines["svg-line-draw-loader-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
