<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"items":"Open,Rename,Duplicate,Share,Move to Trash","pick":2,"tone":"light"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>

          }
          // Right-click: press, a short hold, then a release that overshoots a touch.
          function press(t, at, depth) {
            var d = 0.05 * squeeze;
            if (t < at || t > at + d * 5) return 1;
            if (t < at + d) return 1 - depth * seg(t, at, at + d);
            if (t < at + d * 1.8) return 1 - depth;
            return 1 - depth + depth * springBack(seg(t, at + d * 1.8, at + d * 5));
          }

          function render(t) {
            var tc = offsetIn(cards[TARGET]);
            var cw = cards[TARGET].offsetWidth;
            var ch = cards[TARGET].offsetHeight;
            var anchor = { x: tc.x + cw * 0.62, y: tc.y + ch * 0.42 };

            // Open right and down from the tip, flipping on the side that would leave the frame.
            var mw = menu.offsetWidth;
            var mh = menu.offsetHeight;
            var left = anchor.x + mw + 6 * u > W - 24 * u;
            var up = anchor.y + mh + 6 * u > H - 24 * u;
            var mx = left ? anchor.x - mw - 6 * u : anchor.x + 6 * u;
            var my = up ? anchor.y - mh - 6 * u : anchor.y + 6 * u;
            menu.style.transformOrigin = (left ? "100%" : "0") + " " + (up ? "100%" : "0");

            var open = seg(t, T.bloom, T.bloom + 0.22 * squeeze);
            var shut = seg(t, T.collapse, T.collapse + 0.14 * squeeze);
            var menuScale = 0.95 + 0.05 * bloomEase(open) - 0.03 * shut;
            menu.style.opacity = String(Math.min(1, open * 3) * (1 - shut));
            menu.style.transform = "translate(" + mx + "px," + my + "px) scale(" + menuScale + ")";
            rows.forEach(function (row, i) {
              var k = easeOut(
                seg(t, T.bloom + i * 0.025 * squeeze, T.bloom + (i * 0.025 + 0.16) * squeeze),
              );
              row.style.opacity = String(k);
              row.style.transform = "translateY(" + (1 - k) * -4 * u + "px)";
            });

            var itemPoint = {
              x: mx + mw * 0.34,
              y: my + rows[pick].offsetTop + rows[pick].offsetHeight * 0.55,
            };
            var start = { x: -0.06 * W, y: 1.1 * H };
            // Rest just below the window so the cursor never covers the result.
            var win = grid.parentNode;
            var aside = {
              x: itemPoint.x + (left ? -1 : 1) * 160 * u,
              y: Math.min(H - 80 * u, offsetIn(win).y + win.offsetHeight + 36 * u),
            };
            var p;
            if (t < T.glide) p = lerp(start, anchor, easeOut(seg(t, 0, T.glide)));
            else if (t < T.travel0) p = anchor;
            else if (t < T.travel1)
              p = lerp(anchor, itemPoint, easeInOut(seg(t, T.travel0, T.travel1)));
            else if (t < T.away0) p = itemPoint;
            else p = lerp(itemPoint, aside, easeInOut(seg(t, T.away0, T.away1)));

            // The highlight is whichever row sits under the tip; it blinks once on the click.
            var live = open > 0.6 && shut === 0 && p.x > mx && p.x < mx + mw;
            var blink = t > T.click + 0.06 * squeeze && t < T.click + 0.12 * squeeze;
            rows.forEach(function (row) {
              var top = my + row.offsetTop;
              var hit = live && p.y >= top && p.y < top + row.offsetHeight;
              row.classList.toggle("is-hover", hit && !blink);
            });

            var done = t >= T.act;
            var k = easeOut(seg(t, T.act, T.act + 0.32 * squeeze));
            cards[TARGET].classList.toggle(
              "is-on",
              t >= T.rclick && !(done && action === "duplicate"),
            );
            copy.classList.toggle("is-on", done && action === "duplicate");
            var showCopy = action === "duplicate" ? k : 0;
            copy.style.opacity = String(showCopy);
            copy.style.transform =
              "translateY(" +
              (1 - showCopy) * 18 * u +
              "px) scale(" +
              (0.94 + 0.06 * showCopy) +
              ")";
            var gone = action === "trash" ? k : 0;
            cards[TARGET].style.opacity = String(1 - gone);
            cards[TARGET].style.transform = "scale(" + (1 - 0.08 * gone) + ")";
            var editing = done && action === "rename";
            targetName.classList.toggle("is-edit", editing);
            targetName.innerHTML = editing
              ? "<b>" + FILES[TARGET][0] + "</b>." + FILES[TARGET][1]
              : FILES[TARGET][0] + "." + FILES[TARGET][1];
            var showToast = action === "toast" ? k : 0;
            toast.style.opacity = String(showToast);
            toast.style.transform = "translate(-50%," + (1 - showToast) * 20 * u + "px)";

            var s = press(t, T.rclick, 0.1) * press(t, T.click, 0.12);
            cursor.style.transform = "translate(" + p.x + "px," + p.y + "px) scale(" + s + ")";
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(
            clock,
            {
              t: duration,
              duration: duration,
              ease: "none",
              onUpdate: function () {
                render(clock.t);
              },
            },
            0,
          );
          render(0);
          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = tl;
        })();
      </script>
    </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["cursor-context-menu-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
