<html data-composition-variables='[
    { "id": "rows", "type": "number", "role": "layout", "label": "Rows", "description": "Number of logo rows in the wall.", "default": 3, "min": 2, "max": 4, "step": 1 },
    { "id": "cols", "type": "number", "role": "layout", "label": "Columns", "description": "Number of logo columns in the wall.", "default": 5, "min": 3, "max": 6, "step": 1 },
    { "id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Delay between consecutive logo cell entrances.", "default": 45, "min": 20, "max": 75, "step": 1, "unit": "ms" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Logo Wall Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        --bg: #080b13;
        --fg: #f6f8fc;
        --muted: #a7b0c1;
        --surface: #151b29;
        --border: #344057;
        --brand: #7c9cff;
        --accent: #86e5c5;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, monospace;
        --radius: 18px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 32px;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        --ease-exit: cubic-bezier(0.55, 0.055, 0.675, 0.19);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
      }

      .mount-card {
        width: 72%;
        height: 72%;
        left: 14%;
        top: 14%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) * 1.5);
        background: var(--surface);
        box-shadow: 0 40px 100px color-mix(in srgb, var(--bg) 82%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A trusted-by wall of placeholder lettermark logos that fades and scales into place with a deterministic per-cell stagger.",
 "class": "logo",
 "tags": [
  "data",
  "logos",
  "social-proof",
  "stagger",
  "prove"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "rows",
   "type": "number",
   "default": 3,
   "min": 2,
   "max": 4,
   "what": "Number of logo rows in the wall."
  },
  {
   "name": "cols",
   "type": "number",
   "default": 5,
   "min": 3,
   "max": 6,
   "what": "Number of logo columns in the wall."
  },
  {
   "name": "stagger",
   "type": "number",
   "default": 45,
   "min": 20,
   "max": 75,
   "unit": "ms",
   "what": "Delay between consecutive logo cell entrances."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"rows":4,"cols":6,"stagger":75};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.15,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="logo-wall-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
      data-fps="30"
    >
      <div
        id="logo-wall-mount"
        class="mount-card clip"
        data-composition-id="logo-wall"
       
        data-variable-values='{"rows":4,"cols":6,"stagger":75}'
        data-start="0"
        data-duration="5"
        data-track-index="0"
        data-width="1382"
        data-height="778"
      >
      <div id="root" data-composition-id="logo-wall" data-start="0" data-duration="5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root fills the host box and consumes only the shared theme tokens.
             Every internal dimension is relative to this size container. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f5f6f8);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .lw-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #0b0c10);
          }

          .lw-stage {
            width: 86cqw;
            height: 82cqh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: var(--space-3, 3cqh);
            padding: var(--space-3, 3cqh);
          }

          .lw-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2, 1.6cqh);
            color: var(--muted, #8b8f9a);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(2.6cqw, 4.4cqh);
            font-weight: 650;
            letter-spacing: 0.08em;
            line-height: 1;
            text-transform: uppercase;
          }

          .lw-heading::before,
          .lw-heading::after {
            content: "";
            width: 8cqw;
            height: 0.14cqw;
            background: var(--border, #262931);
          }

          /* EDIT ZONE: grid geometry. rows and cols are the sole owners of
             track count. Spacing and surfaces remain theme-token driven. */
          .lw-grid {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(var(--lw-cols), minmax(0, 1fr));
            grid-template-rows: repeat(var(--lw-rows), minmax(0, 1fr));
            gap: var(--space-2, 1.6cqh);
          }

          .lw-cell {
            min-width: 0;
            min-height: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 0.14cqw solid var(--border, #262931);
            border-radius: var(--radius, 2cqw);
            background: var(--surface, #16181d);
            box-shadow: 0 1.2cqh 3cqh color-mix(in srgb, var(--bg, #0b0c10) 58%, transparent);
          }

          .lw-mark {
            display: grid;
            place-items: center;
            width: min(5.5cqw, 9.5cqh);
            aspect-ratio: 1;
            border-radius: calc(var(--radius, 2cqw) * 0.72);
            background: color-mix(in srgb, var(--fg, #f5f6f8) 72%, transparent);
            color: var(--bg, #0b0c10);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(2.2cqw, 4cqh);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
          }
        </style>

        <div
          id="logo-wall-clip"
          class="lw-clip clip"
          data-start="0"
          data-duration="5"
          data-track-index="0"
        >
          <section class="lw-stage" aria-label="Trusted by logo wall">
            <div class="lw-heading">Trusted by teams</div>
            <div class="lw-grid"></div>
          </section>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "logo-wall";
            var stage = root.querySelector(".lw-stage");
            var grid = root.querySelector(".lw-grid");

            // EDIT ZONE: the runtime variable table is read once. These
            // clamped values own DOM count, grid tracks, and stagger timing.
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var rawRows = Number(vars.rows);
            var rows = Number.isFinite(rawRows) ? Math.round(rawRows) : 3;
            rows = Math.max(2, Math.min(4, rows));

            var rawCols = Number(vars.cols);
            var cols = Number.isFinite(rawCols) ? Math.round(rawCols) : 5;
            cols = Math.max(3, Math.min(6, cols));

            var rawStagger = Number(vars.stagger);
            var staggerMs = Number.isFinite(rawStagger) ? rawStagger : 45;
            staggerMs = Math.max(20, Math.min(75, staggerMs));

            var lettermarks = [
              "AX",
              "BL",
              "CY",
              "DQ",
              "EV",
              "FK",
              "GN",
              "HT",
              "IP",
              "JR",
              "KS",
              "LU",
              "MW",
              "NX",
              "OZ",
              "PA",
              "QC",
              "RF",
              "SG",
              "TJ",
              "VK",
              "WL",
              "XM",
              "YN",
            ];
            var cellCount = rows * cols;
            var fragment = document.createDocumentFragment();

            for (var index = 0; index < cellCount; index += 1) {
              var cell = document.createElement("div");
              var mark = document.createElement("span");
              cell.className = "lw-cell";
              cell.setAttribute("aria-hidden", "true");
              mark.className = "lw-mark";
              mark.textContent = lettermarks[index];
              cell.appendChild(mark);
              fragment.appendChild(cell);
            }

            grid.replaceChildren(fragment);
            grid.style.setProperty("--lw-rows", String(rows));
            grid.style.setProperty("--lw-cols", String(cols));

            var cells = root.querySelectorAll(".lw-cell");

            // RETIME RANGE: the 2.50s IN fits the largest public wall of 24
            // cells at the maximum 75ms stagger plus the 0.55s cell settle.
            // HOLD alone absorbs longer host durations.
            var IN_BASE = 2.5;
            var OUT_BASE = 0.5;
            var ASSEMBLE_START_BASE = 0.15;
            var CELL_DURATION_BASE = 0.55;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "5"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;
            var ASSEMBLE_START = ASSEMBLE_START_BASE * scale;
            var CELL_DURATION = CELL_DURATION_BASE * scale;
            var STAGGER_SECONDS = (staggerMs / 1000) * scale;

            var timeline = gsap.timeline({ paused: true });

            // IN: deterministic DOM-order assembly. power2.out is the GSAP
            // owner of the shared --ease-standard entrance token.
            timeline.fromTo(
              cells,
              { opacity: 0, scale: 0.94 },
              {
                opacity: 1,
                scale: 1,
                duration: CELL_DURATION,
                ease: "power2.out",
                stagger: { each: STAGGER_SECONDS, from: "start" },
              },
              ASSEMBLE_START,
            );

            // HOLD: deliberately still. OUT: the whole proof wall leaves once
            // with the production exit curve, never during the elastic hold.
            timeline.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            timeline.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = timeline;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      // The mounted primitive owns all visible motion. This host registers only
      // the empty paused timeline required for its own composition id.
      window.__timelines = window.__timelines || {};
      window.__timelines["logo-wall-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
