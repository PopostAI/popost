<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #yt-vf-root {
        /* ---- yt tokens ---- */
        --yt-font: "Inter", -apple-system, sans-serif;
        --yt-grid-size: 28px;
        --yt-grid-alpha: 0.05;
        --yt-stage: #101012;
        --yt-scrim: rgba(8, 8, 10, 0.28);
        --yt-cyan: #35c8d9;
        --yt-prism-b: #2a7fff;
        --yt-violet: #7d5cff;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--yt-stage);
        font-family: var(--yt-font);
      }
      .yt-vf-media {
        position: absolute;
        overflow: hidden;
      }
      .yt-vf-media img,
      .yt-vf-media .yt-vf-fill {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #yt-vf-bg {
        inset: -60px;
        filter: blur(42px) brightness(0.75);
      }
      .yt-vf-side {
        top: 0;
        bottom: 0;
        width: 656px;
      }
      #yt-vf-scrim {
        position: absolute;
        inset: 0;
        background: var(--yt-scrim);
      }
      #yt-vf-grid {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, var(--yt-grid-alpha)) 0 1px,
            transparent 1px var(--yt-grid-size)
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, var(--yt-grid-alpha)) 0 1px,
            transparent 1px var(--yt-grid-size)
          );
      }
      #yt-vf-fg {
        top: 0;
        bottom: 0;
        left: 656px;
        width: 608px;
        box-shadow: 0 0 90px rgba(0, 0, 0, 0.55);
      }
      /* stand-in portrait when no media is configured (self-demo) */
      .yt-vf-fill {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 120px;
        color: rgba(255, 255, 255, 0.9);
        background: linear-gradient(
          160deg,
          var(--yt-cyan) 0%,
          var(--yt-prism-b) 50%,
          var(--yt-violet) 100%
        );
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Portrait media filling a widescreen frame via blurred-scale, mirror, or copy side fills; grid texture and foreground contrast lift (images inside the block; keep live footage in the host)",
 "class": "ui",
 "tags": [
  "placeholder",
  "vertical",
  "media"
 ],
 "seconds": 7.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="yt-vf-root"
      data-composition-id="yt-vertical-fill"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div class="yt-vf-media" id="yt-vf-bg" data-layout-allow-overflow></div>
      <div class="yt-vf-media yt-vf-side" id="yt-vf-side-l" style="left: 0"></div>
      <div class="yt-vf-media yt-vf-side" id="yt-vf-side-r" style="right: 0"></div>
      <div id="yt-vf-scrim"></div>
      <div id="yt-vf-grid"></div>
      <div class="yt-vf-media" id="yt-vf-fg"></div>
      <div
        id="yt-vf-drv"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters ----
           Vertical media filling a 16:9 frame — three fill modes:
           mode "scale" (big blurred copy behind), "mirror" (flanking
           mirrored copies), "copy" (flanking straight copies).
           IMAGES ONLY inside this block: the runtime never seeks media
           elements inside a sub-composition (renders black). For live
           vertical FOOTAGE, keep the media element in the HOST root
           positioned over the fg slot (left:656px width:608px) and feed
           this block a representative still for the fill layers. */
        var CONFIG = {
          src: null, // portrait IMAGE path; null -> stand-in gradient (demo)
          mode: "scale", // "scale" | "mirror" | "copy"
          fgContrast: 1.06,
          fgBrightness: 1.03,
          fgSaturation: 1.08,
          grid: { enabled: true },
          kenBurns: true,
          animationIn: true,
          animationOut: true,
        };

        var DUR = 8;
        function clamp(v, lo, hi) {
          return Math.min(hi, Math.max(lo, v));
        }
        var IN = clamp(DUR * 0.08, 0.3, 0.8);
        var OUT = clamp(DUR * 0.06, 0.25, 0.6);

        var root = document.getElementById("yt-vf-root");
        var bg = document.getElementById("yt-vf-bg");
        var sideL = document.getElementById("yt-vf-side-l");
        var sideR = document.getElementById("yt-vf-side-r");
        var fg = document.getElementById("yt-vf-fg");
        var grid = document.getElementById("yt-vf-grid");

        if (!CONFIG.grid.enabled) grid.style.display = "none";

        function media(id) {
          if (!CONFIG.src) {
            var d = document.createElement("div");
            d.className = "yt-vf-fill";
            d.textContent = "9:16";
            return d;
          }
          var img = document.createElement("img");
          img.src = CONFIG.src;
          img.id = id;
          return img;
        }

        fg.appendChild(media("yt-vf-m-fg"));
        fg.style.filter =
          "contrast(" +
          CONFIG.fgContrast +
          ") brightness(" +
          CONFIG.fgBrightness +
          ") saturate(" +
          CONFIG.fgSaturation +
          ")";

        if (CONFIG.mode === "scale") {
          bg.appendChild(media("yt-vf-m-bg"));
          sideL.style.display = "none";
          sideR.style.display = "none";
        } else {
          bg.style.display = "none";
          sideL.appendChild(media("yt-vf-m-l"));
          sideR.appendChild(media("yt-vf-m-r"));
          if (CONFIG.mode === "mirror") {
            sideL.firstChild.style.transform = "scaleX(-1)";
            sideR.firstChild.style.transform = "scaleX(-1)";
          }
          sideL.style.filter = "blur(6px) brightness(0.72)";
          sideR.style.filter = "blur(6px) brightness(0.72)";
        }

        var tl = gsap.timeline({ paused: true });

        if (CONFIG.animationIn) {
          tl.from(root, { opacity: 0, duration: IN, ease: "power2.out" }, 0);
          gsap.set(fg, { y: 34, opacity: 0 });
          tl.to(fg, { y: 0, opacity: 1, duration: IN * 1.6, ease: "power3.out" }, IN * 0.5);
        }
        if (CONFIG.kenBurns) {
          tl.fromTo(
            fg.firstChild,
            { scale: 1.05 },
            { scale: 1, duration: DUR - 1, ease: "sine.out" },
            0.4,
          );
        }

        if (CONFIG.animationOut) {
          tl.to(root, { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["yt-vertical-fill"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
