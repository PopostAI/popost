  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Icon Swap - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~65% of frame */
        transform: scale(1.47);
      }
      .hf-transition-icon-swap {
        position: relative;
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 16px;
        background: #18181b;
        color: #fff;
        font:
          900 28px/1 Inter,
          system-ui,
          sans-serif;
        box-shadow: 0 18px 44px rgba(24, 24, 27, 0.22);
      }
      .hf-transition-icon-swap span {
        position: absolute;
        filter: blur(var(--hf-icon-blur, 0px));
        transform: scale(var(--hf-icon-scale, 1)) rotate(var(--hf-icon-rotate, 0deg));
        will-change: transform, filter, opacity;
      }
      .hf-transition-icon-swap .to {
        opacity: 0;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A scale-and-blur icon swap primitive for toolbar and action state changes",
 "class": "transition",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "icon",
  "swap"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "dark",
   "options": [
    "dark",
    "light",
    "accent"
   ],
   "what": "Button fill and glyph colour. Accent rides --brand."
  },
  {
   "name": "size",
   "type": "choice",
   "default": "standard",
   "options": [
    "small",
    "standard",
    "large"
   ],
   "what": "Button box and glyph size, from a toolbar chip to a hero action."
  },
  {
   "name": "shape",
   "type": "choice",
   "default": "rounded",
   "options": [
    "rounded",
    "circle",
    "square"
   ],
   "what": "Corner treatment of the button box."
  },
  {
   "name": "blur",
   "type": "choice",
   "default": "standard",
   "options": [
    "soft",
    "standard",
    "heavy"
   ],
   "what": "Scales the blur radius the timeline drives through the swap, from a light haze to a full smear."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="icon-swap-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <button
          class="hf-transition-icon-swap"
          type="button"
          data-composition-variables='[
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Button fill and glyph colour. Accent rides --brand.", "default": "dark", "options": [{ "value": "dark", "label": "Dark" }, { "value": "light", "label": "Light" }, { "value": "accent", "label": "Accent" }] },
    { "id": "size", "type": "enum", "role": "layout", "label": "Size", "description": "Button box and glyph size, from a toolbar chip to a hero action.", "default": "standard", "options": [{ "value": "small", "label": "Small" }, { "value": "standard", "label": "Standard" }, { "value": "large", "label": "Large" }] },
    { "id": "shape", "type": "enum", "role": "style", "label": "Shape", "description": "Corner treatment of the button box.", "default": "rounded", "options": [{ "value": "rounded", "label": "Rounded" }, { "value": "circle", "label": "Circle" }, { "value": "square", "label": "Square" }] },
    { "id": "blur", "type": "enum", "role": "motion", "label": "Blur", "description": "Scales the blur radius the timeline drives through the swap, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] }
  ]'
        >
          <span class="from">+</span><span class="to">OK</span>
        </button>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var tones = {
            dark: { bg: "#18181b", fg: "#ffffff" },
            light: { bg: "#fafafa", fg: "#18181b" },
            accent: { bg: "var(--brand, #34d399)", fg: "#052e21" },
          };
          var sizes = {
            small: { box: "44px", font: "22px" },
            standard: { box: "58px", font: "28px" },
            large: { box: "76px", font: "38px" },
          };
          var shapes = { rounded: "16px", circle: "50%", square: "6px" };
          var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };

          var tone = tones[pick(tones, vars.tone, "dark")];
          var size = sizes[pick(sizes, vars.size, "standard")];
          var shape = shapes[pick(shapes, vars.shape, "rounded")];
          var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];

          var roots = document.querySelectorAll(".hf-transition-icon-swap");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-icon-bg", tone.bg);
            roots[i].style.setProperty("--hf-icon-fg", tone.fg);
            roots[i].style.setProperty("--hf-icon-size", size.box);
            roots[i].style.setProperty("--hf-icon-font-size", size.font);
            roots[i].style.setProperty("--hf-icon-radius", shape);
            roots[i].style.setProperty("--hf-icon-blur-scale", String(blurScale));
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.to(
          ".hf-transition-icon-swap .from",
          {
            opacity: 0,
            "--hf-icon-scale": 0.55,
            "--hf-icon-blur": "8px",
            "--hf-icon-rotate": "-18deg",
            duration: 0.18,
            ease: "power2.in",
          },
          startTime,
        );
        tl.fromTo(
          ".hf-transition-icon-swap .to",
          {
            opacity: 0,
            "--hf-icon-scale": 1.35,
            "--hf-icon-blur": "8px",
            "--hf-icon-rotate": "18deg",
          },
          {
            opacity: 1,
            "--hf-icon-scale": 1,
            "--hf-icon-blur": "0px",
            "--hf-icon-rotate": "0deg",
            duration: 0.26,
            ease: "back.out(1.7)",
          },
          startTime + 0.12,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["icon-swap-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-icon-swap {
        position: relative;
        display: grid;
        place-items: center;
        width: var(--hf-icon-size, 58px);
        height: var(--hf-icon-size, 58px);
        border: 0;
        border-radius: var(--hf-icon-radius, 16px);
        background: var(--hf-icon-bg, #18181b);
        color: var(--hf-icon-fg, #fff);
        font:
          900 28px/1 Inter,
          system-ui,
          sans-serif;
        font-size: var(--hf-icon-font-size, 28px);
        box-shadow: 0 18px 44px rgba(24, 24, 27, 0.22);
      }
      .hf-transition-icon-swap span {
        position: absolute;
        filter: blur(calc(var(--hf-icon-blur, 0px) * var(--hf-icon-blur-scale, 1)));
        transform: scale(var(--hf-icon-scale, 1)) rotate(var(--hf-icon-rotate, 0deg));
        will-change: transform, filter, opacity;
      }
      .hf-transition-icon-swap .to {
        opacity: 0;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
