-->
<html
  lang="en"
  data-composition-variables='[
    {
      "id": "direction",
      "type": "enum",
      "label": "Dolly direction",
      "default": "out",
      "options": [
        { "value": "out", "label": "Dolly out + zoom in (background rushes in)" },
        { "value": "in", "label": "Dolly in + zoom out (background falls away)" }
      ]
    },
    {
      "id": "strength",
      "type": "number",
      "label": "Move strength (end / start distance ratio)",
      "default": 2,
      "min": 1.1,
      "max": 4,
      "step": 0.1
    },
    {
      "id": "subjectDistance",
      "type": "number",
      "label": "Camera-to-subject distance at the start of the move",
      "default": 1400,
      "min": 600,
      "max": 3000,
      "step": 50,
      "unit": "px"
    },
    {
      "id": "easing",
      "type": "enum",
      "label": "Dolly easing",
      "default": "power2.inOut",
      "options": [
        { "value": "none", "label": "Linear" },
        { "value": "sine.inOut", "label": "Sine in-out" },
        { "value": "power1.inOut", "label": "Power1 in-out" },
        { "value": "power2.inOut", "label": "Power2 in-out" },
        { "value": "power3.inOut", "label": "Power3 in-out" }
      ]
    }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Camera tracks toward or away from the subject while the field of view changes the opposite way, so the subject holds its frame size while the background collapses behind it or rushes in. Focal length is solved from dolly distance every frame against d * tan(FOV/2) = const, not keyframed beside it. Requires depth: the subject sits on the z = 0 plane and the content behind it must be layered or genuinely 3D (translateZ at two or more distinct depths) -- a flat element gains nothing from this move.",
 "class": "camera",
 "tags": [
  "camera",
  "depth",
  "3d",
  "cinematic"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "out",
   "options": [
    "out",
    "in"
   ],
   "what": "Dolly direction"
  },
  {
   "name": "strength",
   "type": "number",
   "default": 2,
   "min": 1.1,
   "max": 4,
   "what": "Move strength (end / start distance ratio)"
  },
  {
   "name": "subjectDistance",
   "type": "number",
   "default": 1400,
   "min": 600,
   "max": 3000,
   "unit": "px",
   "what": "Camera-to-subject distance at the start of the move"
  },
  {
   "name": "easing",
   "type": "choice",
   "default": "power2.inOut",
   "options": [
    "none",
    "sine.inOut",
    "power1.inOut",
    "power2.inOut",
    "power3.inOut"
   ],
   "what": "Dolly easing"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.2,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    
    <div
      id="dz-root"
      data-composition-id="camera-dolly-zoom"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <style>
        #dz-root {
          width: 1920px;
          height: 1080px;
          position: relative;
          overflow: hidden;
          background: #0b1020;
          font-family: Inter, sans-serif;
        }

        /* The camera. `perspective` is the focal length and is solved from
           the dolly distance every frame -- see the script. */
        #dz-stage {
          position: absolute;
          inset: 0;
          perspective-origin: 50% 50%;
        }

        /* The rig root. Carries the camera's z offset so the subject plane
           always sits exactly `d` in front of the camera. */
        #dz-rig {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }

        /* --- authored depth layers ------------------------------------ */

        .dz-arch {
          position: absolute;
          left: -140px;
          top: -80px;
          width: 2200px;
          height: 1240px;
          border: 16px solid #465280;
          border-radius: 8px;
          transform-style: preserve-3d;
        }

        #dz-backwall {
          position: absolute;
          left: -3040px;
          top: -1710px;
          width: 8000px;
          height: 4500px;
          background: #10162c;
          transform-style: preserve-3d;
        }

        /* Bright doorway on the back wall -- the layer whose on-screen size
           changes while the subject's does not. */
        #dz-portal {
          position: absolute;
          left: 3300px;
          top: 1850px;
          width: 1400px;
          height: 1500px;
          background: #cfe4ff;
        }

        /* --- the subject: z = 0, the plane the solve holds ------------- */

        #dz-subject {
          position: absolute;
          left: 840px;
          top: 300px;
          width: 240px;
          height: 620px;
          transform-style: preserve-3d;
        }
        .dz-fig-head {
          width: 120px;
          height: 120px;
          margin: 0 auto;
          border-radius: 50%;
          background: #f2b134;
        }
        .dz-fig-body {
          width: 240px;
          height: 470px;
          margin-top: 30px;
          border-radius: 120px 120px 10px 10px;
          background: #f2b134;
        }

        /* --- flat overlay (outside the 3D rig) ------------------------- */

        .dz-label {
          position: absolute;
          left: 64px;
          bottom: 56px;
          padding: 14px 22px;
          border-radius: 8px;
          background: #0b1020;
          color: #e9eeff;
          font-size: 26px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        }
      </style>

      <div id="dz-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="dz-rig">
          <div id="dz-backwall" data-layout-allow-overflow style="transform: translateZ(-3200px)">
            <div id="dz-portal"></div>
          </div>

          <div
            class="dz-arch"
            data-layout-allow-overflow
            style="transform: translateZ(-2360px); border-color: #384166"
          ></div>
          <div
            class="dz-arch"
            data-layout-allow-overflow
            style="transform: translateZ(-1720px); border-color: #465280"
          ></div>
          <div
            class="dz-arch"
            data-layout-allow-overflow
            style="transform: translateZ(-1120px); border-color: #57669c"
          ></div>
          <div
            class="dz-arch"
            data-layout-allow-overflow
            style="transform: translateZ(-560px); border-color: #6b7cb8"
          ></div>
          <div
            class="dz-arch"
            data-layout-allow-overflow
            style="transform: translateZ(0px); border-color: #8194d4"
          ></div>

          <div id="dz-subject" style="transform: translateZ(0px)">
            <div class="dz-fig-head"></div>
            <div class="dz-fig-body"></div>
          </div>
        </div>
      </div>

      <div class="dz-label">Dolly zoom &middot; d &times; tan(fov/2) = const</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      (function () {
        var DEFAULTS = {
          direction: "out",
          strength: 2,
          subjectDistance: 1400,
          easing: "power2.inOut",
        };
        var declared =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var vars = Object.assign({}, DEFAULTS, declared);

        function clamp(value, lo, hi, fallback) {
          var n = Number(value);
          if (!isFinite(n)) return fallback;
          return Math.min(hi, Math.max(lo, n));
        }
        function oneOf(value, allowed, fallback) {
          return allowed.indexOf(String(value)) >= 0 ? String(value) : fallback;
        }

        var direction = oneOf(vars.direction, ["in", "out"], DEFAULTS.direction);
        var strength = clamp(vars.strength, 1.1, 4, DEFAULTS.strength);
        var ease = oneOf(
          vars.easing,
          ["none", "sine.inOut", "power1.inOut", "power2.inOut", "power3.inOut"],
          DEFAULTS.easing,
        );

        // d0 = camera-to-subject distance at the start of the move (px).
        // d1 = distance at the end. "out" pulls the camera back and zooms in;
        // "in" pushes the camera forward and zooms out.
        var d0 = clamp(vars.subjectDistance, 600, 3000, DEFAULTS.subjectDistance);
        var d1 = direction === "in" ? d0 / strength : d0 * strength;

        // ---- the solve --------------------------------------------------
        // Subject size is fixed iff  d * tan(FOV/2) = const. With CSS 3D,
        // tan(FOV/2) = (width/2) / perspective, so that invariant is exactly
        // perspective / distance = SUBJECT_SCALE. Focal length is therefore
        // derived from the dolly, never animated alongside it.
        var SUBJECT_SCALE = 1; // subject renders 1:1 => its plane is z = 0

        var stage = document.getElementById("dz-stage");
        var rig = document.getElementById("dz-rig");

        function applyCamera(u) {
          var d = d0 + (d1 - d0) * u; // dolly -- pure function of u
          var P = SUBJECT_SCALE * d; // focal length solved from d
          var camZ = P - d; // put the subject plane at camera distance d
          stage.style.perspective = P + "px";
          rig.style.transform = "translateZ(" + camZ + "px)";
        }

        // GSAP suppresses timeline-level onUpdate during seek(), so the camera
        // is driven by a property setter on the tweened object instead: that
        // fires on every render, seeks included.
        var camera = {
          _u: 0,
          get u() {
            return this._u;
          },
          set u(value) {
            this._u = value;
            applyCamera(value);
          },
        };

        applyCamera(0);

        var tl = gsap.timeline({ paused: true });
        tl.to(camera, { u: 1, duration: 4, ease: ease }, 0);
        window.__timelines["camera-dolly-zoom"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
