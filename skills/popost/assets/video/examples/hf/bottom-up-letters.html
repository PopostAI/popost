<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bottom Up Letters - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #16120e;
        color: #f7ead6;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-bottom-up-letters {
        display: inline-block;
        font-size: 180px; /* ponytail: scaled up from 126px — fills ~65% of 1920px frame width */
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .hf-bottom-up-letters-char {
        display: inline-block;
        opacity: 0;
        transform: translate3d(0, 0.85em, 0);
        will-change: transform, opacity;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Splits text into letters and reveals each glyph from below with deterministic staggered timing",
 "class": "text",
 "tags": [
  "motion-primitive",
  "text",
  "letters",
  "reveal"
 ],
 "seconds": 1.33,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "unit",
   "type": "choice",
   "default": "letter",
   "options": [
    "letter",
    "word"
   ],
   "what": "What each animated span holds. Letter staggers glyph by glyph, word keeps whole words intact."
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "up",
   "options": [
    "up",
    "down"
   ],
   "what": "Where each span starts. Up starts below the baseline and rises, down starts above and drops."
  },
  {
   "name": "travel",
   "type": "choice",
   "default": "standard",
   "options": [
    "close",
    "standard",
    "far"
   ],
   "what": "How far each span starts from its resting position, from 0.45em to 1.5em."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.45,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="bottom-up-letters-demo"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-composition-variables='[
  { "id": "unit", "type": "enum", "role": "content", "label": "Split unit", "description": "What each animated span holds. Letter staggers glyph by glyph, word keeps whole words intact.", "default": "letter", "options": [{ "value": "letter", "label": "Letter" }, { "value": "word", "label": "Word" }] },
  { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Where each span starts. Up starts below the baseline and rises, down starts above and drops.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }] },
  { "id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "How far each span starts from its resting position, from 0.45em to 1.5em.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] }
]'
    >
      <div class="hf-bottom-up-letters">Build with motion</div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var travels = { close: "0.45em", standard: "0.85em", far: "1.5em" };
          var directions = { up: "1", down: "-1" };
          var units = { letter: true, word: true };

          var travel = travels[pick(travels, vars.travel, "standard")];
          var direction = directions[pick(directions, vars.direction, "up")];
          var unit = pick(units, vars.unit, "letter");

          document.querySelectorAll(".hf-bottom-up-letters").forEach((el) => {
            el.style.setProperty("--hf-letters-travel", travel);
            el.style.setProperty("--hf-letters-direction", direction);
            if (el.dataset.hfLettersReady === "1") return;
            const text = el.textContent || "";
            el.textContent = "";
            const parts = unit === "word" ? text.split(/(\s+)/) : Array.from(text);
            for (const part of parts) {
              if (part === "") continue;
              if (unit === "word" && /^\s+$/.test(part)) {
                el.appendChild(document.createTextNode(part));
                continue;
              }
              const span = document.createElement("span");
              span.className = "hf-bottom-up-letters-char";
              span.textContent = part === " " ? "\u00a0" : part;
              el.appendChild(span);
            }
            el.dataset.hfLettersReady = "1";
          });
        })();
      </script>
      <script>
        document.querySelectorAll(".hf-bottom-up-letters").forEach((el) => {
          const text = el.textContent || "";
          el.textContent = "";
          for (const char of text) {
            const span = document.createElement("span");
            span.className = "hf-bottom-up-letters-char";
            span.textContent = char === " " ? "\u00a0" : char;
            el.appendChild(span);
          }
        });
        const tl = gsap.timeline({ paused: true });
        tl.to(
          ".hf-bottom-up-letters-char",
          { opacity: 1, y: 0, duration: 0.48, ease: "back.out(1.7)", stagger: 0.025 },
          0.45,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["bottom-up-letters-demo"] = tl;
      </script>
    </div>
    <style>
       element below; the runtime collects every element carrying
        data-composition-variables, not just the document root. The script reads each
        value, falls back to the declared default on anything missing or
        unrecognised, and either changes how the text is split or writes a custom
        property the CSS consumes. The timeline recipe below is untouched by them: it
        still tweens opacity and y back to rest, and these decide what a single
        stagger step covers and where rest is travelled from.

          - unit (letter | word, default letter): what each animated span holds.
            letter staggers glyph by glyph; word keeps whole words intact, so a long
            line reads instead of shimmers.
          - direction (up | down, default up): where the spans start. up starts
            below the baseline and rises into place, down starts above and drops.
          - travel (close | standard | far, default standard): how far each span
            starts from rest, from 0.45em through 0.85em to 1.5em.

        On every default the result is identical to the original: one span per
        character, each starting 0.85em below the baseline.
      -->

      <style
        data-composition-variables='[
        { "id": "unit", "type": "enum", "role": "content", "label": "Split unit", "description": "What each animated span holds. Letter staggers glyph by glyph, word keeps whole words intact.", "default": "letter", "options": [{ "value": "letter", "label": "Letter" }, { "value": "word", "label": "Word" }] },
        { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Where each span starts. Up starts below the baseline and rises, down starts above and drops.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }] },
        { "id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "How far each span starts from its resting position, from 0.45em to 1.5em.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] }
      ]'
      >
        .hf-bottom-up-letters {
          display: inline-block;
        }
        .hf-bottom-up-letters-char {
          display: inline-block;
          opacity: 0;
          transform: translate3d(
            0,
            calc(var(--hf-letters-travel, 0.85em) * var(--hf-letters-direction, 1)),
            0
          );
          will-change: transform, opacity;
        }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
