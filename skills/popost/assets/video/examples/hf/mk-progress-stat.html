  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; scaled into the canvas; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #mk-ps-root {
        /* ---- mk tokens: override in the host to re-skin the family ---- */
        --mk-font: "Inter", -apple-system, sans-serif;
        --mk-ink: #1d1d1f;
        --mk-ink-dim: #6e6e73;
        --mk-ink-dark: #f5f5f7;
        --mk-ink-dim-dark: #a1a1a6;
        --mk-accent: #0071e3;
        --mk-accent-dark: #7d5cff;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent; /* overlays footage or mk-background */
      }
      #mk-ps-group {
        position: absolute;
        font-family: var(--mk-font);
      }
      #mk-ps-num {
        font-weight: 600;
        font-size: 190px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--mk-ink);
        font-variant-numeric: tabular-nums;
      }
      #mk-ps-label {
        margin-top: 10px;
        font-weight: 500;
        font-size: 42px;
        letter-spacing: -0.01em;
        color: var(--mk-ink);
      }
      #mk-ps-track {
        position: relative;
        margin-top: 28px;
        height: 6px;
        border-radius: 3px;
        background: rgba(29, 29, 31, 0.1);
        overflow: hidden;
      }
      #mk-ps-fill {
        position: absolute;
        inset: 0;
        border-radius: 3px;
        background: var(--mk-accent);
        transform-origin: left center;
      }
      #mk-ps-caption {
        margin-top: 22px;
        font-weight: 400;
        font-size: 30px;
        color: var(--mk-ink-dim);
      }
      .mk-dark #mk-ps-num,
      .mk-dark #mk-ps-label {
        color: var(--mk-ink-dark);
      }
      .mk-dark #mk-ps-caption {
        color: var(--mk-ink-dim-dark);
      }
      .mk-dark #mk-ps-track {
        background: rgba(245, 245, 247, 0.18);
      }
      .mk-dark #mk-ps-fill {
        background: var(--mk-accent-dark);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Big-numeral statistic with count-up, label, thin progress track filling to value/max, and caption; light and dark schemes",
 "class": "chart",
 "tags": [
  "data-viz",
  "stat",
  "minimal"
 ],
 "seconds": 6.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"tick","gain":0.35}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="mk-ps-root"
      data-composition-id="mk-progress-stat"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="mk-ps-group">
        <div id="mk-ps-num">0</div>
        <div id="mk-ps-label"></div>
        <div id="mk-ps-track"><div id="mk-ps-fill"></div></div>
        <div id="mk-ps-caption"></div>
      </div>
      <div
        id="mk-ps-drv"
        class="clip"
        data-start="0"
        data-duration="7"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ----
           A "22 · Goals reached" progress card: big count-up
           numeral, label, thin accent track filling to value/max, caption. */
        var CONFIG = {
          scheme: "light", // "light" | "dark"
          value: 22,
          suffix: "", // e.g. "%", "K"
          label: "Goals reached",
          caption: "Great job, we are getting closer!",
          max: 30, // track fills to value/max
          trackWidth: 480, // px
          x: 1300, // group left edge; null = centered
          y: 250, // group top edge; null = centered
          animationIn: true,
          animationOut: true,
        };

        var DUR = 7;
        var root = document.getElementById("mk-ps-root");
        var group = document.getElementById("mk-ps-group");
        var num = document.getElementById("mk-ps-num");
        var fill = document.getElementById("mk-ps-fill");

        if (CONFIG.scheme === "dark") root.classList.add("mk-dark");
        document.getElementById("mk-ps-label").textContent = CONFIG.label;
        document.getElementById("mk-ps-caption").textContent = CONFIG.caption;
        document.getElementById("mk-ps-track").style.width = CONFIG.trackWidth + "px";

        /* position (measure after filling text) */
        var rect = group.getBoundingClientRect();
        group.style.left =
          (CONFIG.x === null ? Math.round((1920 - rect.width) / 2) : CONFIG.x) + "px";
        group.style.top =
          (CONFIG.y === null ? Math.round((1080 - rect.height) / 2) : CONFIG.y) + "px";

        var tl = gsap.timeline({ paused: true });

        if (CONFIG.animationIn) {
          gsap.set(group, { opacity: 0, y: 28 });
          tl.to(group, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
        }

        /* count-up + track fill on the same ease (the data-viz recipe) */
        var st = { v: 0 };
        tl.to(
          st,
          {
            v: CONFIG.value,
            duration: 1.6,
            ease: "power2.out",
            onUpdate: function () {
              num.textContent = Math.round(st.v) + CONFIG.suffix;
            },
          },
          0.5,
        );
        gsap.set(fill, { scaleX: 0 });
        tl.to(fill, { scaleX: CONFIG.value / CONFIG.max, duration: 1.6, ease: "power2.out" }, 0.5);

        if (CONFIG.animationOut) {
          tl.to(group, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-progress-stat"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
