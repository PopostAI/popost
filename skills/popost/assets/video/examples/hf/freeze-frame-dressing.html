<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #freeze-frame-demo {
        width: 960px;
        height: 540px;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #freeze-demo-background,
      #freeze-demo-cutout,
      #freeze-demo-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #freeze-demo-background {
        object-fit: cover;
        filter: saturate(0.28) contrast(1.1) brightness(0.72);
        transform: scale(1.04) rotate(-0.4deg);
      }

      #freeze-demo-cutout {
        z-index: 10;
        object-fit: contain;
        filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff)
          drop-shadow(0 -3px 0 #fff) drop-shadow(14px 18px 8px rgb(16 18 23 / 46%));
      }

      #freeze-demo-overlay {
        z-index: 20;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Timeline-driven paper, tape, and flash dressing for a freeze-frame or background-removed subject",
 "class": "ui",
 "tags": [
  "freeze-frame",
  "cutout",
  "scrapbook",
  "paper",
  "social",
  "overlay",
  "media-treatment-overlay"
 ],
 "placeholders": "2 pictures as slots (picture-1 ...) with a drawn stand-in",
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 960x540 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 960, H = 540, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1.033,"cue":"swish","gain":0.4}]</script>

      id="freeze-frame-dressing"
      data-composition-id="freeze-frame-dressing"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="hf-freeze-paper" aria-hidden="true"></div>
      <div id="hf-freeze-tape-a" class="hf-freeze-tape" aria-hidden="true"></div>
      <div id="hf-freeze-tape-b" class="hf-freeze-tape" aria-hidden="true"></div>
      <div id="hf-freeze-flash" aria-hidden="true"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var paper = document.getElementById("hf-freeze-paper");
      var host = paper && paper.closest("[data-composition-id]");
      if (!host) throw new Error("Freeze-Frame Dressing could not find its composition host");

      var compositionId = host.getAttribute("data-composition-id");
      var duration = Number(host.getAttribute("data-duration")) || 4;
      var hit = Math.max(0.1, duration * 0.24);
      var exit = Math.max(hit + 0.7, duration - 0.3);
      var tl = gsap.timeline({ paused: true });

      tl.to({}, { duration: duration, ease: "none" }, 0);
      tl.to("#hf-freeze-flash", { opacity: 0.95, duration: 0.06, ease: "power2.out" }, hit);
      tl.to("#hf-freeze-flash", { opacity: 0, duration: 0.24, ease: "power2.in" }, hit + 0.06);
      tl.to("#hf-freeze-paper", { opacity: 0.64, duration: 0.18, ease: "power2.out" }, hit + 0.04);
      tl.fromTo(
        "#hf-freeze-tape-a",
        { opacity: 0, scale: 1.18 },
        { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" },
        hit + 0.3,
      );
      tl.fromTo(
        "#hf-freeze-tape-b",
        { opacity: 0, scale: 1.18 },
        { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" },
        hit + 0.42,
      );
      tl.to(
        ["#hf-freeze-paper", "#hf-freeze-tape-a", "#hf-freeze-tape-b"],
        { opacity: 0, duration: 0.24, ease: "power2.in" },
        exit,
      );

      window.__timelines[compositionId] = tl;
    </script>

    <script>

      tl.fromTo(
        "#freeze-demo-cutout",
        { y: 42, scale: 0.86, rotation: -2 },
        { y: 0, scale: 1, rotation: 0.4, duration: 0.5, ease: "back.out(1.35)" },
        1,
      );
      tl.to({}, { duration: 4, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["freeze-frame-demo"] = tl;
    </script>
