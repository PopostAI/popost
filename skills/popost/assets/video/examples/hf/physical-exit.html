<html data-composition-variables='[
    { "id": "mode", "type": "enum", "role": "motion", "label": "Exit mode", "description": "Physical behavior used to carry the card offscreen.", "default": "toss", "options": [{ "value": "toss", "label": "Toss" }, { "value": "drop", "label": "Drop" }, { "value": "slide", "label": "Slide" }] },
    { "id": "text", "type": "string", "role": "content", "label": "Card text", "description": "Word displayed on the exiting card.", "default": "Later" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Color applied to the card edge.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Physical Exit Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --surface: #17191f;
        --border: #343842;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #1a1d24 0%, #0b0c0e 72%);
      }

      .mount-card {
        width: 58%;
        height: 58%;
        left: 21%;
        top: 21%;
        container-type: size;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 32px;
        background: #111318;
        box-shadow: 0 44px 110px rgba(0, 0, 0, 0.48);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A card exits with physical momentum in toss, drop, or slide mode, carrying acceleration and rotation through the final offscreen pose without fading.",
 "class": "transition",
 "tags": [
  "motion-primitive",
  "exit",
  "momentum",
  "toss",
  "drop",
  "slide"
 ],
 "seconds": 3,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "mode",
   "type": "choice",
   "default": "toss",
   "options": [
    "toss",
    "drop",
    "slide"
   ],
   "what": "Physical behavior used to carry the card offscreen."
  },
  {
   "name": "text",
   "type": "text",
   "default": "Later",
   "maxLength": 200,
   "what": "Word displayed on the exiting card."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Color applied to the card edge."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"mode":"slide","text":"See you","accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="physical-exit-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3"
      data-fps="30"
    >
      <div
        id="physical-exit-mount"
        class="mount-card clip"
        data-composition-id="physical-exit"
       
        data-variable-values='{"mode":"slide","text":"See you","accent":"violet"}'
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-width="1114"
        data-height="626"
      >
      <div id="root" data-composition-id="physical-exit" data-duration="3" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .pe-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .pe-card {
            position: relative;
            display: grid;
            place-items: center;
            width: 58cqw;
            min-height: 32cqh;
            padding: 5cqh 6cqw;
            overflow: hidden;
            border: 0.22cqmin solid color-mix(in srgb, var(--pe-accent) 62%, #ffffff);
            border-radius: 4cqmin;
            background: #f8fafc;
            box-shadow:
              0 2.4cqh 7cqh color-mix(in srgb, #020617 48%, transparent),
              inset 1.2cqw 0 0 var(--pe-accent);
            color: #0b0c0e;
            transform-origin: 50% 50%;
            will-change: transform;
          }

          .pe-label {
            display: block;
            max-width: 48cqw;
            overflow: hidden;
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: 11cqmin;
            font-weight: 760;
            line-height: 1;
            letter-spacing: -0.045em;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
        </style>

        <div
          id="physical-exit-clip"
          class="pe-clip clip"
          data-start="0"
          data-duration="3"
          data-track-index="0"
        >
          <div class="pe-card">
            <span class="pe-label"></span>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var card = root.querySelector(".pe-card");
            var label = root.querySelector(".pe-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var mode = vars.mode === "drop" || vars.mode === "slide" ? vars.mode : "toss";
            var text = vars.text == null ? "Later" : String(vars.text);
            var accent = vars.accent === "blue" || vars.accent === "violet" ? vars.accent : "green";
            var accentColors = {
              green: "var(--brand, #34d399)",
              blue: "var(--accent, #60a5fa)",
              violet: "var(--accent-2, #a78bfa)",
            };

            label.textContent = text;
            card.style.setProperty("--pe-accent", accentColors[accent]);

            var IN_BASE = 0.45;
            var OUT_BASE = 0.85;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3"));
            var baseDuration = IN_BASE + OUT_BASE;
            var envelopeScale = duration < baseDuration ? duration / baseDuration : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              card,
              { y: "4cqh", scale: 0.98, rotation: -1 },
              { y: 0, scale: 1, rotation: 0, duration: IN, ease: "power2.out" },
              0,
            );

            if (HOLD > 0) {
              tl.to(
                card,
                {
                  y: "-0.7cqh",
                  rotation: 0.5,
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                },
                HOLD_START,
              );
            }

            if (mode === "drop") {
              tl.to(
                card,
                {
                  y: "108cqh",
                  rotation: 9,
                  duration: OUT,
                  ease: "power2.in",
                },
                OUT_START,
              );
            } else if (mode === "slide") {
              var slidePeak = OUT * 0.72;
              tl.to(
                card,
                {
                  x: "90cqw",
                  skewX: -12,
                  scaleX: 1.08,
                  rotation: -2,
                  duration: slidePeak,
                  ease: "power4.in",
                },
                OUT_START,
              );
              tl.to(
                card,
                {
                  x: "125cqw",
                  skewX: -3,
                  scaleX: 1,
                  rotation: -5,
                  duration: OUT - slidePeak,
                  ease: "power4.out",
                },
                OUT_START + slidePeak,
              );
            } else {
              var tossApex = OUT * 0.42;
              tl.to(
                card,
                {
                  x: "34cqw",
                  y: "-36cqh",
                  rotation: 8,
                  duration: tossApex,
                  ease: "power3.out",
                },
                OUT_START,
              );
              tl.to(
                card,
                {
                  x: "118cqw",
                  y: "86cqh",
                  rotation: 18,
                  duration: OUT - tossApex,
                  ease: "power2.in",
                },
                OUT_START + tossApex,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["physical-exit"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["physical-exit-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
