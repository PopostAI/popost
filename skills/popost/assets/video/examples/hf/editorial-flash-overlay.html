<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #editorial-flash-demo {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #080808;
      }

      #ef-demo-backdrop,
      #ef-demo-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #ef-demo-backdrop {
        object-fit: cover;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Finite neutral-warm light layers for a seek-safe camera-flash cut or social reveal",
 "class": "overlay",
 "tags": [
  "flash",
  "editorial",
  "social",
  "light",
  "transition",
  "overlay",
  "media-treatment-overlay"
 ],
 "placeholders": "1 picture as slots (picture-1 ...) with a drawn stand-in",
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":2.32,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="editorial-flash-demo"
      data-composition-id="editorial-flash-demo"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <img
        id="ef-demo-backdrop"
        class="clip"
        
        alt=""
        data-start="0"
        data-duration="4"
        data-track-index="0"
      / style="background: linear-gradient(135deg, #3d5a80, #98c1d9);" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-slot="picture-1">
      <div
        id="ef-demo-overlay"
        data-composition-id="editorial-flash-overlay"
       
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      >
    <div
      id="editorial-flash-overlay"
      data-composition-id="editorial-flash-overlay"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="ef-flash" aria-hidden="true">
        <div id="ef-wash" class="ef-layer"></div>
        <div id="ef-core" class="ef-layer" data-layout-allow-overflow></div>
        <div id="ef-sweep" class="ef-layer" data-layout-allow-overflow></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var flash = document.getElementById("ef-flash");
      var host = flash && flash.closest("[data-composition-id]");
      if (!host) throw new Error("Editorial Flash could not find its composition host");

      var compositionId = host.getAttribute("data-composition-id");
      var duration = Number(host.getAttribute("data-duration")) || 4;
      var hit = Math.max(0.12, duration * 0.58);
      var tl = gsap.timeline({ paused: true });

      tl.to({}, { duration: duration, ease: "none" }, 0);
      tl.to("#ef-wash", { opacity: 0.92, duration: 0.04, ease: "power4.in" }, hit);
      tl.fromTo(
        "#ef-core",
        { opacity: 0, scale: 0.86, rotation: -5 },
        { opacity: 1, scale: 1, rotation: -5, duration: 0.05, ease: "power4.in" },
        hit - 0.01,
      );
      tl.fromTo(
        "#ef-sweep",
        { opacity: 0, xPercent: -12, rotation: -2 },
        { opacity: 0.9, xPercent: 8, rotation: -2, duration: 0.04, ease: "power4.in" },
        hit,
      );
      tl.to("#ef-wash", { opacity: 0, duration: 0.18, ease: "power3.out" }, hit + 0.04);
      tl.to(
        "#ef-core",
        { opacity: 0, scale: 1.18, rotation: -5, duration: 0.34, ease: "power2.out" },
        hit + 0.04,
      );
      tl.to(
        "#ef-sweep",
        { opacity: 0, xPercent: 28, rotation: -2, duration: 0.3, ease: "power2.out" },
        hit + 0.04,
      );

      window.__timelines[compositionId] = tl;
    </script>
  </div>
    </div>

    <script>
      var tl = gsap.timeline({ paused: true });
      tl.to("#ef-demo-backdrop", { scale: 1.035, duration: 4, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["editorial-flash-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
