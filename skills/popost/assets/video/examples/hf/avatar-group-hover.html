<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Avatar Group Hover - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale-only fix — GSAP animates the spans inside, not this wrapper */
        transform: scale(3.5);
      }
      .hf-transition-avatar-group-hover {
        display: inline-flex;
        align-items: center;
        padding-left: 18px;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-avatar-group-hover span {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin-left: -18px;
        border: 3px solid #fff;
        border-radius: 999px;
        background: linear-gradient(135deg, #111827, #0ea5e9);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow: 0 12px 30px rgba(24, 24, 27, 0.18);
        transform: translateY(var(--hf-avatar-y, 0px));
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A distance-falloff avatar group lift with bouncy hover return",
 "class": "motion",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "avatar",
  "hover"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "size",
   "type": "choice",
   "default": "standard",
   "options": [
    "small",
    "standard",
    "large"
   ],
   "what": "Avatar diameter, with the initials scaling alongside it."
  },
  {
   "name": "overlap",
   "type": "choice",
   "default": "standard",
   "options": [
    "tight",
    "standard",
    "loose"
   ],
   "what": "How far each avatar tucks under the one before it, as a share of its own diameter."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "blue",
   "options": [
    "blue",
    "violet",
    "green"
   ],
   "what": "Colour the avatar gradient resolves into."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="avatar-group-hover-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-avatar-group-hover"
          data-composition-variables='[
    { "id": "size", "type": "enum", "role": "style", "label": "Size", "description": "Avatar diameter, with the initials scaling alongside it.", "default": "standard", "options": [{ "value": "small", "label": "Small" }, { "value": "standard", "label": "Standard" }, { "value": "large", "label": "Large" }] },
    { "id": "overlap", "type": "enum", "role": "style", "label": "Overlap", "description": "How far each avatar tucks under the one before it, as a share of its own diameter.", "default": "standard", "options": [{ "value": "tight", "label": "Tight" }, { "value": "standard", "label": "Standard" }, { "value": "loose", "label": "Loose" }] },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour the avatar gradient resolves into.", "default": "blue", "options": [{ "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }, { "value": "green", "label": "Green" }] }
  ]'
        >
          <span>A</span><span>B</span><span>C</span><span>D</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var sizes = { small: 42, standard: 54, large: 70 };
          var fonts = { small: "0.8em", standard: "1em", large: "1.3em" };
          // Overlap is a share of the diameter, so the two knobs stay independent.
          var overlaps = { tight: 0.5, standard: 1 / 3, loose: 0.12 };
          var accents = { blue: "#0ea5e9", violet: "#a78bfa", green: "#34d399" };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var sizeName = pick(sizes, vars.size, "standard");
          var overlapName = pick(overlaps, vars.overlap, "standard");
          var accent = accents[pick(accents, vars.accent, "blue")];
          var diameter = sizes[sizeName];
          var overlap = Math.round(diameter * overlaps[overlapName]);

          var roots = document.querySelectorAll(".hf-transition-avatar-group-hover");
          for (var i = 0; i < roots.length; i += 1) {
            var style = roots[i].style;
            style.setProperty("--hf-avatar-size", diameter + "px");
            style.setProperty("--hf-avatar-font", fonts[sizeName]);
            style.setProperty("--hf-avatar-overlap", overlap + "px");
            style.setProperty("--hf-avatar-accent", accent);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.to(
          ".hf-transition-avatar-group-hover span",
          {
            "--hf-avatar-y": "-18px",
            duration: 0.28,
            stagger: { each: 0.035, from: "center" },
            ease: "back.out(1.8)",
          },
          startTime,
        );
        tl.to(
          ".hf-transition-avatar-group-hover span",
          {
            "--hf-avatar-y": "0px",
            duration: 0.42,
            stagger: { each: 0.035, from: "center" },
            ease: "bounce.out",
          },
          startTime + 0.36,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["avatar-group-hover-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-avatar-group-hover {
        display: inline-flex;
        align-items: center;
        padding-left: var(--hf-avatar-overlap, 18px);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-avatar-group-hover span {
        display: grid;
        place-items: center;
        width: var(--hf-avatar-size, 54px);
        height: var(--hf-avatar-size, 54px);
        margin-left: calc(-1 * var(--hf-avatar-overlap, 18px));
        border: 3px solid #fff;
        border-radius: 999px;
        background: linear-gradient(135deg, #111827, var(--hf-avatar-accent, #0ea5e9));
        color: #fff;
        font-size: var(--hf-avatar-font, 1em);
        font-weight: 900;
        box-shadow: 0 12px 30px rgba(24, 24, 27, 0.18);
        transform: translateY(var(--hf-avatar-y, 0px));
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
