<html data-composition-variables='[
    { "id": "quote", "type": "string", "role": "content", "label": "Quote", "description": "Customer testimonial copy revealed at reading pace.", "default": "This changed how we ship." },
    { "id": "author", "type": "string", "role": "content", "label": "Author", "description": "Name attributed to the testimonial.", "default": "Ken Tanaka" },
    { "id": "handle", "type": "string", "role": "content", "label": "Handle", "description": "Role or social handle shown beneath the author name.", "default": "@ken" },
    { "id": "rating", "type": "number", "role": "content", "label": "Rating", "description": "Visible customer rating from zero to five stars.", "default": 5, "min": 0, "max": 5, "step": 0.1 }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Testimonial Card - Demo</title>
    <style>
      :root {
        --bg: #070a12;
        --fg: #f8fafc;
        --muted: #a8b3c7;
        --surface: #151c2c;
        --border: #34405a;
        --brand: #e4e4e7;
        --accent: #e4e4e7;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 28px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 32px;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 44%,
          color-mix(in srgb, var(--surface) 72%, var(--bg)),
          var(--bg) 72%
        );
      }

      .mount-card {
        width: 54%;
        height: 64%;
        left: 23%;
        top: 18%;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        border-radius: calc(var(--radius) * 1.35);
        box-shadow: 0 40px 90px color-mix(in srgb, var(--bg) 78%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Reveals a customer quote at reading pace, then settles its avatar, author name, and handle beneath as a clean proof beat.",
 "class": "ui",
 "tags": [
  "prop",
  "ui-props",
  "testimonial",
  "social-proof",
  "quote",
  "prove"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "quote",
   "type": "text",
   "default": "This changed how we ship.",
   "maxLength": 200,
   "what": "Customer testimonial copy revealed at reading pace."
  },
  {
   "name": "author",
   "type": "text",
   "default": "Ken Tanaka",
   "maxLength": 200,
   "what": "Name attributed to the testimonial."
  },
  {
   "name": "handle",
   "type": "text",
   "default": "@ken",
   "maxLength": 200,
   "what": "Role or social handle shown beneath the author name."
  },
  {
   "name": "rating",
   "type": "number",
   "default": 5,
   "min": 0,
   "max": 5,
   "what": "Visible customer rating from zero to five stars."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"quote":"Our launch video went from brief to polished in one afternoon.","author":"Maya Chen","handle":"@mayac","rating":4.6};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.12,"cue":"tick","gain":0.3},{"at":0.82,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="testimonial-card-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="testimonial-card-mount"
        class="mount-card clip"
        data-composition-id="testimonial-card"
       
        data-variable-values='{"quote":"Our launch video went from brief to polished in one afternoon.","author":"Maya Chen","handle":"@mayac","rating":4.6}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1037"
        data-height="691"
      >
      <div id="root" data-composition-id="testimonial-card" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #070a12);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .tc-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 6cqh 6cqw;
          }

          /* EDIT ZONE: card proportions and type scale. Paint is owned only
             by theme-contract tokens, and every measurement resolves from
             the host container. GSAP owns all transforms and opacity. */
          .tc-card {
            width: min(86cqw, 128cqh);
            display: grid;
            gap: min(4.6cqw, 4.6cqh);
            padding: min(6.5cqw, 6.5cqh);
            overflow: hidden;
            border: 0.16cqh solid var(--border, #34405a);
            border-radius: var(--radius, 28px);
            background: var(--surface, #151c2c);
            box-shadow: 0 3cqh 8cqh color-mix(in srgb, var(--bg, #070a12) 68%, transparent);
          }

          .tc-proof {
            display: grid;
            gap: min(3.2cqw, 3.2cqh);
            will-change: transform, opacity;
          }

          .tc-rating {
            display: flex;
            align-items: center;
            gap: min(2cqw, 2cqh);
            width: max-content;
            color: var(--muted, #a8b3c7);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
            font-size: min(2.4cqw, 2.4cqh);
            font-weight: 650;
            line-height: 1;
          }

          .tc-stars {
            position: relative;
            display: inline-block;
            color: var(--muted, #a8b3c7);
            font-size: min(3.4cqw, 3.4cqh);
            letter-spacing: 0.18em;
            line-height: 1;
            white-space: nowrap;
          }

          .tc-stars-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: var(--tc-rating-fill);
            overflow: hidden;
            /* The earned portion of the rating is the data. Flat ink over the
               muted track says it by value, with no second hue. */
            color: var(--fg, #f8fafc);
            white-space: nowrap;
          }

          .tc-quote {
            margin: 0;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(5.2cqw, 5.2cqh);
            font-weight: 650;
            line-height: 1.23;
            letter-spacing: -0.025em;
            text-wrap: balance;
          }

          .tc-attribution {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            grid-template-rows: auto auto;
            column-gap: min(2.7cqw, 2.7cqh);
            row-gap: min(0.65cqw, 0.65cqh);
            align-items: center;
          }

          .tc-avatar {
            grid-row: 1 / 3;
            display: grid;
            place-items: center;
            width: min(8.4cqw, 8.4cqh);
            aspect-ratio: 1;
            border: 0.16cqh solid color-mix(in srgb, var(--fg, #f8fafc) 20%, transparent);
            border-radius: 50%;
            /* Placeholder person: a single (front) avatar circle at L1, with
               the initials knocked out in the ground colour. */
            background: color-mix(in srgb, var(--fg, #f8fafc) 72%, var(--surface, #151c2c));
            color: var(--bg, #070a12);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(2.65cqw, 2.65cqh);
            font-weight: 780;
            letter-spacing: 0.03em;
          }

          .tc-author {
            min-width: 0;
            align-self: end;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(3.2cqw, 3.2cqh);
            font-weight: 700;
            line-height: 1.08;
          }

          .tc-handle {
            min-width: 0;
            align-self: start;
            color: var(--muted, #a8b3c7);
            font-size: min(2.35cqw, 2.35cqh);
            line-height: 1.15;
          }

          .tc-attribution-item {
            will-change: transform, opacity;
          }
        </style>

        <div
          id="testimonial-card-clip"
          class="tc-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <article class="tc-card" aria-label="Customer testimonial">
            <div class="tc-proof">
              <div class="tc-rating" role="img" aria-label="5 out of 5 stars">
                <span class="tc-stars" aria-hidden="true">
                  ★★★★★
                  <span class="tc-stars-fill">★★★★★</span>
                </span>
                <span class="tc-rating-value" aria-hidden="true">5 / 5</span>
              </div>
              <blockquote class="tc-quote"></blockquote>
            </div>

            <footer class="tc-attribution">
              <div class="tc-avatar tc-attribution-item" aria-hidden="true"></div>
              <div class="tc-author tc-attribution-item"></div>
              <div class="tc-handle tc-attribution-item"></div>
            </footer>
          </article>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "testimonial-card";
            var card = root.querySelector(".tc-card");
            var proof = root.querySelector(".tc-proof");
            var quoteEl = root.querySelector(".tc-quote");
            var avatarEl = root.querySelector(".tc-avatar");
            var authorEl = root.querySelector(".tc-author");
            var handleEl = root.querySelector(".tc-handle");
            var ratingEl = root.querySelector(".tc-rating");
            var ratingValueEl = root.querySelector(".tc-rating-value");
            var attributionItems = root.querySelectorAll(".tc-attribution-item");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            /* INVARIANT: getVariables() is the sole owner of content. Missing
               values use the declared defaults, while intentional empty
               strings remain empty. Rating zero is valid and cannot fall
               through to the default. */
            var quoteText = vars.quote == null ? "This changed how we ship." : String(vars.quote);
            var authorText = vars.author == null ? "Ken Tanaka" : String(vars.author);
            var handleText = vars.handle == null ? "@ken" : String(vars.handle);
            var rawRating = Number(vars.rating);
            var rating = Number.isFinite(rawRating) ? Math.max(0, Math.min(5, rawRating)) : 5;
            var ratingText = Number.isInteger(rating) ? String(rating) : rating.toFixed(1);
            var initials = authorText
              .trim()
              .split(/\s+/)
              .filter(Boolean)
              .slice(0, 2)
              .map(function (part) {
                return part.charAt(0);
              })
              .join("")
              .toUpperCase();

            quoteEl.textContent = quoteText;
            authorEl.textContent = authorText;
            handleEl.textContent = handleText;
            avatarEl.textContent = initials === "" ? "?" : initials;
            ratingEl.style.setProperty("--tc-rating-fill", rating * 20 + "%");
            ratingEl.setAttribute("aria-label", ratingText + " out of 5 stars");
            ratingValueEl.textContent = ratingText + " / 5";

            /* RETIME RANGE: these constants own the complete lifecycle. The
               reveal uses --ease-standard's GSAP form, power2.out, with the
               quote first and three attribution items staggered beneath. */
            var IN_BASE = 1.5;
            var OUT_BASE = 0.45;
            var QUOTE_START_BASE = 0.12;
            var QUOTE_DURATION_BASE = 0.7;
            var ATTRIBUTION_START_BASE = 0.82;
            var ATTRIBUTION_DURATION_BASE = 0.56;
            var ATTRIBUTION_STAGGER_BASE = 0.06;
            var durationValue = Number(root.dataset.duration);
            var duration = Number.isFinite(durationValue) && durationValue > 0 ? durationValue : 4;
            var scale = duration < IN_BASE + OUT_BASE ? duration / (IN_BASE + OUT_BASE) : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              proof,
              { y: "18%", opacity: 0 },
              {
                y: "0%",
                opacity: 1,
                duration: QUOTE_DURATION_BASE * scale,
                ease: "power2.out",
              },
              QUOTE_START_BASE * scale,
            );
            tl.fromTo(
              attributionItems,
              { y: "34%", opacity: 0 },
              {
                y: "0%",
                opacity: 1,
                duration: ATTRIBUTION_DURATION_BASE * scale,
                stagger: ATTRIBUTION_STAGGER_BASE * scale,
                ease: "power2.out",
              },
              ATTRIBUTION_START_BASE * scale,
            );
            tl.to(card, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["testimonial-card-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
