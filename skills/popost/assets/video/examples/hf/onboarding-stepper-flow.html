<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Onboarding Stepper Flow - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #fafafa;
        font-family: Inter, system-ui, sans-serif;
      }
      /* ponytail: scale on .demo-frame (not a GSAP target) — safe CSS transform */
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 520px;
        padding: 56px;
        transform: scale(2.3);
      }
      .hf-ui-onboarding-flow {
        display: grid;
        gap: 22px;
        width: 520px;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-ui-onboarding-steps {
        display: flex;
        justify-content: center;
        gap: 18px;
      }
      .hf-ui-onboarding-steps span {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 2px solid #e4e4e7;
        border-radius: 999px;
        background: #ffffff;
        color: #71717a;
        font-size: 15px;
        font-weight: 600;
      }
      .hf-ui-onboarding-steps .done,
      .hf-ui-onboarding-steps .active {
        border-color: #18181b;
        background: #18181b;
        color: #ffffff;
      }
      .hf-ui-onboarding-card {
        display: grid;
        gap: 14px;
        padding: 34px;
        border: 1px solid #e4e4e7;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.1);
      }
      .hf-ui-onboarding-card small {
        color: #71717a;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .hf-ui-onboarding-card strong {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.1;
      }
      .hf-ui-onboarding-card p {
        margin: 0;
        color: #71717a;
        font-size: 16px;
        line-height: 1.5;
      }
      .hf-ui-onboarding-card button {
        justify-self: start;
        height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: #18181b;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: default;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A composed onboarding flow with milestone rail, active step card, and next-action button",
 "class": "ui",
 "tags": [
  "ui-flow",
  "onboarding",
  "stepper"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.62,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="onboarding-stepper-flow-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="hf-ui-onboarding-flow">
          <div class="hf-ui-onboarding-steps">
            <span class="done">1</span><span class="active">2</span><span>3</span>
          </div>
          <div class="hf-ui-onboarding-card">
            <small>Step 2 of 3</small>
            <strong>Choose your visual style</strong>
            <p>Pick a direction so the agent can generate matching motion primitives.</p>
            <button type="button">Continue</button>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-ui-onboarding-steps span",
          { scale: 0.7, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.28, stagger: 0.08, ease: "back.out(1.8)" },
          0.3,
        );
        tl.fromTo(
          ".hf-ui-onboarding-card",
          { y: 28, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
          0.62,
        );
        tl.to(
          ".hf-ui-onboarding-steps .active",
          { scale: 1.16, duration: 0.16, yoyo: true, repeat: 1, ease: "power1.inOut" },
          1.1,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["onboarding-stepper-flow-demo"] = tl;
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
