<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Text Stagger - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #fafafa;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        gap: 28px;
        /* Scale the non-GSAP wrapper while keeping the full phrase inside the frame. */
        transform: scale(1.9);
        transform-origin: center center;
      }
      .demo-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #737379;
      }
      .hf-transition-text-stagger {
        display: flex;
        flex-wrap: wrap;
        gap: 0.24em;
        color: #18181b;
        font:
          900 74px/0.95 Inter,
          system-ui,
          sans-serif;
        letter-spacing: -0.045em;
      }
      .hf-transition-text-stagger span {
        display: inline-block;
        background: linear-gradient(90deg, #18181b, #18181b, #71717a, #18181b);
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        will-change: transform, opacity, filter, background-position;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A transitions.dev-inspired text stagger primitive with enter, shimmer, and exit-ready words",
 "class": "text",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "text",
  "stagger"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Build motion systems fast",
   "maxLength": 200,
   "what": "Headline copy. Every whitespace-separated word becomes one staggered span."
  },
  {
   "name": "size",
   "type": "number",
   "default": 74,
   "min": 24,
   "max": 160,
   "unit": "px",
   "what": "Type size of every word in pixels, clamped to 24-160. Line height stays proportional."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper"
   ],
   "what": "Base word colour: ink for light frames, paper for dark ones."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "blue",
   "options": [
    "blue",
    "green",
    "violet"
   ],
   "what": "Colour of the shimmer the second timeline step sweeps across the words."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.35,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="text-stagger-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="demo-label">text-stagger</div>
        <div
          class="hf-transition-text-stagger"
          data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Headline copy. Every whitespace-separated word becomes one staggered span.", "default": "Build motion systems fast"},
    {"id": "size", "type": "number", "role": "layout", "label": "Size", "description": "Type size of every word in pixels, clamped to 24-160. Line height stays proportional.", "default": 74, "min": 24, "max": 160, "step": 1, "unit": "px"},
    {"id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Base word colour: ink for light frames, paper for dark ones.", "default": "ink", "options": [{"value": "ink", "label": "Ink"}, {"value": "paper", "label": "Paper"}]},
    {"id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour of the shimmer the second timeline step sweeps across the words.", "default": "blue", "options": [{"value": "blue", "label": "Blue"}, {"value": "green", "label": "Green"}, {"value": "violet", "label": "Violet"}]}
  ]'
        >
          <span>Build</span>
          <span>motion</span>
          <span>systems</span>
          <span>fast</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var DEFAULT_TEXT = "Build motion systems fast";
          var tones = { ink: "#111827", paper: "#f8fafc" };
          var accents = { blue: "#38bdf8", green: "#34d399", violet: "#a78bfa" };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var words = String(vars.text == null ? DEFAULT_TEXT : vars.text)
            .split(/\s+/)
            .filter(function (word) {
              return word.length > 0;
            });
          if (words.length === 0) words = DEFAULT_TEXT.split(" ");

          // Number(null) is 0, so null has to miss the numeric branch and clamp back
          // to the declared default instead of snapping to the minimum.
          var size = typeof vars.size === "number" ? vars.size : parseFloat(vars.size);
          if (!isFinite(size)) size = 74;
          size = Math.min(160, Math.max(24, size));

          var tone = tones[pick(tones, vars.tone, "ink")];
          var accent = accents[pick(accents, vars.accent, "blue")];

          var roots = document.querySelectorAll(".hf-transition-text-stagger");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-stagger-size", size + "px");
            root.style.setProperty("--hf-stagger-ink", tone);
            root.style.setProperty("--hf-stagger-accent", accent);
            // Rebuilt without whitespace between the spans: whitespace-only text
            // between flex items is not rendered, so this matches the markup above.
            root.textContent = "";
            for (var w = 0; w < words.length; w += 1) {
              var span = document.createElement("span");
              span.textContent = words[w];
              root.appendChild(span);
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-text-stagger span",
          { opacity: 0, y: 48, filter: "blur(14px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.54,
            stagger: 0.09,
            ease: "power3.out",
          },
          0.35,
        );
        tl.to(
          ".hf-transition-text-stagger span",
          { backgroundPosition: "100% 0%", duration: 0.72, stagger: 0.04, ease: "power2.inOut" },
          1.05,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["text-stagger-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-text-stagger {
        display: flex;
        flex-wrap: wrap;
        gap: 0.24em;
        color: var(--hf-stagger-ink, #111827);
        font:
          900 74px/0.95 Inter,
          system-ui,
          sans-serif;
        font-size: var(--hf-stagger-size, 74px);
        letter-spacing: -0.045em;
      }
      .hf-transition-text-stagger span {
        display: inline-block;
        background: linear-gradient(
          90deg,
          var(--hf-stagger-ink, #111827),
          var(--hf-stagger-ink, #111827),
          var(--hf-stagger-accent, #38bdf8),
          var(--hf-stagger-ink, #111827)
        );
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        will-change: transform, opacity, filter, background-position;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
