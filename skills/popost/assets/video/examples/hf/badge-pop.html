<!doctype html>

  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; scaled into the canvas; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Badge Pop - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 56px;
        transform: scale(
          3
        ); /* ponytail: scale wrapper (hugs content — no min-width inflation), not GSAP targets */
        transform-origin: center;
      }
      .hf-transition-badge-pop {
        position: relative;
        display: inline-grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-badge-button {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border: 1px solid #e4e4e7;
        border-radius: 22px;
        background: #ffffff;
        color: #18181b;
        box-shadow: 0 20px 58px rgba(0, 0, 0, 0.12);
      }
      .hf-transition-badge-button svg {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hf-transition-badge-count {
        position: absolute;
        right: -8px;
        top: -8px;
        display: grid;
        place-items: center;
        min-width: 30px;
        height: 30px;
        padding: 0 8px;
        border: 3px solid #ffffff;
        border-radius: 999px;
        background: #ef4444;
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        transform-origin: center;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A transitions.dev-inspired notification badge pop with elastic scale and count reveal",
 "class": "logo",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "badge",
  "microinteraction"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "count",
   "type": "text",
   "default": "3",
   "maxLength": 4,
   "what": "Text shown inside the notification badge, up to four characters."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "red",
   "options": [
    "red",
    "blue",
    "green",
    "violet"
   ],
   "what": "Colour family of the badge."
  },
  {
   "name": "surface",
   "type": "choice",
   "default": "light",
   "options": [
    "light",
    "dark"
   ],
   "what": "Chrome of the button and the badge ring: light for bright frames, dark for dark ones."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.35,"cue":"tick","gain":0.3},{"at":0.73,"cue":"pop","gain":0.65}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="badge-pop-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-badge-pop"
          data-composition-variables='[
    { "id": "count", "type": "string", "role": "style", "label": "Count", "description": "Text shown inside the notification badge, up to four characters.", "default": "3", "maxLength": 4 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the badge.", "default": "red", "options": [{ "value": "red", "label": "Red" }, { "value": "blue", "label": "Blue" }, { "value": "green", "label": "Green" }, { "value": "violet", "label": "Violet" }] },
    { "id": "surface", "type": "enum", "role": "style", "label": "Surface", "description": "Chrome of the button and the badge ring: light for bright frames, dark for dark ones.", "default": "light", "options": [{ "value": "light", "label": "Light" }, { "value": "dark", "label": "Dark" }] }
  ]'
        >
          <button class="hf-transition-badge-button" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
              <path d="M10 20a2 2 0 004 0" />
            </svg>
          </button>
          <span class="hf-transition-badge-count">3</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          // The badge is the one accent-carrying element here. red is the literal
          // notification convention and stays; the decorative options ride the
          // composition's own tokens and fall back to ink.
          var accents = {
            red: "#ef4444",
            blue: "var(--accent, #18181b)",
            green: "var(--brand, #18181b)",
            violet: "var(--accent-2, #18181b)",
          };
          var surfaces = {
            light: { surface: "#ffffff", border: "#e4e4e7", ink: "#18181b" },
            dark: { surface: "#101014", border: "#2a2a32", ink: "#fafafa" },
          };

          var accent = accents[pick(accents, vars.accent, "red")];
          var surface = surfaces[pick(surfaces, vars.surface, "light")];
          var count =
            typeof vars.count === "string" && vars.count.trim()
              ? vars.count.trim().slice(0, 4)
              : "3";

          var roots = document.querySelectorAll(".hf-transition-badge-pop");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-badge-pop-accent", accent);
            root.style.setProperty("--hf-badge-pop-surface", surface.surface);
            root.style.setProperty("--hf-badge-pop-border", surface.border);
            root.style.setProperty("--hf-badge-pop-ink", surface.ink);
            var label = root.querySelector(".hf-transition-badge-count");
            if (label) {
              label.textContent = count;
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-badge-button",
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
          0.35,
        );
        tl.fromTo(
          ".hf-transition-badge-count",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.4)" },
          0.7,
        );
        tl.to(
          ".hf-transition-badge-count",
          { scale: 1.18, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" },
          1.15,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["badge-pop-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-badge-pop {
        --hf-badge-pop-accent: #ef4444;
        --hf-badge-pop-surface: #ffffff;
        --hf-badge-pop-border: #e4e4e7;
        --hf-badge-pop-ink: #18181b;
        position: relative;
        display: inline-grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-badge-button {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border: 1px solid var(--hf-badge-pop-border);
        border-radius: 22px;
        background: var(--hf-badge-pop-surface);
        color: var(--hf-badge-pop-ink);
        box-shadow: 0 20px 58px rgba(0, 0, 0, 0.12);
      }
      .hf-transition-badge-button svg {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hf-transition-badge-count {
        position: absolute;
        right: -8px;
        top: -8px;
        display: grid;
        place-items: center;
        min-width: 30px;
        height: 30px;
        padding: 0 8px;
        border: 3px solid var(--hf-badge-pop-surface);
        border-radius: 999px;
        background: var(--hf-badge-pop-accent);
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        transform-origin: center;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
