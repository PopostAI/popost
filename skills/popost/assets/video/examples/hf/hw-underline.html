<!doctype html>
<!--

  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; pictures replaced by slots and drawn stand-ins; scaled into the canvas; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.
-->

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: linear-gradient(135deg, #3d5a80, #98c1d9) format("woff2");
        font-weight: 700;
        font-display: block;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #17161a;
        overflow: hidden;
      }
      /* ---- hw-underline ------------------------------------------------
         Squiggle underline / strikethrough / bracket marks that draw on.
         Size the wrapper over the text they annotate. Requires the hw-boil
         helpers in the host. */
      .hw-mark {
        position: absolute;
        pointer-events: none;
      }
      .hw-mark svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .hw-mark path {
        fill: none;
        stroke: var(--hw-mark-color, var(--hw-accent-warm, #ffb020));
        stroke-width: var(--hw-mark-w, 7);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* self-preview scene */
      #hw-un-scene {
        position: absolute;
        inset: 0;
        background: #17161a;
        font-family: var(--hw-font-print, "Caveat", cursive);
        font-weight: 700;
        font-size: 84px;
        color: #f4f2ec;
      }
      #hw-un-scene div {
        position: absolute;
        left: 480px;
        white-space: nowrap;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Hand-drawn squiggle underline, double-pass strikethrough, and bracket marks that draw on",
 "class": "overlay",
 "tags": [
  "handwritten",
  "annotation",
  "text-treatment"
 ],
 "placeholders": "1 CSS picture as a gradient",
 "seconds": 3.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.4,"cue":"draw","gain":0.45},{"at":1,"cue":"draw","gain":0.45},{"at":1.6,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    
    <div
      id="hw-un-root"
      data-composition-id="hw-underline"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="hw-un-scene">
        <div style="top: 260px">underline the point</div>
        <div style="top: 460px">cross this out</div>
        <div style="top: 660px">bracket the aside</div>
      </div>
      <div
        class="hw-mark"
        id="hw-un-m1"
        style="left: 470px; top: 350px; width: 620px; height: 34px"
      >
        <svg viewBox="0 0 620 34"><path></path></svg>
      </div>
      <div
        class="hw-mark"
        id="hw-un-m2"
        style="left: 470px; top: 500px; width: 480px; height: 34px"
      >
        <svg viewBox="0 0 480 34"><path></path></svg>
      </div>
      <div
        class="hw-mark"
        id="hw-un-m3"
        style="left: 440px; top: 650px; width: 40px; height: 110px"
      >
        <svg viewBox="0 0 40 110"><path></path></svg>
      </div>
      <div
        id="hw-un-drv"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- hw-boil helpers (shared family runtime — copy once per host) ---- */
        window.hwOnUpdate = function (tl, fn) {
          if (!tl.__hwRenders) {
            tl.__hwRenders = [];
            tl.eventCallback("onUpdate", function () {
              for (var i = 0; i < tl.__hwRenders.length; i++) tl.__hwRenders[i]();
            });
          }
          tl.__hwRenders.push(fn);
          fn();
        };
        window.hwHash = function (n, seed) {
          var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        };
        window.hwBoil = function (tl, target, opts) {
          opts = opts || {};
          var amp = opts.amp !== undefined ? opts.amp : 1.6;
          var rot = opts.rot !== undefined ? opts.rot : 0.5;
          var fps = opts.fps || 30;
          var drop = opts.frameDrop || 3;
          var seed = opts.seed || 1;
          var els = gsap.utils.toArray(target);
          window.hwOnUpdate(tl, function () {
            var step = Math.floor((tl.time() * fps) / drop);
            for (var i = 0; i < els.length; i++) {
              gsap.set(els[i], {
                x: window.hwHash(step * 3 + i * 97, seed) * amp,
                y: window.hwHash(step * 3 + 1 + i * 97, seed) * amp,
                rotation: (opts.baseRot || 0) + window.hwHash(step * 3 + 2 + i * 97, seed) * rot,
              });
            }
          });
        };

        // ---- hw-mark helpers (copy these too) ----
        // style: "underline" (squiggle) | "strike" (double pass) | "bracket"
        window.hwMarkPath = function (w, h, style, seed) {
          seed = seed || 1;
          function wob(n, range) {
            return window.hwHash(n, seed) * (range === undefined ? 5 : range);
          }
          var mid = h / 2;
          if (style === "bracket") {
            return (
              "M " +
              (w * 0.9 + wob(1, 3)) +
              " " +
              (2 + wob(2, 3)) +
              " Q " +
              wob(3, 4) +
              " " +
              (2 + wob(4)) +
              " " +
              (4 + wob(5, 3)) +
              " " +
              (h * 0.5 + wob(6)) +
              " Q " +
              wob(7, 4) +
              " " +
              (h - 2 + wob(8)) +
              " " +
              (w * 0.9 + wob(9, 3)) +
              " " +
              (h - 2 + wob(10, 3))
            );
          }
          if (style === "strike") {
            return (
              "M " +
              (2 + wob(1, 3)) +
              " " +
              (mid + wob(2)) +
              " L " +
              (w - 4 + wob(3, 3)) +
              " " +
              (mid - 3 + wob(4)) +
              " M " +
              (w - 10 + wob(5, 4)) +
              " " +
              (mid + 7 + wob(6)) +
              " L " +
              (8 + wob(7, 4)) +
              " " +
              (mid + 3 + wob(8))
            );
          }
          /* underline squiggle */
          var segs = Math.max(5, Math.round(w / 95));
          var d = "M 2 " + (mid + wob(0, 4));
          for (var i = 1; i <= segs; i++) {
            var x = (w / segs) * i;
            d +=
              " Q " +
              (x - w / segs / 2 + wob(i * 4 + 1, 9)) +
              " " +
              (mid + (i % 2 ? -1 : 1) * (9 + wob(i * 4 + 2, 4))) +
              " " +
              x.toFixed(1) +
              " " +
              (mid + wob(i * 4 + 3, 4));
          }
          return d;
        };
        window.hwMarkOn = function (tl, target, at, dur) {
          var p = document.querySelector(target + " path");
          var len = p.getTotalLength();
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(
            p,
            { strokeDashoffset: 0, duration: dur === undefined ? 0.55 : dur, ease: "power2.inOut" },
            at,
          );
        };
        window.hwMarkOff = function (tl, target, at) {
          tl.to(target, { opacity: 0, duration: 0.3, ease: "power2.in" }, at);
        };

        // ---- self-preview ----
        document
          .querySelector("#hw-un-m1 path")
          .setAttribute("d", window.hwMarkPath(620, 34, "underline", 4));
        document
          .querySelector("#hw-un-m2 path")
          .setAttribute("d", window.hwMarkPath(480, 34, "strike", 6));
        document
          .querySelector("#hw-un-m3 path")
          .setAttribute("d", window.hwMarkPath(40, 110, "bracket", 8));
        var tl = gsap.timeline({ paused: true });
        window.hwMarkOn(tl, "#hw-un-m1", 0.4);
        window.hwMarkOn(tl, "#hw-un-m2", 1.0);
        window.hwMarkOn(tl, "#hw-un-m3", 1.6);
        window.hwBoil(tl, [".hw-mark"], { amp: 1.5, rot: 0.4, frameDrop: 3, seed: 5 });
        tl.to([".hw-mark"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);
        tl.set("#hw-un-root", { visibility: "hidden" }, 3.98);
        window.__timelines["hw-underline"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
