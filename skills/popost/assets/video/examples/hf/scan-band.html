<html data-composition-variables='[
    { "id": "wordmark", "type": "string", "role": "content", "label": "Wordmark", "description": "Text displayed by the scan effect.", "default": "HYPERFRAMES" },
    { "id": "band_angle", "type": "number", "role": "layout", "label": "Band angle", "description": "Diagonal angle of the distortion band in degrees.", "default": 12, "min": -30, "max": 30, "step": 1, "unit": "deg" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Scan Band Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f7f8fa;
        --font-display: Inter, system-ui, sans-serif;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 48%, #1a1d22 0%, #0b0c0e 68%);
      }

      .mount-card {
        width: 76%;
        height: 56%;
        left: 12%;
        top: 22%;
        container-type: size;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 32px;
        background: #101216;
        box-shadow: 0 5cqh 14cqh rgba(0, 0, 0, 0.48);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A diagonal distortion band sweeps once across a clean wordmark, revealing clipped red and cyan offsets only inside the moving band.",
 "class": "overlay",
 "tags": [
  "motion-primitive",
  "typography",
  "scan",
  "chromatic",
  "distortion",
  "wordmark"
 ],
 "seconds": 3.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "wordmark",
   "type": "text",
   "default": "HYPERFRAMES",
   "maxLength": 200,
   "what": "Text displayed by the scan effect."
  },
  {
   "name": "band_angle",
   "type": "number",
   "default": 12,
   "min": -30,
   "max": 30,
   "unit": "deg",
   "what": "Diagonal angle of the distortion band in degrees."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"wordmark":"SCAN MODE","band_angle":-18};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="scan-band-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="scan-band-mount"
        class="mount-card clip"
        data-composition-id="scan-band"
       
        data-variable-values='{"wordmark":"SCAN MODE","band_angle":-18}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1459"
        data-height="605"
      >
      <div id="root" data-composition-id="scan-band" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0b0c0e);
            color: var(--fg, #f7f8fa);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .sb-clip,
          .sb-stage,
          .sb-band,
          .sb-clone {
            position: absolute;
            inset: 0;
          }

          .sb-clip,
          .sb-stage,
          .sb-clone {
            display: grid;
            place-items: center;
          }

          .sb-stage {
            opacity: 0;
          }

          .sb-wordmark,
          .sb-clone {
            font-size: clamp(28px, 13cqw, 150px);
            font-weight: 850;
            line-height: 0.86;
            letter-spacing: -0.065em;
            white-space: nowrap;
          }

          .sb-wordmark {
            color: var(--fg, #f7f8fa);
            text-shadow: 0 1.2cqh 4cqh color-mix(in srgb, #000 45%, transparent);
          }

          .sb-band {
            --sb-band-position: -60%;
            --sb-half: 6%;
            --sb-lean: 10.6%;
            overflow: hidden;
            clip-path: polygon(
              calc(var(--sb-band-position) - var(--sb-half) - var(--sb-lean)) 0%,
              calc(var(--sb-band-position) + var(--sb-half) - var(--sb-lean)) 0%,
              calc(var(--sb-band-position) + var(--sb-half) + var(--sb-lean)) 100%,
              calc(var(--sb-band-position) - var(--sb-half) + var(--sb-lean)) 100%
            );
            will-change: clip-path;
          }

          .sb-clone {
            text-shadow: none;
          }

          .sb-clone-red {
            color: #ff3158;
            opacity: 0.9;
            transform: translateX(-0.8cqw);
          }

          .sb-clone-cyan {
            color: #36efff;
            opacity: 0.9;
            transform: translateX(1.7cqw);
          }

          .sb-clone-core {
            color: var(--fg, #f7f8fa);
            transform: translateX(0.65cqw);
          }
        </style>

        <div
          id="scan-band-clip"
          class="sb-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="sb-stage" role="img">
            <span class="sb-wordmark"></span>
            <div class="sb-band" aria-hidden="true">
              <span class="sb-clone sb-clone-red"></span>
              <span class="sb-clone sb-clone-cyan"></span>
              <span class="sb-clone sb-clone-core"></span>
            </div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".sb-stage");
            var wordmark = root.querySelector(".sb-wordmark");
            var band = root.querySelector(".sb-band");
            var clones = root.querySelectorAll(".sb-clone");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.wordmark == null ? "HYPERFRAMES" : String(vars.wordmark);
            var angleValue = vars.band_angle;
            var bandAngle = Number.isFinite(angleValue)
              ? Math.max(-30, Math.min(30, angleValue))
              : 12;

            wordmark.textContent = text;
            stage.setAttribute("aria-label", text);
            clones.forEach(function (clone) {
              clone.textContent = text;
            });

            var lean = Math.tan((bandAngle * Math.PI) / 180) * 50;
            band.style.setProperty("--sb-lean", lean.toFixed(3) + "%");

            var IN_BASE = 0.45;
            var OUT_BASE = 0.45;
            var SWEEP_BASE = 1.65;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var fixedTotal = IN_BASE + OUT_BASE;
            var phaseScale = duration < fixedTotal ? duration / fixedTotal : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;
            var SWEEP = Math.min(SWEEP_BASE, HOLD);

            gsap.set(stage, { opacity: 0 });
            gsap.set(band, { "--sb-band-position": "-60%" });

            var tl = gsap.timeline({ paused: true });
            tl.to(stage, { opacity: 1, duration: IN, ease: "power2.out" }, 0);

            if (SWEEP > 0) {
              tl.fromTo(
                band,
                { "--sb-band-position": "-60%" },
                {
                  "--sb-band-position": "160%",
                  duration: SWEEP,
                  ease: "power2.out",
                },
                IN,
              );
            }

            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["scan-band"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["scan-band-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
