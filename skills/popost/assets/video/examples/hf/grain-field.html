<html data-composition-variables='[
    { "id": "density", "type": "enum", "role": "style", "label": "Density", "description": "Dot size and spacing across the grain field.", "default": "fine", "options": [{ "value": "fine", "label": "Fine" }, { "value": "coarse", "label": "Coarse" }] },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Accent token family used to color the dots and luminance wash.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] }
  ]' lang="en" data-composition-id="grain-field-demo" data-composition-duration="4">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Grain Field Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --surface: #17191f;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #a78bfa;
        --brand: #34d399;
        --border: #334155;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #17191f 0%, #0b0c0e 72%);
      }

      .mount-card {
        width: 75%;
        height: 70%;
        left: 12.5%;
        top: 15%;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 0.16);
        border-radius: 28px;
        background: #080a10;
        box-shadow: 0 5cqh 14cqh rgb(0 0 0 / 0.52);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A clearly visible accent-tinted dot field drifts over a subtle luminance gradient in an exact ambient loop.",
 "class": "background",
 "tags": [
  "motion-primitive",
  "background",
  "grain",
  "dots",
  "texture",
  "ambient",
  "loopable"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "density",
   "type": "choice",
   "default": "fine",
   "options": [
    "fine",
    "coarse"
   ],
   "what": "Dot size and spacing across the grain field."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Accent token family used to color the dots and luminance wash."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"density":"coarse","accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="grain-field-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="grain-field-mount"
        class="mount-card clip"
        data-composition-id="grain-field"
       
        data-variable-values='{"density":"coarse","accent":"violet"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1440"
        data-height="756"
      >
      <div id="root" data-composition-id="grain-field" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            pointer-events: none;
          }

          .gf-clip,
          .gf-base,
          .gf-field {
            position: absolute;
          }

          .gf-clip,
          .gf-base {
            inset: 0;
          }

          .gf-clip {
            overflow: hidden;
          }

          .gf-base {
            background:
              radial-gradient(
                ellipse at 28% 20%,
                color-mix(in srgb, var(--gf-color) 18%, transparent) 0%,
                transparent 56%
              ),
              linear-gradient(
                145deg,
                color-mix(in srgb, var(--gf-base) 90%, var(--gf-color)) 0%,
                var(--gf-base) 72%
              );
          }

          .gf-field {
            inset: -8cqw;
            background-image: radial-gradient(
              circle,
              color-mix(in srgb, var(--gf-color) 70%, white) 0 var(--gf-dot),
              transparent calc(var(--gf-dot) + 0.12cqmin)
            );
            background-position: 0 0;
            background-size: var(--gf-cell) var(--gf-cell);
            opacity: 0.82;
            will-change: transform;
          }
        </style>

        <div
          id="grain-field-clip"
          class="gf-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="gf-base"></div>
          <div class="gf-field"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var field = root.querySelector(".gf-field");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // Invalid enum overrides return to their declared defaults.
            var accentTokens = {
              green: "var(--brand, #34d399)",
              blue: "var(--accent, #38bdf8)",
              violet: "var(--accent-2, #a78bfa)",
            };
            var densityStyles = {
              fine: { cell: "3.2cqmin", dot: "0.48cqmin" },
              coarse: { cell: "5.8cqmin", dot: "0.86cqmin" },
            };
            var accent = Object.prototype.hasOwnProperty.call(accentTokens, vars.accent)
              ? vars.accent
              : "green";
            var density = vars.density === "coarse" ? "coarse" : "fine";

            root.style.setProperty("--gf-color", accentTokens[accent]);
            root.style.setProperty("--gf-base", "var(--bg, #080a10)");
            root.style.setProperty("--gf-cell", densityStyles[density].cell);
            root.style.setProperty("--gf-dot", densityStyles[density].dot);

            var TAU = Math.PI * 2;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var state = { phase: 0 };

            function renderPose() {
              var phase = state.phase === TAU ? 0 : state.phase;
              var drift = Math.sin(phase);
              gsap.set(field, { x: drift * 2.8 + "cqw", y: drift * 2.2 + "cqh" });
            }

            var tl = gsap.timeline({ paused: true });

            // HOLD: uniform phase travel becomes a smooth sine drift. One full
            // cycle restores the exact starting pose at the duration boundary.
            tl.to(state, { phase: TAU, duration: duration, ease: "none", onUpdate: renderPose }, 0);

            renderPose();
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["grain-field"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["grain-field-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
