<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Label", "description": "Text displayed on the card.", "default": "Pro" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Color treatment for the card.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "sweep_angle", "type": "number", "role": "style", "label": "Sweep angle", "description": "Angle of the specular gloss in degrees.", "default": 25, "min": -60, "max": 60, "step": 1, "unit": "deg" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Gloss Sweep Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --font-display: Inter, system-ui, sans-serif;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      .mount-card {
        width: 46%;
        height: 38%;
        left: 27%;
        top: 31%;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A card lands with a restrained slam, catches one diagonal specular gloss, and holds perfectly still.",
 "class": "logo",
 "tags": [
  "motion-primitive",
  "celebration",
  "gloss",
  "card",
  "badge",
  "payoff"
 ],
 "seconds": 1.35,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Pro",
   "maxLength": 200,
   "what": "Text displayed on the card."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Color treatment for the card."
  },
  {
   "name": "sweep_angle",
   "type": "number",
   "default": 25,
   "min": -60,
   "max": 60,
   "unit": "deg",
   "what": "Angle of the specular gloss in degrees."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"Studio","accent":"violet","sweep_angle":38};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"shimmer","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="gloss-sweep-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="2.5"
      data-fps="30"
    >
      <div
        id="gloss-sweep-mount"
        class="mount-card clip"
        data-composition-id="gloss-sweep"
       
        data-variable-values='{"text":"Studio","accent":"violet","sweep_angle":38}'
        data-start="0"
        data-duration="2.5"
        data-track-index="0"
        data-width="883"
        data-height="410"
      >
      <div id="root" data-composition-id="gloss-sweep" data-duration="2.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .gs-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .gs-card {
            position: relative;
            display: grid;
            min-width: 48cqw;
            max-width: 78cqw;
            min-height: 34cqh;
            padding: 7cqh 9cqw;
            place-items: center;
            overflow: hidden;
            border: 0.22cqmin solid var(--gs-edge);
            border-radius: 5cqmin;
            background: linear-gradient(145deg, var(--gs-surface-bright), var(--gs-surface));
            box-shadow:
              0 3cqh 8cqh color-mix(in srgb, var(--bg, #05070d) 62%, transparent),
              inset 0 0 0 0.12cqmin color-mix(in srgb, white 12%, transparent);
            transform-origin: 50% 50%;
            will-change: transform;
          }

          .gs-label {
            position: relative;
            z-index: 1;
            max-width: 62cqw;
            overflow: hidden;
            color: var(--gs-label);
            font-size: clamp(8cqmin, 15cqmin, 18cqmin);
            font-weight: 780;
            line-height: 1;
            letter-spacing: -0.04em;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .gs-gloss {
            --gs-sweep: -30;
            --gs-angle: 25deg;
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0;
            background: linear-gradient(
              var(--gs-angle),
              transparent calc(var(--gs-sweep) * 1% - 22%),
              rgba(255, 255, 255, 0.06) calc(var(--gs-sweep) * 1% - 9%),
              rgba(255, 255, 255, 0.72) calc(var(--gs-sweep) * 1%),
              rgba(255, 255, 255, 0.08) calc(var(--gs-sweep) * 1% + 9%),
              transparent calc(var(--gs-sweep) * 1% + 22%)
            );
            pointer-events: none;
          }
        </style>

        <div
          id="gloss-sweep-clip"
          class="gs-clip clip"
          data-start="0"
          data-duration="2.5"
          data-track-index="0"
        >
          <div class="gs-card">
            <span class="gs-label"></span>
            <span class="gs-gloss" aria-hidden="true"></span>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var card = root.querySelector(".gs-card");
            var label = root.querySelector(".gs-label");
            var gloss = root.querySelector(".gs-gloss");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var accents = {
              green: {
                surface: "#123b2c",
                surfaceBright: "#1a513c",
                edge: "#39d98a",
                label: "#ecfff5",
              },
              blue: {
                surface: "#123554",
                surfaceBright: "#19486f",
                edge: "#4db5ff",
                label: "#eef8ff",
              },
              violet: {
                surface: "#31205b",
                surfaceBright: "#463078",
                edge: "#a98cff",
                label: "#f7f2ff",
              },
            };
            var accent = accents[vars.accent] ? vars.accent : "green";
            var palette = accents[accent];
            var text = vars.text == null ? "Pro" : String(vars.text);
            var angleValue = Number(vars.sweep_angle);
            var sweepAngle = Number.isFinite(angleValue)
              ? Math.max(-60, Math.min(60, angleValue))
              : 25;

            label.textContent = text;
            card.style.setProperty("--gs-surface", palette.surface);
            card.style.setProperty("--gs-surface-bright", palette.surfaceBright);
            card.style.setProperty("--gs-edge", palette.edge);
            card.style.setProperty("--gs-label", palette.label);
            gloss.style.setProperty("--gs-angle", sweepAngle + "deg");

            var IN_BASE = 1.35;
            var LAND_BASE = 0.5;
            var SWEEP_AT_BASE = 0.65;
            var SWEEP_BASE = 0.7;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "2.5"));
            var scale = duration < IN_BASE ? duration / IN_BASE : 1;
            var LAND = LAND_BASE * scale;
            var SWEEP_AT = SWEEP_AT_BASE * scale;
            var SWEEP = SWEEP_BASE * scale;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              card,
              { y: "-5cqh", scale: 1.06 },
              { y: "0cqh", scale: 1, duration: LAND, ease: "expo.out" },
              0,
            );
            tl.set(gloss, { opacity: 1, "--gs-sweep": -30 }, SWEEP_AT);
            tl.to(gloss, { "--gs-sweep": 130, duration: SWEEP, ease: "power2.out" }, SWEEP_AT);
            tl.set(gloss, { opacity: 0 }, SWEEP_AT + SWEEP);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["gloss-sweep"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["gloss-sweep-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
