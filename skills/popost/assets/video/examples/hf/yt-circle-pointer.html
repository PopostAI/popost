<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #14161c;
        overflow: hidden;
      }
      /* ---- yt-circle-pointer -----------------------------------------------
         Annotation tools: a hand-drawn-feel circle that draws on around a
         target, and a countdown chip. Position instances via top/left with
         explicit width/height. */
      .yt-circle {
        --yt-red: #e62e2e;
        position: absolute;
        pointer-events: none;
      }
      .yt-circle svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .yt-circle ellipse {
        fill: none;
        stroke: var(--yt-ptr-color, var(--yt-red));
        stroke-width: 6;
        stroke-linecap: round;
        transform: rotate(-6deg);
        transform-origin: 50% 50%;
      }
      .yt-count {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 16px 32px;
        border-radius: 999px;
        font-family: "Inter", ui-sans-serif, sans-serif;
        font-weight: 700;
        font-size: 40px;
        background: var(--yt-count-bg, var(--yt-red));
        color: #ffffff;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        pointer-events: none;
        opacity: 0;
      }
      .yt-count .num {
        font-variant-numeric: tabular-nums;
        min-width: 1.2em;
        text-align: center;
      }
      /* self-preview scene */
      #yt-ptr-scene {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #35c8d9 0%, #2a7fff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", ui-sans-serif, sans-serif;
        font-weight: 700;
        font-size: 60px;
        color: rgba(255, 255, 255, 0.92);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Draw-on annotation ellipse around a target plus a countdown chip that pulses each tick",
 "class": "cursor",
 "tags": [
  "annotation",
  "countdown",
  "overlay"
 ],
 "seconds": 4.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    
    <div
      id="yt-ptr-root"
      data-composition-id="yt-circle-pointer"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="yt-ptr-scene"><span>the thing</span></div>
      <div
        class="yt-circle"
        id="yt-ptr-circle"
        style="left: 760px; top: 440px; width: 420px; height: 210px"
      >
        <svg viewBox="0 0 420 210"><ellipse cx="210" cy="105" rx="196" ry="88"></ellipse></svg>
      </div>
      <div class="yt-count" id="yt-ptr-count" style="right: 140px; top: 110px">
        <span class="num">5</span><span>sec</span>
      </div>
      <div
        id="yt-ptr-drv"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        // ---- copy these helpers into the host script ----
        window.ytCircleOn = function (tl, target, at, dur) {
          var el = document.querySelector(target + " ellipse");
          var len = el.getTotalLength();
          gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(
            el,
            { strokeDashoffset: 0, duration: dur === undefined ? 0.7 : dur, ease: "power2.inOut" },
            at,
          );
        };
        window.ytCircleOff = function (tl, target, at) {
          tl.to(target, { opacity: 0, duration: 0.35, ease: "power2.in" }, at);
        };
        window.ytCountIn = function (tl, target, at) {
          gsap.set(target, { y: -18, scale: 0.9 });
          tl.to(target, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, at);
        };
        window.ytCountdown = function (tl, target, at, from) {
          var num = document.querySelector(target + " .num");
          var st = { v: from };
          tl.to(
            st,
            {
              v: 0,
              duration: from,
              ease: "none",
              onUpdate: function () {
                num.textContent = String(Math.ceil(st.v));
              },
            },
            at,
          );
          for (var i = 1; i <= from; i++) {
            tl.to(target, { scale: 1.07, duration: 0.09, ease: "sine.out" }, at + i - 0.09);
            tl.to(target, { scale: 1, duration: 0.14, ease: "sine.in" }, at + i);
          }
        };

        // Self-preview timeline.
        var tl = gsap.timeline({ paused: true });
        window.ytCountIn(tl, "#yt-ptr-count", 0.3);
        window.ytCountdown(tl, "#yt-ptr-count", 0.7, 3);
        window.ytCircleOn(tl, "#yt-ptr-circle", 1.0);
        window.ytCircleOff(tl, "#yt-ptr-circle", 4.2);
        tl.to("#yt-ptr-count", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.3);
        tl.set("#yt-ptr-root", { visibility: "hidden" }, 4.98);
        window.__timelines["yt-circle-pointer"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
