<!doctype html>

  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; scaled into the canvas; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #yt-cc-root {
        /* ---- yt tokens: override in the host to re-skin the family ---- */
        --yt-font: "Inter", -apple-system, sans-serif;
        --yt-ink: #1d1d1f;
        --yt-ink-dim: #5a5a5f;
        /* overlay-scheme text over footage — distinct from the --yt-ink board tokens */
        --yt-text: #ffffff;
        --yt-text-dim: rgba(255, 255, 255, 0.72);
        --yt-red: #e62e2e;
        --yt-cyan: #35c8d9;
        --yt-scanline-alpha: 0.04;
        --yt-scanline-gap: 3px;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent; /* overlays footage or a yt-lcd board */
        font-family: var(--yt-font);
      }
      /* optional full-frame LCD pass while comments are up */
      #yt-cc-scan {
        position: absolute;
        inset: 0;
        display: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, var(--yt-scanline-alpha)) 0 1px,
          transparent 1px var(--yt-scanline-gap)
        );
      }
      #yt-cc-col {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .yt-cc-card {
        display: flex;
        gap: 22px;
        align-items: flex-start;
      }
      .yt-cc-avatar {
        flex: none;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 26px;
        color: #ffffff;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      .yt-cc-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .yt-cc-meta {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .yt-cc-user {
        font-weight: 700;
        font-size: 27px;
      }
      .yt-cc-time {
        font-weight: 400;
        font-size: 23px;
      }
      .yt-cc-text {
        margin-top: 8px;
        font-weight: 500;
        font-size: 34px;
        line-height: 1.35;
        letter-spacing: -0.01em;
        max-width: 860px;
      }
      .yt-cc-text .ch {
        opacity: 0;
      }
      .yt-cc-row {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 22px;
        opacity: 0;
      }
      .yt-cc-row svg {
        width: 24px;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .yt-cc-reply {
        margin-left: 18px;
        letter-spacing: 0.1em;
      }
      /* scheme: overlay (white over footage, w/ shadow) vs light (ink on boards) */
      .yt-overlay .yt-cc-user,
      .yt-overlay .yt-cc-text {
        color: var(--yt-text);
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      }
      .yt-overlay .yt-cc-time,
      .yt-overlay .yt-cc-row {
        color: var(--yt-text-dim);
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      }
      .yt-overlay .yt-cc-row svg {
        stroke: var(--yt-text-dim);
      }
      .yt-light .yt-cc-user,
      .yt-light .yt-cc-text {
        color: var(--yt-ink);
      }
      .yt-light .yt-cc-time,
      .yt-light .yt-cc-row {
        color: var(--yt-ink-dim);
      }
      .yt-light .yt-cc-row svg {
        stroke: var(--yt-ink-dim);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Social comments typing on over footage: avatar pop, username and time, per-character typewriter, likes row; image avatars or initials chips",
 "class": "ui",
 "tags": [
  "social",
  "comments",
  "creator",
  "overlay"
 ],
 "seconds": 7.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="yt-cc-root"
      data-composition-id="yt-comment-card"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="yt-cc-scan"></div>
      <div id="yt-cc-col"></div>
      <div
        id="yt-cc-drv"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ----
           Social comments typing on over footage — creator-style
           comment cards. avatar: image path, or null -> initials chip. */
        var CONFIG = {
          scheme: "overlay", // "overlay" (white over footage) | "light" (ink on boards)
          comments: [
            {
              avatar: null,
              initials: "PW",
              avatarHue: 210, // initials-chip hue when no image
              username: "@pixelwaves",
              time: "2 days ago",
              text: "Your videos are the best!",
              likes: 47,
            },
            {
              avatar: null,
              initials: "FR",
              avatarHue: 340,
              username: "@framerate",
              time: "1 day ago",
              text: "That camera move at 0:12 though 🔥",
              likes: 12,
            },
          ],
          x: 140,
          y: null, // null = vertically centered
          typeCharDelay: 0.024, // s per character (capped so a comment types <= 2.2s)
          scanlines: false, // full-frame LCD pass while comments are up
          animationIn: true,
          animationOut: true,
        };

        var DUR = 8;
        function clamp(v, lo, hi) {
          return Math.min(hi, Math.max(lo, v));
        }
        var OUT = clamp(DUR * 0.06, 0.25, 0.6);

        var root = document.getElementById("yt-cc-root");
        var col = document.getElementById("yt-cc-col");
        root.classList.add(CONFIG.scheme === "light" ? "yt-light" : "yt-overlay");
        if (CONFIG.scanlines) document.getElementById("yt-cc-scan").style.display = "block";

        var THUMB =
          '<svg viewBox="0 0 24 24"><path d="M7 11v9M7 11l3.2-6.4a2 2 0 0 1 3.6 1.2V9h4.6a2 2 0 0 1 2 2.4l-1.2 6a2 2 0 0 1-2 1.6H7M7 11H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h3"/></svg>';

        /* build cards */
        CONFIG.comments.forEach(function (c, i) {
          var card = document.createElement("div");
          card.className = "yt-cc-card";
          card.id = "yt-cc-card-" + i;

          var av = document.createElement("div");
          av.className = "yt-cc-avatar";
          av.id = "yt-cc-av-" + i;
          if (c.avatar) {
            var img = document.createElement("img");
            img.src = c.avatar;
            av.appendChild(img);
          } else {
            av.textContent = c.initials || "?";
            av.style.background =
              "linear-gradient(135deg, hsl(" +
              (c.avatarHue || 210) +
              ", 62%, 52%), hsl(" +
              ((c.avatarHue || 210) + 40) +
              ", 62%, 42%))";
          }
          card.appendChild(av);

          var body = document.createElement("div");
          var meta = document.createElement("div");
          meta.className = "yt-cc-meta";
          meta.id = "yt-cc-meta-" + i;
          var user = document.createElement("span");
          user.className = "yt-cc-user";
          user.textContent = c.username;
          var time = document.createElement("span");
          time.className = "yt-cc-time";
          time.textContent = c.time || "";
          meta.appendChild(user);
          meta.appendChild(time);
          body.appendChild(meta);

          var text = document.createElement("div");
          text.className = "yt-cc-text";
          text.id = "yt-cc-text-" + i;
          Array.from(c.text).forEach(function (ch) {
            var span = document.createElement("span");
            span.className = "ch";
            span.textContent = ch;
            text.appendChild(span);
          });
          body.appendChild(text);

          var row = document.createElement("div");
          row.className = "yt-cc-row";
          row.id = "yt-cc-row-" + i;
          row.innerHTML =
            THUMB + "<span>" + (c.likes || 0) + '</span><span class="yt-cc-reply">REPLY</span>';
          body.appendChild(row);
          card.appendChild(body);
          col.appendChild(card);
        });

        /* position (measure after building) */
        col.style.left = CONFIG.x + "px";
        var rect = col.getBoundingClientRect();
        col.style.top =
          (CONFIG.y === null ? Math.round((1080 - rect.height) / 2) : CONFIG.y) + "px";

        var tl = gsap.timeline({ paused: true });

        /* comments enter sequentially: avatar pops, meta fades, text types, row fades */
        var t = CONFIG.animationIn ? 0.3 : 0;
        CONFIG.comments.forEach(function (c, i) {
          var av = "#yt-cc-av-" + i,
            meta = "#yt-cc-meta-" + i,
            row = "#yt-cc-row-" + i;
          var chars = document.querySelectorAll("#yt-cc-text-" + i + " .ch");
          var delay = Math.min(CONFIG.typeCharDelay, 2.2 / Math.max(1, chars.length));

          gsap.set(av, { opacity: 0, scale: 0.5 });
          gsap.set(meta, { opacity: 0, y: 10 });
          tl.to(av, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t);
          tl.to(meta, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.12);
          t += 0.4;
          tl.to(chars, { opacity: 1, duration: 0.02, stagger: delay, ease: "none" }, t);
          t += chars.length * delay + 0.15;
          tl.to(row, { opacity: 1, duration: 0.35, ease: "power2.out" }, t);
          t += 0.5;
        });

        /* exit + hard kill (auto-scaled out) */
        if (CONFIG.animationOut) {
          tl.to(col, { opacity: 0, y: -18, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["yt-comment-card"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
