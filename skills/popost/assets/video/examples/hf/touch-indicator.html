        font-size: 22px;
        letter-spacing: -0.02em;

        align-items: center;
        gap: 10px;
        padding: 0 14px;
        font-size: 13px;
        line-height: 16px;
      }

        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        flex: none;
      }
      .post__user {
        font-weight: 600;
      }
      .post__place {
        color: var(--muted, #8b8f9a);
        font-size: 12px;
      }
      .post__more {
        margin-left: auto;
        color: var(--fg, #f5f6f8);
        font-size: 16px;
        letter-spacing: 1px;
      }

      .post__photo {
        display: block;
        width: 380px;
        height: 380px;
      }

      .post__actions {
        height: 46px;
        display: flex;
        align-items: center;
        padding: 0 8px 0 16px;
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .icon {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .like-btn {
        position: relative;
        width: 44px;
        height: 44px;
        margin-left: -9px;
        border: 0;
        padding: 0;
        display: grid;
        place-items: center;
        background: none;
        color: var(--fg, #f5f6f8);
      }
      .like-btn .icon {
        grid-area: 1 / 1;
      }
      .like-btn__filled {
        fill: #ff3b5c;
        stroke: #ff3b5c;
        opacity: 0;
      }
      .post__stat {
        margin: 0 18px 0 2px;
      }
      .post__save {
        margin-left: auto;
        margin-right: 8px;
      }

      .post__caption {
        padding: 2px 16px 0;
        font-size: 14px;
        line-height: 19px;
        text-wrap: pretty;
      }
      .post__meta {
        margin-top: 4px;
        color: var(--muted, #8b8f9a);
        font-size: 13px;
      }

      .post--next {
        margin-top: 14px;
      }

      .phone__tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding-bottom: 6px;
        background: var(--bg, #0b0c10);
        border-top: 1px solid var(--border, #262931);
      }
      .phone__tabs .avatar {
        width: 26px;
        height: 26px;
        font-size: 10px;
      }

      /*
        Mount slot: fills the whole phone screen, so touch-indicator.html's
        18cqw disc resolves against the 380px screen (68px), not the frame.
      */
      .touch-indicator-mount {
        position: absolute;
        inset: 0;
      }

              {
                x: x0,
                y: y0,
                xPercent: -50,
                yPercent: -50,
                autoAlpha: 1,
                duration: appear,
                ease: "power2.out",
                immediateRender: false,
              },
              at,
            );
            tl.fromTo(
              core,
              { scale: 0.9 },
              { scale: 1, duration: appear, ease: "power2.out", immediateRender: false },
              at,
            );
            const touchDown = at + appear;

            // --- HOLD: the only elastic phase. Stretch it, never gsap.timeScale(). ---
            let holdEnd;
            if (vars.gesture === "swipe") {
              // a swipe lasts 0.28s to 0.52s; elasticity scales its pacing.
              const swipeDuration = q(clamp(0.34 * elasticity, 0.28, 0.52));
              const travel = hostH * 0.4; // vertical scroll, 40% of host height (32-68% allowed)
              const accel = q(swipeDuration * 0.41);
              const decel = swipeDuration - accel;
              const bendY = y0 - travel * 0.41;
              const endY = y0 - travel;
              tl.fromTo(
                actor,
                { x: x0, y: y0 },
                { x: x0, y: bendY, duration: accel, ease: "power2.in", immediateRender: false },
                touchDown,
              );
              tl.to(
                actor,
                { x: x0, y: endY, duration: decel, ease: "power3.out" },
                touchDown + accel,
              );
              holdEnd = touchDown + swipeDuration;
            } else {
              // a tap touches for 0.08s to 0.2s; any longer reads as a long-press.
              holdEnd = touchDown + q(clamp(0.12 * elasticity, 0.08, 0.2));
            }

            // --- OUT: fixed, never stretched. ---
            const lift = q(0.2);
            tl.to(actor, { autoAlpha: 0, duration: lift, ease: "power1.in" }, holdEnd);
          }

          // Self-driving mount: build the paused timeline and register it
          // under this file's own data-composition-id, matching the host's
          // data-composition-src wiring (sub-compositions.md, Pitfall 2).
          const root = document.querySelector('[data-composition-id="touch-indicator"]');
          const tl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
          window.__timelines["touch-indicator"] = tl;
          buildTouchIndicator(tl, root, { at: 0 });
        })();
      </script>
    </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Touch-down: the mount's data-start (0.4) + the disc's 4-frame appear.
      var TAP = 0.4 + 4 / 60;
      tl.set(".like-btn__filled", { opacity: 1 }, TAP);
      tl.set(".like-count", { textContent: "129" }, TAP);
      tl.fromTo(
        ".like-btn",
        { scale: 1 },
        { scale: 1.2, duration: 0.1, ease: "power2.out", immediateRender: false },
        TAP,
      );
      tl.to(".like-btn", { scale: 1, duration: 0.15, ease: "power2.out" }, TAP + 0.1);

      window.__timelines["touch-indicator-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
