<html data-composition-variables='[
    { "id": "overshoot", "type": "number", "role": "timing", "label": "Overshoot", "description": "Strength passed to the back.out entrance curve.", "default": 1.7, "min": 1.1, "max": 2, "step": 0.1 },
    { "id": "fromScale", "type": "number", "role": "timing", "label": "Starting scale", "description": "Scale at the start of the entrance.", "default": 0.9, "min": 0.8, "max": 0.97, "step": 0.01 },
    { "id": "text", "type": "string", "role": "content", "label": "Label", "description": "Text displayed inside the badge.", "default": "New" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Spring Pop Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #05070d);
      }

      #root {
        --bg: #05070d;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --surface: #131b2e;
        --border: #334155;
        --brand: #22c55e;
        --accent: #38bdf8;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 3cqmin;
        --space-1: 1.2cqmin;
        --space-2: 2.4cqmin;
        --space-3: 4cqmin;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 42%,
          color-mix(in srgb, var(--surface) 92%, var(--accent)) 0%,
          var(--bg) 70%
        );
      }

      .mount-card {
        width: 46%;
        height: 36%;
        left: 27%;
        top: 32%;
        container-type: size;
        overflow: hidden;
        border: 0.12cqmin solid color-mix(in srgb, var(--border) 72%, transparent);
        border-radius: calc(var(--radius) * 1.35);
        background: color-mix(in srgb, var(--surface) 76%, transparent);
        box-shadow: 0 4cqh 10cqh color-mix(in srgb, var(--bg) 64%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A badge pops in from a visible near-rest scale, overshoots full size once, and settles cleanly.",
 "class": "transition",
 "tags": [
  "motion-primitive",
  "effects",
  "spring",
  "overshoot",
  "pop",
  "reveal"
 ],
 "seconds": 0.6,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "overshoot",
   "type": "number",
   "default": 1.7,
   "min": 1.1,
   "max": 2,
   "what": "Strength passed to the back.out entrance curve."
  },
  {
   "name": "fromScale",
   "type": "number",
   "default": 0.9,
   "min": 0.8,
   "max": 0.97,
   "what": "Scale at the start of the entrance."
  },
  {
   "name": "text",
   "type": "text",
   "default": "New",
   "maxLength": 200,
   "what": "Text displayed inside the badge."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"overshoot":1.9,"fromScale":0.86,"text":"Just shipped"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"pop","gain":0.65}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="spring-pop-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="2"
      data-fps="30"
    >
      <div
        id="spring-pop-mount"
        class="mount-card clip"
        data-composition-id="spring-pop"
       
        data-variable-values='{"overshoot":1.9,"fromScale":0.86,"text":"Just shipped"}'
        data-start="0"
        data-duration="2"
        data-track-index="0"
        data-width="883"
        data-height="389"
      >
      <div id="root" data-composition-id="spring-pop" data-duration="2" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .sp-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          /* EDIT ZONE: badge proportions only. The centered 82cqw ceiling
             reserves clearance for the overshoot at every allowed value. */
          .sp-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2, 2.4cqw);
            min-width: 48cqw;
            max-width: 82cqw;
            min-height: 32cqh;
            padding: var(--space-2, 2.4cqh) var(--space-3, 4cqw);
            border: 0.18cqmin solid var(--border, #334155);
            border-radius: var(--radius, 3cqmin);
            background: var(--surface, #1e293b);
            box-shadow: 0 2.4cqh 7cqh color-mix(in srgb, var(--bg, #0b1120) 42%, transparent);
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          .sp-dot {
            flex: 0 0 auto;
            width: 3.2cqmin;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--brand, #22c55e);
            box-shadow: 0 0 2.4cqmin color-mix(in srgb, var(--brand, #22c55e) 58%, transparent);
          }

          .sp-label {
            min-width: 0;
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: clamp(14px, 9cqmin, 54px);
            font-weight: 720;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
        </style>

        <div
          id="spring-pop-clip"
          class="sp-clip clip"
          data-start="0"
          data-duration="2"
          data-track-index="0"
        >
          <div class="sp-badge">
            <span class="sp-dot" aria-hidden="true"></span>
            <span class="sp-label"></span>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var badge = root.querySelector(".sp-badge");
            var label = root.querySelector(".sp-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // INVARIANT: invalid numeric overrides return to declared
            // defaults. Explicit finite checks preserve every valid value.
            var overshootValue = vars.overshoot;
            var fromScaleValue = vars.fromScale;
            var overshoot = Number.isFinite(overshootValue)
              ? Math.max(1.1, Math.min(2, overshootValue))
              : 1.7;
            var fromScale = Number.isFinite(fromScaleValue)
              ? Math.max(0.8, Math.min(0.97, fromScaleValue))
              : 0.9;
            var text = vars.text == null ? "New" : String(vars.text);

            label.textContent = text;

            // RETIME RANGE: tune only the fixed entrance length. HOLD is
            // deliberately still, and this reveal has no exit phase.
            var IN_BASE = 0.6;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "2"));
            var IN = Math.min(IN_BASE, duration);
            var OPACITY_IN = Math.min(0.3, IN);

            var tl = gsap.timeline({ paused: true });

            // --ease-overshoot: the back curve owns the only scale arc. The
            // start is 0.9 by default, never 0, so the badge does not appear
            // from nothing. Opacity uses its own non-overshooting ease.
            tl.fromTo(
              badge,
              { scale: fromScale },
              { scale: 1, duration: IN, ease: "back.out(" + overshoot + ")" },
              0,
            );
            tl.fromTo(
              badge,
              { opacity: 0 },
              { opacity: 1, duration: OPACITY_IN, ease: "power2.out" },
              0,
            );
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["spring-pop"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["spring-pop-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
