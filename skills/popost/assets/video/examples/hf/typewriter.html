<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Typewriter - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 900px;
        min-height: 500px;
        padding: 64px;
        /* ponytail: scale-up only; GSAP targets .hf-catalog-typewriter with CSS vars, not transforms */
        transform: scale(2);
      }
      .hf-catalog-typewriter {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-typewriter {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font:
          800 52px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .hf-catalog-typewriter span {
        display: inline-block;
        max-width: calc(var(--hf-type-progress, 1) * 100%);
        overflow: hidden;
        white-space: nowrap;
      }
      .hf-catalog-typewriter i {
        width: 3px;
        height: 52px;
        border-radius: 999px;
        background: #18181b;
        opacity: var(--hf-caret-opacity, 1);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Character-by-character text reveal with a deterministic blinking cursor.",
 "class": "text",
 "tags": [
  "video-primitive",
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "hyperframes add typewriter",
   "maxLength": 200,
   "what": "Line that types itself out character by character."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Colour of the text and the caret: ink for light frames, paper for dark ones, accent rides --brand."
  },
  {
   "name": "caret",
   "type": "choice",
   "default": "line",
   "options": [
    "line",
    "block",
    "none"
   ],
   "what": "Caret shape: a thin rule, a terminal-style block, or no caret at all."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"type","gain":0.35}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="typewriter-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-catalog-typewriter"
          data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Line that types itself out character by character.", "default": "hyperframes add typewriter" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Colour of the text and the caret: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "caret", "type": "enum", "role": "style", "label": "Caret", "description": "Caret shape: a thin rule, a terminal-style block, or no caret at all.", "default": "line", "options": [{ "value": "line", "label": "Line" }, { "value": "block", "label": "Block" }, { "value": "none", "label": "None" }] }
  ]'
        >
          <span>hyperframes add typewriter</span><i></i>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var tones = {
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };
          var carets = {
            line: { width: "3px", display: "block" },
            block: { width: "22px", display: "block" },
            none: { width: "3px", display: "none" },
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var tone = tones[pick(tones, vars.tone, "ink")];
          var caret = carets[pick(carets, vars.caret, "line")];
          var text = typeof vars.text === "string" && vars.text !== "" ? vars.text : null;

          var roots = document.querySelectorAll(".hf-catalog-typewriter");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-type-color", tone);
            root.style.setProperty("--hf-caret-width", caret.width);
            root.style.setProperty("--hf-caret-display", caret.display);

            var line = root.querySelector("span");
            if (text !== null && line) {
              line.textContent = text;
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-typewriter",
          { "--hf-type-progress": 0 },
          { "--hf-type-progress": 1, duration: 1.2, ease: "steps(28)" },
          startTime,
        );
        tl.to(
          ".hf-catalog-typewriter i",
          { "--hf-caret-opacity": 0.2, duration: 0.24, repeat: 7, yoyo: true, ease: "none" },
          startTime + 0.2,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["typewriter-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-typewriter {
        color: var(--hf-type-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-typewriter {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font:
          800 42px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .hf-catalog-typewriter span {
        display: inline-block;
        max-width: calc(var(--hf-type-progress, 1) * 100%);
        overflow: hidden;
        white-space: nowrap;
      }
      .hf-catalog-typewriter i {
        display: var(--hf-caret-display, block);
        width: var(--hf-caret-width, 3px);
        height: 42px;
        border-radius: 999px;
        background: var(--hf-type-color, #18181b);
        opacity: var(--hf-caret-opacity, 1);
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
