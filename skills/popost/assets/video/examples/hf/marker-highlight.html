<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Full line of display text.", "default": "Ship it with confidence" },
    { "id": "emphasis_word", "type": "string", "role": "content", "label": "Emphasis word", "description": "First case-insensitive substring match in text receives the marker. Empty or unmatched draws no marker.", "default": "confidence" },
    { "id": "style", "type": "enum", "role": "style", "label": "Marker style", "description": "Shape of the hand-drawn marker stroke.", "default": "highlight", "options": [{ "value": "highlight", "label": "Highlight" }, { "value": "circle", "label": "Circle" }, { "value": "underline", "label": "Underline" }, { "value": "scribble", "label": "Scribble" }] },
    { "id": "draw_at", "type": "number", "role": "timing", "label": "Draw at", "description": "Second (from mount start) the marker starts drawing. Clamped so the stroke completes before any exit.", "default": 0.9, "min": 0, "step": 0.1, "unit": "s" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Marker ink color from the contract token map.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "Optional departure. Default none: the lockup holds until the frame cuts.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Marker Highlight Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #0b0c0e);
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --brand: #71f5a7;
        --accent: #61a8ff;
        --accent-2: #c5a3ff;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .mount-box {
        position: absolute;
        width: 80%;
        height: 56%;
        left: 10%;
        top: 22%;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Display text settles in, then one hand-drawn marker stroke (highlight, circle, underline, or scribble) draws over the emphasized word on cue.",
 "class": "overlay",
 "tags": [
  "motion-primitive",
  "typography",
  "emphasis",
  "marker",
  "deterministic"
 ],
 "seconds": 1.84,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Ship it with confidence",
   "maxLength": 200,
   "what": "Full line of display text."
  },
  {
   "name": "emphasis_word",
   "type": "text",
   "default": "confidence",
   "maxLength": 200,
   "what": "First case-insensitive substring match in text receives the marker. Empty or unmatched draws no marker."
  },
  {
   "name": "style",
   "type": "choice",
   "default": "highlight",
   "options": [
    "highlight",
    "circle",
    "underline",
    "scribble"
   ],
   "what": "Shape of the hand-drawn marker stroke."
  },
  {
   "name": "draw_at",
   "type": "number",
   "default": 0.9,
   "min": 0,
   "max": 100000,
   "unit": "s",
   "what": "Second (from mount start) the marker starts drawing. Clamped so the stroke completes before any exit."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Marker ink color from the contract token map."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Default none: the lockup holds until the frame cuts."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"Zero render surprises","emphasis_word":"Zero","style":"circle","accent":"violet","draw_at":1.1};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1.1,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="marker-highlight-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="marker-highlight-mount"
        class="mount-box clip"
        data-composition-id="marker-highlight"
       
        data-variable-values='{"text":"Zero render surprises","emphasis_word":"Zero","style":"circle","accent":"violet","draw_at":1.1}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1536"
        data-height="605"
      >
      <div id="root" data-composition-id="marker-highlight" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0b0c0e);
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .mh-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .mh-stage {
            max-width: 86cqw;
            text-align: center;
            will-change: transform, opacity;
          }

          .mh-text {
            margin: 0;
            font-size: var(--mh-font-size, min(8cqw, 15cqh));
            font-weight: 600;
            line-height: 1.14;
            letter-spacing: -0.03em;
          }

          .mh-em {
            position: relative;
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
          }

          .mh-em-text {
            position: relative;
            z-index: 1;
          }

          .mh-mark {
            position: absolute;
            z-index: 0;
            overflow: visible;
          }

          /* Per-style marker box around the emphasized word. Explicit
             width/height (svg is a replaced element: inset-stretching would
             fall back to its intrinsic viewBox ratio); then
             preserveAspectRatio="none" stretches the authored path (and its
             stroke) into the box, which is exactly the marker-nib distortion
             we want on a dashed path. */
          .mh-em[data-marker-style="highlight"] .mh-mark {
            left: -3%;
            top: 14%;
            width: 106%;
            height: 76%;
          }

          .mh-em[data-marker-style="underline"] .mh-mark {
            left: -2%;
            bottom: -14%;
            width: 105%;
            height: 22%;
            z-index: 2;
          }

          .mh-em[data-marker-style="circle"] .mh-mark {
            left: -13%;
            top: -26%;
            width: 126%;
            height: 152%;
            z-index: 2;
          }

          .mh-em[data-marker-style="scribble"] .mh-mark {
            left: -2%;
            top: 12%;
            width: 104%;
            height: 76%;
            z-index: 2;
          }
        </style>

        <div
          id="marker-highlight-clip"
          class="mh-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="mh-stage">
            <p class="mh-text"></p>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            // Literal key: the flattening step strips data-composition-id off
            // the mounted root, so reading it back would register "null".
            var compositionId = "marker-highlight";
            var stage = root.querySelector(".mh-stage");
            var textEl = root.querySelector(".mh-text");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text =
              vars.text == null
                ? "Ship it with confidence"
                : String(vars.text).trim().replace(/\s+/g, " ");
            var emphasis =
              vars.emphasis_word == null
                ? "confidence"
                : String(vars.emphasis_word).trim().replace(/\s+/g, " ");
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            // Hand-drawn stroke library. Paths are authored in a fixed viewBox
            // and stretched into the word box; wobble is baked into the
            // control points, never randomized.
            var markerStyles = {
              highlight: {
                viewBox: "0 0 100 40",
                d: "M 3 24 C 22 20.5, 47 25.5, 68 22.5 C 79 21, 90 23, 97 21.5",
                strokeWidth: 26,
                opacity: 0.5,
              },
              circle: {
                viewBox: "0 0 100 40",
                d: "M 22 7 C 58 1, 95 8, 97 20 C 99 31, 74 38, 44 37 C 16 36, 2 29, 3 19 C 4 10, 22 4, 52 4.5",
                strokeWidth: 2.8,
                opacity: 1,
              },
              underline: {
                viewBox: "0 0 100 12",
                d: "M 2 7 C 20 4.5, 46 8.5, 66 6 C 80 4.5, 92 7.5, 98 5.5",
                strokeWidth: 4.5,
                opacity: 1,
              },
              scribble: {
                viewBox: "0 0 100 40",
                d: "M 6 13 C 34 9.5, 66 11, 94 9 C 60 15, 26 16, 7 20 C 36 18, 68 21, 93 18 C 62 25, 28 27, 8 29",
                strokeWidth: 5,
                opacity: 0.65,
              },
            };
            var styleName = Object.prototype.hasOwnProperty.call(markerStyles, vars.style)
              ? vars.style
              : "highlight";
            var marker = markerStyles[styleName];

            // Split text around the first case-insensitive emphasis match.
            // textContent nodes only, never innerHTML.
            var matchIndex =
              emphasis.length > 0 ? text.toLowerCase().indexOf(emphasis.toLowerCase()) : -1;
            var emEl = null;
            var pathEl = null;
            if (matchIndex >= 0) {
              var before = text.slice(0, matchIndex);
              var matched = text.slice(matchIndex, matchIndex + emphasis.length);
              var after = text.slice(matchIndex + emphasis.length);
              if (before) textEl.appendChild(document.createTextNode(before));

              emEl = document.createElement("span");
              emEl.className = "mh-em";
              emEl.setAttribute("data-marker-style", styleName);

              var svgNS = "http://www.w3.org/2000/svg";
              var svg = document.createElementNS(svgNS, "svg");
              svg.setAttribute("class", "mh-mark");
              svg.setAttribute("viewBox", marker.viewBox);
              svg.setAttribute("preserveAspectRatio", "none");
              svg.setAttribute("aria-hidden", "true");
              pathEl = document.createElementNS(svgNS, "path");
              pathEl.setAttribute("d", marker.d);
              pathEl.setAttribute("fill", "none");
              pathEl.setAttribute("stroke-width", String(marker.strokeWidth));
              pathEl.setAttribute("stroke-linecap", "round");
              pathEl.setAttribute("stroke-linejoin", "round");
              // style.stroke, not the presentation attribute: var() only
              // resolves as a CSS value.
              pathEl.style.stroke = accentColors[accent];
              svg.appendChild(pathEl);

              var emText = document.createElement("span");
              emText.className = "mh-em-text";
              emText.textContent = matched;

              emEl.appendChild(svg);
              emEl.appendChild(emText);
              textEl.appendChild(emEl);
              if (after) textEl.appendChild(document.createTextNode(after));
            } else {
              textEl.textContent = text;
            }
            textEl.setAttribute("aria-label", text);

            // Deterministic character-count fit; the line may wrap, the
            // emphasized phrase never wraps internally.
            var characters = Math.max(1, Array.from(text).length);
            var fitted = Math.max(4.2, Math.min(9.5, 185 / characters));
            root.style.setProperty("--mh-font-size", "min(" + fitted.toFixed(3) + "cqw, 16cqh)");

            // RETIME RANGE: fixed phases; HOLD is the only elastic span.
            var IN_BASE = 0.55;
            var DRAW_BASE = 0.6;
            var POP_BASE = 0.32;
            var OUT_BASE = exit === "none" ? 0 : 0.45;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var totalBase = IN_BASE + DRAW_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var DRAW = DRAW_BASE * scale;
            var POP = POP_BASE * scale;
            var OUT = OUT_BASE * scale;
            var OUT_START = duration - OUT;

            var drawAtRaw = Number(vars.draw_at);
            var drawAt = Number.isFinite(drawAtRaw) ? Math.max(0, drawAtRaw) : 0.9;
            // The stroke and its settle pop always land before the exit.
            drawAt = Math.min(drawAt, Math.max(0, OUT_START - (DRAW + POP)));

            gsap.set(stage, { opacity: 0, y: "6cqh" });

            var tl = gsap.timeline({ paused: true });

            // IN: the line rises into place.
            tl.fromTo(
              stage,
              { opacity: 0, y: "6cqh" },
              { opacity: 1, y: "0cqh", duration: IN, ease: "power3.out" },
              0,
            );

            // DRAW: dash reveal from measured length; both endpoints explicit
            // so any seek is correct without playing through.
            if (pathEl) {
              var length = pathEl.getTotalLength();
              pathEl.style.strokeDasharray = String(length);
              // Hidden until the cue: at dashoffset == length the round cap
              // still paints a dot at the path start, so the ink is opacity 0
              // until the exact frame the draw begins.
              gsap.set(pathEl, { strokeDashoffset: length, opacity: 0 });
              tl.set(pathEl, { opacity: marker.opacity }, drawAt);
              tl.fromTo(
                pathEl,
                { strokeDashoffset: length },
                { strokeDashoffset: 0, duration: DRAW, ease: "power2.inOut" },
                drawAt,
              );
              // Settle pop on the emphasized word as the ink lands.
              tl.fromTo(
                emEl,
                { scale: 1 },
                {
                  scale: 1.045,
                  duration: POP / 2,
                  ease: "power1.out",
                  yoyo: true,
                  repeat: 1,
                },
                drawAt + DRAW * 0.7,
              );
            }

            // HOLD: completely still.

            // OUT: optional departure; exit none holds until the frame cuts.
            if (exit === "fade") {
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            } else if (exit === "up") {
              tl.to(stage, { opacity: 0, y: "-7cqh", duration: OUT, ease: "power2.in" }, OUT_START);
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["marker-highlight-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
