<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mesh Gradient Background - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 52px;
        transform: scale(1.75);
      }
      .hf-catalog-mesh-gradient-bg {
        --hf-accent: #2563eb;
        --hf-ink: #111827;
        --hf-muted: #6b7280;
        --hf-surface: #ffffff;
        color: var(--hf-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-catalog-mesh-gradient-bg {
        position: relative;
        width: 760px;
        height: 428px;
        overflow: hidden;
        border-radius: 30px;
        background: #080b12;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
      }
      .hf-catalog-mesh-gradient-bg .mesh {
        position: absolute;
        inset: -22%;
        filter: blur(44px);
        opacity: 0.88;
        background:
          radial-gradient(
            circle at var(--hf-x1, 20%) var(--hf-y1, 30%),
            #60a5fa 0 18%,
            transparent 32%
          ),
          radial-gradient(
            circle at var(--hf-x2, 76%) var(--hf-y2, 52%),
            #f472b6 0 16%,
            transparent 34%
          ),
          radial-gradient(
            circle at var(--hf-x3, 46%) var(--hf-y3, 78%),
            #34d399 0 18%,
            transparent 34%
          );
      }
      .hf-catalog-mesh-gradient-bg .card {
        position: absolute;
        inset: 74px 92px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        display: grid;
        place-items: center;
        text-align: center;
        overflow: hidden;
      }
      .hf-catalog-mesh-gradient-bg .spot {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.5), transparent 65%);
        transform: translate(var(--hf-spot-x, 0px), var(--hf-spot-y, 0px));
        mix-blend-mode: screen;
      }
      .hf-catalog-mesh-gradient-bg .particle {
        position: absolute;
        left: 50%;
        top: 54%;
        width: 12px;
        height: 20px;
        border-radius: 3px;
        background: var(--c);
        transform: translate(var(--hf-px, 0px), var(--hf-py, 0px)) rotate(var(--hf-pr, 0deg));
        opacity: var(--hf-po, 0);
      }
      .hf-catalog-mesh-gradient-bg h3 {
        margin: 0;
        font-size: 44px;
        letter-spacing: -0.04em;
      }
      .hf-catalog-mesh-gradient-bg p {
        margin: 8px 0 0;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A render-safe mesh gradient using animated radial layers.",
 "class": "background",
 "tags": [
  "effect"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="mesh-gradient-bg-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="hf-catalog-mesh-gradient-bg">
          <div class="mesh"></div>
          <div class="card">
            <div class="spot"></div>
            <div>
              <h3>Mesh Gradient Background</h3>
              <p>A render-safe mesh gradient using animated radial layers.</p>
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-mesh-gradient-bg .mesh",
          {
            "--hf-x1": "18%",
            "--hf-y1": "28%",
            "--hf-x2": "78%",
            "--hf-y2": "46%",
            "--hf-x3": "44%",
            "--hf-y3": "80%",
          },
          {
            "--hf-x1": "34%",
            "--hf-y1": "42%",
            "--hf-x2": "62%",
            "--hf-y2": "60%",
            "--hf-x3": "58%",
            "--hf-y3": "64%",
            duration: 4,
            ease: "sine.inOut",
          },
          startTime,
        );
        tl.fromTo(
          ".hf-catalog-mesh-gradient-bg .spot",
          { "--hf-spot-x": "-120px", "--hf-spot-y": "-70px" },
          { "--hf-spot-x": "190px", "--hf-spot-y": "90px", duration: 3, ease: "sine.inOut" },
          startTime,
        );
        const particles_mesh_gradient_bg = gsap.utils.toArray(
          ".hf-catalog-mesh-gradient-bg .particle",
        );
        if (particles_mesh_gradient_bg.length) {
          tl.fromTo(
            particles_mesh_gradient_bg,
            { "--hf-po": 0, "--hf-px": "0px", "--hf-py": "0px", "--hf-pr": "0deg" },
            {
              "--hf-po": 1,
              "--hf-px": (i) => Math.cos(i * 0.83) * 250 + "px",
              "--hf-py": (i) => -120 - Math.sin(i * 0.61) * 120 + "px",
              "--hf-pr": (i) => 180 + i * 37 + "deg",
              duration: 0.8,
              stagger: 0.015,
              ease: "power2.out",
            },
            startTime + 0.2,
          );
        }
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["mesh-gradient-bg-demo"] = tl;
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
