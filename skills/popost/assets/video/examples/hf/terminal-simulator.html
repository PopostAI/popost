<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Terminal Simulator - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 52px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~65% of frame */
        transform: scale(1.65);
      }
      .hf-catalog-terminal-simulator {
        --hf-accent: var(--accent, #18181b);
        --hf-ink: #111827;
        --hf-muted: #6b7280;
        --hf-surface: #ffffff;
        color: var(--hf-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-catalog-terminal-simulator {
        width: 760px;
        border-radius: 24px;
        overflow: hidden;
        background: #0f172a;
        color: #e4e4e7;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .hf-catalog-terminal-simulator .chrome {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        background: #111827;
        color: #94a3b8;
        font-size: 14px;
      }
      .hf-catalog-terminal-simulator .dot {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow:
          18px 0 #f59e0b,
          36px 0 #22c55e;
      }
      .hf-catalog-terminal-simulator .body {
        display: grid;
        grid-template-columns: 210px 1fr;
        min-height: 340px;
      }
      .hf-catalog-terminal-simulator .files {
        padding: 22px;
        border-right: 1px solid rgba(148, 163, 184, 0.18);
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.8;
      }
      .hf-catalog-terminal-simulator .editor {
        padding: 22px;
        display: grid;
        gap: 14px;
      }
      .hf-catalog-terminal-simulator .line {
        display: block;
        height: 18px;
        border-radius: 999px;
        background: rgba(228, 228, 231, 0.18);
        transform: scaleX(var(--hf-line, 1));
        transform-origin: left center;
        opacity: var(--hf-line-opacity, 1);
      }
      .hf-catalog-terminal-simulator .terminal {
        padding: 18px 22px 24px;
        border-top: 1px solid rgba(148, 163, 184, 0.18);
        color: #86efac;
        min-height: 78px;
        font-size: 15px;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A terminal window types commands and streams log output.",
 "class": "ui",
 "tags": [
  "code-animation"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.98,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="terminal-simulator-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="hf-catalog-terminal-simulator">
          <div class="chrome"><span class="dot"></span><span>Terminal Simulator</span></div>
          <div class="body">
            <div class="files">index.html<br />style.css<br />timeline.js</div>
            <div class="editor">
              <span class="line" style="width: 92%"></span
              ><span class="line" style="width: 72%"></span
              ><span class="line" style="width: 84%"></span
              ><span class="line" style="width: 58%"></span
              ><span class="line" style="width: 78%"></span>
            </div>
          </div>
          <div class="terminal">$ hyperframes render --skill=terminal-simulator</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-terminal-simulator .line",
          { "--hf-line": 0, "--hf-line-opacity": 0 },
          {
            "--hf-line": 1,
            "--hf-line-opacity": 1,
            duration: 0.24,
            stagger: 0.08,
            ease: "power2.out",
          },
          startTime,
        );
        tl.fromTo(
          ".hf-catalog-terminal-simulator .terminal",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
          startTime + 0.48,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["terminal-simulator-demo"] = tl;
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
