<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Success Check - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
      }
      .hf-transition-success-check {
        display: grid;
        place-items: center;
        /* ponytail: sized up from 82px to fill ~55% of frame height at 1080p */
        width: 340px;
        height: 340px;
        border-radius: 999px;
        background: #dcfce7;
        color: #16a34a;
        box-shadow:
          0 24px 80px rgba(22, 163, 74, 0.18),
          0 4px 16px rgba(22, 163, 74, 0.1);
      }
      .hf-transition-success-check svg {
        width: 220px;
        height: 220px;
        fill: none;
        stroke: currentColor;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: blur(var(--hf-check-blur, 0px));
        transform: rotate(var(--hf-check-rotate, 0deg)) scale(var(--hf-check-scale, 1));
      }
      .hf-transition-success-check circle {
        opacity: 0.28;
      }
      .hf-transition-success-check path {
        stroke-dasharray: 36;
        stroke-dashoffset: var(--hf-check-dash, 0);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A success check primitive with ring pop, path draw, and subtle rotate blur",
 "class": "motion",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "success",
  "check"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "tint",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet",
    "amber"
   ],
   "what": "Colour pair, a pale halo behind a saturated mark. green and amber are literal state colours; blue and violet ride the composition theme tokens."
  },
  {
   "name": "size",
   "type": "choice",
   "default": "standard",
   "options": [
    "small",
    "standard",
    "large"
   ],
   "what": "Diameter of the halo and of the mark inside it."
  },
  {
   "name": "ring",
   "type": "choice",
   "default": "standard",
   "options": [
    "subtle",
    "standard",
    "bold"
   ],
   "what": "Opacity of the circle the tick sits in."
  },
  {
   "name": "spin",
   "type": "choice",
   "default": "standard",
   "options": [
    "subtle",
    "standard",
    "bold"
   ],
   "what": "Multiplies the rotation the timeline drives, so the mark swings less or more into place."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="success-check-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-success-check"
          aria-label="Success"
          data-composition-variables='[
    { "id": "tint", "type": "enum", "role": "style", "label": "Tint", "description": "Colour pair, a pale halo behind a saturated mark. green and amber are literal state colours; blue and violet ride the composition theme tokens.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }, { "value": "amber", "label": "Amber" }] },
    { "id": "size", "type": "enum", "role": "layout", "label": "Size", "description": "Diameter of the halo and of the mark inside it.", "default": "standard", "options": [{ "value": "small", "label": "Small" }, { "value": "standard", "label": "Standard" }, { "value": "large", "label": "Large" }] },
    { "id": "ring", "type": "enum", "role": "style", "label": "Ring", "description": "Opacity of the circle the tick sits in.", "default": "standard", "options": [{ "value": "subtle", "label": "Subtle" }, { "value": "standard", "label": "Standard" }, { "value": "bold", "label": "Bold" }] },
    { "id": "spin", "type": "enum", "role": "motion", "label": "Spin", "description": "Multiplies the rotation the timeline drives, so the mark swings less or more into place.", "default": "standard", "options": [{ "value": "subtle", "label": "Subtle" }, { "value": "standard", "label": "Standard" }, { "value": "bold", "label": "Bold" }] }
  ]'
        >
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="27" />
            <path d="M20 33.5l8 8L45 23" />
          </svg>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          // The mark is the whole composition and its colour is its meaning, so this
          // is the one place an accent belongs. green and amber are the literal
          // success and caution conventions; blue and violet named no state, so they
          // ride the composition's own tokens over a neutral halo and fall back to
          // ink when the composition declares none.
          var tints = {
            green: { halo: "#dcfce7", ink: "#16a34a" },
            blue: { halo: "#f4f4f5", ink: "var(--accent, #18181b)" },
            violet: { halo: "#f4f4f5", ink: "var(--accent-2, #18181b)" },
            amber: { halo: "#fef3c7", ink: "#d97706" },
          };
          var sizes = {
            small: { box: "60px", mark: "47px" },
            standard: { box: "82px", mark: "64px" },
            large: { box: "110px", mark: "86px" },
          };
          var rings = { subtle: "0.12", standard: "0.28", bold: "0.6" };
          var spins = { subtle: "0.4", standard: "1", bold: "2" };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var tint = tints[pick(tints, vars.tint, "green")];
          var size = sizes[pick(sizes, vars.size, "standard")];
          var ring = rings[pick(rings, vars.ring, "standard")];
          var spin = spins[pick(spins, vars.spin, "standard")];

          var roots = document.querySelectorAll(".hf-transition-success-check");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-check-halo", tint.halo);
            roots[i].style.setProperty("--hf-check-ink", tint.ink);
            roots[i].style.setProperty("--hf-check-size", size.box);
            roots[i].style.setProperty("--hf-check-mark-size", size.mark);
            roots[i].style.setProperty("--hf-check-ring-opacity", ring);
            roots[i].style.setProperty("--hf-check-spin", spin);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-transition-success-check svg",
          {
            opacity: 0,
            "--hf-check-scale": 0.72,
            "--hf-check-rotate": "-18deg",
            "--hf-check-blur": "7px",
          },
          {
            opacity: 1,
            "--hf-check-scale": 1,
            "--hf-check-rotate": "0deg",
            "--hf-check-blur": "0px",
            duration: 0.34,
            ease: "back.out(1.8)",
          },
          startTime,
        );
        tl.fromTo(
          ".hf-transition-success-check path",
          { "--hf-check-dash": 36 },
          { "--hf-check-dash": 0, duration: 0.42, ease: "power2.out" },
          startTime + 0.12,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["success-check-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-success-check {
        display: grid;
        place-items: center;
        width: var(--hf-check-size, 82px);
        height: var(--hf-check-size, 82px);
        border-radius: 999px;
        background: var(--hf-check-halo, #dcfce7);
        color: var(--hf-check-ink, #16a34a);
      }
      .hf-transition-success-check svg {
        width: var(--hf-check-mark-size, 64px);
        height: var(--hf-check-mark-size, 64px);
        fill: none;
        stroke: currentColor;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: blur(var(--hf-check-blur, 0px));
        transform: rotate(calc(var(--hf-check-rotate, 0deg) * var(--hf-check-spin, 1)))
          scale(var(--hf-check-scale, 1));
      }
      .hf-transition-success-check circle {
        opacity: var(--hf-check-ring-opacity, 0.28);
      }
      .hf-transition-success-check path {
        stroke-dasharray: 36;
        stroke-dashoffset: var(--hf-check-dash, 0);
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
