    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"tone":"dark","target_x":67.9,"target_y":40.5,"target2_x":63.3,"target2_y":73.7,"enter_from":"right","exit_to":"right"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);

      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));

    };
  })();

          var DEFAULTS = {};

          var T_CLICK1 = 0.7 * squeeze;

          var T_LAND2 = 1.55 * squeeze;
          var T_CLICK2 = 1.7 * squeeze;

          var easeInOut = gsap.parseEase("power2.inOut");

            }
            if (t <= T_EXIT) return B;
            return arc(B, END, 0.12, easeIn(clamp01((t - T_EXIT) / (duration - T_EXIT))));
          }

          function keyed(keys, u) {
            if (u <= keys[0][0]) return keys[0][1];
            for (var i = 1; i < keys.length; i++) {
              if (u <= keys[i][0]) {
                var a = keys[i - 1];
                var b = keys[i];
                return a[1] + (b[1] - a[1]) * smooth((u - a[0]) / (b[0] - a[0]));
              }
            }
            return keys[keys.length - 1][1];
          }
          var DIVE = [
            [0, 1.3],
            [0.4, 1.8],
            [0.78, 1.06],
            [1, 1],
          ];
          function press(t, at) {
            var down = 0.08 * squeeze;
            var up = 0.2 * squeeze;
            if (t < at) return 0;
            if (t < at + down) return 0.2 * gsap.parseEase("power2.in")((t - at) / down);
            return 0.2 - 0.1 * gsap.parseEase("power2.out")(clamp01((t - at - down) / up));
          }

          // Depth is scale: above 1 is lifted toward camera, below 1 is pressed into the screen.
          function depthAt(t) {
            if (t <= T_LAND1) return keyed(DIVE, t / T_LAND1);
            if (t <= T_MOVE) return 1 - press(t, T_CLICK1);
            if (t <= T_LAND2) {
              var u = (t - T_MOVE) / (T_LAND2 - T_MOVE);
              return 0.9 + 0.1 * smooth(u / 0.3) + 0.07 * Math.sin(Math.PI * u);
            }
            return 1 - press(t, T_CLICK2);
          }

          // Local-frame nose angle of the arrowhead (tip minus the shape's centroid).
          var NOSE_DEG = -106;
          var H_STEP = 1 / 120;
          function wrap(deg) {
            return ((((deg + 180) % 360) + 360) % 360) - 180;
          }

          function render(t) {
            var p = positionAt(t);
            var before = positionAt(Math.max(0, t - H_STEP));
            var after = positionAt(Math.min(duration, t + H_STEP));
            var vx = (after.x - before.x) / (2 * H_STEP);
            var vy = (after.y - before.y) / (2 * H_STEP);
            var speed = Math.hypot(vx, vy) / unit;
            var travelDeg = (Math.atan2(vy, vx) * 180) / Math.PI;
            var steer = smooth((speed - 150) / 950);
            var rotation = steer * wrap(travelDeg - NOSE_DEG);
            var depth = depthAt(t);
            var exiting = t > T_EXIT;
            var perFrame = speed / 60;
            var smearUnits =
              blurAmount * Math.min(exiting ? 36 : 12, (exiting ? 0.28 : 0.16) * perFrame);
            var lift = Math.max(0, depth - 0.9);

            cursor.style.transform = "translate(" + p.x.toFixed(2) + "px," + p.y.toFixed(2) + "px)";
            svg.style.filter =
              "drop-shadow(0 " +
              (3 + 22 * lift).toFixed(1) +
              "px " +
              (4 + 26 * lift).toFixed(1) +
              "px rgba(0,0,0," +
              (0.34 - 0.12 * Math.min(1, lift)).toFixed(3) +
              "))";
            spin.setAttribute(
              "transform",
              "rotate(" +
                rotation.toFixed(2) +
                ") scale(" +
                (depth * PX_PER_SVG_UNIT).toFixed(4) +
                ")",
            );
            // The blur's x axis is turned onto the travel direction, then the shape turned back.
            var local = wrap(travelDeg - rotation);
            heading.setAttribute("transform", "rotate(" + local.toFixed(2) + ")");
            unheading.setAttribute("transform", "rotate(" + (-local).toFixed(2) + ")");
            smear.setAttribute("stdDeviation", smearUnits.toFixed(3) + " 0");
            cursor.style.opacity = t >= duration ? "0" : "1";
          }

          cursor.setAttribute("data-tone", tone);
          shape.setAttribute("transform", "scale(1.09 1)");

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(
            clock,
            {
              t: duration,
              duration: duration,
              ease: "none",
              onUpdate: function () {
                render(clock.t);
              },
            },
            0,
          );
          render(0);
          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = tl;
        })();
      </script>
    </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // First click (0.7s): the resolution thumb slides onto 4K.
      tl.to("#res-thumb", { x: 144, duration: 0.34, ease: "power3.out" }, 0.78);
      tl.to("#res-1080", { color: "#6b6f85", duration: 0.2 }, 0.78);
      tl.to("#res-4k", { color: "#111320", duration: 0.2 }, 0.78);

      // Second click (1.7s): the button presses, relabels and fills over 1s.
      tl.to("#export", { scale: 0.96, duration: 0.08, ease: "power2.in" }, 1.7);
      tl.to("#export", { scale: 1, duration: 0.22, ease: "power2.out" }, 1.78);
      tl.to("#export-idle", { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, 1.78);
      tl.fromTo(
        "#export-busy",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" },
        1.86,
      );
      tl.to("#progress", { scaleX: 1, duration: 1.0, ease: "none" }, 1.8);

      // Done (2.8s): the fill clears and a check swaps in with "Exported".
      tl.to("#export-busy", { opacity: 0, y: -14, duration: 0.12, ease: "power2.in" }, 2.8);
      tl.to("#progress", { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.8);
      tl.fromTo(
        "#export-check",
        { opacity: 0, scale: 0.3, filter: "blur(3px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
        2.88,
      );
      tl.fromTo(
        "#export-done",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" },
        2.88,
      );

      window.__timelines["dart-cursor-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
