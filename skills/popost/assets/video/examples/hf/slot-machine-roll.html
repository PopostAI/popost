<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Slot Machine Roll - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        /* ponytail: scale on non-GSAP wrapper — safe, GSAP only animates --hf-slot-y on inner <i> */
        transform: scale(1.85);
        transform-origin: center center;
      }
      .slot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        padding: 40px 56px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.1);
      }
      .slot-label {
        font-family: Inter, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #71717a;
      }
      .hf-catalog-slot-machine-roll {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-slot-machine-roll {
        display: inline-flex;
        gap: 6px;
        height: 74px;
        overflow: hidden;
        font:
          900 74px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .hf-catalog-slot-machine-roll span {
        display: block;
        height: 74px;
        overflow: hidden;
      }
      .hf-catalog-slot-machine-roll i {
        display: block;
        font-style: normal;
        transform: translateY(var(--hf-slot-y, 0px));
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A vertical reel scrolls characters from one value to another.",
 "class": "text",
 "tags": [
  "video-primitive",
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "result",
   "type": "text",
   "default": "A7K",
   "maxLength": 200,
   "what": "Characters the reels land on, one reel column per character. Whitespace is stripped and every reel starts on a zero."
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "up",
   "options": [
    "up",
    "down"
   ],
   "what": "Which way the reels roll: up lifts the zero out through the top, down drops it out through the bottom."
  },
  {
   "name": "size",
   "type": "choice",
   "default": "standard",
   "options": [
    "small",
    "standard",
    "large"
   ],
   "what": "Reel height and type size. The roll distance scales with it so the reel always lands exactly one row on."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Character colour: ink for light frames, paper for dark ones, accent rides --brand."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.6,"cue":"tick","gain":0.35}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="slot-machine-roll-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="slot-card">
          <div class="slot-label">Slot Machine Roll</div>
          <div
            class="hf-catalog-slot-machine-roll"
            data-composition-variables='[
    { "id": "result", "type": "string", "role": "content", "label": "Result", "description": "Characters the reels land on, one reel column per character. Whitespace is stripped and every reel starts on a zero.", "default": "A7K" },
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Which way the reels roll: up lifts the zero out through the top, down drops it out through the bottom.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }] },
    { "id": "size", "type": "enum", "role": "layout", "label": "Size", "description": "Reel height and type size. The roll distance scales with it so the reel always lands exactly one row on.", "default": "standard", "options": [{ "value": "small", "label": "Small" }, { "value": "standard", "label": "Standard" }, { "value": "large", "label": "Large" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Character colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
          >
            <span
              ><i>0<br />A</i></span
            ><span
              ><i>0<br />7</i></span
            ><span
              ><i>0<br />K</i></span
            >
          </div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var directions = { up: 1, down: -1 };
          var sizes = { small: 48, standard: 74, large: 104 };
          var tones = {
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };

          var dir = directions[pick(directions, vars.direction, "up")];
          var row = sizes[pick(sizes, vars.size, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];
          var result = (typeof vars.result === "string" ? vars.result : "").replace(/\s+/g, "");
          if (result.length === 0) result = "A7K";

          var roots = document.querySelectorAll(".hf-catalog-slot-machine-roll");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-slot-row", row + "px");
            root.style.setProperty("--hf-slot-gain", String(row / 74));
            root.style.setProperty("--hf-slot-dir", String(dir));
            // Rolling down starts one row up, so the zero still sits in frame at rest.
            root.style.setProperty("--hf-slot-base", (dir === 1 ? 0 : -row) + "px");
            root.style.setProperty("--hf-slot-color", tone);
            root.textContent = "";
            for (var j = 0; j < result.length; j += 1) {
              var reel = document.createElement("i");
              reel.appendChild(document.createTextNode(dir === 1 ? "0" : result.charAt(j)));
              reel.appendChild(document.createElement("br"));
              reel.appendChild(document.createTextNode(dir === 1 ? result.charAt(j) : "0"));
              var slot = document.createElement("span");
              slot.appendChild(reel);
              root.appendChild(slot);
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-slot-machine-roll i",
          { "--hf-slot-y": "0px" },
          { "--hf-slot-y": "-74px", duration: 0.52, stagger: 0.06, ease: "power3.inOut" },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["slot-machine-roll-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-slot-machine-roll {
        color: var(--hf-slot-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-slot-machine-roll {
        display: inline-flex;
        gap: 6px;
        height: var(--hf-slot-row, 74px);
        overflow: hidden;
        font:
          900 var(--hf-slot-row, 74px)/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .hf-catalog-slot-machine-roll span {
        display: block;
        height: var(--hf-slot-row, 74px);
        overflow: hidden;
      }
      .hf-catalog-slot-machine-roll i {
        display: block;
        font-style: normal;
        transform: translateY(
          calc(
            var(--hf-slot-base, 0px) + var(--hf-slot-y, 0px) * var(--hf-slot-dir, 1) *
              var(--hf-slot-gain, 1)
          )
        );
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
