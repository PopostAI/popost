<html data-composition-variables='[
    { "id": "label", "type": "string", "role": "content", "label": "Nucleus label", "description": "Text displayed inside the fixed center nucleus.", "default": "core" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Color used by the nucleus, rings, and satellite markers.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "satellites", "type": "number", "role": "layout", "label": "Satellites", "description": "Number of orbiting copy chips.", "default": 4, "min": 3, "max": 6, "step": 1 }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Locked Nucleus Orbit Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --surface: #171923;
        --border: #3f4250;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 50%, #171923 0%, #0b0c0e 68%);
      }

      .mount-card {
        width: 72%;
        height: 68%;
        left: 14%;
        top: 16%;
        overflow: hidden;
        container-type: size;
        border: 1px solid rgba(167, 139, 250, 0.2);
        border-radius: 32px;
        background: color-mix(in srgb, #171923 84%, transparent);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A fixed center nucleus anchors deterministic satellite orbits that settle into a composed lockup.",
 "class": "3d",
 "tags": [
  "motion-primitive",
  "intro",
  "reveal",
  "orbit",
  "lockup",
  "deterministic"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "label",
   "type": "text",
   "default": "core",
   "maxLength": 200,
   "what": "Text displayed inside the fixed center nucleus."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Color used by the nucleus, rings, and satellite markers."
  },
  {
   "name": "satellites",
   "type": "number",
   "default": 4,
   "min": 3,
   "max": 6,
   "what": "Number of orbiting copy chips."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"label":"anchor","accent":"violet","satellites":6};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="locked-nucleus-orbit-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="locked-nucleus-orbit-mount"
        class="mount-card clip"
        data-composition-id="locked-nucleus-orbit"
       
        data-variable-values='{"label":"anchor","accent":"violet","satellites":6}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1382"
        data-height="734"
      >
      <div id="root" data-composition-id="locked-nucleus-orbit" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0b0c0e);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .lno-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .lno-field {
            position: absolute;
            inset: 0;
          }

          .lno-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--lno-size);
            aspect-ratio: 1;
            border: 0.12cqmin solid color-mix(in srgb, var(--lno-accent) 34%, transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transform-origin: 50% 50%;
            box-shadow: inset 0 0 3cqmin color-mix(in srgb, var(--lno-accent) 5%, transparent);
            opacity: 0;
          }

          .lno-ring:nth-child(1) {
            --lno-size: 46cqmin;
          }

          .lno-ring:nth-child(2) {
            --lno-size: 58cqmin;
          }

          .lno-ring:nth-child(3) {
            --lno-size: 70cqmin;
          }

          .lno-nucleus {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 15cqmin;
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            transform: translate(-50%, -50%);
            border: 0.2cqmin solid color-mix(in srgb, var(--lno-accent) 68%, white 16%);
            border-radius: 50%;
            background: color-mix(in srgb, var(--surface, #172033) 86%, var(--lno-accent) 14%);
            box-shadow:
              0 0 2.8cqmin color-mix(in srgb, var(--lno-accent) 38%, transparent),
              inset 0 0 2.2cqmin color-mix(in srgb, var(--lno-accent) 18%, transparent);
            z-index: 3;
          }

          .lno-nucleus::before {
            content: "";
            position: absolute;
            width: 2.4cqmin;
            aspect-ratio: 1;
            top: 2.5cqmin;
            border-radius: 50%;
            background: var(--lno-accent);
            box-shadow: 0 0 1.8cqmin color-mix(in srgb, var(--lno-accent) 72%, transparent);
          }

          .lno-nucleus-label {
            max-width: 11cqmin;
            margin-top: 3.1cqmin;
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
            font-size: clamp(9px, 2cqmin, 20px);
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
          }

          .lno-arm {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-origin: 0 0;
          }

          .lno-anchor {
            position: absolute;
            left: var(--lno-radius);
            top: 0;
            transform: translate(-50%, -50%);
          }

          .lno-chip {
            min-width: 12cqmin;
            max-width: 22cqmin;
            min-height: 5.2cqmin;
            display: flex;
            align-items: center;
            gap: 1.25cqmin;
            padding: 1.1cqmin 1.8cqmin;
            border: 0.12cqmin solid
              color-mix(in srgb, var(--lno-accent) 48%, var(--border, #334155));
            border-radius: 999px;
            background: color-mix(in srgb, var(--surface, #172033) 90%, transparent);
            box-shadow: 0 1.2cqmin 3.6cqmin color-mix(in srgb, var(--bg, #0b0c0e) 60%, transparent);
            opacity: 0;
            will-change: transform, opacity;
          }

          .lno-marker {
            flex: 0 0 auto;
            width: 2.4cqmin;
            aspect-ratio: 1;
            border: 0.32cqmin solid var(--lno-accent);
            border-radius: 50%;
            box-shadow: 0 0 1.4cqmin color-mix(in srgb, var(--lno-accent) 56%, transparent);
          }

          .lno-copy {
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
            font-size: clamp(8px, 1.8cqmin, 18px);
            font-weight: 650;
            letter-spacing: 0.08em;
            line-height: 1;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
          }
        </style>

        <div
          id="locked-nucleus-orbit-clip"
          class="lno-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="lno-field">
            <div class="lno-ring" aria-hidden="true"></div>
            <div class="lno-ring" aria-hidden="true"></div>
            <div class="lno-ring" aria-hidden="true"></div>
            <div class="lno-satellites"></div>
            <div class="lno-nucleus">
              <span class="lno-nucleus-label"></span>
            </div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var label = root.querySelector(".lno-nucleus-label");
            var satelliteLayer = root.querySelector(".lno-satellites");
            var rings = root.querySelectorAll(".lno-ring");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var accentColors = {
              green: "var(--brand, #34d399)",
              blue: "var(--accent, #38bdf8)",
              violet: "var(--accent-2, #a78bfa)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var countValue = Number(vars.satellites);
            var satelliteCount =
              vars.satellites != null && Number.isFinite(countValue)
                ? Math.max(3, Math.min(6, Math.round(countValue)))
                : 4;
            var labelText = vars.label == null ? "core" : String(vars.label);
            var copy = ["signal", "motion", "frames", "output", "sync", "lock"];
            var radii = [23, 29, 35];

            root.style.setProperty("--lno-accent", accentColors[accent]);
            label.textContent = labelText;

            var satellites = [];
            for (var index = 0; index < satelliteCount; index += 1) {
              var arm = document.createElement("div");
              var anchor = document.createElement("div");
              var chip = document.createElement("div");
              var marker = document.createElement("span");
              var chipCopy = document.createElement("span");

              arm.className = "lno-arm";
              anchor.className = "lno-anchor";
              chip.className = "lno-chip";
              marker.className = "lno-marker";
              chipCopy.className = "lno-copy";
              arm.style.setProperty("--lno-radius", radii[index % radii.length] + "cqmin");
              chipCopy.textContent = copy[index];

              chip.appendChild(marker);
              chip.appendChild(chipCopy);
              anchor.appendChild(chip);
              arm.appendChild(anchor);
              satelliteLayer.appendChild(arm);

              var finalPhase = -90 + (360 * index) / satelliteCount;
              var travel = 210 + (index % 3) * 70;
              satellites.push({
                arm: arm,
                chip: chip,
                startPhase: finalPhase - travel,
                finalPhase: finalPhase,
              });
            }

            var IN_BASE = 0.45;
            var ORBIT_BASE = 1.75;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var motionBase = IN_BASE + ORBIT_BASE;
            var motionScale = duration < motionBase ? duration / motionBase : 1;
            var IN = IN_BASE * motionScale;
            var ORBIT = ORBIT_BASE * motionScale;
            var MOTION = IN + ORBIT;
            var HOLD = Math.max(0, duration - MOTION);
            var fadeStagger = Math.min(0.07, IN / (satelliteCount * 2));
            var fadeDuration = Math.max(0.001, IN - fadeStagger * (satelliteCount - 1));

            gsap.set(rings, { opacity: 0, scale: 0.86 });
            satellites.forEach(function (satellite) {
              gsap.set(satellite.arm, { rotation: satellite.startPhase });
              gsap.set(satellite.chip, {
                opacity: 0,
                rotation: -satellite.startPhase,
                scale: 0.82,
              });
            });

            var tl = gsap.timeline({ paused: true });

            tl.to(rings, { opacity: 0.38, scale: 1, duration: IN, ease: "power2.out" }, 0);

            satellites.forEach(function (satellite, index) {
              tl.to(
                satellite.arm,
                { rotation: satellite.finalPhase, duration: MOTION, ease: "power2.out" },
                0,
              );
              tl.to(
                satellite.chip,
                { rotation: -satellite.finalPhase, duration: MOTION, ease: "power2.out" },
                0,
              );
              tl.to(
                satellite.chip,
                {
                  opacity: 1,
                  scale: 1,
                  duration: fadeDuration,
                  ease: "back.out(1.7)",
                },
                index * fadeStagger,
              );
            });

            if (HOLD > 0.2) {
              tl.to(
                rings,
                {
                  opacity: 0.5,
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                },
                MOTION,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["locked-nucleus-orbit"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["locked-nucleus-orbit-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
