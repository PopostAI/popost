<html data-composition-variables='[
    { "id": "label", "type": "string", "role": "content", "label": "Label", "description": "Text inside the default pill target.", "default": "Get started" },
    { "id": "done_label", "type": "string", "role": "content", "label": "Done label", "description": "Text beside the check once the default pill is pressed.", "default": "Saved" },
    { "id": "target_x", "type": "number", "role": "layout", "label": "Target X", "description": "Zone center, percent of host width.", "default": 50, "min": 8, "max": 92, "step": 1, "unit": "%" },
    { "id": "target_y", "type": "number", "role": "layout", "label": "Target Y", "description": "Zone center, percent of host height.", "default": 50, "min": 8, "max": 92, "step": 1, "unit": "%" },
    { "id": "press_at", "type": "number", "role": "timing", "label": "Press at", "description": "Seconds from mount start when the press begins.", "default": 0.9, "min": 0.9, "max": 10, "step": 0.1, "unit": "s" },
    { "id": "cursor", "type": "enum", "role": "style", "label": "Cursor", "description": "Pointer tone.", "default": "light", "options": [{ "value": "light", "label": "Light" }, { "value": "dark", "label": "Dark" }] },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Contract color for the click rings and the confirmation check.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "style", "label": "Exit", "description": "How the frame leaves. None holds the pressed state.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Fade up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>press-ripple Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #f4f4f5);
      }

      #root {
        --bg: #f4f4f5;
        --fg: #14161b;
        --surface: #ffffff;
        --border: #dfe4ec;
        --brand: #0a84ff;
        --accent: #0284c7;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      .mount-stage {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A cursor decel-arrives from off-stage, lands slightly off-center on a caller-positioned target, compresses with it in lockstep, releases with two small click rings while the label swaps to a check, then exits off-stage while the confirmed state holds.",
 "class": "cursor",
 "tags": [
  "cursor",
  "motion-primitive",
  "product-demo",
  "press",
  "ripple",
  "payoff"
 ],
 "seconds": 1.7,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "label",
   "type": "text",
   "default": "Get started",
   "maxLength": 200,
   "what": "Text inside the default pill target."
  },
  {
   "name": "done_label",
   "type": "text",
   "default": "Saved",
   "maxLength": 200,
   "what": "Text beside the check once the default pill is pressed."
  },
  {
   "name": "target_x",
   "type": "number",
   "default": 50,
   "min": 8,
   "max": 92,
   "unit": "%",
   "what": "Zone center, percent of host width."
  },
  {
   "name": "target_y",
   "type": "number",
   "default": 50,
   "min": 8,
   "max": 92,
   "unit": "%",
   "what": "Zone center, percent of host height."
  },
  {
   "name": "press_at",
   "type": "number",
   "default": 0.9,
   "min": 0.9,
   "max": 10,
   "unit": "s",
   "what": "Seconds from mount start when the press begins."
  },
  {
   "name": "cursor",
   "type": "choice",
   "default": "light",
   "options": [
    "light",
    "dark"
   ],
   "what": "Pointer tone."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Contract color for the click rings and the confirmation check."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "How the frame leaves. None holds the pressed state."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"label":"Save changes","target_x":50,"target_y":52,"press_at":0.9,"cursor":"light","accent":"green"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"whoosh","gain":0.5},{"at":1.3,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="press-ripple-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="2.4"
      data-fps="30"
    >
      <div
        id="press-ripple-mount"
        class="mount-stage clip"
        data-composition-id="press-ripple"
       
        data-variable-values='{"label":"Save changes","target_x":50,"target_y":52,"press_at":0.9,"cursor":"light","accent":"green"}'
        data-start="0"
        data-duration="2.4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      >
      <div id="root" data-composition-id="press-ripple" data-duration="2.4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .pr-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: var(--bg, #0b0c0e);
          }

          .pr-stage {
            position: absolute;
            inset: 0;
          }

          /* Caller-positioned target zone; --pr-x / --pr-y come from the
             target_x / target_y variables. */
          .pr-zone {
            position: absolute;
            left: calc(var(--pr-x, 50) * 1cqw);
            top: calc(var(--pr-y, 50) * 1cqh);
            transform: translate(-50%, -50%);
          }

          /* Click rings around the cursor tip; the script sets cx/cy/r in px. */
          .pr-rings {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
          }

          .pr-ring {
            fill: none;
            stroke: var(--pr-accent, #71f5a7);
            opacity: 0;
          }

          /* GSAP owns this wrapper's opacity/y (entrance) and scale (press). */
          .pr-actor {
            position: relative;
            will-change: transform, opacity;
          }

          .pr-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: var(--space-2, 2.6cqmin) calc(var(--space-2, 2.6cqmin) * 2.1);
            border: 0.22cqmin solid var(--border, #343a46);
            border-radius: 999px;
            background: var(--surface, #14171c);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            font-size: 4.6cqmin;
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.015em;
            white-space: nowrap;
          }

          /* The label stays in flow so the pill keeps its width; the done
             state is layered over it and cross-fades in. */
          .pr-label {
            display: inline-block;
          }

          .pr-done {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3em;
            opacity: 0;
          }

          .pr-check {
            width: 0.9em;
            height: 0.9em;
            fill: none;
            stroke: var(--pr-accent, #71f5a7);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          /* Pointer: the script sizes the box and offsets it so the arrow tip
             sits at the stage origin; GSAP x/y then place the tip itself and
             the press scales about it. */
          .pr-cursor {
            position: absolute;
            left: 0;
            top: 0;
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.3));
            will-change: transform, opacity;
          }

          .pr-cursor svg {
            display: block;
            width: 100%;
            height: 100%;
          }
        </style>

        <div
          id="press-ripple-clip"
          class="pr-clip clip"
          data-start="0"
          data-duration="2.4"
          data-track-index="0"
        >
          <div class="pr-stage">
            <div class="pr-zone">
              <div class="pr-actor">
                <div class="pr-target-slot" data-slot="target" data-state="idle">
                  <span class="pr-pill"
                    ><span class="pr-label"></span
                    ><span class="pr-done"
                      ><svg class="pr-check" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 12.5 L9.5 17 L19 7.5"></path></svg
                      ><span class="pr-done-text"></span></span
                  ></span>
                </div>
              </div>
            </div>
            <svg class="pr-rings" aria-hidden="true">
              <circle class="pr-ring"></circle>
              <circle class="pr-ring"></circle>
            </svg>
            <div class="pr-cursor" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  class="pr-cursor-path"
                  d="M5 3 L5 19 L9 15 L12 22 L15 20.5 L11.5 14 L18 14 Z"
                  stroke-width="1.4"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".pr-stage");
            var rings = root.querySelectorAll(".pr-ring");
            var actor = root.querySelector(".pr-actor");
            var slot = root.querySelector(".pr-target-slot");
            var label = root.querySelector(".pr-label");
            var done = root.querySelector(".pr-done");
            var cursor = root.querySelector(".pr-cursor");
            var cursorPath = root.querySelector(".pr-cursor-path");

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              if (!isFinite(n)) n = fallback;
              return Math.min(max, Math.max(min, n));
            }

            function text(value, fallback) {
              return value == null ? fallback : String(value).trim().replace(/\s+/g, " ");
            }

            var labelText = text(vars.label, "Get started");
            var doneText = text(vars.done_label, "Saved");
            var targetX = num(vars.target_x, 50, 8, 92);
            var targetY = num(vars.target_y, 50, 8, 92);
            var cursorTone = vars.cursor === "dark" ? "dark" : "light";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            // The bundler mirrors composition variables as scoped CSS custom
            // props, so this unit's own accent variable shadows the contract
            // --accent token inside the subtree ("blue" is a valid CSS color
            // and would render pure blue). When the shadow is present, fall
            // back to the literal contract value instead of var(--accent).
            var computedAccent = getComputedStyle(root).getPropertyValue("--accent").trim();
            if (
              computedAccent === "green" ||
              computedAccent === "blue" ||
              computedAccent === "violet"
            ) {
              accentColors.blue = "#61a8ff";
            }

            label.textContent = labelText;
            root.querySelector(".pr-done-text").textContent = doneText;
            root.style.setProperty("--pr-accent", accentColors[accent]);
            root.style.setProperty("--pr-x", String(targetX));
            root.style.setProperty("--pr-y", String(targetY));
            if (cursorTone === "dark") {
              cursorPath.setAttribute("fill", "#141414");
              cursorPath.setAttribute("stroke", "#ffffff");
            } else {
              cursorPath.setAttribute("fill", "#ffffff");
              cursorPath.setAttribute("stroke", "#141414");
            }

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "2.4"));
            var OUT = exit === "none" ? 0 : 0.45;
            // Press to cursor gone; keep it inside D, then the OUT window after it.
            var TAIL = 0.8;
            var pressAt = num(vars.press_at, 0.9, 0.9, Math.max(0.9, duration - TAIL - OUT));
            // Human aim: the tip lands a few px off the zone's true center.
            var landX = targetX + 0.55;
            var landY = targetY + 0.85;
            var arriveEnd = pressAt - 0.15;
            var arriveStart = arriveEnd - 0.45;

            // Motion runs on transforms only (x/y px), never left/top: layout
            // props snap to integer device pixels under the seek-by-frame
            // capture engine. Stage size is read once, synchronously, at load
            // (deterministic: fixed viewport per render) to convert the
            // percent-based land/off-stage positions into px.
            var stageW = root.clientWidth || 1920;
            var stageH = root.clientHeight || 1080;
            function xAt(percent) {
              return (percent / 100) * stageW;
            }
            function yAt(percent) {
              return (percent / 100) * stageH;
            }

            // Sizes are authored at 1920 wide and scale with the stage.
            var u = stageW / 1920;
            var ARROW = 64 * u;
            cursor.style.width = cursor.style.height = ARROW + "px";
            cursor.style.left = (-5 / 24) * ARROW + "px";
            cursor.style.top = (-3 / 24) * ARROW + "px";
            cursor.style.transformOrigin = (5 / 24) * ARROW + "px " + (3 / 24) * ARROW + "px";

            for (var i = 0; i < rings.length; i++) {
              rings[i].setAttribute("cx", xAt(landX));
              rings[i].setAttribute("cy", yAt(landY));
              rings[i].setAttribute("r", 16 * u);
              rings[i].setAttribute("stroke-width", 2 * u);
            }

            var tl = gsap.timeline({ paused: true });

            // IN: target settles in.
            tl.fromTo(
              actor,
              { opacity: 0, y: "2.6cqh" },
              { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
              0,
            );

            // Cursor decel-arrives from off-stage bottom-right to an exact
            // endpoint: it arrives, it never passes through.
            tl.fromTo(
              cursor,
              { x: xAt(114), y: yAt(112) },
              {
                x: xAt(landX),
                y: yAt(landY),
                duration: arriveEnd - arriveStart,
                ease: "power3.out",
              },
              arriveStart,
            );

            // Press: target and cursor compress in lockstep (cursor about its
            // tip), then release with a soft spring.
            tl.to([actor, cursor], { scale: 0.93, duration: 0.12, ease: "power1.in" }, pressAt);
            tl.set(slot, { attr: { "data-state": "pressed" } }, pressAt + 0.12);
            tl.to(
              [actor, cursor],
              { scale: 1, duration: 0.42, ease: "back.out(1.8)" },
              pressAt + 0.14,
            );

            // Click: two rings grow from the tip, the second 60ms behind and fainter.
            // Opacity fades late so the ring stays readable while it grows.
            [1, 0.6].forEach(function (peak, i) {
              var at = pressAt + 0.12 + i * 0.06;
              var ring = { duration: 0.32, immediateRender: false };
              tl.fromTo(
                rings[i],
                { attr: { r: 16 * u } },
                Object.assign({ attr: { r: 72 * u }, ease: "power2.out" }, ring),
                at,
              );
              tl.fromTo(
                rings[i],
                { opacity: peak },
                Object.assign({ opacity: 0, ease: "power1.in" }, ring),
                at,
              );
            });

            // Confirm: the label cross-fades to check + done label (icon swap).
            var swap = { duration: 0.3, ease: "power3.out", immediateRender: false };
            tl.fromTo(
              label,
              { scale: 1, opacity: 1, filter: "blur(0px)" },
              Object.assign({ scale: 0.3, opacity: 0, filter: "blur(3px)" }, swap),
              pressAt + 0.12,
            );
            tl.fromTo(
              done,
              { scale: 0.3, opacity: 0, filter: "blur(3px)" },
              Object.assign({ scale: 1, opacity: 1, filter: "blur(0px)" }, swap),
              pressAt + 0.12,
            );

            // The cursor exits off-stage (accelerating) so it never occludes the
            // label during the hold. Both endpoints are explicit so reverse
            // seeks restore the landing.
            tl.fromTo(
              cursor,
              { x: xAt(landX), y: yAt(landY) },
              {
                x: xAt(112),
                y: yAt(110),
                duration: 0.4,
                ease: "power2.in",
                immediateRender: false,
              },
              pressAt + 0.4,
            );

            // HOLD: dead-still on the pressed state; elastic with D.

            // OUT: only when the host opts in; frame roots own transitions.
            if (exit !== "none") {
              var outStart = Math.max(pressAt + TAIL, duration - OUT);
              var outVars = { opacity: 0, duration: OUT, ease: "power2.in" };
              if (exit === "up") outVars.y = "-4cqh";
              tl.to(stage, outVars, outStart);
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["press-ripple"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["press-ripple-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
