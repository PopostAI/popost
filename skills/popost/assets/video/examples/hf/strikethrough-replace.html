<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Strikethrough Replace - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 900px;
        min-height: 500px;
        padding: 64px;
        /* ponytail: scale non-GSAP wrapper; GSAP targets are children */
        transform: scale(2.8);
      }
      .hf-catalog-strikethrough-replace {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-strikethrough-replace {
        position: relative;
        display: inline-grid;
        grid-auto-flow: column;
        gap: 18px;
        align-items: center;
        font-size: 58px;
      }
      .hf-catalog-strikethrough-replace i {
        position: absolute;
        left: 0;
        width: 48%;
        height: 6px;
        border-radius: 999px;
        background: #ef4444;
        transform: scaleX(var(--hf-strike-progress, 1));
        transform-origin: left center;
      }
      .hf-catalog-strikethrough-replace strong {
        opacity: var(--hf-replace-opacity, 1);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Draw a strike line across old text, then reveal the replacement.",
 "class": "text",
 "tags": [
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "origin",
   "type": "choice",
   "default": "left",
   "options": [
    "left",
    "center",
    "right"
   ],
   "what": "Edge the strike grows out of as the timeline runs its scale from 0 to 1."
  },
  {
   "name": "thickness",
   "type": "choice",
   "default": "standard",
   "options": [
    "thin",
    "standard",
    "thick"
   ],
   "what": "Height of the strike line, from a hairline rule to a heavy bar."
  },
  {
   "name": "tint",
   "type": "choice",
   "default": "red",
   "options": [
    "red",
    "amber",
    "blue",
    "violet"
   ],
   "what": "Strike colour. Blue and violet ride --accent and --accent-2."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper"
   ],
   "what": "Colour of both words: ink for light frames, paper for dark ones."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="strikethrough-replace-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-catalog-strikethrough-replace"
          data-composition-variables='[
    { "id": "origin", "type": "enum", "role": "motion", "label": "Origin", "description": "Edge the strike grows out of as the timeline runs its scale from 0 to 1.", "default": "left", "options": [{ "value": "left", "label": "Left" }, { "value": "center", "label": "Center" }, { "value": "right", "label": "Right" }] },
    { "id": "thickness", "type": "enum", "role": "style", "label": "Thickness", "description": "Height of the strike line, from a hairline rule to a heavy bar.", "default": "standard", "options": [{ "value": "thin", "label": "Thin" }, { "value": "standard", "label": "Standard" }, { "value": "thick", "label": "Thick" }] },
    { "id": "tint", "type": "enum", "role": "style", "label": "Tint", "description": "Strike colour. Blue and violet ride --accent and --accent-2.", "default": "red", "options": [{ "value": "red", "label": "Red" }, { "value": "amber", "label": "Amber" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Colour of both words: ink for light frames, paper for dark ones.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }] }
  ]'
        >
          <span>Slow</span><i></i><strong>Fast</strong>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var origins = { left: "left center", center: "center", right: "right center" };
          var thicknesses = { thin: "3px", standard: "6px", thick: "10px" };
          var tints = {
            red: "#ef4444",
            amber: "#f59e0b",
            blue: "var(--accent, #38bdf8)",
            violet: "var(--accent-2, #a78bfa)",
          };
          var tones = { ink: "#18181b", paper: "#fafafa" };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var origin = origins[pick(origins, vars.origin, "left")];
          var thickness = thicknesses[pick(thicknesses, vars.thickness, "standard")];
          var tint = tints[pick(tints, vars.tint, "red")];
          var tone = tones[pick(tones, vars.tone, "ink")];

          var roots = document.querySelectorAll(".hf-catalog-strikethrough-replace");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-strike-origin", origin);
            roots[i].style.setProperty("--hf-strike-thickness", thickness);
            roots[i].style.setProperty("--hf-strike-color", tint);
            roots[i].style.setProperty("--hf-strike-text-color", tone);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-strikethrough-replace i",
          { "--hf-strike-progress": 0 },
          { "--hf-strike-progress": 1, duration: 0.28, ease: "power2.out" },
          startTime,
        );
        tl.fromTo(
          ".hf-catalog-strikethrough-replace strong",
          { "--hf-replace-opacity": 0, y: 14 },
          { "--hf-replace-opacity": 1, y: 0, duration: 0.3, ease: "power2.out" },
          startTime + 0.24,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["strikethrough-replace-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-strikethrough-replace {
        color: var(--hf-strike-text-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-strikethrough-replace {
        position: relative;
        display: inline-grid;
        grid-auto-flow: column;
        gap: 18px;
        align-items: center;
        font-size: 58px;
      }
      .hf-catalog-strikethrough-replace i {
        position: absolute;
        left: 0;
        width: 48%;
        height: var(--hf-strike-thickness, 6px);
        border-radius: 999px;
        background: var(--hf-strike-color, #ef4444);
        transform: scaleX(var(--hf-strike-progress, 1));
        transform-origin: var(--hf-strike-origin, left center);
      }
      .hf-catalog-strikethrough-replace strong {
        opacity: var(--hf-replace-opacity, 1);
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
