<html data-composition-variables='[
    { "id": "scanColor", "type": "string", "role": "style", "label": "Scan color", "description": "Any CSS color value used by the scan line and recognition glow.", "default": "var(--brand, #22c55e)" },

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Camera Scan Gate - Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #132036 0%, #05070d 72%);
      }

      /* A definite host box is required for the primitive's cqw/cqh geometry.
         data-width/data-height below mirror these rendered dimensions for
         tooling, while the primitive itself stays fully elastic. */
      .mount-card {
        --bg: #0d1728;
        --fg: #f8fafc;
        --surface: #17253a;
        --border: #50647d;
        --muted: #a5b4c7;
        --brand: #22c55e;
        --accent: #38bdf8;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --dur-beat: 0.48s;
        width: 48%;
        height: 64%;
        left: 26%;
        top: 18%;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 32px;
        box-shadow: 0 42px 100px rgba(0, 0, 0, 0.48);
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A camera and QR recognition moment with a viewfinder sweep, bracket lock, confirmation pulse, and verified next beat.",
 "class": "camera",
 "tags": [
  "prop",
  "ui-props",
  "camera",
  "qr",
  "scan",
  "recognition",
  "interaction",
  "demonstrate"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "scanColor",
   "type": "text",
   "default": "var(--brand, #22c55e)",
   "maxLength": 200,
   "what": "Any CSS color value used by the scan line and recognition glow."
  },
  {
   "name": "targetLabel",
   "type": "text",
   "default": "Verified",
   "maxLength": 200,
   "what": "Confirmation label revealed at recognition lock. Blank hides the line."
  },
  {
   "name": "sweepSpeed",
   "type": "number",
   "default": 1,
   "min": 0.8,
   "max": 1.6,
   "unit": "x",
   "what": "Speed multiplier for the scan sweep phase only."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"scanColor":"var(--accent)","targetLabel":"Payment approved","sweepSpeed":1.1};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.14,"cue":"whoosh","gain":0.5}]</script>

  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="camera-scan-gate-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="camera-scan-gate-mount"
        class="mount-card clip"
        data-composition-id="camera-scan-gate"
       
        data-variable-values='{"scanColor":"var(--accent)","targetLabel":"Payment approved","sweepSpeed":1.1}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="922"
        data-height="691"
      >
      <div
        id="root"
        data-composition-id="camera-scan-gate"
        data-start="0"
        data-duration="4"
        data-fps="30"
      >
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* INVARIANT: the host owns dimensions. #root fills that box and
             establishes the cqw/cqh basis for every visible measurement. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .csg-clip {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #0b1120);
          }

          .csg-stage {
            position: relative;
            width: min(64cqw, 76cqh);
            aspect-ratio: 1;
            opacity: 0;
          }

          /* EDIT ZONE: the outer viewfinder is a square so one centered scale
             operation tightens all four brackets onto the target equally. */
          .csg-frame,
          .csg-corner-layer,
          .csg-scan-window {
            position: absolute;
            inset: 0;
          }

          .csg-frame {
            border: 0.16cqw solid color-mix(in srgb, var(--border, #334155) 74%, transparent);
            border-radius: var(--space-2, 2.4cqw);
            background: color-mix(in srgb, var(--surface, #1e293b) 34%, transparent);
            box-shadow: inset 0 0 5cqw color-mix(in srgb, var(--bg, #0b1120) 60%, transparent);
          }

          .csg-grid {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image:
              linear-gradient(
                to right,
                transparent 33%,
                color-mix(in srgb, var(--border, #334155) 32%, transparent) 33% 33.25%,
                transparent 33.25% 66.5%,
                color-mix(in srgb, var(--border, #334155) 32%, transparent) 66.5% 66.75%,
                transparent 66.75%
              ),
              linear-gradient(
                to bottom,
                transparent 33%,
                color-mix(in srgb, var(--border, #334155) 32%, transparent) 33% 33.25%,
                transparent 33.25% 66.5%,
                color-mix(in srgb, var(--border, #334155) 32%, transparent) 66.5% 66.75%,
                transparent 66.75%
              );
            opacity: 0.55;
          }

          .csg-ambient {
            position: absolute;
            inset: -4%;
            border: 0.45cqw solid
              color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 48%, transparent);
            border-radius: var(--space-3, 3.2cqw);
            box-shadow: 0 0 4.5cqw
              color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 38%, transparent);
            opacity: 0;
          }

          .csg-corner-layer {
            transform-origin: center;
            z-index: 3;
          }

          .csg-corner {
            position: absolute;
            width: 18%;
            height: 18%;
            border-color: var(--csg-scan-color, var(--brand, #22c55e));
            border-style: solid;
            filter: drop-shadow(
              0 0 0.9cqw
                color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 56%, transparent)
            );
          }

          .csg-corner-tl {
            top: 0;
            left: 0;
            border-width: 0.65cqw 0 0 0.65cqw;
            border-radius: var(--space-2, 2.4cqw) 0 0;
          }

          .csg-corner-tr {
            top: 0;
            right: 0;
            border-width: 0.65cqw 0.65cqw 0 0;
            border-radius: 0 var(--space-2, 2.4cqw) 0 0;
          }

          .csg-corner-br {
            right: 0;
            bottom: 0;
            border-width: 0 0.65cqw 0.65cqw 0;
            border-radius: 0 0 var(--space-2, 2.4cqw);
          }

          .csg-corner-bl {
            bottom: 0;
            left: 0;
            border-width: 0 0 0.65cqw 0.65cqw;
            border-radius: 0 0 0 var(--space-2, 2.4cqw);
          }

          .csg-scan-window {
            z-index: 2;
            inset: 3.5%;
            overflow: hidden;
          }

          .csg-sweep {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
          }

          .csg-scan-line {
            position: absolute;
            inset: 0 0 auto;
            width: 100%;
            height: 0.38cqh;
            border-radius: 999cqw;
            background: var(--csg-scan-color, var(--brand, #22c55e));
            box-shadow:
              0 0 1.2cqw var(--csg-scan-color, var(--brand, #22c55e)),
              0 1.8cqh 3.6cqh
                color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 42%, transparent);
          }

          .csg-target {
            position: absolute;
            z-index: 1;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border: 0.2cqw solid
              color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 65%, transparent);
            border-radius: var(--space-2, 2.4cqw);
            background: color-mix(
              in srgb,
              var(--csg-scan-color, var(--brand, #22c55e)) 7%,
              transparent
            );
            opacity: 0;
          }

          .csg-confirmation {
            position: absolute;
            z-index: 4;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-2, 2.2cqh);
          }

          .csg-pulse {
            position: absolute;
            width: 30%;
            aspect-ratio: 1;
            border: 0.42cqw solid var(--csg-scan-color, var(--brand, #22c55e));
            border-radius: 50%;
            box-shadow: 0 0 4.5cqw
              color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 58%, transparent);
            opacity: 0;
          }

          .csg-check {
            display: block;
            width: 8.5%;
            height: 15%;
            margin-top: -5%;
            border-right: 0.8cqw solid var(--csg-scan-color, var(--brand, #22c55e));
            border-bottom: 0.8cqw solid var(--csg-scan-color, var(--brand, #22c55e));
            filter: drop-shadow(
              0 0 1.1cqw
                color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 65%, transparent)
            );
            opacity: 0;
            transform: rotate(45deg);
          }

          .csg-label {
            min-width: 34%;
            padding: var(--space-1, 1cqh) var(--space-3, 3cqw);
            border: 0.14cqw solid
              color-mix(in srgb, var(--csg-scan-color, var(--brand, #22c55e)) 48%, transparent);
            border-radius: 999cqw;
            background: color-mix(in srgb, var(--surface, #1e293b) 88%, transparent);
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: clamp(2cqh, 2.8cqw, 3.3cqh);
            font-weight: 760;
            letter-spacing: 0.035em;
            line-height: 1.1;
            text-align: center;
            opacity: 0;
          }

          .csg-label:empty {
            display: none;
          }
        </style>

        <div
          id="camera-scan-gate-clip"
          class="csg-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="csg-stage" role="img" aria-label="Camera recognition scanner">
            <div class="csg-frame">
              <div class="csg-grid" aria-hidden="true"></div>
            </div>
            <div class="csg-ambient" aria-hidden="true"></div>
            <div class="csg-target" aria-hidden="true"></div>
            <div class="csg-scan-window" aria-hidden="true">
              <div class="csg-sweep">
                <div class="csg-scan-line"></div>
              </div>
            </div>
            <div class="csg-corner-layer" aria-hidden="true">
              <span class="csg-corner csg-corner-tl"></span>
              <span class="csg-corner csg-corner-tr"></span>
              <span class="csg-corner csg-corner-br"></span>
              <span class="csg-corner csg-corner-bl"></span>
            </div>
            <div class="csg-confirmation">
              <span class="csg-pulse" aria-hidden="true"></span>
              <span class="csg-check" aria-hidden="true"></span>
              <span class="csg-label"></span>
            </div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            // Literal, not read from the DOM. Mounted flattening strips the
            // root's data-composition-id before timeline registration.
            var compositionId = "camera-scan-gate";
            var stage = root.querySelector(".csg-stage");
            var cornerLayer = root.querySelector(".csg-corner-layer");
            var sweep = root.querySelector(".csg-sweep");
            var target = root.querySelector(".csg-target");
            var ambient = root.querySelector(".csg-ambient");
            var pulse = root.querySelector(".csg-pulse");
            var check = root.querySelector(".csg-check");
            var label = root.querySelector(".csg-label");

            // EDIT ZONE: declared defaults and per-instance overrides have one
            // owner after mount, window.__hyperframes.getVariables().
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var scanColor =
              vars.scanColor == null || String(vars.scanColor).trim() === ""
                ? "var(--brand, #22c55e)"
                : String(vars.scanColor);
            var targetLabel = vars.targetLabel == null ? "" : String(vars.targetLabel);
            var rawSweepSpeed = Number(vars.sweepSpeed);
            // INVARIANT: sweep speed is finite and clamped to the declared
            // 0.8 to 1.6 range. It never changes IN, HOLD, OUT, or sync points.
            var sweepSpeed = Number.isFinite(rawSweepSpeed)
              ? Math.max(0.8, Math.min(1.6, rawSweepSpeed))
              : 1;

            root.style.setProperty("--csg-scan-color", scanColor);
            label.textContent = targetLabel;

            var beatValue = parseFloat(getComputedStyle(root).getPropertyValue("--dur-beat"));
            var beat = Number.isFinite(beatValue) && beatValue > 0 ? beatValue : 0.5;
            var AMBIENT_HALF = beat * 1.5;

            // RETIME RANGE: IN_BASE and OUT_BASE own the interaction envelope.
            // The only elastic phase is HOLD. Short durations scale IN and OUT
            // together with one factor, never gsap.timeScale().
            var IN_BASE = 1.05;
            var OUT_BASE = 0.5;
            var STAGE_IN_BASE = 0.28;
            var SWEEP_DURATION_BASE = 0.4;
            var SWEEP_LANDS_BASE = 0.5;
            var LOCK_AT_BASE = 0.68;
            var LOCK_DURATION_BASE = 0.22;
            var CONFIRM_DURATION_BASE = 0.2;
            var PULSE_HALF_BASE = 0.18;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var STAGE_IN = STAGE_IN_BASE * scale;
            var SWEEP_LANDS = SWEEP_LANDS_BASE * scale;
            var SWEEP_DURATION = (SWEEP_DURATION_BASE / sweepSpeed) * scale;
            var SWEEP_START = Math.max(0, SWEEP_LANDS - SWEEP_DURATION);
            var LOCK_AT = LOCK_AT_BASE * scale;
            var LOCK_DURATION = LOCK_DURATION_BASE * scale;
            var CONFIRM_DURATION = CONFIRM_DURATION_BASE * scale;
            var PULSE_HALF = PULSE_HALF_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            function fireSfx(id, t) {
              root.dispatchEvent(
                new CustomEvent("hf:sfx", { detail: { id: id, t: t }, bubbles: true }),
              );
            }

            // Explicit both-endpoints state before timeline construction keeps
            // direct seek to t=0 correct without playing through prior frames.
            gsap.set(stage, { opacity: 0, scale: 0.94 });
            gsap.set(cornerLayer, { scale: 1 });
            gsap.set(sweep, { opacity: 1, yPercent: 0 });
            gsap.set(target, { opacity: 0, scale: 0.96 });
            gsap.set(ambient, { opacity: 0, scale: 1 });
            gsap.set(pulse, { opacity: 0, scale: 0.9 });
            gsap.set(check, { opacity: 0, scale: 0.94 });
            gsap.set(label, { opacity: 0, y: "1.2cqh", scale: 0.96 });

            var tl = gsap.timeline({ paused: true });

            // IN: settle, scan, then lock. The sweep uses --ease-standard's
            // GSAP equivalent and lands at a fixed offset inside IN.
            tl.to(stage, { opacity: 1, scale: 1, duration: STAGE_IN, ease: "power2.out" }, 0);
            tl.to(
              sweep,
              { yPercent: 100, duration: SWEEP_DURATION, ease: "power2.out" },
              SWEEP_START,
            );
            tl.set(sweep, { opacity: 0 }, SWEEP_LANDS);

            // recognition-lock is the single causal gate. Corner tightening is
            // the one moderate --ease-overshoot motion in this primitive.
            tl.to(
              cornerLayer,
              { scale: 0.6, duration: LOCK_DURATION, ease: "back.out(1.7)" },
              LOCK_AT,
            );
            tl.to(
              target,
              { opacity: 1, scale: 1, duration: CONFIRM_DURATION, ease: "power2.out" },
              LOCK_AT,
            );
            tl.to(
              check,
              { opacity: 1, scale: 1, duration: CONFIRM_DURATION, ease: "power2.out" },
              LOCK_AT,
            );
            tl.to(
              label,
              { opacity: 1, y: 0, scale: 1, duration: CONFIRM_DURATION, ease: "power2.out" },
              LOCK_AT,
            );
            tl.to(
              pulse,
              {
                opacity: 0.9,
                scale: 1.25,
                duration: PULSE_HALF,
                ease: "power2.out",
                yoyo: true,
                repeat: 1,
              },
              LOCK_AT,
            );
            // Side-effect invariant: this timeline callback is the only actor
            // that emits lock-chime, once at the recognition-lock sync point.
            tl.call(
              function () {
                fireSfx("lock-chime", LOCK_AT);
              },
              [],
              LOCK_AT,
            );

            // HOLD: a separate layer breathes with a finite repeat count, so
            // the resolved gate stays alive without competing with lock tweens.
            if (HOLD > AMBIENT_HALF) {
              var ambientRepeat = Math.max(0, Math.floor(HOLD / AMBIENT_HALF) - 1);
              tl.to(
                ambient,
                {
                  opacity: 0.3,
                  scale: 1.015,
                  duration: AMBIENT_HALF,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: ambientRepeat,
                },
                HOLD_START,
              );
            }

            // OUT: asymmetric release. HOLD alone absorbs duration changes.
            tl.to(stage, { opacity: 0, scale: 0.98, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      // The demo owns no motion. It registers one empty paused timeline under
      // its own id, while the mounted primitive owns the interaction timeline.
      window.__timelines = window.__timelines || {};
      window.__timelines["camera-scan-gate-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
