<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #mk-sl-root {
        /* ---- mk tokens: override in the host to re-skin the family ---- */
        --mk-font: "Inter", -apple-system, sans-serif;
        --mk-ink: #1d1d1f;
        --mk-ink-dim: #6e6e73;
        --mk-ink-dark: #f5f5f7;
        --mk-ink-dim-dark: #a1a1a6;
        --mk-accent: #0071e3;
        --mk-accent-dark: #7d5cff;
        --mk-hairline: 2px;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent; /* overlays footage or mk-background */
      }
      #mk-sl-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 62%);
        opacity: 0;
      }
      #mk-sl-col {
        position: absolute;
        display: flex;
        flex-direction: column;
      }
      .mk-sl-row {
        font-family: var(--mk-font);
        line-height: 1;
        opacity: 0;
      }
      .mk-sl-text {
        display: flex;
        align-items: baseline;
        gap: 18px;
        white-space: nowrap;
      }
      .mk-sl-label {
        font-weight: 600;
        font-size: 46px;
        letter-spacing: -0.015em;
        color: var(--mk-ink);
      }
      .mk-sl-value {
        font-weight: 400;
        font-size: 40px;
        letter-spacing: -0.01em;
        color: var(--mk-ink-dim);
      }
      .mk-sl-line {
        position: relative;
        margin-top: 22px;
        height: var(--mk-hairline);
        background: rgba(0, 0, 0, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .mk-sl-line-fill {
        position: absolute;
        inset: 0;
        background: var(--mk-accent);
        transform-origin: left center;
      }
      /* dark scheme: white rows for use over footage (overlay look) */
      .mk-dark .mk-sl-label {
        color: var(--mk-ink-dark);
      }
      .mk-dark .mk-sl-value {
        color: var(--mk-ink-dim-dark);
      }
      .mk-dark .mk-sl-line {
        background: rgba(255, 255, 255, 0.18);
      }
      .mk-dark .mk-sl-line-fill {
        background: var(--mk-accent-dark);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Left-aligned specs/traits checklist over footage or a board: rows slide in staggered with an accent underline sweep; light and dark schemes",
 "class": "motion",
 "tags": [
  "data-viz",
  "list",
  "minimal",
  "professional"
 ],
 "seconds": 7.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="mk-sl-root"
      data-composition-id="mk-specs-list"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mk-sl-scrim"></div>
      <div id="mk-sl-col"></div>
      <div
        id="mk-sl-drv"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ---- */
        var CONFIG = {
          scheme: "light", // "light" (ink rows) | "dark" (white rows, for footage)
          rows: [
            { label: "Design", value: "Minimal, clean lines" },
            { label: "Typography", value: "Inter SemiBold" },
            { label: "Motion", value: "Restrained, no bounce" },
            { label: "Color", value: "Stage + one accent" },
            { label: "Shapes", value: "Capsules & rounded cards" },
          ],
          underline: true, // accent sweep under each row
          lineWidth: 660, // px
          scrim: 0, // 0–1 left-edge dark scrim for readability over footage
          x: 160, // column left edge
          rowGap: 44, // px between rows
          stagger: 0.18, // s between row entrances
          animationIn: true,
          animationOut: true,
        };

        var DUR = 8;
        var root = document.getElementById("mk-sl-root");
        var col = document.getElementById("mk-sl-col");
        var scrim = document.getElementById("mk-sl-scrim");

        if (CONFIG.scheme === "dark") root.classList.add("mk-dark");
        scrim.style.opacity = String(CONFIG.scrim);

        /* build rows */
        CONFIG.rows.forEach(function (r, i) {
          var row = document.createElement("div");
          row.id = "mk-sl-row-" + i;
          row.className = "mk-sl-row";
          if (i > 0) row.style.marginTop = CONFIG.rowGap + "px";

          var text = document.createElement("div");
          text.className = "mk-sl-text";
          var label = document.createElement("span");
          label.className = "mk-sl-label";
          label.textContent = r.label;
          text.appendChild(label);
          if (r.value) {
            var value = document.createElement("span");
            value.className = "mk-sl-value";
            value.textContent = r.value;
            text.appendChild(value);
          }
          row.appendChild(text);

          if (CONFIG.underline) {
            var line = document.createElement("div");
            line.className = "mk-sl-line";
            line.style.width = CONFIG.lineWidth + "px";
            var fill = document.createElement("div");
            fill.id = "mk-sl-fill-" + i;
            fill.className = "mk-sl-line-fill";
            line.appendChild(fill);
            row.appendChild(line);
          }
          col.appendChild(row);
        });

        /* center the column vertically */
        var colH =
          CONFIG.rows.length * (46 + 22 + (CONFIG.underline ? 2 : 0)) +
          (CONFIG.rows.length - 1) * CONFIG.rowGap;
        col.style.left = CONFIG.x + "px";
        col.style.top = Math.round((1080 - colH) / 2) + "px";

        var tl = gsap.timeline({ paused: true });

        CONFIG.rows.forEach(function (r, i) {
          var row = document.getElementById("mk-sl-row-" + i);
          var t0 = (CONFIG.animationIn ? 0.3 : 0) + i * CONFIG.stagger;

          if (CONFIG.animationIn) {
            gsap.set(row, { opacity: 0, x: -36 });
            tl.to(row, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, t0);
          } else {
            gsap.set(row, { opacity: 1 });
          }

          if (CONFIG.underline) {
            var fill = document.getElementById("mk-sl-fill-" + i);
            gsap.set(fill, { scaleX: 0 });
            tl.to(fill, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, t0 + 0.15);
          }
        });

        /* exit + hard kill */
        if (CONFIG.animationOut) {
          tl.to(col, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
          tl.to(scrim, { opacity: 0, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-specs-list"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
