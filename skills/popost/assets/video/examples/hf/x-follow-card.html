<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>X Follow Card - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #fafafa;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 52px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~65% of 1920px frame */
        transform: scale(1.9);
        transform-origin: center center;
      }
      .hf-catalog-x-follow-card {
        --hf-accent: var(--accent, #f8fafc);
        --hf-ink: #111827;
        --hf-l1: rgba(255, 255, 255, 0.72);
        --hf-l2: rgba(255, 255, 255, 0.45);
        --hf-muted: #6b7280;
        --hf-surface: #ffffff;
        color: var(--hf-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-catalog-x-follow-card {
        width: 700px;
        border-radius: 30px;
        padding: 34px;
        background: #0f172a;
        color: #fff;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
      }
      .hf-catalog-x-follow-card header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .hf-catalog-x-follow-card .avatar {
        width: 70px;
        height: 70px;
        border-radius: 22px;
        background: var(--hf-l1);
      }
      .hf-catalog-x-follow-card h3 {
        margin: 0;
        font-size: 36px;
        letter-spacing: -0.04em;
      }
      .hf-catalog-x-follow-card p {
        color: #94a3b8;
        margin: 4px 0 0;
        font-size: 18px;
      }
      .hf-catalog-x-follow-card .stat {
        margin-top: 30px;
        font-size: 82px;
        font-weight: 900;
        letter-spacing: -0.08em;
        transform: translateY(var(--hf-stat-y, 0px));
      }
      .hf-catalog-x-follow-card .avatars {
        display: flex;
        margin-top: 18px;
      }
      .hf-catalog-x-follow-card .avatars span {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        border: 3px solid #0f172a;
        margin-left: -10px;
        background: var(--c);
        opacity: var(--hf-avatar-opacity, 1);
        transform: translateY(var(--hf-avatar-y, 0px));
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A social follow card with avatar, handle, and follower motion.",
 "class": "ui",
 "tags": [
  "social-overlay"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="x-follow-card-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="hf-catalog-x-follow-card">
          <header>
            <div class="avatar"></div>
            <div>
              <h3>X Follow Card</h3>
              <p>A social follow card with avatar, handle, and follower motion.</p>
            </div>
          </header>
          <div class="stat">30.6K</div>
          <div class="avatars">
            <span style="--c: var(--hf-l1)"></span><span style="--c: var(--hf-l2)"></span
            ><span style="--c: var(--hf-l2)"></span><span style="--c: var(--hf-l2)"></span
            ><span style="--c: var(--hf-l2)"></span><span style="--c: var(--hf-l2)"></span>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-x-follow-card .stat",
          { "--hf-stat-y": "28px", opacity: 0 },
          { "--hf-stat-y": "0px", opacity: 1, duration: 0.46, ease: "back.out(1.6)" },
          startTime,
        );
        tl.fromTo(
          ".hf-catalog-x-follow-card .avatars span",
          { "--hf-avatar-y": "18px", "--hf-avatar-opacity": 0 },
          {
            "--hf-avatar-y": "0px",
            "--hf-avatar-opacity": 1,
            duration: 0.28,
            stagger: 0.05,
            ease: "power2.out",
          },
          startTime + 0.22,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["x-follow-card-demo"] = tl;
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
