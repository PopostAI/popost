<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Matrix Decode - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      /* ponytail: scale on wrapper (not a GSAP target), zooms content ~3× for thumbnail legibility */
      .demo-frame {
        display: grid;
        place-items: center;
        gap: 32px;
        padding: 72px 96px;
        background: #18181b;
        border-radius: 20px;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.22);
        transform: scale(3.2);
        transform-origin: center center;
      }
      .demo-label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #71717a;
      }
      .hf-catalog-matrix-decode {
        display: inline-flex;
        gap: 4px;
        font:
          700 52px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #4ade80;
        text-shadow: 0 0 24px rgba(74, 222, 128, 0.45);
      }
      .hf-catalog-matrix-decode span {
        display: inline-block;
        min-width: 0.64em;
        opacity: var(--hf-matrix-opacity, 1);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Random scramble resolves left-to-right into the target text.",
 "class": "text",
 "tags": [
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "HYPERFRAMES",
   "maxLength": 200,
   "what": "Word the scramble resolves into. One scrambling cell per character, up to 32."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Colour family of the cells and their glow."
  },
  {
   "name": "size",
   "type": "number",
   "default": 64,
   "min": 24,
   "max": 160,
   "unit": "px",
   "what": "Type size of the cells in pixels. Cell width follows it."
  },
  {
   "name": "glow",
   "type": "choice",
   "default": "standard",
   "options": [
    "none",
    "standard",
    "strong"
   ],
   "what": "Strength of the halo behind the cells, from none to a heavy bloom."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="matrix-decode-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="demo-label">Matrix Decode</div>
        <div
          class="hf-catalog-matrix-decode"
          data-final="HYPERFRAMES"
          data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Target text", "description": "Word the scramble resolves into. One scrambling cell per character, up to 32.", "default": "HYPERFRAMES" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the cells and their glow.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "size", "type": "number", "role": "style", "label": "Size", "description": "Type size of the cells in pixels. Cell width follows it.", "default": 64, "min": 24, "max": 160, "step": 4, "unit": "px" },
    { "id": "glow", "type": "enum", "role": "style", "label": "Glow", "description": "Strength of the halo behind the cells, from none to a heavy bloom.", "default": "standard", "options": [{ "value": "none", "label": "None" }, { "value": "standard", "label": "Standard" }, { "value": "strong", "label": "Strong" }] }
  ]'
        >
          <span>0</span><span>0</span><span>0</span><span>0</span><span>0</span><span>0</span
          ><span>0</span><span>0</span><span>0</span><span>0</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Anything missing or invalid returns to its declared default.
          var accents = {
            green: { color: "#16a34a", rgb: "22, 163, 74" },
            blue: { color: "#2563eb", rgb: "37, 99, 235" },
            violet: { color: "#7c3aed", rgb: "124, 58, 237" },
          };
          var glows = {
            none: { radius: "0px", alpha: "0" },
            standard: { radius: "18px", alpha: "0.28" },
            strong: { radius: "34px", alpha: "0.55" },
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var text = typeof vars.text === "string" ? vars.text.trim().slice(0, 32) : "";
          if (!text) {
            text = "HYPERFRAMES";
          }

          var size =
            typeof vars.size === "number" || typeof vars.size === "string"
              ? Number(vars.size)
              : NaN;
          size = isFinite(size) && size > 0 ? Math.min(160, Math.max(24, size)) : 64;

          var accent = accents[pick(accents, vars.accent, "green")];
          var glow = glows[pick(glows, vars.glow, "standard")];

          var roots = document.querySelectorAll(".hf-catalog-matrix-decode");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-matrix-size", size + "px");
            roots[i].style.setProperty("--hf-matrix-color", accent.color);
            roots[i].style.setProperty("--hf-matrix-glow-rgb", accent.rgb);
            roots[i].style.setProperty("--hf-matrix-glow-radius", glow.radius);
            roots[i].style.setProperty("--hf-matrix-glow-alpha", glow.alpha);
            roots[i].setAttribute("data-final", text);
            while (roots[i].firstChild) {
              roots[i].removeChild(roots[i].firstChild);
            }
            for (var j = 0; j < text.length; j += 1) {
              var cell = document.createElement("span");
              cell.textContent = text.charAt(j) === " " ? "\u00a0" : "0";
              roots[i].appendChild(cell);
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-matrix-decode span",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.18, stagger: 0.035, ease: "power2.out" },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["matrix-decode-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-matrix-decode {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-matrix-decode {
        display: inline-flex;
        gap: 3px;
        font:
          900 64px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        font-size: var(--hf-matrix-size, 64px);
        color: var(--hf-matrix-color, #16a34a);
        text-shadow: 0 0 var(--hf-matrix-glow-radius, 18px)
          rgba(var(--hf-matrix-glow-rgb, 22, 163, 74), var(--hf-matrix-glow-alpha, 0.28));
      }
      .hf-catalog-matrix-decode span {
        display: inline-block;
        min-width: 0.64em;
        opacity: var(--hf-matrix-opacity, 1);
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
