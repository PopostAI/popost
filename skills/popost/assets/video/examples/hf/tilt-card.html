<!doctype html>

  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tilt Card - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #eef2ff;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        transform: scale(2.5); /* ponytail: card was ~16% of frame; 2.5× brings it to ~60% */
      }
      .hf-transition-tilt-card {
        position: relative;
        width: 420px;
        height: 260px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 30px;
        background: linear-gradient(135deg, #18181b, #312e81);
        color: #ffffff;
        font-family: Inter, system-ui, sans-serif;
        transform-style: preserve-3d;
        box-shadow: 0 32px 90px rgba(49, 46, 129, 0.34);
      }
      .hf-transition-tilt-glow {
        position: absolute;
        inset: -30%;
        background: radial-gradient(circle at 30% 20%, rgba(125, 211, 252, 0.5), transparent 36%);
      }
      .hf-transition-tilt-content {
        position: relative;
        display: grid;
        align-content: end;
        gap: 10px;
        height: 100%;
        padding: 34px;
        transform: translateZ(38px);
      }
      .hf-transition-tilt-content span {
        color: #a5b4fc;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .hf-transition-tilt-content strong {
        max-width: 280px;
        font-size: 34px;
        line-height: 0.96;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A transitions.dev-inspired tilt card primitive with depth layers and hover-style parallax",
 "class": "3d",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "card",
  "tilt"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "eyebrow",
   "type": "text",
   "default": "Primitive",
   "maxLength": 200,
   "what": "Small uppercase kicker above the headline."
  },
  {
   "name": "headline",
   "type": "text",
   "default": "Agent-ready motion",
   "maxLength": 200,
   "what": "Large card headline."
  },
  {
   "name": "glow",
   "type": "choice",
   "default": "standard",
   "options": [
    "tight",
    "standard",
    "wide"
   ],
   "what": "How far the corner glow reaches past the card edges, which sets both its spread at rest and how far the timeline drift carries it."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "indigo",
   "options": [
    "indigo",
    "emerald",
    "violet"
   ],
   "what": "Colour family of the card gradient, corner glow, eyebrow and drop shadow."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="tilt-card-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-tilt-card"
          data-composition-variables='[
    {"id": "eyebrow", "type": "string", "role": "content", "label": "Eyebrow", "description": "Small uppercase kicker above the headline.", "default": "Primitive"},
    {"id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Large card headline.", "default": "Agent-ready motion"},
    {"id": "glow", "type": "enum", "role": "motion", "label": "Glow", "description": "How far the corner glow reaches past the card edges, which sets both its spread at rest and how far the timeline drift carries it.", "default": "standard", "options": [{"value": "tight", "label": "Tight"}, {"value": "standard", "label": "Standard"}, {"value": "wide", "label": "Wide"}]},
    {"id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the card gradient, corner glow, eyebrow and drop shadow.", "default": "indigo", "options": [{"value": "indigo", "label": "Indigo"}, {"value": "emerald", "label": "Emerald"}, {"value": "violet", "label": "Violet"}]}
  ]'
        >
          <div class="hf-transition-tilt-glow"></div>
          <div class="hf-transition-tilt-content">
            <span>Primitive</span>
            <strong>Agent-ready motion</strong>
          </div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var insets = { tight: "-18%", standard: "-30%", wide: "-46%" };
          var accents = {
            indigo: {
              accent: "#312e81",
              glow: "rgba(125, 211, 252, 0.5)",
              label: "#a5b4fc",
              shadow: "rgba(49, 46, 129, 0.34)",
            },
            emerald: {
              accent: "#065f46",
              glow: "rgba(110, 231, 183, 0.5)",
              label: "#6ee7b7",
              shadow: "rgba(6, 95, 70, 0.34)",
            },
            violet: {
              accent: "#5b21b6",
              glow: "rgba(216, 180, 254, 0.5)",
              label: "#d8b4fe",
              shadow: "rgba(91, 33, 182, 0.34)",
            },
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          function text(value, fallback) {
            var resolved = value == null ? "" : String(value).trim();
            return resolved.length > 0 ? resolved : fallback;
          }

          var eyebrow = text(vars.eyebrow, "Primitive");
          var headline = text(vars.headline, "Agent-ready motion");
          var inset = insets[pick(insets, vars.glow, "standard")];
          var accent = accents[pick(accents, vars.accent, "indigo")];

          var roots = document.querySelectorAll(".hf-transition-tilt-card");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-tilt-glow-inset", inset);
            root.style.setProperty("--hf-tilt-accent", accent.accent);
            root.style.setProperty("--hf-tilt-glow", accent.glow);
            root.style.setProperty("--hf-tilt-label", accent.label);
            root.style.setProperty("--hf-tilt-shadow", accent.shadow);
            root.querySelector(".hf-transition-tilt-content span").textContent = eyebrow;
            root.querySelector(".hf-transition-tilt-content strong").textContent = headline;
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-tilt-card",
          { opacity: 0, y: 30, rotateX: 0, rotateY: 0 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" },
          0.3,
        );
        tl.to(
          ".hf-transition-tilt-card",
          { rotateX: -7, rotateY: 10, duration: 0.72, ease: "power3.inOut" },
          0.75,
        );
        tl.to(
          ".hf-transition-tilt-glow",
          { xPercent: 12, yPercent: 10, duration: 0.72, ease: "power3.inOut" },
          0.75,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["tilt-card-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-tilt-card {
        position: relative;
        width: 420px;
        height: 260px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 30px;
        background: linear-gradient(135deg, #18181b, var(--hf-tilt-accent, #312e81));
        color: #ffffff;
        font-family: Inter, system-ui, sans-serif;
        transform-style: preserve-3d;
        box-shadow: 0 32px 90px var(--hf-tilt-shadow, rgba(49, 46, 129, 0.34));
      }
      .hf-transition-tilt-glow {
        position: absolute;
        inset: var(--hf-tilt-glow-inset, -30%);
        background: radial-gradient(
          circle at 30% 20%,
          var(--hf-tilt-glow, rgba(125, 211, 252, 0.5)),
          transparent 36%
        );
      }
      .hf-transition-tilt-content {
        position: relative;
        display: grid;
        align-content: end;
        gap: 10px;
        height: 100%;
        padding: 34px;
        transform: translateZ(38px);
      }
      .hf-transition-tilt-content span {
        color: var(--hf-tilt-label, #a5b4fc);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .hf-transition-tilt-content strong {
        max-width: 280px;
        font-size: 34px;
        line-height: 0.96;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
