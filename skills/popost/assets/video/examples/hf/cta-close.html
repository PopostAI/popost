<html data-composition-variables='[
    { "id": "action_line", "type": "string", "role": "content", "label": "Action line", "description": "Two to four word action that closes the film.", "default": "Make it happen" },
    { "id": "button_label", "type": "string", "role": "content", "label": "Button label", "description": "Text displayed inside the single CTA capsule.", "default": "Start now" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Contract color used by the CTA capsule.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "Optional departure. Default none: the lockup holds until the frame cuts (this primitive closes films).", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CTA Close Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #faf8f3;
      }

      #root {
        --bg: #faf8f3;
        --fg: #191713;
        --muted: #6f695d;
        --surface: #f1ede3;
        --border: #e2dccd;
        --brand: #0d7a4f;
        --accent: #1d4ed8;
        --accent-2: #6d3ae0;
        --font-display: Georgia, "Times New Roman", serif;
        --font-body: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 0.9cqmin;
        --space-1: 1.1cqmin;
        --space-2: 2.2cqmin;
        --space-3: 3.8cqmin;
        --dur-beat: 0.48s;
        --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1);
        --ease-emphasis: cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        border-top: 1px solid var(--border, #e2dccd);
        border-bottom: 1px solid var(--border, #e2dccd);
        background: var(--bg, #faf8f3);
      }

      .mount-stage {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A display-scale action line lands per word and fills the frame with air, one generous CTA capsule pops beneath it with a single overshoot, and the finished close holds completely still.",
 "class": "logo",
 "tags": [
  "motion-primitive",
  "ui-props",
  "cta",
  "end-card",
  "close",
  "ask"
 ],
 "seconds": 3.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "action_line",
   "type": "text",
   "default": "Make it happen",
   "maxLength": 200,
   "what": "Two to four word action that closes the film."
  },
  {
   "name": "button_label",
   "type": "text",
   "default": "Start now",
   "maxLength": 200,
   "what": "Text displayed inside the single CTA capsule."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Contract color used by the CTA capsule."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Default none: the lockup holds until the frame cuts (this primitive closes films)."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"action_line":"Ship your first film","button_label":"Get started free","accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.06,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="cta-close-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="cta-close-mount"
        class="mount-stage clip"
        data-composition-id="cta-close"
       
        data-variable-values='{"action_line":"Ship your first film","button_label":"Get started free","accent":"violet"}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      >
      <div id="root" data-composition-id="cta-close" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .cc-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #0b0c0e);
          }

          .cc-lockup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7cqh;
            max-width: 96cqw;
            text-align: center;
          }

          .cc-action {
            margin: 0;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: var(--cc-action-size, min(10.4cqw, 30cqh));
            font-weight: 600;
            line-height: 1.02;
            letter-spacing: -0.035em;
            white-space: nowrap;
          }

          .cc-w {
            display: inline-block;
            will-change: transform, opacity;
          }

          .cc-button {
            margin: 0;
            padding: 2.9cqh 5cqw;
            overflow: hidden;
            border: 0;
            border-radius: 999px;
            background: var(--cc-accent);
            color: var(--bg, #0b0c0e);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            font-size: var(--cc-button-size, min(3.4cqw, 6cqh));
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.01em;
            white-space: nowrap;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }
        </style>

        <div
          id="cta-close-clip"
          class="cc-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="cc-lockup">
            <h2 class="cc-action"></h2>
            <button class="cc-button" type="button" tabindex="-1"></button>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var lockup = root.querySelector(".cc-lockup");
            var actionLine = root.querySelector(".cc-action");
            var button = root.querySelector(".cc-button");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var actionText =
              vars.action_line == null
                ? "Make it happen"
                : String(vars.action_line).trim().replace(/\s+/g, " ");
            var buttonText =
              vars.button_label == null
                ? "Start now"
                : String(vars.button_label).trim().replace(/\s+/g, " ");
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            // The line lands per word: one span per word, natural spaces kept
            // between them so the display tracking never crushes word gaps.
            actionLine.setAttribute("aria-label", actionText);
            var words = actionText ? actionText.split(" ") : [];
            words.forEach(function (word, index) {
              if (index > 0) actionLine.appendChild(document.createTextNode(" "));
              var span = document.createElement("span");
              span.className = "cc-w";
              span.setAttribute("aria-hidden", "true");
              span.textContent = word;
              actionLine.appendChild(span);
            });
            var wordEls = actionLine.querySelectorAll(".cc-w");
            button.textContent = buttonText;
            root.style.setProperty("--cc-accent", accentColors[accent]);

            // Character-count fitting is deterministic before the template is
            // laid out. The 0.47em advance estimate lands common display faces
            // at 70 to 85 percent of the frame width; short lines cap on
            // height instead so two-word closes stay monumental without
            // touching the edges.
            var actionCharacters = Math.max(1, Array.from(actionText).length);
            var actionSize = Math.min(24, 76 / (actionCharacters * 0.47));
            var buttonCharacters = Math.max(1, Array.from(buttonText).length);
            var buttonSize = Math.min(3.5, 50 / (buttonCharacters * 0.5));
            root.style.setProperty(
              "--cc-action-size",
              "min(" + actionSize.toFixed(3) + "cqw, 30cqh)",
            );
            root.style.setProperty(
              "--cc-button-size",
              "min(" + buttonSize.toFixed(3) + "cqw, 6cqh)",
            );

            var IN_BASE = 1.32;
            var OUT_BASE = exit === "none" ? 0 : 0.45;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var envelopeScale = Math.min(1, duration / (IN_BASE + OUT_BASE));
            var WORDS_AT = 0.06 * envelopeScale;
            var WORD_DURATION = 0.62 * envelopeScale;
            var WORD_STAGGER = 0.1 * envelopeScale;
            var BUTTON_AT = 0.72 * envelopeScale;
            var BUTTON_DURATION = 0.6 * envelopeScale;
            var BUTTON_FADE = 0.22 * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var OUT_START = duration - OUT;

            var tl = gsap.timeline({ paused: true });

            // IN, phase one: the action line lands per word at display scale.
            tl.fromTo(
              wordEls,
              { opacity: 0, y: "8cqh" },
              {
                opacity: 1,
                y: 0,
                duration: WORD_DURATION,
                ease: "power3.out",
                stagger: WORD_STAGGER,
              },
              WORDS_AT,
            );

            // IN, phase two: the capsule pops beneath with ONE restrained
            // overshoot (back.out), a real button under a monumental line.
            tl.fromTo(
              button,
              { scale: 0.85, y: "3cqh" },
              { scale: 1, y: 0, duration: BUTTON_DURATION, ease: "back.out(1.5)" },
              BUTTON_AT,
            );
            tl.fromTo(
              button,
              { opacity: 0 },
              { opacity: 1, duration: BUTTON_FADE, ease: "power2.out" },
              BUTTON_AT,
            );

            // HOLD: dead still. The empty set pins the timeline to the full
            // mount duration so seeks inside the hold land on the held pose.
            tl.set({}, {}, duration);

            // OUT: optional departure; exit none holds the still lockup
            // until the frame cuts (this primitive closes films).
            if (exit === "fade") {
              tl.to(lockup, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            } else if (exit === "up") {
              tl.to(
                lockup,
                { opacity: 0, y: "-5cqh", duration: OUT, ease: "power2.in" },
                OUT_START,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["cta-close"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["cta-close-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
