<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Input Feedback - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f8fafc;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale up the static wrapper so the widget fills ~60% of frame; GSAP targets children, not this element */
        transform: scale(2.8);
      }
      .hf-transition-input-feedback {
        display: grid;
        gap: 10px;
        width: 430px;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-input-feedback label {
        color: #52525b;
        font-size: 15px;
        font-weight: 850;
      }
      .hf-transition-input-shell {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 62px;
        padding: 0 16px;
        border: 1px solid #d4d4d8;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      }
      .hf-transition-input-value {
        flex: 1;
        font-size: 20px;
        font-weight: 760;
      }
      .hf-transition-input-clear,
      .hf-transition-input-check {
        display: grid;
        place-items: center;
        height: 28px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 900;
      }
      .hf-transition-input-clear {
        width: 28px;
        border: 0;
        background: #f4f4f5;
        color: #71717a;
      }
      .hf-transition-input-check {
        min-width: 38px;
        padding: 0 8px;
        background: #dcfce7;
        color: #166534;
      }
      .hf-transition-input-hint {
        margin: 0;
        color: #16a34a;
        font-size: 14px;
        font-weight: 800;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A transitions.dev-inspired input feedback primitive with shake, clear affordance, and success state",
 "class": "ui",
 "tags": [
  "transition-primitive",
  "transitions-dev-port",
  "input",
  "feedback"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "status",
   "type": "choice",
   "default": "valid",
   "options": [
    "valid",
    "error"
   ],
   "what": "Whether the field reads as accepted or rejected, colouring the border, chip and hint."
  },
  {
   "name": "value",
   "type": "text",
   "default": "mia@example.com",
   "maxLength": 200,
   "what": "Text held by the field."
  },
  {
   "name": "hint",
   "type": "text",
   "default": "Looks good.",
   "maxLength": 200,
   "what": "Helper line under the field."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"tick","gain":0.3},{"at":1.21,"cue":"pop","gain":0.65}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="input-feedback-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-input-feedback"
          data-state="valid"
          data-composition-variables='[
    { "id": "status", "type": "enum", "role": "style", "label": "Status", "description": "Whether the field reads as accepted or rejected, colouring the border, chip and hint.", "default": "valid", "options": [{ "value": "valid", "label": "Valid" }, { "value": "error", "label": "Error" }] },
    { "id": "value", "type": "string", "role": "content", "label": "Value", "description": "Text held by the field.", "default": "mia@example.com" },
    { "id": "hint", "type": "string", "role": "content", "label": "Hint", "description": "Helper line under the field.", "default": "Looks good." }
  ]'
        >
          <label>Email</label>
          <div class="hf-transition-input-shell">
            <span class="hf-transition-input-value">mia@example.com</span>
            <button class="hf-transition-input-clear" type="button">x</button>
            <span class="hf-transition-input-check">OK</span>
          </div>
          <p class="hf-transition-input-hint">Looks good.</p>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          function text(value, fallback) {
            return typeof value === "string" && value.trim() !== "" ? value : fallback;
          }

          var statuses = { valid: "OK", error: "!" };

          var status = pick(statuses, vars.status, "valid");
          var value = text(vars.value, "mia@example.com");
          var hint = text(vars.hint, "Looks good.");

          var roots = document.querySelectorAll(".hf-transition-input-feedback");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.setAttribute("data-state", status);
            var valueEl = root.querySelector(".hf-transition-input-value");
            if (valueEl) valueEl.textContent = value;
            var hintEl = root.querySelector(".hf-transition-input-hint");
            if (hintEl) hintEl.textContent = hint;
            var chip = root.querySelector(".hf-transition-input-check");
            if (chip) chip.textContent = statuses[status];
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-input-feedback",
          { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
          0.3,
        );
        tl.to(
          ".hf-transition-input-shell",
          { x: -12, duration: 0.06, repeat: 5, yoyo: true, ease: "none" },
          0.72,
        );
        tl.fromTo(
          ".hf-transition-input-check",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(2)" },
          1.18,
        );
        tl.fromTo(
          ".hf-transition-input-hint",
          { opacity: 0, y: -6 },
          { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" },
          1.28,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["input-feedback-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-input-feedback {
        --hf-fb-border: #d4d4d8;
        --hf-fb-chip-bg: #dcfce7;
        --hf-fb-chip-fg: #166534;
        --hf-fb-hint: #16a34a;
        display: grid;
        gap: 10px;
        width: 430px;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-input-feedback label {
        color: #52525b;
        font-size: 15px;
        font-weight: 850;
      }
      .hf-transition-input-shell {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 62px;
        padding: 0 16px;
        border: 1px solid var(--hf-fb-border);
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      }
      .hf-transition-input-value {
        flex: 1;
        font-size: 20px;
        font-weight: 760;
      }
      .hf-transition-input-clear,
      .hf-transition-input-check {
        display: grid;
        place-items: center;
        height: 28px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 900;
      }
      .hf-transition-input-clear {
        width: 28px;
        border: 0;
        background: #f4f4f5;
        color: #71717a;
      }
      .hf-transition-input-check {
        min-width: 38px;
        padding: 0 8px;
        background: var(--hf-fb-chip-bg);
        color: var(--hf-fb-chip-fg);
      }
      .hf-transition-input-hint {
        margin: 0;
        color: var(--hf-fb-hint);
        font-size: 14px;
        font-weight: 800;
      }
      .hf-transition-input-feedback[data-state="error"] {
        --hf-fb-border: #fca5a5;
        --hf-fb-chip-bg: #fee2e2;
        --hf-fb-chip-fg: #991b1b;
        --hf-fb-hint: #dc2626;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
