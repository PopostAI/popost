<html data-composition-variables='[
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Accent token family used to derive the aurora hues.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "mood", "type": "enum", "role": "style", "label": "Mood", "description": "Base luminance and aurora field strength.", "default": "deep", "options": [{ "value": "deep", "label": "Deep" }, { "value": "bright", "label": "Bright" }] }

  <head>

    <title>Aurora Drift Demo</title>
    <style>
      * {
        margin: 0;

  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Three soft accent-derived aurora fields drift in an exact ambient loop over a deep base and faint vignette.",
 "class": "background",
 "tags": [
  "motion-primitive",
  "background",
  "aurora",
  "gradient",
  "ambient",
  "loopable"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Accent token family used to derive the aurora hues."
  },
  {
   "name": "mood",
   "type": "choice",
   "default": "deep",
   "options": [
    "deep",
    "bright"
   ],
   "what": "Base luminance and aurora field strength."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"accent":"violet","mood":"bright"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="aurora-drift-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="aurora-drift-mount"
        class="mount-card clip"
        data-composition-id="aurora-drift"
       
        data-variable-values='{"accent":"violet","mood":"bright"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1440"
        data-height="756"
      >
      <div id="root" data-composition-id="aurora-drift" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            pointer-events: none;
          }

          .ad-clip,
          .ad-base,
          .ad-vignette {
            position: absolute;
            inset: 0;
          }

          .ad-clip {
            overflow: hidden;
          }

          .ad-base {
            background:
              radial-gradient(
                ellipse at 50% 42%,
                color-mix(in srgb, var(--ad-color) 8%, var(--ad-base)) 0%,
                var(--ad-base) 68%
              ),
              var(--ad-base);
          }

          .ad-blob {
            --ad-blob-opacity: 1;
            position: absolute;
            display: block;
            border-radius: 50%;
            filter: blur(12cqmin) saturate(0.84) opacity(var(--ad-blob-opacity));
            mix-blend-mode: screen;
            opacity: var(--ad-strength);
            will-change: transform;
          }

          .ad-blob-a {
            width: 76cqw;
            height: 72cqh;
            left: -18cqw;
            top: -22cqh;
            background: radial-gradient(
              ellipse at center,
              color-mix(in srgb, var(--ad-color) 88%, white) 0%,
              color-mix(in srgb, var(--ad-color) 42%, transparent) 48%,
              transparent 76%
            );
          }

          .ad-blob-b {
            width: 84cqw;
            height: 78cqh;
            right: -28cqw;
            top: -2cqh;
            --ad-blob-opacity: 0.82;
            background: radial-gradient(
              ellipse at center,
              color-mix(in srgb, var(--ad-color) 72%, var(--accent, #38bdf8)) 0%,
              color-mix(in srgb, var(--ad-color) 36%, transparent) 52%,
              transparent 78%
            );
          }

          .ad-blob-c {
            width: 72cqw;
            height: 74cqh;
            left: 18cqw;
            bottom: -34cqh;
            --ad-blob-opacity: 0.68;
            background: radial-gradient(
              ellipse at center,
              color-mix(in srgb, var(--ad-color) 72%, var(--accent-2, #a78bfa)) 0%,
              color-mix(in srgb, var(--ad-color) 32%, transparent) 50%,
              transparent 76%
            );
          }

          .ad-vignette {
            background: radial-gradient(
              ellipse at center,
              transparent 35%,
              rgb(0 0 0 / var(--ad-vignette)) 100%
            );
          }
        </style>

        <div
          id="aurora-drift-clip"
          class="ad-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="ad-base"></div>
          <div class="ad-blob ad-blob-a"></div>
          <div class="ad-blob ad-blob-b"></div>
          <div class="ad-blob ad-blob-c"></div>
          <div class="ad-vignette"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // Invalid enum overrides return to their declared defaults.
            var accentTokens = {
              green: "var(--brand, #34d399)",
              blue: "var(--accent, #38bdf8)",
              violet: "var(--accent-2, #a78bfa)",
            };
            var moodStyles = {
              deep: { base: "#050711", strength: "0.42", vignette: "0.62" },
              bright: { base: "#111827", strength: "0.56", vignette: "0.46" },
            };
            var accent = Object.prototype.hasOwnProperty.call(accentTokens, vars.accent)
              ? vars.accent
              : "green";
            var mood = vars.mood === "bright" ? "bright" : "deep";
            var moodStyle = moodStyles[mood];

            root.style.setProperty("--ad-color", accentTokens[accent]);
            root.style.setProperty("--ad-base", moodStyle.base);
            root.style.setProperty("--ad-strength", moodStyle.strength);
            root.style.setProperty("--ad-vignette", moodStyle.vignette);

            var TAU = Math.PI * 2;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var state = { phase: 0 };
            var paths = [
              { element: root.querySelector(".ad-blob-a"), offset: 0, x: 4.6, y: 3.2 },
              {
                element: root.querySelector(".ad-blob-b"),
                offset: TAU / 3,
                x: 4.1,
                y: 3.8,
              },
              {
                element: root.querySelector(".ad-blob-c"),
                offset: (TAU * 2) / 3,
                x: 3.6,
                y: 3,
              },
            ];

            function renderPose() {
              // The endpoint uses literal phase zero, avoiding the floating
              // point residue from Math.sin(2 * PI).
              var phase = state.phase === TAU ? 0 : state.phase;
              paths.forEach(function (path) {
                gsap.set(path.element, {
                  x: Math.sin(phase + path.offset) * path.x + "cqw",
                  y: Math.sin(phase + path.offset + Math.PI / 2) * path.y + "cqh",
                });
              });
            }

            var tl = gsap.timeline({ paused: true });

            // HOLD: uniform phase travel produces smooth sine motion. Exactly
            // one whole cycle is completed at the duration boundary.
            tl.to(state, { phase: TAU, duration: duration, ease: "none", onUpdate: renderPose }, 0);

            renderPose();
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["aurora-drift"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["aurora-drift-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
