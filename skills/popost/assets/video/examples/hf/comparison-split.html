<html data-composition-variables='[
    { "id": "split", "type": "number", "role": "layout", "label": "Split position", "description": "Target resting position of the comparison divider.", "default": 50, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "orientation", "type": "enum", "role": "layout", "label": "Orientation", "description": "Axis and direction used by the comparison wipe.", "default": "horizontal", "options": [{ "value": "horizontal", "label": "Horizontal" }, { "value": "vertical", "label": "Vertical" }] },
    { "id": "labelA", "type": "string", "role": "content", "label": "Before label", "description": "Caption shown on the base before panel.", "default": "Before" },
    { "id": "labelB", "type": "string", "role": "content", "label": "After label", "description": "Caption shown on the revealed after panel.", "default": "After" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Comparison Split Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #050812);
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 42%,
          var(--bg, #14213b) 0%,
          var(--bg, #050812) 72%
        );
      }

      /* The primitive uses cqw/cqh inside this definite host box. Keeping an
         explicit CSS size here sidesteps shrink-to-fit sizing for the mounted
         size-contained root. data-width and data-height remain for tooling. */
      .mount-card {
        --bg: #07111f;
        --fg: #f8fafc;
        --surface: #172033;
        --brand: #e4e4e7;
        --border: #40506b;
        --muted: #94a3b8;
        --accent: #e4e4e7;
        --font-body: Inter, system-ui, sans-serif;
        --font-display: Inter, system-ui, sans-serif;
        --space-1: 1.2cqw;
        --space-2: 2.4cqw;
        --space-3: 4cqw;
        position: absolute;
        left: 14%;
        top: 16%;
        width: 72%;
        height: 68%;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border, #94a3b8) 28%, transparent);
        border-radius: 32px;
        box-shadow: 0 44px 110px color-mix(in srgb, var(--bg, #000000) 48%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Two full-bleed panels compare before and after states as a persistent divider wipes the vivid after layer over the muted before layer and rests at a configurable split.",
 "class": "transition",
 "tags": [
  "prop",
  "ui-props",
  "compare",
  "holdable",
  "before-after",
  "wipe"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "split",
   "type": "number",
   "default": 50,
   "min": 0,
   "max": 100,
   "unit": "%",
   "what": "Target resting position of the comparison divider."
  },
  {
   "name": "orientation",
   "type": "choice",
   "default": "horizontal",
   "options": [
    "horizontal",
    "vertical"
   ],
   "what": "Axis and direction used by the comparison wipe."
  },
  {
   "name": "labelA",
   "type": "text",
   "default": "Before",
   "maxLength": 200,
   "what": "Caption shown on the base before panel."
  },
  {
   "name": "labelB",
   "type": "text",
   "default": "After",
   "maxLength": 200,
   "what": "Caption shown on the revealed after panel."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"split":64,"orientation":"horizontal","labelA":"Manual","labelB":"Automated"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="comparison-split-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="comparison-split-mount"
        class="mount-card clip"
        data-composition-id="comparison-split"
       
        data-variable-values='{"split":64,"orientation":"horizontal","labelA":"Manual","labelB":"Automated"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1382"
        data-height="734"
      >
      <div id="root" data-composition-id="comparison-split" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root fills the host-owned box. Every internal measurement uses
             cqw/cqh, and every painted color comes from a theme token. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #07111f);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .cs-clip,
          .cs-stage,
          .cs-panel {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
          }

          .cs-clip {
            overflow: hidden;
          }

          .cs-stage {
            --cs-split: 0;
            opacity: 0;
          }

          .cs-before {
            background:
              linear-gradient(
                  color-mix(in srgb, var(--border, #334155) 38%, transparent) 0.12cqw,
                  transparent 0.12cqw
                )
                0 0 / 5cqw 5cqw,
              linear-gradient(
                  90deg,
                  color-mix(in srgb, var(--border, #334155) 38%, transparent) 0.12cqw,
                  transparent 0.12cqw
                )
                0 0 / 5cqw 5cqw,
              var(--surface, #172033);
          }

          .cs-after {
            z-index: 2;
            clip-path: inset(0 calc((100 - var(--cs-split)) * 1%) 0 0);
            background: color-mix(in srgb, var(--fg, #f8fafc) 18%, var(--surface, #172033));
          }

          .cs-window {
            position: absolute;
            left: 14cqw;
            top: 18cqh;
            width: 72cqw;
            height: 64cqh;
            overflow: hidden;
            border-radius: min(3cqw, 5cqh);
            border: 0.16cqw solid var(--border, #334155);
            background: color-mix(in srgb, var(--surface, #172033) 90%, var(--muted, #94a3b8));
            box-shadow: 0 2.2cqh 6cqw color-mix(in srgb, var(--bg, #07111f) 50%, transparent);
          }

          .cs-after .cs-window {
            border-color: color-mix(in srgb, var(--fg, #f8fafc) 45%, transparent);
            background: color-mix(in srgb, var(--fg, #f8fafc) 8%, var(--surface, #172033));
            box-shadow: 0 2.2cqh 7cqw rgba(0, 0, 0, 0.18);
          }

          .cs-toolbar {
            display: flex;
            align-items: center;
            gap: var(--space-1, 1.2cqw);
            height: 12cqh;
            padding: 0 var(--space-2, 2.4cqw);
            border-bottom: 0.14cqw solid var(--border, #334155);
          }

          .cs-dot {
            width: min(2.2cqw, 3.2cqh);
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--muted, #94a3b8);
            opacity: 0.55;
          }

          .cs-after .cs-dot {
            background: var(--accent, #f8fafc);
            opacity: 1;
          }

          .cs-content {
            position: relative;
            height: 52cqh;
          }

          .cs-copy {
            position: absolute;
            left: 7cqw;
            top: 9cqh;
            width: 31cqw;
          }

          .cs-line {
            height: 2.3cqh;
            margin-bottom: var(--space-2, 2.4cqh);
            border-radius: 2cqh;
            background: var(--muted, #94a3b8);
            opacity: 0.48;
          }

          .cs-line:nth-child(1) {
            width: 94%;
          }

          .cs-line:nth-child(2) {
            width: 72%;
          }

          .cs-line:nth-child(3) {
            width: 48%;
          }

          .cs-after .cs-line {
            background: color-mix(in srgb, var(--fg, #f8fafc) 72%, transparent);
            opacity: 1;
          }

          .cs-visual {
            position: absolute;
            right: 7cqw;
            top: 7cqh;
            width: min(22cqw, 32cqh);
            aspect-ratio: 1;
            border-radius: 36% 64% 58% 42%;
            border: 0.3cqw solid var(--border, #334155);
            background: var(--muted, #94a3b8);
            opacity: 0.5;
          }

          .cs-after .cs-visual {
            border-color: color-mix(in srgb, var(--fg, #f8fafc) 45%, transparent);
            background: color-mix(in srgb, var(--fg, #f8fafc) 72%, transparent);
            box-shadow: 0 0 5cqw rgba(0, 0, 0, 0.18);
            opacity: 1;
          }

          .cs-label {
            position: absolute;
            z-index: 4;
            top: var(--space-3, 4cqh);
            padding: var(--space-1, 1.2cqh) var(--space-2, 2.2cqw);
            border: 0.14cqw solid var(--border, #334155);
            border-radius: 999cqw;
            background: var(--surface, #172033);
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(3cqw, 4.2cqh);
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap;
          }

          .cs-before .cs-label {
            right: var(--space-3, 4cqw);
            color: var(--muted, #94a3b8);
          }

          .cs-after .cs-label {
            left: var(--space-3, 4cqw);
            border-color: color-mix(in srgb, var(--fg, #f8fafc) 45%, transparent);
            background: color-mix(in srgb, var(--fg, #f8fafc) 8%, var(--surface, #172033));
          }

          .cs-divider {
            position: absolute;
            z-index: 5;
            top: 0;
            bottom: 0;
            left: calc(var(--cs-split) * 1%);
            width: 0.45cqw;
            transform: translateX(-50%);
            background: var(--fg, #f8fafc);
            box-shadow:
              0 0 1.4cqw color-mix(in srgb, var(--fg, #f8fafc) 45%, transparent),
              0 0 3cqw rgba(0, 0, 0, 0.45);
            pointer-events: none;
          }

          .cs-divider::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(5cqw, 7cqh);
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            border: 0.3cqw solid var(--bg, #07111f);
            border-radius: 50%;
            background: var(--fg, #f8fafc);
            box-shadow: 0 0 2.2cqw color-mix(in srgb, var(--fg, #f8fafc) 45%, transparent);
          }

          /* INVARIANT: vertical changes only the axis mapping. The after clip
             and divider still read the same --cs-split value. */
          #root[data-orientation="vertical"] .cs-after {
            clip-path: inset(0 0 calc((100 - var(--cs-split)) * 1%) 0);
          }

          #root[data-orientation="vertical"] .cs-before .cs-label {
            top: auto;
            right: var(--space-3, 4cqw);
            bottom: var(--space-3, 4cqh);
          }

          #root[data-orientation="vertical"] .cs-divider {
            top: calc(var(--cs-split) * 1%);
            right: 0;
            bottom: auto;
            left: 0;
            width: 100%;
            height: 0.45cqh;
            transform: translateY(-50%);
          }
        </style>

        <div
          id="comparison-split-clip"
          class="cs-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="cs-stage">
            <section class="cs-panel cs-before" aria-label="Before panel">
              <div class="cs-label"></div>
              <div class="cs-window">
                <div class="cs-toolbar">
                  <span class="cs-dot"></span>
                  <span class="cs-dot"></span>
                  <span class="cs-dot"></span>
                </div>
                <div class="cs-content">
                  <div class="cs-copy">
                    <div class="cs-line"></div>
                    <div class="cs-line"></div>
                    <div class="cs-line"></div>
                  </div>
                  <div class="cs-visual"></div>
                </div>
              </div>
            </section>

            <section class="cs-panel cs-after" aria-label="After panel">
              <div class="cs-label"></div>
              <div class="cs-window">
                <div class="cs-toolbar">
                  <span class="cs-dot"></span>
                  <span class="cs-dot"></span>
                  <span class="cs-dot"></span>
                </div>
                <div class="cs-content">
                  <div class="cs-copy">
                    <div class="cs-line"></div>
                    <div class="cs-line"></div>
                    <div class="cs-line"></div>
                  </div>
                  <div class="cs-visual"></div>
                </div>
              </div>
            </section>

            <div class="cs-divider" aria-hidden="true"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            // Hardcoded because mount flattening strips data-composition-id
            // from the live root before this timeline registers.
            var compositionId = "comparison-split";
            var stage = root.querySelector(".cs-stage");
            var labelAEl = root.querySelector(".cs-before .cs-label");
            var labelBEl = root.querySelector(".cs-after .cs-label");

            // EDIT ZONE: declarations above and registry metadata change
            // together. This API owns defaults plus per-instance overrides.
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var rawSplit = vars.split == null ? 50 : Number(vars.split);
            // INVARIANT: split always clamps into the declared 0 to 100 range.
            var splitPct = Number.isFinite(rawSplit) ? Math.max(0, Math.min(100, rawSplit)) : 50;
            // INVARIANT: only horizontal or vertical reaches the renderer.
            var orientation = vars.orientation === "vertical" ? "vertical" : "horizontal";
            var labelAText = vars.labelA == null ? "" : String(vars.labelA);
            var labelBText = vars.labelB == null ? "" : String(vars.labelB);

            root.setAttribute("data-orientation", orientation);
            labelAEl.textContent = labelAText;
            labelBEl.textContent = labelBText;

            // RETIME RANGE: fixed IN and OUT scale together only when D is too
            // short. HOLD is the sole elastic phase. Never use timeScale().
            var IN_BASE = 1.4;
            var OUT_BASE = 0.5;
            var STAGE_IN_BASE = 0.32;
            var WIPE_AT_BASE = 0.25;
            var WIPE_DURATION_BASE = 1.05;
            var WIPE_END_BASE = WIPE_AT_BASE + WIPE_DURATION_BASE;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var STAGE_IN = STAGE_IN_BASE * scale;
            var WIPE_AT = WIPE_AT_BASE * scale;
            var WIPE_DURATION = WIPE_DURATION_BASE * scale;
            var WIPE_END = WIPE_END_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;

            function fireSfx(id, t) {
              root.dispatchEvent(
                new CustomEvent("hf:sfx", { detail: { id: id, t: t }, bubbles: true }),
              );
            }

            // Explicit both-endpoints state makes tl.seek(0) deterministic.
            // --cs-split is the only owner of both clip and divider progress.
            gsap.set(stage, { opacity: 0, "--cs-split": 0 });

            var tl = gsap.timeline({ paused: true });

            // IN: stage settle, then one shared wipe value travels to split.
            tl.to(stage, { opacity: 1, duration: STAGE_IN, ease: "power2.out" }, 0);
            tl.to(
              stage,
              { "--cs-split": splitPct, duration: WIPE_DURATION, ease: "sine.inOut" },
              WIPE_AT,
            );
            tl.call(
              function () {
                fireSfx("wipe-land-soft", WIPE_END);
              },
              [],
              WIPE_END,
            );

            // HOLD: deliberately steady at the target split.

            // OUT: release fade.
            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.out" }, OUT_START);

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      // This host owns no motion. The mounted primitive registers its own
      // timeline, while this empty paused timeline satisfies the demo root.
      window.__timelines = window.__timelines || {};
      window.__timelines["comparison-split-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
