<html data-composition-variables='[
    { "id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Short action line shown above the store badges.", "default": "Get the app" },
    { "id": "showApple", "type": "enum", "role": "content", "label": "Show App Store", "description": "Show or hide the App Store badge.", "default": "yes", "options": [{ "value": "yes", "label": "Yes" }, { "value": "no", "label": "No" }] },
    { "id": "showGoogle", "type": "enum", "role": "content", "label": "Show Google Play", "description": "Show or hide the Google Play badge.", "default": "yes", "options": [{ "value": "yes", "label": "Yes" }, { "value": "no", "label": "No" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Store Badge Lockup Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        --bg: #080b13;
        --fg: #f7f9fc;
        --muted: #aab4c5;
        --surface: #151c29;
        --border: #3b4659;
        --brand: #7c6cff;
        --accent: #42d3b2;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, monospace;
        --radius: 2.4cqh;
        --space-1: 1.2cqh;
        --space-2: 2.4cqh;
        --space-3: 4.8cqh;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        --ease-exit: cubic-bezier(0.55, 0.055, 0.675, 0.19);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: radial-gradient(
          ellipse at 50% 44%,
          color-mix(in srgb, var(--surface) 72%, var(--bg)),
          var(--bg) 72%
        );
      }

      .mount-card {
        width: 66%;
        height: 58%;
        left: 17%;
        top: 21%;
        overflow: hidden;
        border: 0.14cqh solid var(--border);
        border-radius: calc(var(--radius) * 1.45);
        background: var(--bg);
        box-shadow: 0 4cqh 11cqh color-mix(in srgb, var(--fg) 11%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Settles a short headline above equal-size App Store and Google Play badges as a token-driven mobile end-card call to action.",
 "class": "logo",
 "tags": [
  "prop",
  "ui-props",
  "mobile",
  "store-badges",
  "cta",
  "ask"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "headline",
   "type": "text",
   "default": "Get the app",
   "maxLength": 200,
   "what": "Short action line shown above the store badges."
  },
  {
   "name": "showApple",
   "type": "choice",
   "default": "yes",
   "options": [
    "yes",
    "no"
   ],
   "what": "Show or hide the App Store badge."
  },
  {
   "name": "showGoogle",
   "type": "choice",
   "default": "yes",
   "options": [
    "yes",
    "no"
   ],
   "what": "Show or hide the Google Play badge."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"headline":"Get the app","showApple":"yes","showGoogle":"yes"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.05,"cue":"tick","gain":0.3},{"at":0.22,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="store-badge-lockup-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="store-badge-lockup-mount"
        class="mount-card clip"
        data-composition-id="store-badge-lockup"
       
        data-variable-values='{"headline":"Get the app","showApple":"yes","showGoogle":"yes"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1267"
        data-height="626"
      >
      <div id="root" data-composition-id="store-badge-lockup" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f7f9fc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .sbl-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: var(--space-3, 4.8cqh);
            overflow: hidden;
            background: var(--bg, #080b13);
          }

          .sbl-lockup {
            width: min(88cqw, 154cqh);
            display: grid;
            justify-items: center;
            gap: min(6cqw, 7cqh);
          }

          .sbl-headline {
            margin: 0;
            max-width: 82cqw;
            color: var(--fg, #f7f9fc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(8.2cqw, 12.5cqh);
            font-weight: 750;
            line-height: 1;
            letter-spacing: -0.045em;
            text-align: center;
            text-wrap: balance;
            will-change: transform, opacity;
          }

          .sbl-badges {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2, 2.4cqh);
          }

          /* EDIT ZONE: both destinations share one badge geometry and one
             text hierarchy. This single rule owns sizing, spacing, and order
             so the pair cannot drift into mismatched lockups. */
          .sbl-badge {
            width: min(40cqw, 67cqh);
            aspect-ratio: 3.12 / 1;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: var(--space-1, 1.2cqh);
            padding: min(2.2cqw, 3.2cqh) min(3cqw, 4.8cqh);
            border: 0.16cqh solid var(--border, #3b4659);
            border-radius: calc(var(--radius, 2.4cqh) * 4);
            background: var(--surface, #151c29);
            color: var(--fg, #f7f9fc);
            box-shadow: 0 1.5cqh 3.8cqh color-mix(in srgb, var(--bg, #080b13) 70%, transparent);
            will-change: transform, opacity;
          }

          .sbl-glyph {
            width: min(6.7cqw, 10.5cqh);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            flex: none;
            border: 0.16cqh solid color-mix(in srgb, var(--fg, #f7f9fc) 28%, transparent);
            border-radius: calc(var(--radius, 2.4cqh) * 0.72);
            background: color-mix(in srgb, var(--brand, #7c6cff) 20%, var(--surface, #151c29));
            color: var(--fg, #f7f9fc);
          }

          .sbl-apple-mark {
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(3.2cqw, 5.2cqh);
            font-weight: 800;
            line-height: 1;
          }

          .sbl-play-mark {
            width: 42%;
            aspect-ratio: 0.88;
            clip-path: polygon(8% 0, 100% 50%, 8% 100%);
            background: currentColor;
          }

          .sbl-copy {
            min-width: 0;
            display: grid;
            gap: min(0.4cqw, 0.6cqh);
          }

          .sbl-microcopy {
            color: var(--muted, #aab4c5);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            font-size: min(1.65cqw, 2.65cqh);
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.04em;
            white-space: nowrap;
          }

          .sbl-label {
            color: var(--fg, #f7f9fc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(3.75cqw, 5.8cqh);
            font-weight: 720;
            line-height: 1;
            letter-spacing: -0.025em;
            white-space: nowrap;
          }
        </style>

        <div
          id="store-badge-lockup-clip"
          class="sbl-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <section class="sbl-lockup" aria-label="Download the app">
            <h1 class="sbl-headline"></h1>
            <div class="sbl-badges">
              <div class="sbl-badge sbl-apple" role="img" aria-label="Download on the App Store">
                <span class="sbl-glyph" aria-hidden="true">
                  <span class="sbl-apple-mark">A</span>
                </span>
                <span class="sbl-copy" aria-hidden="true">
                  <span class="sbl-microcopy">Download on the</span>
                  <span class="sbl-label">App Store</span>
                </span>
              </div>

              <div class="sbl-badge sbl-google" role="img" aria-label="Get it on Google Play">
                <span class="sbl-glyph" aria-hidden="true">
                  <span class="sbl-play-mark"></span>
                </span>
                <span class="sbl-copy" aria-hidden="true">
                  <span class="sbl-microcopy">GET IT ON</span>
                  <span class="sbl-label">Google Play</span>
                </span>
              </div>
            </div>
          </section>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "store-badge-lockup";
            var lockup = root.querySelector(".sbl-lockup");
            var headlineElement = root.querySelector(".sbl-headline");
            var appleBadge = root.querySelector(".sbl-apple");
            var googleBadge = root.querySelector(".sbl-google");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            /* INVARIANT: getVariables() owns all three public decisions.
               Missing values use the declared defaults. Only an explicit
               "no" removes a badge, while an empty headline remains empty. */
            var headline = vars.headline == null ? "Get the app" : String(vars.headline);
            var showApple = vars.showApple === "no" ? "no" : "yes";
            var showGoogle = vars.showGoogle === "no" ? "no" : "yes";

            headlineElement.textContent = headline;
            if (showApple === "no") {
              appleBadge.remove();
            }
            if (showGoogle === "no") {
              googleBadge.remove();
            }

            var badgeElements = root.querySelectorAll(".sbl-badge");

            /* RETIME RANGE: these constants own the complete lifecycle. The
               headline finishes first. Both badges then rise and fade on
               --ease-standard's GSAP owner, power2.out, with a small stagger. */
            var IN_BASE = 1.2;
            var OUT_BASE = 0.45;
            var HEADLINE_START_BASE = 0.05;
            var HEADLINE_DURATION_BASE = 0.48;
            var BADGE_START_BASE = 0.22;
            var BADGE_DURATION_BASE = 0.68;
            var BADGE_STAGGER_BASE = 0.1;
            var durationValue = Number(root.dataset.duration);
            var duration = Number.isFinite(durationValue) && durationValue > 0 ? durationValue : 4;
            var scale = duration < IN_BASE + OUT_BASE ? duration / (IN_BASE + OUT_BASE) : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;

            var timeline = gsap.timeline({ paused: true });

            timeline.fromTo(
              headlineElement,
              { y: "22%", opacity: 0 },
              {
                y: "0%",
                opacity: 1,
                duration: HEADLINE_DURATION_BASE * scale,
                ease: "power2.out",
              },
              HEADLINE_START_BASE * scale,
            );

            if (badgeElements.length > 0) {
              timeline.fromTo(
                badgeElements,
                { y: "28%", opacity: 0 },
                {
                  y: "0%",
                  opacity: 1,
                  duration: BADGE_DURATION_BASE * scale,
                  stagger: BADGE_STAGGER_BASE * scale,
                  ease: "power2.out",
                },
                BADGE_START_BASE * scale,
              );
            }

            timeline.to(lockup, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            timeline.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = timeline;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["store-badge-lockup-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
