<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Wordmark", "description": "Text used as the SVG mask window.", "default": "REVEAL", "maxLength": 16 },
    { "id": "revealProgress", "type": "number", "role": "content", "label": "Reveal progress", "description": "Final revealed width of the wordmark.", "default": 100, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "featherPx", "type": "number", "role": "style", "label": "Edge feather", "description": "Softness of the traveling reveal edge.", "default": 24, "min": 0, "max": 120, "step": 1, "unit": "px" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SVG Mask Reveal - Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        --bg: #07111f;
        --fg: #f8fafc;
        --muted: #8da2b8;
        --surface: #101d31;
        --border: rgba(248, 250, 252, 0.22);
        --brand: #ff7a33;
        --accent: #22d3ee;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
        --radius: 24px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 32px;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, var(--surface), var(--bg) 68%);
        color: var(--fg);
        font-family: var(--font-body);
      }

      .mount-card {
        --bg: var(--surface);
        position: absolute;
        width: 70%;
        height: 44%;
        left: 15%;
        top: 28%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 40px 100px color-mix(in srgb, var(--bg) 72%, transparent);
        container-type: size;
        isolation: isolate;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A soft token-colored sweep reveals media only through an editable SVG wordmark mask.",
 "class": "transition",
 "tags": [
  "effect",
  "svg",
  "mask",
  "wordmark",
  "reveal",
  "exhibit"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "REVEAL",
   "maxLength": 16,
   "what": "Text used as the SVG mask window."
  },
  {
   "name": "revealProgress",
   "type": "number",
   "default": 100,
   "min": 0,
   "max": 100,
   "unit": "%",
   "what": "Final revealed width of the wordmark."
  },
  {
   "name": "featherPx",
   "type": "number",
   "default": 24,
   "min": 0,
   "max": 120,
   "unit": "px",
   "what": "Softness of the traveling reveal edge."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"REVEAL","revealProgress":100,"featherPx":24};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.08,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="svg-mask-reveal-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="svg-mask-reveal-mount"
        class="mount-card clip"
        data-composition-id="svg-mask-reveal"
       
        data-variable-values='{"text":"REVEAL","revealProgress":100,"featherPx":24}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1344"
        data-height="475"
      >
      <div
        id="root"
        data-composition-id="svg-mask-reveal"
        data-start="0"
        data-duration="4"
        data-fps="30"
      >
        <style>
          @property --svg-mask-reveal-sweep-x {
            syntax: "<percentage>";
            inherits: false;
            initial-value: -10%;
          }

          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* INVARIANT: the host owns dimensions. All visible layout derives
             from this size container, and the root is styled only by #root. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #101d31);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .smr-clip,
          .smr-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
          }

          .smr-stage {
            display: grid;
            place-items: center;
          }

          /* EDIT ZONE: presentation scale. The SVG keeps its 12:5 viewBox
             while these container-relative limits make it fit wide and tall
             hosts without stage-pixel assumptions. */
          .smr-svg {
            display: block;
            width: min(92cqw, 168cqh);
            height: auto;
            overflow: visible;
          }

          .smr-media-start {
            stop-color: var(--brand, #ff7a33);
          }

          .smr-media-middle {
            stop-color: var(--accent, #22d3ee);
          }

          .smr-media-end {
            stop-color: var(--fg, #f8fafc);
          }

          .smr-mask-text {
            fill: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: 240px;
            font-weight: 850;
            letter-spacing: 0.02em;
          }

          .smr-media {
            mask-mode: alpha, alpha;
            mask-composite: intersect;
          }

          .smr-outline {
            fill: none;
            stroke: var(--border, rgba(248, 250, 252, 0.22));
            stroke-width: 2;
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: 240px;
            font-weight: 850;
            letter-spacing: 0.02em;
          }
        </style>

        <div
          id="svg-mask-reveal-clip"
          class="smr-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="smr-stage">
            <svg
              class="smr-svg"
              viewBox="0 0 1200 500"
              role="img"
              aria-label="REVEAL"
              preserveAspectRatio="xMidYMid meet"
            >
              <defs>
                
                <linearGradient
                  id="svg-mask-reveal-media-gradient"
                  gradientUnits="userSpaceOnUse"
                  x1="80"
                  y1="420"
                  x2="1120"
                  y2="80"
                >
                  <stop class="smr-media-start" offset="0" />
                  <stop class="smr-media-middle" offset="0.52" />
                  <stop class="smr-media-end" offset="1" />
                </linearGradient>

                
                <mask
                  id="svg-mask-reveal-word-mask"
                  mask-type="alpha"
                  maskUnits="userSpaceOnUse"
                  maskContentUnits="userSpaceOnUse"
                  x="0"
                  y="0"
                  width="1200"
                  height="500"
                >
                  <text
                    id="svg-mask-reveal-text"
                    class="smr-mask-text"
                    x="600"
                    y="260"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    textLength="1000"
                    lengthAdjust="spacingAndGlyphs"
                  >
                    REVEAL
                  </text>
                </mask>
              </defs>

              
              <text
                id="svg-mask-reveal-outline"
                class="smr-outline"
                x="600"
                y="260"
                text-anchor="middle"
                dominant-baseline="middle"
                textLength="1000"
                lengthAdjust="spacingAndGlyphs"
              >
                REVEAL
              </text>
              <rect
                class="smr-media"
                x="0"
                y="0"
                width="1200"
                height="500"
                fill="url(#svg-mask-reveal-media-gradient)"
              />
            </svg>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "svg-mask-reveal";
            var stage = root.querySelector(".smr-stage");
            var svg = root.querySelector(".smr-svg");
            var maskText = root.querySelector("#svg-mask-reveal-text");
            var outlineText = root.querySelector("#svg-mask-reveal-outline");
            var mediaRect = root.querySelector(".smr-media");

            // EDIT ZONE: declared defaults are merged with per-instance host
            // overrides by the runtime. Missing and zero are distinct here.
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var textValue = vars.text == null ? "REVEAL" : String(vars.text);
            var progressValue = vars.revealProgress == null ? NaN : Number(vars.revealProgress);
            var revealProgress = Number.isFinite(progressValue)
              ? Math.max(0, Math.min(100, progressValue))
              : 100;
            var featherValue = vars.featherPx == null ? NaN : Number(vars.featherPx);
            var featherPx = Number.isFinite(featherValue)
              ? Math.max(0, Math.min(120, featherValue))
              : 24;

            maskText.textContent = textValue;
            outlineText.textContent = textValue;
            svg.setAttribute("aria-label", textValue);

            // INVARIANT: the word and sweep masks are independent layers on
            // the media rect. This initialization owns their feather geometry.
            var VIEW_WIDTH = 1200;
            var featherPercent = (featherPx / VIEW_WIDTH) * 100;
            var hiddenSweepPercent = -featherPercent;
            mediaRect.style.maskImage =
              "url(#svg-mask-reveal-word-mask), linear-gradient(to right, black var(--svg-mask-reveal-sweep-x, -10%), transparent calc(var(--svg-mask-reveal-sweep-x, -10%) + " +
              featherPercent +
              "%))";

            // RETIME RANGE: IN_BASE and OUT_BASE define the burst envelope.
            // The sweep uses --ease-standard's GSAP owner, power2.out.
            var IN_BASE = 0.9;
            var OUT_BASE = 0.45;
            var SWEEP_START_BASE = 0.08;
            var SWEEP_LANDS_BASE = 0.8;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var envelopeBase = IN_BASE + OUT_BASE;
            var scale = duration < envelopeBase ? duration / envelopeBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;
            var SWEEP_START = SWEEP_START_BASE * scale;
            var SWEEP_DURATION = (SWEEP_LANDS_BASE - SWEEP_START_BASE) * scale;
            var targetSweepPercent = revealProgress === 0 ? hiddenSweepPercent : revealProgress;

            gsap.set(stage, { opacity: 1 });
            gsap.set(mediaRect, {
              "--svg-mask-reveal-sweep-x": hiddenSweepPercent + "%",
            });

            var tl = gsap.timeline({ paused: true });
            tl.to(
              mediaRect,
              {
                "--svg-mask-reveal-sweep-x": targetSweepPercent + "%",
                duration: SWEEP_DURATION,
                ease: "power2.out",
              },
              SWEEP_START,
            );
            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["svg-mask-reveal-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
