<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: repeating-linear-gradient(45deg, #3d5a80 0 40px, #98c1d9 40px 80px) format("woff2");
        font-weight: 700;
        font-display: block;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #17161a;
        overflow: hidden;
      }
      #hw-pt-root {
        --hw-font-print: "Caveat", cursive;
        --hw-font-script: "Caveat", cursive;
        --hw-ink: #f4f2ec;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--hw-font-print, "Caveat", cursive);
      }
      #hw-pt-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      /* The textPath carrier is geometry only — without fill:none it inherits
         SVG's default black fill and renders as a solid blob under the text. */
      #hw-pt-path {
        fill: none;
      }
      #hw-pt-guide {
        fill: none;
        stroke: rgba(244, 242, 236, 0.22);
        stroke-width: 3;
        stroke-dasharray: 2 14;
        stroke-linecap: round;
      }
      #hw-pt-svg text {
        font-family: var(--hw-font-print, "Caveat", cursive);
        font-weight: 700;
        fill: var(--hw-ink);
      }
      #hw-pt-svg tspan {
        opacity: 0;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Handwriting flowing along any SVG path with a per-character reveal; the path is the only geometry input",
 "class": "overlay",
 "tags": [
  "handwritten",
  "typography",
  "path",
  "overlay"
 ],
 "placeholders": "1 CSS picture as a gradient",
 "seconds": 5.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.2,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="hw-pt-root"
      data-composition-id="hw-path-text"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <svg id="hw-pt-svg" viewBox="0 0 1920 1080">
        <path id="hw-pt-path" d=""></path>
        <path id="hw-pt-guide" d=""></path>
        <text id="hw-pt-text" font-size="92">
          <textPath id="hw-pt-tp" href="#hw-pt-path" startOffset="4%"></textPath>
        </text>
      </svg>
      <div
        id="hw-pt-drv"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters ----
           Handwriting along any path — custom path text, natively via
           SVG textPath (no Fusion overlay). CONFIG.d is the whole design. */
        var CONFIG = {
          text: "come on this wild journey with me...",
          d: "M 220 700 C 520 480, 900 820, 1230 560 S 1700 380, 1780 420",
          fontSize: 92,
          showGuide: true, // faint dotted guide under the writing
          typeCharDelay: 0.05,
          seed: 12,
          boil: { enabled: true, amp: 1.4, rot: 0.3, frameDrop: 3 },
          animationOut: true,
        };

        var DUR = 6;
        function clamp(v, lo, hi) {
          return Math.min(hi, Math.max(lo, v));
        }
        var OUT = clamp(DUR * 0.06, 0.25, 0.6);

        /* hw family runtime */
        window.hwOnUpdate = function (tl, fn) {
          if (!tl.__hwRenders) {
            tl.__hwRenders = [];
            tl.eventCallback("onUpdate", function () {
              for (var i = 0; i < tl.__hwRenders.length; i++) tl.__hwRenders[i]();
            });
          }
          tl.__hwRenders.push(fn);
          fn();
        };
        window.hwHash = function (n, seed) {
          var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        };
        window.hwBoil = function (tl, target, opts) {
          opts = opts || {};
          var amp = opts.amp !== undefined ? opts.amp : 1.6;
          var rot = opts.rot !== undefined ? opts.rot : 0.5;
          var fps = opts.fps || 30;
          var drop = opts.frameDrop || 3;
          var seed = opts.seed || 1;
          var els = gsap.utils.toArray(target);
          window.hwOnUpdate(tl, function () {
            var step = Math.floor((tl.time() * fps) / drop);
            for (var i = 0; i < els.length; i++) {
              gsap.set(els[i], {
                x: window.hwHash(step * 3 + i * 97, seed) * amp,
                y: window.hwHash(step * 3 + 1 + i * 97, seed) * amp,
                rotation: (opts.baseRot || 0) + window.hwHash(step * 3 + 2 + i * 97, seed) * rot,
              });
            }
          });
        };

        var pathEl = document.getElementById("hw-pt-path");
        var guide = document.getElementById("hw-pt-guide");
        pathEl.setAttribute("d", CONFIG.d);
        if (CONFIG.showGuide) guide.setAttribute("d", CONFIG.d);
        document.getElementById("hw-pt-text").setAttribute("font-size", CONFIG.fontSize);

        /* per-char tspans along the path */
        var NS = "http://www.w3.org/2000/svg";
        var tp = document.getElementById("hw-pt-tp");
        Array.from(CONFIG.text).forEach(function (ch) {
          var t = document.createElementNS(NS, "tspan");
          t.textContent = ch;
          tp.appendChild(t);
        });

        var tl = gsap.timeline({ paused: true });

        /* guide draws first, then the handwriting types along it */
        if (CONFIG.showGuide) {
          var glen = guide.getTotalLength();
          gsap.set(guide, { strokeDasharray: "2 14", strokeDashoffset: glen });
          tl.to(guide, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.2);
        }
        var chars = tp.querySelectorAll("tspan");
        var delay = Math.min(CONFIG.typeCharDelay, 2.6 / Math.max(1, chars.length));
        tl.to(chars, { opacity: 1, duration: 0.03, stagger: delay, ease: "none" }, 0.7);

        if (CONFIG.boil.enabled) {
          window.hwBoil(tl, "#hw-pt-svg", {
            amp: CONFIG.boil.amp,
            rot: CONFIG.boil.rot,
            frameDrop: CONFIG.boil.frameDrop,
            seed: CONFIG.seed,
          });
        }

        if (CONFIG.animationOut) {
          tl.to("#hw-pt-svg", { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
        }
        tl.set("#hw-pt-root", { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["hw-path-text"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
