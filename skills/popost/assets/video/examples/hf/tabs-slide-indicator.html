  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tabs Slide Indicator - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale wrapper only — GSAP targets .indicator inside, not this element */
        transform: scale(3.5);
      }
      .hf-transition-tabs-slide-indicator {
        --hf-tab-x: 0px;
        --hf-tab-offset: var(--hf-tab-x);
        position: relative;
        display: inline-grid;
        grid-template-columns: repeat(3, 86px);
        padding: 4px;
        border: 1px solid #e4e4e7;
        border-radius: 999px;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-tabs-slide-indicator .indicator {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 86px;
        height: 36px;
        border-radius: 999px;
        background: #18181b;
        transform: translateX(var(--hf-tab-offset));
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18);
      }
      .hf-transition-tabs-slide-indicator button {
        --hf-tab-highlight-start: clamp(
          0px,
          calc(var(--hf-tab-offset) - var(--hf-tab-index) * 86px),
          86px
        );
        --hf-tab-highlight-end: clamp(
          0px,
          calc(var(--hf-tab-offset) + 86px - var(--hf-tab-index) * 86px),
          86px
        );
        position: relative;
        z-index: 1;
        height: 36px;
        border: 0;
        background-color: transparent;
        background-image: linear-gradient(
          to right,
          #6f6f78 0 var(--hf-tab-highlight-start),
          #fff var(--hf-tab-highlight-start) var(--hf-tab-highlight-end),
          #6f6f78 var(--hf-tab-highlight-end) 100%
        );
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-weight: 600;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A pill indicator transition that slides between active tabs",
 "class": "transition",
 "tags": [
  "transition-primitive",
  "transitions-dev-port",
  "tabs",
  "indicator"
 ],
 "seconds": 0.92,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "green",
    "blue",
    "violet"
   ],
   "what": "Fill of the sliding pill. ink is literal; the rest ride the composition theme tokens."
  },
  {
   "name": "width",
   "type": "choice",
   "default": "standard",
   "options": [
    "compact",
    "standard",
    "wide"
   ],
   "what": "Width of one tab. The slide the timeline drives is scaled to match, so the pill still lands on the next tab."
  },
  {
   "name": "shape",
   "type": "choice",
   "default": "pill",
   "options": [
    "pill",
    "rounded",
    "square"
   ],
   "what": "Corner radius of the track and the pill."
  },
  {
   "name": "labels",
   "type": "text",
   "default": "Plan,Debug,Ask",
   "maxLength": 200,
   "what": "The tab names, separated by commas. Two or more names rebuild the row."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="tabs-slide-indicator-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-tabs-slide-indicator"
          data-composition-variables='[
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Fill of the sliding pill. ink is literal; the rest ride the composition theme tokens.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "width", "type": "enum", "role": "layout", "label": "Tab width", "description": "Width of one tab. The slide the timeline drives is scaled to match, so the pill still lands on the next tab.", "default": "standard", "options": [{ "value": "compact", "label": "Compact" }, { "value": "standard", "label": "Standard" }, { "value": "wide", "label": "Wide" }] },
    { "id": "shape", "type": "enum", "role": "style", "label": "Shape", "description": "Corner radius of the track and the pill.", "default": "pill", "options": [{ "value": "pill", "label": "Pill" }, { "value": "rounded", "label": "Rounded" }, { "value": "square", "label": "Square" }] },
    { "id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "The tab names, separated by commas. Two or more names rebuild the row.", "default": "Plan,Debug,Ask" }
  ]'
        >
          <span class="indicator"></span><button style="--hf-tab-index: 0">Plan</button
          ><button style="--hf-tab-index: 1">Debug</button
          ><button style="--hf-tab-index: 2">Ask</button>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          // The pill is the one accent-carrying element here, so the three chromatic
          // options ride the composition's own tokens and fall back to ink.
          var accents = {
            ink: "#18181b",
            green: "var(--brand, #18181b)",
            blue: "var(--accent, #18181b)",
            violet: "var(--accent-2, #18181b)",
          };
          var widths = { compact: 72, standard: 86, wide: 104 };
          var shapes = { pill: "999px", rounded: "12px", square: "4px" };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var accent = accents[pick(accents, vars.accent, "ink")];
          var width = widths[pick(widths, vars.width, "standard")];
          var radius = shapes[pick(shapes, vars.shape, "pill")];
          var labels =
            typeof vars.labels === "string"
              ? vars.labels.split(",").map(function (part) {
                  return part.trim();
                })
              : [];
          labels = labels.filter(function (part) {
            return part.length > 0;
          });

          var roots = document.querySelectorAll(".hf-transition-tabs-slide-indicator");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-tab-fill", accent);
            roots[i].style.setProperty("--hf-tab-width", width + "px");
            // The timeline slides the pill by one standard tab, so scale that slide
            // to whatever a tab is actually worth here.
            roots[i].style.setProperty("--hf-tab-step", String(width / 86));
            roots[i].style.setProperty("--hf-tab-radius", radius);
            // A single tab has nowhere to slide to, so it is left as authored.
            if (labels.length > 1) {
              var old = roots[i].querySelectorAll("button");
              for (var j = 0; j < old.length; j += 1) {
                old[j].parentNode.removeChild(old[j]);
              }
              for (var k = 0; k < labels.length; k += 1) {
                var button = document.createElement("button");
                button.textContent = labels[k];
                button.style.setProperty("--hf-tab-index", String(k));
                roots[i].appendChild(button);
              }
              roots[i].style.setProperty("--hf-tab-count", String(labels.length));
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-transition-tabs-slide-indicator",
          { "--hf-tab-x": "0px" },
          { "--hf-tab-x": "86px", duration: 0.42, ease: "power3.inOut" },
          startTime,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["tabs-slide-indicator-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-tabs-slide-indicator {
        --hf-tab-x: 0px;
        --hf-tab-offset: calc(var(--hf-tab-x) * var(--hf-tab-step, 1));
        position: relative;
        display: inline-grid;
        grid-template-columns: repeat(var(--hf-tab-count, 3), var(--hf-tab-width, 86px));
        padding: 4px;
        border: 1px solid #e4e4e7;
        border-radius: var(--hf-tab-radius, 999px);
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-tabs-slide-indicator .indicator {
        position: absolute;
        top: 4px;
        left: 4px;
        width: var(--hf-tab-width, 86px);
        height: 36px;
        border-radius: var(--hf-tab-radius, 999px);
        background: var(--hf-tab-fill, #18181b);
        transform: translateX(var(--hf-tab-offset));
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18);
      }
      .hf-transition-tabs-slide-indicator button {
        --hf-tab-highlight-start: clamp(
          0px,
          calc(var(--hf-tab-offset) - var(--hf-tab-index) * var(--hf-tab-width, 86px)),
          var(--hf-tab-width, 86px)
        );
        --hf-tab-highlight-end: clamp(
          0px,
          calc(
            var(--hf-tab-offset) + var(--hf-tab-width, 86px) - var(--hf-tab-index) *
              var(--hf-tab-width, 86px)
          ),
          var(--hf-tab-width, 86px)
        );
        position: relative;
        z-index: 1;
        height: 36px;
        border: 0;
        background-color: transparent;
        background-image: linear-gradient(
          to right,
          #6f6f78 0 var(--hf-tab-highlight-start),
          #fff var(--hf-tab-highlight-start) var(--hf-tab-highlight-end),
          #6f6f78 var(--hf-tab-highlight-end) 100%
        );
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-weight: 850;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
