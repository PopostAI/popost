<html data-composition-variables='[
    { "id": "stationCount", "type": "number", "role": "layout", "label": "Station count", "description": "Number of feature stations in the row.", "default": 4, "min": 3, "max": 6, "step": 1 },
    { "id": "labels", "type": "string", "role": "content", "label": "Station labels", "description": "Comma-separated labels shown on the station cards.", "default": "Capture,Edit,Render,Share" },
    { "id": "dwell", "type": "number", "role": "timing", "label": "Dwell", "description": "Seconds the camera holds at each station before panning.", "default": 0.6, "min": 0.2, "max": 2, "step": 0.1, "unit": "s" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pan Stations - Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #14213a 0%, #05070d 72%);
      }

      .pan-stations-mount {
        --bg: #0b1120;
        --fg: #f8fafc;
        --surface: #17233b;
        --brand: #34d399;
        --accent: #60a5fa;
        --muted: #a5b4cc;
        --border: #34445f;
        width: 86%;
        height: 72%;
        left: 7%;
        top: 14%;
        overflow: hidden;
        border: 1px solid #34445f;
        border-radius: 32px;
        box-shadow: 0 48px 110px rgba(0, 0, 0, 0.48);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A lateral camera move across a continuous row of labeled feature stations, with a steady dwell at each stop before the next pan.",
 "class": "camera",
 "tags": [
  "camera",
  "pan",
  "stations",
  "features",
  "exhibit",
  "agitate",
  "cross-shelved"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "stationCount",
   "type": "number",
   "default": 4,
   "min": 3,
   "max": 6,
   "what": "Number of feature stations in the row."
  },
  {
   "name": "labels",
   "type": "text",
   "default": "Capture,Edit,Render,Share",
   "maxLength": 200,
   "what": "Comma-separated labels shown on the station cards."
  },
  {
   "name": "dwell",
   "type": "number",
   "default": 0.6,
   "min": 0.2,
   "max": 2,
   "unit": "s",
   "what": "Seconds the camera holds at each station before panning."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"stationCount":5,"labels":"Discover,Compose,Polish,Publish,Measure","dwell":0.2};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="pan-stations-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="pan-stations-mount"
        class="pan-stations-mount clip"
        data-composition-id="pan-stations"
       
        data-variable-values='{"stationCount":5,"labels":"Discover,Compose,Polish,Publish,Measure","dwell":0.2}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1651"
        data-height="778"
      >
      <div
        id="root"
        data-composition-id="pan-stations"
        data-start="0"
        data-duration="4"
        data-fps="30"
      >
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
            --ease-exit: cubic-bezier(0.55, 0.055, 0.675, 0.19);
            --ease-drift: cubic-bezier(0.445, 0.05, 0.55, 0.95);
            --ps-station-width: 78cqw;
            --ps-station-gap: var(--space-4, 6cqw);
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #0b1120);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .ps-clip {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            opacity: 0;
          }

          .ps-rail {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 0.18cqh;
            background: var(--border, #334155);
            opacity: 0.7;
          }

          .ps-strip {
            --ps-pan-index: 0;
            position: absolute;
            top: 18cqh;
            left: 0;
            display: flex;
            align-items: stretch;
            gap: var(--ps-station-gap);
            width: max-content;
            padding: 0 11cqw;
            transform: translateX(
              calc(var(--ps-pan-index) * -1 * (var(--ps-station-width) + var(--ps-station-gap)))
            );
            will-change: transform;
          }

          .ps-station {
            position: relative;
            flex: 0 0 var(--ps-station-width);
            height: 64cqh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: var(--space-3, 3cqh);
            padding: var(--space-5, 5cqw);
            overflow: hidden;
            border: 0.16cqw solid var(--border, #334155);
            border-radius: 3.2cqw;
            background: var(--surface, #1e293b);
            box-shadow: 0 2.2cqh 6cqw color-mix(in srgb, var(--bg, #0b1120) 72%, transparent);
          }

          .ps-station::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
              circle at 82% 18%,
              color-mix(in srgb, var(--brand, #22c55e) 24%, transparent),
              transparent 42%
            );
          }

          .ps-kicker,
          .ps-label,
          .ps-screen {
            position: relative;
            z-index: 1;
          }

          .ps-kicker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--muted, #94a3b8);
            font-size: 1.8cqw;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
          }

          .ps-index {
            color: var(--accent, #38bdf8);
            font-variant-numeric: tabular-nums;
          }

          .ps-screen {
            display: grid;
            grid-template-columns: 0.56fr 1fr;
            gap: var(--space-3, 3cqw);
            min-height: 0;
          }

          .ps-tool,
          .ps-stack {
            border: 0.13cqw solid var(--border, #334155);
            border-radius: 2cqw;
            background: color-mix(in srgb, var(--bg, #0b1120) 56%, var(--surface, #1e293b));
          }

          .ps-tool {
            display: grid;
            place-items: center;
          }

          .ps-glyph {
            width: 8.5cqw;
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border-radius: 2.2cqw;
            background: var(--brand, #22c55e);
            color: var(--bg, #0b1120);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: 3.2cqw;
            font-weight: 850;
          }

          .ps-stack {
            display: grid;
            align-content: center;
            gap: var(--space-2, 1.8cqh);
            padding: var(--space-3, 3cqw);
          }

          .ps-line {
            height: 1.15cqh;
            border-radius: 50%;
            background: var(--border, #334155);
          }

          .ps-line:nth-child(1) {
            width: 82%;
            background: var(--accent, #38bdf8);
          }

          .ps-line:nth-child(2) {
            width: 100%;
          }

          .ps-line:nth-child(3) {
            width: 64%;
          }

          .ps-label {
            max-width: 100%;
            overflow-wrap: anywhere;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: 5.8cqw;
            font-weight: 760;
            letter-spacing: -0.045em;
            line-height: 0.98;
          }
        </style>

        <div
          id="pan-stations-clip"
          class="ps-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="ps-rail"></div>
          <div class="ps-strip" aria-label="Feature stations"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            // Literal by contract: the mounted root loses data-composition-id.
            var compositionId = "pan-stations";
            var clip = root.querySelector(".ps-clip");
            var strip = root.querySelector(".ps-strip");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // INVARIANT: stationCount is always an integer in the declared 3-6 range.
            var rawCount = Number(vars.stationCount);
            var stationCount = Number.isFinite(rawCount) ? Math.round(rawCount) : 4;
            stationCount = Math.max(3, Math.min(6, stationCount));

            // INVARIANT: dwell is finite and positive, then clamps to 0.2-2 seconds.
            var rawDwell = Number(vars.dwell);
            var dwell = Number.isFinite(rawDwell) ? rawDwell : 0.6;
            dwell = Math.max(0.2, Math.min(2, dwell));

            var labelsSource =
              vars.labels == null ? "Capture,Edit,Render,Share" : String(vars.labels);
            var parsedLabels = labelsSource.split(",").map(function (label) {
              return label.trim();
            });

            // Station creation is the only owner of row content and fallback labels.
            for (var i = 0; i < stationCount; i += 1) {
              var label = parsedLabels[i] || "Station " + (i + 1);

              var station = document.createElement("article");
              station.className = "ps-station";
              station.setAttribute("aria-label", label);

              var kicker = document.createElement("div");
              kicker.className = "ps-kicker";
              kicker.innerHTML = '<span>Feature station</span><span class="ps-index"></span>';
              kicker.querySelector(".ps-index").textContent = String(i + 1).padStart(2, "0");

              var screen = document.createElement("div");
              screen.className = "ps-screen";
              screen.innerHTML =
                '<div class="ps-tool"><span class="ps-glyph"></span></div>' +
                '<div class="ps-stack"><span class="ps-line"></span><span class="ps-line"></span><span class="ps-line"></span></div>';
              screen.querySelector(".ps-glyph").textContent = label.charAt(0).toUpperCase();

              var title = document.createElement("div");
              title.className = "ps-label";
              title.textContent = label;

              station.appendChild(kicker);
              station.appendChild(screen);
              station.appendChild(title);
              strip.appendChild(station);
            }

            var stations = Array.from(strip.querySelectorAll(".ps-station"));

            // RETIME RANGE: fixed IN/OUT, elastic HOLD, no global time scaling.
            var IN_BASE = 0.45;
            var OUT_BASE = 0.4;
            var PAN_DURATION = 0.25;
            var durationValue = parseFloat(root.dataset.duration || "4");
            var duration = Number.isFinite(durationValue) ? Math.max(0.001, durationValue) : 4;
            var totalBase = IN_BASE + OUT_BASE;
            var envelopeScale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            // Explicit t=0 state for every animated endpoint.
            gsap.set(clip, { opacity: 0 });
            gsap.set(strip, { "--ps-pan-index": 0 });

            var tl = gsap.timeline({ paused: true });
            tl.to(clip, { opacity: 1, duration: IN, ease: "power2.out" }, 0);

            // HOLD: empty time is the steady dwell. Only complete pans are added.
            var cursor = HOLD_START;
            for (var stationIndex = 0; stationIndex < stations.length - 1; stationIndex += 1) {
              cursor += dwell;
              if (cursor + PAN_DURATION > OUT_START) break;
              tl.to(
                strip,
                {
                  "--ps-pan-index": stationIndex + 1,
                  duration: PAN_DURATION,
                  ease: "sine.inOut",
                },
                cursor,
              );
              cursor += PAN_DURATION;
            }

            tl.to(clip, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["pan-stations-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
