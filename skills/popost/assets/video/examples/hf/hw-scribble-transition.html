<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #hw-st-root {
        /* Warm marker accent, consistent with the rest of the hw family.
           Override per use via CONFIG.color. */
        --hw-accent: #ffb020;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #hw-st-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #hw-st-svg path {
        fill: none;
        stroke: var(--hw-accent);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* solid backstop that guarantees full coverage at the midpoint */
      #hw-st-solid {
        position: absolute;
        inset: 0;
        background: var(--hw-accent);
        opacity: 0;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Overlay transition, scribble bands accumulate to cover the frame with a solid backstop, the host cuts beneath, and the scribble clears",
 "class": "transition",
 "tags": [
  "handwritten",
  "transition",
  "wipe"
 ],
 "seconds": 2.17,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"draw","gain":0.45},{"at":1.42,"cue":"type","gain":0.3},{"at":1.53,"cue":"type","gain":0.3},{"at":1.63,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="hw-st-root"
      data-composition-id="hw-scribble-transition"
      data-start="0"
      data-duration="2.2"
      data-width="1920"
      data-height="1080"
    >
      <svg id="hw-st-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
      <div id="hw-st-solid"></div>
      <div
        id="hw-st-drv"
        class="clip"
        data-start="0"
        data-duration="2.2"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters ----
           Overlay-transition (the mk-clone-wall model): fat scribble strokes
           sweep across and cover the frame, a solid backstop guarantees full
           coverage at the midpoint (the host hard-cuts beneath, ~0.9-1.4s
           local), then everything clears. Place spanning the host's cut. */
        var CONFIG = {
          color: null, // css color; null = --hw-accent (warm marker)
          bands: 7, // horizontal scribble bands
          strokeScale: 1.0,
          seed: 17,
        };

        var W = 1920,
          H = 1080,
          DUR = 2.2;

        window.hwHash = function (n, seed) {
          var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        };

        var root = document.getElementById("hw-st-root");
        if (CONFIG.color) root.style.setProperty("--hw-accent", CONFIG.color);
        var NS = "http://www.w3.org/2000/svg";
        var svg = document.getElementById("hw-st-svg");

        /* fat zigzag bands, each covering a horizontal slice edge-to-edge */
        var bandH = H / CONFIG.bands;
        var paths = [];
        for (var b = 0; b < CONFIG.bands; b++) {
          var y0 = b * bandH + bandH / 2;
          var d = "M -80 " + (y0 + window.hwHash(b * 17, CONFIG.seed) * 20).toFixed(1);
          var zigs = 7;
          for (var i = 1; i <= zigs; i++) {
            var x = (W + 160) * (i / zigs) - 80;
            var y =
              y0 + (i % 2 ? -1 : 1) * bandH * 0.32 + window.hwHash(b * 17 + i, CONFIG.seed) * 16;
            d += " L " + x.toFixed(1) + " " + y.toFixed(1);
          }
          var p = document.createElementNS(NS, "path");
          p.setAttribute("d", d);
          p.setAttribute("stroke-width", Math.ceil(bandH * 0.85 * CONFIG.strokeScale));
          p.setAttribute("id", "hw-st-band-" + b);
          svg.appendChild(p);
          paths.push(p);
        }

        var tl = gsap.timeline({ paused: true });

        /* 0-0.85: bands scribble on (staggered, alternating direction) */
        paths.forEach(function (p, i) {
          var len = p.getTotalLength();
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: i % 2 ? -len : len });
          tl.to(p, { strokeDashoffset: 0, duration: 0.55, ease: "power2.in" }, 0.04 * i);
        });
        /* 0.8: solid backstop snaps in beneath the finished scribble — full
           coverage guaranteed 0.85-1.35 (the host's cut window) */
        tl.to("#hw-st-solid", { opacity: 1, duration: 0.12, ease: "none" }, 0.8);

        /* 1.35-1.95: clear — bands scribble off the other way, backstop lifts */
        tl.to("#hw-st-solid", { opacity: 0, duration: 0.15, ease: "none" }, 1.42);
        paths.forEach(function (p, i) {
          var len = p.getTotalLength();
          tl.to(
            p,
            { strokeDashoffset: i % 2 ? len : -len, duration: 0.5, ease: "power2.out" },
            1.42 + 0.035 * i,
          );
        });

        /* hard kill the moment the last band clears (learning: kill roots
           when the final fade completes, not at DUR) */
        tl.set(root, { visibility: "hidden" }, 2.17);

        window.__timelines["hw-scribble-transition"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
