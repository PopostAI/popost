<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "The word whose variable-font axes flex.", "default": "FLEX" },
    { "id": "axis", "type": "enum", "role": "style", "label": "Axis", "description": "Which variable-font axes animate: weight, width, or both.", "default": "both", "options": [{ "value": "weight", "label": "Weight" }, { "value": "width", "label": "Width" }, { "value": "both", "label": "Both" }] },
    { "id": "stagger", "type": "number", "role": "timing", "label": "Stagger", "description": "Seconds between per-character flex starts, clamped 0 to 0.25.", "default": 0.06 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Word color: green rides --brand, blue rides --accent, violet rides --accent-2.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "Optional departure. Default none: the carved word holds until the frame cuts.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Variable Font Flex Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #eef0f3);
      }

      #root {
        --bg: #eef0f3;
        --fg: #14161b;
        --muted: #5b6472;
        --surface: #ffffff;
        --border: #d3d8e0;
        --brand: #3f3f46;
        --accent: #3f3f46;
        --accent-2: #3f3f46;
        --font-display: "Inter", system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #f7f8fa 0%, var(--bg, #eef0f3) 72%);
      }

      .mount-bleed {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A word lands while its variable-font weight and width axes flex from hairline-condensed to black-wide with per-character stagger; font-size eases inversely so the letterforms gain mass while the box holds.",
 "class": "text",
 "tags": [
  "motion-primitive",
  "experiment",
  "type",
  "variable-font",
  "deterministic"
 ],
 "placeholders": "1 CSS picture as a gradient",
 "seconds": 3.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "FLEX",
   "maxLength": 200,
   "what": "The word whose variable-font axes flex."
  },
  {
   "name": "axis",
   "type": "choice",
   "default": "both",
   "options": [
    "weight",
    "width",
    "both"
   ],
   "what": "Which variable-font axes animate: weight, width, or both."
  },
  {
   "name": "stagger",
   "type": "number",
   "default": 0.06,
   "min": -100000,
   "max": 100000,
   "what": "Seconds between per-character flex starts, clamped 0 to 0.25."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Word color: green rides --brand, blue rides --accent, violet rides --accent-2."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Default none: the carved word holds until the frame cuts."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"ELASTIC","axis":"width","stagger":0.09,"accent":"blue"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="variable-font-flex-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="variable-font-flex-mount"
        class="mount-bleed clip"
        data-composition-id="variable-font-flex"
       
        data-variable-values='{"text":"ELASTIC","axis":"width","stagger":0.09,"accent":"blue"}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      >
      <div id="root" data-composition-id="variable-font-flex" data-duration="3.5" data-fps="30">
        <style>
          /* Pinned variable font: Fontsource build of Roboto Flex, latin
             standard subset, wght 100..1000 + wdth 25%..151% in one file.
             @fontsource-variable/roboto-flex@5.2.8 on jsdelivr. */
          @font-face {
            font-family: "Roboto Flex Variable";
            font-style: normal;
            font-display: block;
            font-weight: 100 1000;
            font-stretch: 25% 151%;
            src: linear-gradient(135deg, #3d5a80, #98c1d9)
              format("woff2-variations");
          }

          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: "Roboto Flex Variable", system-ui, sans-serif;
            pointer-events: none;
          }

          .vff-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, transparent);
          }

          .vff-stage {
            display: block;
            max-width: 94cqw;
            will-change: transform, opacity;
          }

          .vff-word {
            display: flex;
            align-items: baseline;
            justify-content: center;
            color: var(--vff-accent);
            line-height: 1;
            white-space: pre;
          }

          .vff-char {
            position: relative;
            display: inline-block;
            white-space: pre;
            /* No will-change and no transform on chars: per-char compositor
               layer promotion makes glyph antialiasing depend on seek
               history (paint-level nondeterminism); the rise rides
               relative top instead. */
          }
        </style>

        <div
          id="variable-font-flex-clip"
          class="vff-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="vff-stage" role="img">
            <div class="vff-word" aria-hidden="true"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".vff-stage");
            var word = root.querySelector(".vff-word");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null || vars.text === "" ? "FLEX" : String(vars.text);
            var axis = vars.axis === "weight" || vars.axis === "width" ? vars.axis : "both";
            var staggerRaw = parseFloat(vars.stagger);
            var stagger = isFinite(staggerRaw) ? Math.min(0.25, Math.max(0, staggerRaw)) : 0.06;
            // Each enum choice routes to a DIFFERENT contract token so the
            // variable stays meaningful under a theme.
            var accentColors = {
              green: "var(--brand, #52525b)",
              blue: "var(--accent, #52525b)",
              violet: "var(--accent-2, #52525b)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            root.style.setProperty("--vff-accent", accentColors[accent]);
            stage.setAttribute("aria-label", text);

            // Axis endpoints. Non-animated axes hold a fixed value so the
            // composed string is always complete and orderable.
            var WGHT_FROM = axis === "width" ? 620 : 120;
            var WGHT_TO = axis === "width" ? 620 : 840;
            var WDTH_FROM = axis === "weight" ? 100 : 40;
            var WDTH_TO = axis === "weight" ? 100 : 128;
            // Optical compensation strength per mode: how much of the mass
            // gain the font-size gives back so the box barely grows.
            var COMP = axis === "both" ? 0.16 : axis === "width" ? 0.12 : 0.08;

            // Build one span per character; spaces stay in flow (white-space:
            // pre) but never animate.
            var characters = Array.from(text);
            var hostDoc = root.ownerDocument;
            var chars = [];
            var fragment = hostDoc.createDocumentFragment();
            for (var i = 0; i < characters.length; i += 1) {
              var span = hostDoc.createElement("span");
              span.className = "vff-char";
              span.textContent = characters[i];
              fragment.appendChild(span);
              if (!/\s/.test(characters[i])) chars.push({ el: span, index: i });
            }
            word.appendChild(fragment);

            // Fit for the FINAL (wide, black) state; compensation only ever
            // shrinks below this. cqw base capped by cqh so short words on
            // wide hosts stay inside the frame.
            var fitted = Math.min(21, 118 / Math.max(3, characters.length));
            var BASE_SIZE = "min(" + fitted.toFixed(3) + "cqw, 30cqh)";
            root.style.setProperty("--vff-size", BASE_SIZE);
            word.style.fontSize = "var(--vff-size)";

            // Envelope: fixed IN/OUT, elastic HOLD, never time-scaled.
            var LEAD = 0.12;
            var FLEX = 1.15;
            var MARGIN = 0.15;
            var IN_BASE = LEAD + Math.max(0, chars.length - 1) * stagger + FLEX + MARGIN;
            var OUT_BASE = exit === "none" ? 0 : 0.45;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var totalBase = Math.max(0.001, IN_BASE + OUT_BASE);
            var scale = duration < totalBase ? duration / totalBase : 1;
            var lead = LEAD * scale;
            var flex = FLEX * scale;
            var staggerEff = stagger * scale;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;

            function clamp01(v) {
              return v < 0 ? 0 : v > 1 ? 1 : v;
            }
            // Carve ease: overshoots ~6% past the target, then settles. The
            // painter clamps composed axis values to the font's real ranges.
            function carve(u) {
              var c1 = 0.9;
              var c3 = c1 + 1;
              var x = u - 1;
              return 1 + c3 * x * x * x + c1 * x * x;
            }
            function clampAxis(v, lo, hi) {
              return v < lo ? lo : v > hi ? hi : v;
            }

            // Pure per-update painter: every character's axis NUMBERS are a
            // function of tl.time() alone; the font-variation-settings
            // string is composed from those numbers (the number proxy; the
            // string itself is never tweened). The word-level font-size
            // eases inversely to the mean settled progress: optical
            // compensation, mass grows while the box holds.
            function applyTime(timeSeconds) {
              var settledSum = 0;
              for (var c = 0; c < chars.length; c += 1) {
                var start = lead + c * staggerEff;
                var u = clamp01(flex > 0 ? (timeSeconds - start) / flex : 1);
                var e = u <= 0 ? 0 : u >= 1 ? 1 : carve(u);
                var settled = e > 1 ? 1 : e;
                settledSum += settled;
                var wght = clampAxis(WGHT_FROM + (WGHT_TO - WGHT_FROM) * e, 100, 1000);
                var wdth = clampAxis(WDTH_FROM + (WDTH_TO - WDTH_FROM) * e, 25, 151);
                var el = chars[c].el;
                el.style.fontVariationSettings =
                  '"wght" ' + wght.toFixed(1) + ', "wdth" ' + wdth.toFixed(2);
                var oIn = clamp01(flex > 0 ? (timeSeconds - start) / (flex * 0.22) : 1);
                el.style.opacity = (oIn * oIn * (3 - 2 * oIn)).toFixed(4);
                el.style.top = ((1 - settled) * 0.14).toFixed(4) + "em";
              }
              var mean = chars.length > 0 ? settledSum / chars.length : 1;
              word.style.fontSize = "calc(var(--vff-size) * " + (1 - COMP * mean).toFixed(4) + ")";
            }

            gsap.set(stage, { opacity: 1, y: "0cqh" });

            var tl = gsap.timeline({
              paused: true,
              onUpdate: function () {
                applyTime(tl.time());
              },
            });

            // Anchor tween: an inert plain-object tween spanning [0, D] so
            // onUpdate fires for every eventful seek and holds never clamp.
            tl.to({ p: 0 }, { p: 1, duration: duration, ease: "none" }, 0);

            // HOLD: truly still; repeated repaints write identical values.

            // OUT: optional departure; exit none holds until the frame cuts.
            if (exit === "up") {
              tl.to(stage, { y: "-4cqh", duration: OUT, ease: "power2.in" }, OUT_START);
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            } else if (exit === "fade") {
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            }

            tl.seek(0);
            applyTime(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["variable-font-flex"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["variable-font-flex-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
