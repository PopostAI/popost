<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #organic-light-leak-demo {
        width: 960px;
        height: 540px;
        margin: 0;
        overflow: hidden;
        background: #090909;
      }

      #light-leak-demo-backdrop,
      #light-leak-demo-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #light-leak-demo-backdrop {
        object-fit: cover;
      }

      #light-leak-demo-overlay {
        z-index: 20;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Finite CSS light-leak overlay for memory beats and motivated transitions",
 "class": "background",
 "tags": [
  "light-leak",
  "film",
  "memory",
  "transition",
  "overlay",
  "media-treatment-overlay"
 ],
 "placeholders": "1 picture as slots (picture-1 ...) with a drawn stand-in",
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 960x540 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 960, H = 540, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="organic-light-leak-demo"
      data-composition-id="organic-light-leak-demo"
      data-start="0"
      data-duration="4"
      data-width="960"
      data-height="540"
    >
      <img
        id="light-leak-demo-backdrop"
        class="clip"
        
        alt=""
        data-start="0"
        data-duration="4"
        data-track-index="0"
      / style="background: linear-gradient(135deg, #3d5a80, #98c1d9);" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-slot="picture-1">
      <div
        id="light-leak-demo-overlay"
        data-composition-id="organic-light-leak-overlay"
       
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="960"
        data-height="540"
      >
    <div
      id="organic-light-leak-overlay"
      data-composition-id="organic-light-leak-overlay"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="hf-light-leak" aria-hidden="true">
        <div class="hf-leak-layer hf-leak-amber"></div>
        <div class="hf-leak-layer hf-leak-red"></div>
        <div class="hf-leak-layer hf-leak-gold"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var leak = document.getElementById("hf-light-leak");
      var host = leak && leak.closest("[data-composition-id]");
      if (!host) throw new Error("Organic Light Leak could not find its composition host");

      var compositionId = host.getAttribute("data-composition-id");
      var duration = Number(host.getAttribute("data-duration")) || 4;
      var tl = gsap.timeline({ paused: true });

      tl.to({}, { duration: duration, ease: "none" }, 0);
      tl.fromTo(
        leak,
        { opacity: 0 },
        { opacity: 0.9, duration: duration * 0.24, ease: "sine.out" },
        duration * 0.08,
      );
      tl.to(leak, { opacity: 0.46, duration: duration * 0.2, ease: "sine.inOut" }, duration * 0.42);
      tl.to(leak, { opacity: 0, duration: duration * 0.26, ease: "sine.in" }, duration * 0.68);
      tl.fromTo(
        ".hf-leak-amber",
        { xPercent: -20, scale: 0.92, rotation: -4 },
        { xPercent: 18, scale: 1.1, rotation: 2, duration: duration, ease: "sine.inOut" },
        0,
      );
      tl.fromTo(
        ".hf-leak-red",
        { xPercent: 20, yPercent: -8, scale: 1.08 },
        { xPercent: -16, yPercent: 8, scale: 0.94, duration: duration, ease: "sine.inOut" },
        0,
      );
      tl.fromTo(
        ".hf-leak-gold",
        { xPercent: -28, rotation: -6 },
        { xPercent: 24, rotation: 4, duration: duration, ease: "sine.inOut" },
        0,
      );

      window.__timelines[compositionId] = tl;
    </script>
  </div>
    </div>

    <script>
      var tl = gsap.timeline({ paused: true });
      tl.to("#light-leak-demo-backdrop", { scale: 1.025, duration: 4, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["organic-light-leak-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
