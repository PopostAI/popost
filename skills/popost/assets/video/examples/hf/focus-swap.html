<html data-composition-variables='[
    { "id": "focus", "type": "enum", "role": "motion", "label": "Final focus", "description": "Card that ends sharp, full-size, and fully opaque.", "default": "b", "options": [{ "value": "a", "label": "Card A" }, { "value": "b", "label": "Card B" }] },
    { "id": "blurPx", "type": "number", "role": "style", "label": "Unfocused blur", "description": "Blur applied to the card outside the viewer focus.", "default": 6, "min": 0, "max": 20, "step": 1, "unit": "px" },
    { "id": "dim", "type": "number", "role": "style", "label": "Unfocused opacity", "description": "Opacity of the card outside the viewer focus.", "default": 0.5, "min": 0, "max": 1, "step": 0.05 }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Focus Swap - Demo</title>
    <style>
      :root {
        --bg: #070a12;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --surface: #151c2c;
        --border: #34405a;
        --brand: #e4e4e7;
        --accent: #e4e4e7;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 22px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 32px;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 45%,
          color-mix(in srgb, var(--surface) 78%, var(--bg)),
          var(--bg) 72%
        );
      }

      .mount-card {
        width: 70%;
        height: 60%;
        left: 15%;
        top: 20%;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
        border-radius: calc(var(--radius) * 1.4);
        box-shadow: 0 40px 90px color-mix(in srgb, var(--bg) 78%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Moves attention between two side-by-side cards as one recedes with scale, blur, and dimming while the other advances to full focus.",
 "class": "transition",
 "tags": [
  "effect",
  "ui-props",
  "focus",
  "blur",
  "attention",
  "demonstrate"
 ],
 "seconds": 0.9,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "focus",
   "type": "choice",
   "default": "b",
   "options": [
    "a",
    "b"
   ],
   "what": "Card that ends sharp, full-size, and fully opaque."
  },
  {
   "name": "blurPx",
   "type": "number",
   "default": 6,
   "min": 0,
   "max": 20,
   "unit": "px",
   "what": "Blur applied to the card outside the viewer focus."
  },
  {
   "name": "dim",
   "type": "number",
   "default": 0.5,
   "min": 0,
   "max": 1,
   "what": "Opacity of the card outside the viewer focus."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"focus":"b","blurPx":6,"dim":0.5};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.2,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="focus-swap-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="1.5"
      data-fps="30"
    >
      <div
        id="focus-swap-mount"
        class="mount-card clip"
        data-composition-id="focus-swap"
       
        data-variable-values='{"focus":"b","blurPx":6,"dim":0.5}'
        data-start="0"
        data-duration="1.5"
        data-track-index="0"
        data-width="1344"
        data-height="648"
      >
      <div id="root" data-composition-id="focus-swap" data-duration="1.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #070a12);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .fs-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 7cqh 6cqw;
          }

          .fs-pair {
            width: 100%;
            height: min(72cqh, 52cqw);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4cqw;
            align-items: stretch;
          }

          /* EDIT ZONE: visual payload only. Keep the card frames and their
             initial states transform-free because GSAP owns scale and blur. */
          .fs-card {
            min-width: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5cqh 3.2cqw;
            overflow: hidden;
            border: 0.16cqw solid var(--border, #34405a);
            border-radius: var(--radius, 22px);
            background: var(--surface, #151c2c);
            box-shadow: 0 2.2cqh 5cqh color-mix(in srgb, var(--bg, #070a12) 72%, transparent);
            transform-origin: center;
            will-change: transform, filter, opacity;
            /* Both cards are the same placeholder material. Which one holds
               attention is said by blur, scale, and opacity, never by hue. */
            --fs-card-accent: color-mix(in srgb, var(--fg, #f8fafc) 72%, var(--surface, #151c2c));
          }

          .fs-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 0.75cqh;
            background: var(--fs-card-accent);
          }

          .fs-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2, 16px);
          }

          .fs-card-letter {
            display: grid;
            place-items: center;
            width: 5cqw;
            aspect-ratio: 1;
            border-radius: 50%;
            background: color-mix(in srgb, var(--fg, #f8fafc) 13%, var(--surface, #151c2c));
            color: var(--fg, #f8fafc);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
            font-size: 2.3cqw;
            font-weight: 700;
          }

          .fs-status {
            color: var(--muted, #94a3b8);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
            font-size: 1.25cqw;
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }

          .fs-copy {
            display: grid;
            gap: var(--space-1, 8px);
          }

          .fs-title {
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: 3.4cqw;
            font-weight: 680;
            line-height: 1;
            letter-spacing: -0.025em;
          }

          .fs-detail {
            color: var(--muted, #94a3b8);
            font-size: 1.45cqw;
            line-height: 1.35;
          }

          .fs-meter {
            height: 1.1cqh;
            overflow: hidden;
            border-radius: var(--radius, 22px);
            background: color-mix(in srgb, var(--border, #34405a) 60%, transparent);
          }

          .fs-meter-fill {
            width: var(--fs-meter-width);
            height: 100%;
            border-radius: inherit;
            background: var(--fs-card-accent);
          }
        </style>

        <div class="fs-clip clip" data-start="0" data-duration="1.5" data-track-index="0">
          <div class="fs-pair">
            <article class="fs-card" data-focus-card="a" aria-label="Card A, plan">
              <div class="fs-card-head">
                <span class="fs-card-letter">A</span>
                <span class="fs-status">Plan</span>
              </div>
              <div class="fs-copy">
                <h2 class="fs-title">Shape the idea</h2>
                <p class="fs-detail">Define the brief and align the team.</p>
              </div>
              <div class="fs-meter" aria-hidden="true">
                <div class="fs-meter-fill" style="--fs-meter-width: 58%"></div>
              </div>
            </article>

            <article class="fs-card" data-focus-card="b" aria-label="Card B, launch">
              <div class="fs-card-head">
                <span class="fs-card-letter">B</span>
                <span class="fs-status">Launch</span>
              </div>
              <div class="fs-copy">
                <h2 class="fs-title">Ship the result</h2>
                <p class="fs-detail">Move from approved work to live impact.</p>
              </div>
              <div class="fs-meter" aria-hidden="true">
                <div class="fs-meter-fill" style="--fs-meter-width: 86%"></div>
              </div>
            </article>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var cardA = root.querySelector('[data-focus-card="a"]');
            var cardB = root.querySelector('[data-focus-card="b"]');
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // INVARIANT: focus is the only owner of which card advances and
            // which recedes. Invalid input resolves to the declared default.
            var targetIsB = vars.focus !== "a";
            var initialFocused = targetIsB ? cardA : cardB;
            var targetFocused = targetIsB ? cardB : cardA;

            var rawBlur = Number(vars.blurPx);
            var blurPx = Number.isFinite(rawBlur) ? Math.max(0, Math.min(20, rawBlur)) : 6;
            var rawDim = Number(vars.dim);
            var dim = Number.isFinite(rawDim) ? Math.max(0, Math.min(1, rawDim)) : 0.5;
            var blurred = "blur(" + blurPx + "px)";
            var sharp = "blur(0px)";

            // RETIME RANGE: keep the standard 0.20s lead and 0.70s swap. Only
            // short host durations compress them so focus always lands by D.
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "1.5"));
            var SWAP_START = Math.min(0.2, duration * 0.2);
            var SWAP_DURATION = Math.min(0.7, Math.max(0.001, duration - SWAP_START));

            gsap.set(initialFocused, { opacity: 1, scale: 1, filter: sharp });
            gsap.set(targetFocused, { opacity: dim, scale: 0.92, filter: blurred });

            var tl = gsap.timeline({ paused: true });
            tl.to(
              initialFocused,
              {
                opacity: dim,
                scale: 0.92,
                filter: blurred,
                duration: SWAP_DURATION,
                ease: "power2.out",
              },
              SWAP_START,
            );
            tl.to(
              targetFocused,
              {
                opacity: 1,
                scale: 1,
                filter: sharp,
                duration: SWAP_DURATION,
                ease: "power2.out",
              },
              SWAP_START,
            );

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["focus-swap"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["focus-swap-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
