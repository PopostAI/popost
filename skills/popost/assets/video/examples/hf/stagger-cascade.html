<html data-composition-variables='[
    { "id": "itemCount", "type": "number", "role": "layout", "label": "Item count", "description": "Number of tiles in the responsive grid.", "default": 6, "min": 3, "max": 12, "step": 1 },
    { "id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Delay between consecutive tile entrances.", "default": 60, "min": 20, "max": 150, "step": 1, "unit": "ms" },
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Direction each tile travels into its resting position.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }, { "value": "left", "label": "Left" }, { "value": "right", "label": "Right" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Stagger Cascade Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        --bg: #090d16;
        --fg: #f4f7fb;
        --muted: #8d99aa;
        --surface: #171e2d;
        --border: rgba(244, 247, 251, 0.14);
        --brand: #79a8ff;
        --accent: #8be0c4;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, monospace;
        --radius: 16px;
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 32px;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        --ease-exit: cubic-bezier(0.55, 0.055, 0.675, 0.19);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
      }

      .mount-card {
        width: 50%;
        height: 60%;
        left: 25%;
        top: 20%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 40px 100px color-mix(in srgb, var(--fg) 12%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A responsive grid of tile cards that fades and travels into place with an evenly spaced per-item GSAP stagger. The ordered cascade is the only visual mechanic.",
 "class": "text",
 "tags": [
  "effects",
  "grid",
  "stagger",
  "entrance",
  "exhibit"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "itemCount",
   "type": "number",
   "default": 6,
   "min": 3,
   "max": 12,
   "what": "Number of tiles in the responsive grid."
  },
  {
   "name": "stagger",
   "type": "number",
   "default": 60,
   "min": 20,
   "max": 150,
   "unit": "ms",
   "what": "Delay between consecutive tile entrances."
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "up",
   "options": [
    "up",
    "down",
    "left",
    "right"
   ],
   "what": "Direction each tile travels into its resting position."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"itemCount":8,"stagger":90,"direction":"left"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.1,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="stagger-cascade-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="stagger-cascade-mount"
        class="mount-card clip"
        data-composition-id="stagger-cascade"
       
        data-variable-values='{"itemCount":8,"stagger":90,"direction":"left"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="960"
        data-height="648"
      >
      <div
        id="root"
        data-composition-id="stagger-cascade"
        data-start="0"
        data-duration="4"
        data-fps="30"
      >
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root fills the host box. Every internal measurement uses cqw/cqh,
             and every painted color comes from the host theme contract. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f4f7fb);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .sc-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #090d16);
          }

          .sc-grid {
            width: 82cqw;
            height: 70cqh;
            display: grid;
            grid-template-columns: repeat(var(--sc-columns), minmax(0, 1fr));
            grid-auto-rows: minmax(0, 1fr);
            gap: min(2.2cqw, 3.8cqh);
          }

          .sc-tile {
            position: relative;
            min-width: 0;
            min-height: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 0.16cqw solid var(--border, rgba(244, 247, 251, 0.14));
            border-radius: min(2.4cqw, 4cqh);
            background: color-mix(in srgb, var(--surface, #171e2d) 92%, var(--brand, #79a8ff));
            color: var(--fg, #f4f7fb);
          }

          .sc-tile::after {
            content: "";
            position: absolute;
            left: 14%;
            right: 14%;
            bottom: 12%;
            height: min(0.55cqw, 0.95cqh);
            border-radius: 50cqw;
            background: var(--brand, #79a8ff);
            opacity: 0.72;
          }

          .sc-tile-index {
            display: block;
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: min(5cqw, 8cqh);
            font-weight: 700;
            line-height: 1;
            color: var(--fg, #f4f7fb);
          }
        </style>

        <div
          id="stagger-cascade-clip"
          class="sc-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="sc-grid" aria-label="Cascading tile grid"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "stagger-cascade";
            var grid = root.querySelector(".sc-grid");

            // EDIT ZONE: declarations above and clamped reads below are the
            // single source of truth for the primitive's three public knobs.
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var rawItemCount = Number(vars.itemCount);
            var itemCount = Number.isFinite(rawItemCount) ? Math.round(rawItemCount) : 6;
            itemCount = Math.max(3, Math.min(12, itemCount));

            var rawStagger = Number(vars.stagger);
            var staggerMs = Number.isFinite(rawStagger) ? rawStagger : 60;
            staggerMs = Math.max(20, Math.min(150, staggerMs));

            // INVARIANT: only these four mappings can reach GSAP. Each option
            // has a distinct axis or sign at preview size.
            var offsets = {
              up: { x: "0cqw", y: "12cqh" },
              down: { x: "0cqw", y: "-12cqh" },
              left: { x: "8cqw", y: "0cqh" },
              right: { x: "-8cqw", y: "0cqh" },
            };
            var offset = Object.prototype.hasOwnProperty.call(offsets, vars.direction)
              ? offsets[vars.direction]
              : offsets.up;

            // itemCount owns both DOM count and the responsive grid shape.
            var fragment = document.createDocumentFragment();
            for (var index = 0; index < itemCount; index += 1) {
              var tile = document.createElement("div");
              var number = document.createElement("span");
              tile.className = "sc-tile";
              tile.setAttribute("aria-hidden", "true");
              number.className = "sc-tile-index";
              number.textContent = String(index + 1).padStart(2, "0");
              tile.appendChild(number);
              fragment.appendChild(tile);
            }
            grid.replaceChildren(fragment);
            grid.style.setProperty(
              "--sc-columns",
              String(Math.min(4, Math.ceil(Math.sqrt(itemCount)))),
            );

            var tiles = root.querySelectorAll(".sc-tile");

            // RETIME RANGE: change these four base values together. IN_BASE is
            // sized so 12 items at 150ms plus the entrance tween finish exactly
            // at its boundary. HOLD alone absorbs longer host durations.
            var IN_BASE = 2.4;
            var OUT_BASE = 0.4;
            var CASCADE_START_BASE = 0.1;
            var ENTRY_DURATION_BASE = 0.65;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;
            var CASCADE_START = CASCADE_START_BASE * scale;
            var ENTRY_DURATION = ENTRY_DURATION_BASE * scale;
            var STAGGER_SECONDS = (staggerMs / 1000) * scale;

            var timeline = gsap.timeline({ paused: true });

            // IN: the sole mechanic. Explicit endpoints keep mounted re-seeks
            // deterministic. power2.out is --ease-standard.
            timeline.fromTo(
              tiles,
              { opacity: 0, x: offset.x, y: offset.y },
              {
                opacity: 1,
                x: "0cqw",
                y: "0cqh",
                duration: ENTRY_DURATION,
                ease: "power2.out",
                stagger: { each: STAGGER_SECONDS, from: "start" },
              },
              CASCADE_START,
            );

            // HOLD: deliberately unanimated. OUT: one clean group fade with
            // power2.in, the GSAP form of --ease-exit.
            timeline.to(grid, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            timeline.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = timeline;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      // The mounted primitive owns all visible motion. This standalone host
      // registers only the empty paused timeline required for its own id.
      window.__timelines = window.__timelines || {};
      window.__timelines["stagger-cascade-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
