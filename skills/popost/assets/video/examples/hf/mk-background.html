<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #mk-bg-root {
        /* ---- mk tokens: override these in the host to re-skin the family ---- */
        --mk-font: "Inter", -apple-system, sans-serif;
        --mk-stage: #f5f5f7;
        --mk-base: #ffffff;
        --mk-blob-1: #ff7ac8;
        --mk-blob-2: #45d6c8;
        --mk-stage-dark: #000000;
        --mk-base-dark: #0a0a0c;
        --mk-blob-1-dark: #7d5cff;
        --mk-blob-2-dark: #2d1b69;
        --mk-radius-card: 40px;
        --mk-shadow: 0 30px 80px rgba(0, 0, 0, 0.18);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--mk-stage);
      }
      #mk-bg-root.mk-dark {
        background: var(--mk-stage-dark);
      }
      /* The "Bar" — an animatable rounded-rect mask. Full-bleed by default,
         animatable down to a floating card over the stage. */
      #mk-bg-card {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        border-radius: 0;
        background: var(--mk-base);
        box-shadow: var(--mk-shadow);
      }
      .mk-dark #mk-bg-card {
        background: var(--mk-base-dark);
      }
      /* Soft radial blobs — the procedural "mesh gradient". Two oversized
         radial gradients with a long falloff, drifting slowly. */
      .mk-bg-blob {
        position: absolute;
        border-radius: 50%;
        will-change: transform;
      }
      #mk-bg-blob1 {
        background: radial-gradient(
          circle closest-side,
          var(--mk-blob-1) 0%,
          rgba(255, 255, 255, 0) 72%
        );
      }
      #mk-bg-blob2 {
        background: radial-gradient(
          circle closest-side,
          var(--mk-blob-2) 0%,
          rgba(255, 255, 255, 0) 72%
        );
      }
      .mk-dark #mk-bg-blob1 {
        background: radial-gradient(
          circle closest-side,
          var(--mk-blob-1-dark) 0%,
          rgba(0, 0, 0, 0) 72%
        );
      }
      .mk-dark #mk-bg-blob2 {
        background: radial-gradient(
          circle closest-side,
          var(--mk-blob-2-dark) 0%,
          rgba(0, 0, 0, 0) 72%
        );
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Procedural soft-blob gradient backdrop in a minimalist presentation style: two radial blobs drifting over a base color, with an animatable rounded-card bar mask and optional frosted-glass mode",
 "class": "background",
 "tags": [
  "background",
  "gradient",
  "minimal",
  "professional",
  "presentation"
 ],
 "seconds": 9.98,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="mk-bg-root"
      data-composition-id="mk-background"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="mk-bg-card">
        <div id="mk-bg-blob1" class="mk-bg-blob" data-layout-allow-overflow></div>
        <div id="mk-bg-blob2" class="mk-bg-blob" data-layout-allow-overflow></div>
      </div>
      <div
        id="mk-bg-drv"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ---- */
        var CONFIG = {
          scheme: "light", // "light" | "dark"
          animationIn: true, // fade/settle entrance
          animationOut: true, // fade exit
          drift: true, // ambient blob motion
          // Soft BG blobs: center as fraction of canvas, radius in px
          blob1: { x: 0.28, y: 0.32, r: 950, opacity: 0.85 },
          blob2: { x: 0.74, y: 0.66, r: 1100, opacity: 0.8 },
          // Bar mask (rounded-rect card). demo:true plays full-bleed -> card -> full-bleed
          bar: {
            demo: true, // full-bleed -> rounded card -> full-bleed showcase
            x: 240,
            y: 140,
            width: 1440,
            height: 800,
            roundness: 40,
          },
          // Content opacity + frost only matter with footage beneath the block
          contentOpacity: 1,
          frostBlur: 0, // px; e.g. 24 for the frosted-card look over footage
        };

        var W = 1920,
          H = 1080,
          DUR = 10;

        var root = document.getElementById("mk-bg-root");
        var card = document.getElementById("mk-bg-card");
        var blob1 = document.getElementById("mk-bg-blob1");
        var blob2 = document.getElementById("mk-bg-blob2");

        if (CONFIG.scheme === "dark") root.classList.add("mk-dark");

        function placeBlob(el, b) {
          var d = b.r * 2;
          el.style.width = d + "px";
          el.style.height = d + "px";
          el.style.left = b.x * W - b.r + "px";
          el.style.top = b.y * H - b.r + "px";
          el.style.opacity = String(b.opacity);
        }
        placeBlob(blob1, CONFIG.blob1);
        placeBlob(blob2, CONFIG.blob2);

        card.style.opacity = String(CONFIG.contentOpacity);
        if (CONFIG.frostBlur > 0) {
          card.style.backdropFilter = "blur(" + CONFIG.frostBlur + "px) saturate(1.4)";
        }

        var tl = gsap.timeline({ paused: true });

        /* entrance — fade + blobs settle (power3, no bounce) */
        if (CONFIG.animationIn) {
          tl.from(root, { opacity: 0, duration: 0.7, ease: "power2.out" }, 0);
          tl.from([blob1, blob2], { scale: 1.14, duration: 1.2, ease: "power3.out" }, 0);
        }

        /* ambient drift — slow sine yoyo, seek-safe timeline tweens */
        if (CONFIG.drift) {
          tl.to(
            blob1,
            { x: 70, y: 42, duration: 2.35, ease: "sine.inOut", yoyo: true, repeat: 3 },
            0.3,
          );
          tl.to(
            blob2,
            { x: -84, y: -36, duration: 2.35, ease: "sine.inOut", yoyo: true, repeat: 3 },
            0.3,
          );
        }

        /* bar-mask demo: full-bleed -> rounded card over the stage -> full-bleed.
           Offset via x/y transforms, not top/left: layout properties snap to
           integer device pixels and stutter under seek-by-frame capture. The
           card's CSS base is top:0/left:0, so the transform values match 1:1. */
        if (CONFIG.bar.demo) {
          tl.to(
            card,
            {
              y: CONFIG.bar.y,
              x: CONFIG.bar.x,
              width: CONFIG.bar.width,
              height: CONFIG.bar.height,
              borderRadius: CONFIG.bar.roundness,
              duration: 1.1,
              ease: "power3.inOut",
            },
            3.8,
          );
          tl.to(
            card,
            {
              y: 0,
              x: 0,
              width: W,
              height: H,
              borderRadius: 0,
              duration: 1.0,
              ease: "power3.inOut",
            },
            7.6,
          );
        }

        /* exit + hard kill */
        if (CONFIG.animationOut) {
          tl.to(root, { opacity: 0, duration: 0.4, ease: "power2.in" }, DUR - 0.45);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-background"] = tl;
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
