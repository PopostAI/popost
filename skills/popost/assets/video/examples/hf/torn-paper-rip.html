<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"direction":"right-to-left","roughness":72};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>

        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var fromLayer = document.getElementById("tpr-from");
            var fromClip = document.getElementById("tpr-from-clip");
            var toLayer = document.getElementById("tpr-to");
            var rimLayer = document.getElementById("tpr-rim");

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var direction = vars.direction === "right-to-left" ? "right-to-left" : "left-to-right";

            var rimColors = {
              cream: "#f6f1e7",
              kraft: "#d8c29c",
              white: "#fbfaf8",
            };
            var tone = Object.prototype.hasOwnProperty.call(rimColors, vars.tone)
              ? vars.tone
              : "cream";
            root.style.setProperty("--tpr-rim-color", rimColors[tone]);

            var roughnessValue = parseFloat(vars.roughness);
            var roughness = Number.isFinite(roughnessValue)
              ? Math.min(90, Math.max(20, roughnessValue))
              : 55;
            var roughnessNorm = (roughness - 20) / 70;

            // Slots. Caller templates live at the host document level (the
            // mount wipes host-clip children, and templates never render),
            // so the lookup deliberately goes through ownerDocument.
            var hostDoc = root.ownerDocument;
            function mountSlot(slotName, layer) {
              var tpl = null;
              try {
                tpl = hostDoc.querySelector('template[data-slot="' + slotName + '"]');
              } catch (error) {
                tpl = null;
              }
              if (!tpl) return;
              var defaultMark = layer.querySelector(".tpr-default");
              if (defaultMark) defaultMark.remove();
              layer.appendChild(hostDoc.importNode(tpl.content, true));
            }
            mountSlot("torn-paper-rip-from", fromClip);
            mountSlot("torn-paper-rip-to", toLayer);

            // Envelope: fixed IN, elastic HOLD, never time-scaled.
            var IN_BASE = 1.0;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "2.4"));
            var IN = Math.min(IN_BASE, duration);

            // Edge table, built once. Sizes are px at 1920 wide, stored as %
            // of width: a low-frequency wander (~40 px at roughness 55), a
            // 2-4 px per-vertex fibre, and a 6-14 px paper-core band.
            var PX = 100 / 1920;
            var ROWS = 180;
            var WANDER_PX = 22 + roughnessNorm * 36;
            var FIBRE_PX = 2 + roughnessNorm * 2;
            var DIAGONAL_PCT = 1 + roughnessNorm * 4;
            var RIM_MIN_PX = 6;
            var RIM_MAX_PX = 14;

            var state = 0x7a9e11cf;
            function rand() {
              state = (Math.imul(1664525, state) + 1013904223) >>> 0;
              return state / 4294967296;
            }
            // Seeded value noise over [0, 1] with smoothstep between knots.
            function valueNoise(knots) {
              var k = [];
              for (var i = 0; i <= knots; i += 1) k.push(rand() * 2 - 1);
              return function (v) {
                var f = v * knots;
                var i = Math.min(knots - 1, Math.floor(f));
                var u = f - i;
                u = u * u * (3 - 2 * u);
                return k[i] + (k[i + 1] - k[i]) * u;
              };
            }
            var wander = valueNoise(6);
            var coreWidth = valueNoise(14);
            var edge = [];
            for (var r = 0; r <= ROWS; r += 1) {
              var v = r / ROWS;
              var rimPx = RIM_MIN_PX + (RIM_MAX_PX - RIM_MIN_PX) * (coreWidth(v) * 0.5 + 0.5);
              rimPx = Math.min(
                RIM_MAX_PX,
                Math.max(RIM_MIN_PX, rimPx + (rand() * 2 - 1) * FIBRE_PX),
              );
              edge.push({
                y: (v * 100).toFixed(2) + "%",
                offset:
                  (v - 0.5) * DIAGONAL_PCT +
                  (wander(v) * WANDER_PX + (rand() * 2 - 1) * FIBRE_PX) * PX,
                rim: rimPx * PX,
              });
            }

            var maxOffset = edge.reduce(function (m, row) {
              return Math.max(m, Math.abs(row.offset));
            }, 0);
            // Clears the worst row plus the core band and its feather, so no
            // edge is on screen at p=0 or p=1.
            var MARGIN = maxOffset + RIM_MAX_PX * PX + 0.5;
            // side: which side of the boundary still shows "from" (ltr tears
            // from the left, so "from" lives on the right; rtl mirrors).
            var side = direction === "left-to-right" ? "right" : "left";
            var START = side === "right" ? -MARGIN : 100 + MARGIN;
            var END = side === "right" ? 100 + MARGIN : -MARGIN;
            var CORNER_X = side === "right" ? "100%" : "0%";
            var RIM_SIGN = side === "right" ? -1 : 1;
            var LIFT_SIGN = -RIM_SIGN;
            fromLayer.style.transformOrigin = CORNER_X + " 100%";

            // power2.in over the first 20% of travel in 30% of the time,
            // then power3.out; the speed jump is the paper giving way.
            var RESIST_T = 0.3;
            function tearEase(p) {
              if (p < RESIST_T) return 0.2 * Math.pow(p / RESIST_T, 2);
              return 0.2 + 0.8 * (1 - Math.pow(1 - (p - RESIST_T) / (1 - RESIST_T), 3));
            }

            function paint(p) {
              var e = tearEase(Math.max(0, Math.min(1, p)));
              var bx = START + (END - START) * e;

              var fromPts = CORNER_X + " 0%, " + CORNER_X + " 100%";
              var rimPts = fromPts;
              for (var i = ROWS; i >= 0; i -= 1) {
                var row = edge[i];
                var x = bx + row.offset;
                fromPts += ", " + x.toFixed(2) + "% " + row.y;
                rimPts += ", " + (x + RIM_SIGN * row.rim).toFixed(2) + "% " + row.y;
              }
              fromClip.style.clipPath = "polygon(" + fromPts + ")";
              rimLayer.style.clipPath = "polygon(" + rimPts + ")";

              // The sheet lifts toward the tear: up to 3% travel, 1.5deg,
              // and a shadow growing to 0 12px 24px (1080 tall).
              fromLayer.style.transform =
                "translateX(" +
                (LIFT_SIGN * 3 * e).toFixed(3) +
                "%) rotate(" +
                (LIFT_SIGN * 1.5 * e).toFixed(3) +
                "deg)";
              fromLayer.style.filter =
                "drop-shadow(0 " +
                (1.111 * e).toFixed(3) +
                "cqmin " +
                (2.222 * e).toFixed(3) +
                "cqmin rgba(0, 0, 0, 0.25))";
            }

            paint(0);

            var tl = gsap.timeline({
              paused: true,
              onUpdate: function () {
                paint(this.progress());
              },
            });
            tl.to({}, { duration: IN, ease: "none" }, 0);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["torn-paper-rip"] = tl;
          })();
        </script>

    <script src="../lib/gsap.min.js"></script>
    <script>
      (function () {
        // Seeded, so the scene is identical on every load.
        var seed = 7;
        function rand() {
          seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
          return seed / 4294967296;
        }
        function rect(x, y, w, h, fill, opacity) {
          return (
            '<rect x="' +
            x.toFixed(1) +
            '" y="' +
            y.toFixed(1) +
            '" width="' +
            w.toFixed(1) +
            '" height="' +
            h.toFixed(1) +
            '" fill="' +
            fill +
            '" opacity="' +
            opacity.toFixed(2) +
            '"/>'
          );
        }

        // A backlit harbor at dusk: silhouettes, a low sun and its broken
        // reflection, so it reads as a photograph rather than flat vector.
        function harborScene() {
          var town = "";
          var lights = "";
          for (var bx = 20; bx < 600; ) {
            var w = 18 + rand() * 34;
            var h = 16 + rand() * 46;
            var base = 566 + bx * 0.11;
            town += rect(bx, base - h, w, h + 30, "#2a2036", 1);
            if (rand() > 0.35) {
              var lx = bx + 4 + rand() * (w - 10);
              var ly = base - h + 5 + rand() * (h - 12);
              lights += rect(lx, ly, 4, 5, "#ffc57a", 0.9);
              lights += rect(lx, 654 + (650 - ly) * 0.2, 3, 26, "#ffc57a", 0.22);
            }
            bx += w + 2 + rand() * 6;
          }
          var posts = "";
          for (var px = 1488; px < 1920; px += 44) posts += rect(px, 736, 7, 70, "#0e0a14", 1);
          return (
            '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">' +
            "<defs>" +
            '<linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="650">' +
            '<stop offset="0" stop-color="#151c33"/><stop offset="0.35" stop-color="#2e3150"/>' +
            '<stop offset="0.6" stop-color="#6b4863"/><stop offset="0.8" stop-color="#c46d5c"/>' +
            '<stop offset="0.93" stop-color="#eea062"/><stop offset="1" stop-color="#f8c585"/></linearGradient>' +
            '<linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="650" x2="0" y2="1080">' +
            '<stop offset="0" stop-color="#d88f63"/><stop offset="0.12" stop-color="#9a5b5e"/>' +
            '<stop offset="0.45" stop-color="#3c2a44"/><stop offset="1" stop-color="#120e1b"/></linearGradient>' +
            '<filter id="b70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>' +
            '<filter id="b8" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="8"/></filter>' +
            '<filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>' +
            '<filter id="b1"><feGaussianBlur stdDeviation="1"/></filter>' +
            '<linearGradient id="seaglint" gradientUnits="userSpaceOnUse" x1="0" y1="652" x2="0" y2="1080">' +
            '<stop offset="0" stop-color="#f5b680" stop-opacity="0.8"/><stop offset="1" stop-color="#f5b680" stop-opacity="0.12"/></linearGradient>' +
            '<linearGradient id="sunglint" gradientUnits="userSpaceOnUse" x1="0" y1="652" x2="0" y2="1080">' +
