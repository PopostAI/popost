  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; web font links removed; pictures replaced by slots and drawn stand-ins; scaled into the canvas; the 1080x1920 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
        font-family: "DM Sans", sans-serif;
      }

      [data-composition-id="tiktok-follow"] .lower-third {
        position: absolute;
        bottom: 160px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 30px;
        background: #1a1a1a;
        border-radius: 75px;
        padding: 25px 40px 25px 25px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      }

      [data-composition-id="tiktok-follow"] .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        border: 3px solid #333;
      }

      [data-composition-id="tiktok-follow"] .profile-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-right: 20px;
      }

      [data-composition-id="tiktok-follow"] .display-name {
        font-size: 42px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      [data-composition-id="tiktok-follow"] .handle {
        font-size: 28px;
        font-weight: 400;
        color: #a0a0a0;
        line-height: 1.3;
      }

      [data-composition-id="tiktok-follow"] .follower-count {
        font-size: 25px;
        font-weight: 400;
        color: #737373;
        line-height: 1.3;
      }

      [data-composition-id="tiktok-follow"] .follow-btn {
        position: relative;
        width: 250px;
        height: 80px;
        border-radius: 40px;
        background: #fe2c55;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      [data-composition-id="tiktok-follow"] .btn-text {
        position: absolute;
        font-family: "DM Sans", sans-serif;
        font-size: 30px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      [data-composition-id="tiktok-follow"] .btn-text-follow {
        opacity: 1;
      }

      [data-composition-id="tiktok-follow"] .btn-text-following {
        opacity: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      [data-composition-id="tiktok-follow"] .check-icon {
        display: inline-block;
        width: 22px;
        height: 22px;
      }

      [data-composition-id="tiktok-follow"] .check-icon svg {
        width: 22px;
        height: 22px;
        display: block;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Animated TikTok follow overlay with profile card and follow button",
 "class": "ui",
 "tags": [
  "social",
  "overlay",
  "tiktok"
 ],
 "placeholders": "web fonts are replaced by the fonts of the machine; 1 picture as slots (picture-1 ...) with a drawn stand-in",
 "seconds": 4.05,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1080x1920 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1080, H = 1920, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":3.8,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="tiktok-follow"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="4.5"
    >
      <div
        id="card"
        class="clip lower-third"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      >
        <img class="avatar"  alt="HeyGen" crossorigin="anonymous" / style="background: linear-gradient(135deg, #3d5a80, #98c1d9);" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-slot="picture-1">
        <div class="profile-info">
          <div class="display-name">HeyGen</div>
          <div class="handle">@heygen.com</div>
          <div class="follower-count">1,999 followers</div>
        </div>
        <div id="follow-btn" class="follow-btn">
          <span id="btn-follow" class="btn-text btn-text-follow">Follow</span>
          <span id="btn-following" class="btn-text btn-text-following">
            <span>Following</span>
            <span class="check-icon"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12"></polyline></svg
            ></span>
          </span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("card");
      var btn = document.getElementById("follow-btn");
      var textFollow = document.getElementById("btn-follow");
      var textFollowing = document.getElementById("btn-following");

      // Start off-screen
      gsap.set(card, { y: 300, opacity: 0 });

      // Slide in from bottom
      tl.to(
        card,
        {
          y: 0,
          opacity: 1,
          duration: 0.5,
          ease: "power3.out",
        },
        0.1,
      );

      // Hold, then button press-in
      tl.to(
        btn,
        {
          scale: 0.92,
          duration: 0.15,
          ease: "power2.out",
        },
        1.0,
      );

      // Button release with spring bounce
      tl.to(
        btn,
        {
          scale: 1,
          duration: 0.4,
          ease: "elastic.out(1, 0.4)",
        },
        1.15,
      );

      // Button background: rose-red → dark gray
      tl.to(
        btn,
        {
          backgroundColor: "#2f2f2f",
          duration: 0.12,
          ease: "none",
        },
        1.15,
      );

      // Fade out "Follow", fade in "Following"
      tl.to(
        textFollow,
        {
          opacity: 0,
          duration: 0.08,
          ease: "none",
        },
        1.15,
      );

      tl.to(
        textFollowing,
        {
          opacity: 1,
          duration: 0.08,
          ease: "none",
        },
        1.18,
      );

      // Slide out to bottom
      tl.to(
        card,
        {
          y: 300,
          opacity: 0,
          duration: 0.25,
          ease: "power3.in",
        },
        3.8,
      );

      window.__timelines["tiktok-follow"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
