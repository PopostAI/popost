<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Signup Flow - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #fafafa;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 520px;
        padding: 56px;
        /* ponytail: scale-up wrapper (not a GSAP target); card was ~20% of frame */
        transform: scale(2.2);
      }
      .hf-ui-signup-flow {
        display: grid;
        gap: 14px;
        width: 430px;
        padding: 30px;
        border: 1px solid #e4e4e7;
        border-radius: 28px;
        background: #ffffff;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        box-shadow: 0 28px 84px rgba(0, 0, 0, 0.12);
      }
      .hf-ui-signup-flow h3 {
        margin: 0 0 6px;
        text-align: center;
        font-size: 28px;
      }
      .hf-ui-signup-flow button,
      .hf-ui-signup-field {
        height: 50px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .hf-ui-signup-social,
      .hf-ui-signup-field {
        border: 1px solid #e4e4e7;
        background: #ffffff;
        color: #18181b;
      }
      .hf-ui-signup-field {
        display: flex;
        align-items: center;
        padding: 0 15px;
      }
      .hf-ui-signup-field.muted {
        color: #a1a1aa;
      }
      .hf-ui-signup-divider {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: center;
        color: #a1a1aa;
        font-size: 13px;
        font-weight: 500;
      }
      .hf-ui-signup-divider span {
        height: 1px;
        background: #e4e4e7;
      }
      .hf-ui-signup-submit {
        border: 0;
        background: #18181b;
        color: #ffffff;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A composed signup flow with social action, email field, password field, and submit button",
 "class": "ui",
 "tags": [
  "ui-flow",
  "signup",
  "form"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.25,"cue":"tick","gain":0.3},{"at":0.48,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="signup-flow-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="hf-ui-signup-flow">
          <h3>Create account</h3>
          <button class="hf-ui-signup-social" type="button">Continue with Google</button>
          <div class="hf-ui-signup-divider"><span></span><em>or</em><span></span></div>
          <div class="hf-ui-signup-field">email@company.com</div>
          <div class="hf-ui-signup-field muted">Password</div>
          <button class="hf-ui-signup-submit" type="button">Start building</button>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-ui-signup-flow",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" },
          0.25,
        );
        tl.fromTo(
          ".hf-ui-signup-flow > *",
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.24, stagger: 0.05, ease: "power2.out" },
          0.48,
        );
        tl.to(
          ".hf-ui-signup-submit",
          { scale: 0.97, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" },
          1.2,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["signup-flow-demo"] = tl;
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
