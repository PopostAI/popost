<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Soft Blur In - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        background: #101418;
        font-family: Inter, system-ui, sans-serif;
      }
      #demo {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 25% 20%, #3b5b7a 0, transparent 30%),
          linear-gradient(135deg, #101418, #20282f);
        color: white;
      }
      .wrap {
        position: absolute;
        left: 180px;
        top: 310px;
        width: 1200px;
      }
      .eyebrow {
        color: #80d9ff;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .title {
        margin-top: 28px;
        font-size: 132px;
        line-height: 0.92;
        font-weight: 850;
        letter-spacing: -0.02em;
      }
      .copy {
        margin-top: 42px;
        width: 780px;
        color: #d7e3ea;
        font-size: 42px;
        line-height: 1.18;
      }
      .hf-soft-blur-in {
        opacity: 0;
        transform: translate3d(0, 28px, 0);
        filter: blur(18px);
        will-change: transform, opacity, filter;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A soft opacity, blur, and lift reveal for headlines, captions, and product UI callouts",
 "class": "text",
 "tags": [
  "motion-primitive",
  "text",
  "reveal",
  "blur"
 ],
 "seconds": 1.39,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "distance",
   "type": "choice",
   "default": "standard",
   "options": [
    "close",
    "standard",
    "far"
   ],
   "what": "How far the element is offset before it slides home: 14px, 28px or 52px."
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "up",
   "options": [
    "up",
    "down"
   ],
   "what": "up starts the element below its resting place so it rises in, down starts it above so it drops in."
  },
  {
   "name": "blur",
   "type": "choice",
   "default": "standard",
   "options": [
    "soft",
    "standard",
    "heavy"
   ],
   "what": "Starting blur radius, from a light haze to a full smear."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.35,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="soft-blur-in-demo"
      data-width="1920"
      data-height="1080"
      data-duration="5"
      data-composition-variables='[
    { "id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "How far the element is offset before it slides home: 14px, 28px or 52px.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "up starts the element below its resting place so it rises in, down starts it above so it drops in.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Starting blur radius, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] }
  ]'
    >
      <div class="wrap">
        <div class="eyebrow hf-soft-blur-in">Motion Primitive</div>
        <div class="title hf-soft-blur-in">Soft blur reveals that feel cinematic.</div>
        <div class="copy hf-soft-blur-in">
          Use it for titles, labels, stats, and scene intros without adding a framework.
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var distances = { close: 14, standard: 28, far: 52 };
          var directions = { up: 1, down: -1 };
          var blurs = { soft: 8, standard: 18, heavy: 34 };

          var distance = distances[pick(distances, vars.distance, "standard")];
          var direction = directions[pick(directions, vars.direction, "up")];
          var blur = blurs[pick(blurs, vars.blur, "standard")];

          // Set on the root so every element carrying the class inherits the values,
          // whether it exists yet or not.
          var root = document.documentElement;
          root.style.setProperty("--hf-soft-blur-y", distance * direction + "px");
          root.style.setProperty("--hf-soft-blur-radius", blur + "px");
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to(
          ".hf-soft-blur-in",
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.8,
            ease: "power3.out",
            stagger: 0.12,
          },
          0.35,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["soft-blur-in-demo"] = tl;
      </script>
    </div>
    <style
      data-composition-variables='[
    { "id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "How far the element is offset before it slides home: 14px, 28px or 52px.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "up starts the element below its resting place so it rises in, down starts it above so it drops in.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Starting blur radius, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] }
  ]'
    >
      .hf-soft-blur-in {
        opacity: 0;
        transform: translate3d(0, var(--hf-soft-blur-y, 28px), 0);
        filter: blur(var(--hf-soft-blur-radius, 18px));
        will-change: transform, opacity, filter;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
