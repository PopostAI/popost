-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Logo Outro</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Cinematic logo reveal with piece-by-piece assembly, glow bloom, tagline fade-in, and URL pill",
 "class": "logo",
 "tags": [
  "branding",
  "outro",
  "logo"
 ],
 "placeholders": "web fonts are replaced by the fonts of the machine",
 "seconds": 3.2,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1.23,"cue":"pop","gain":0.65},{"at":2.4,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="logo-outro"
      data-composition-id="logo-outro"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="6"
    >
      <div class="canvas">
        
        <div class="logo-glow"></div>

        
        <div class="logo-container">
          <svg viewBox="0 0 160 240" width="160" height="240" class="logo-svg">
            
            <path
              class="logo-piece logo-tl"
              d="M 0 40 C 0 17.9 17.9 0 40 0 L 80 0 L 80 80 L 40 80 C 17.9 80 0 62.1 0 40 Z"
              fill="#F24E1E"
            />
            <path
              class="logo-piece logo-tr"
              d="M 80 0 L 120 0 C 142.1 0 160 17.9 160 40 C 160 62.1 142.1 80 120 80 L 80 80 L 80 0 Z"
              fill="#A259FF"
            />
            <path
              class="logo-piece logo-ml"
              d="M 0 120 C 0 97.9 17.9 80 40 80 L 80 80 L 80 160 L 40 160 C 17.9 160 0 142.1 0 120 Z"
              fill="#FF7262"
            />
            <circle class="logo-piece logo-mr" cx="120" cy="120" r="40" fill="#1ABCFE" />
            <path
              class="logo-piece logo-bl"
              d="M 0 200 C 0 177.9 17.9 160 40 160 L 80 160 L 80 200 C 80 222.1 62.1 240 40 240 C 17.9 240 0 222.1 0 200 Z"
              fill="#0ACF83"
            />
          </svg>
        </div>

        <div class="text-container">
          <div class="tagline">Nothing great is made alone.</div>
          <div class="url-pill">
            <span class="url-text">figma.com</span>
          </div>
        </div>
      </div>

      <style>
        [data-composition-id="logo-outro"] .canvas {
          width: 1920px;
          height: 1080px;
          background: #0a0a0f;
          position: relative;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        [data-composition-id="logo-outro"] .logo-container {
          position: absolute;
          left: 880px;
          top: 380px;
          width: 160px;
          height: 240px;
          z-index: 2;
        }

        [data-composition-id="logo-outro"] .logo-piece {
          transform-origin: center center;
          opacity: 0;
        }

        [data-composition-id="logo-outro"] .logo-glow {
          position: absolute;
          left: 760px;
          top: 300px;
          width: 400px;
          height: 400px;
          background: radial-gradient(circle, rgba(162, 89, 255, 0.25) 0%, rgba(10, 10, 15, 0) 70%);
          border-radius: 50%;
          opacity: 0;
          pointer-events: none;
          z-index: 1;
        }

        [data-composition-id="logo-outro"] .text-container {
          position: absolute;
          top: 720px;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          z-index: 3;
        }

        [data-composition-id="logo-outro"] .tagline {
          font-size: 44px;
          font-weight: 500;
          color: white;
          opacity: 0;
          margin-bottom: 32px;
          text-align: center;
        }

        [data-composition-id="logo-outro"] .url-pill {
          background: #1a1a1f;
          border: 1px solid #2c2c2c;
          border-radius: 100px;
          padding: 8px 24px;
          opacity: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        [data-composition-id="logo-outro"] .url-text {
          font-size: 18px;
          color: #666;
          letter-spacing: 0.5px;
        }
      </style>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          const pieces = {
            tl: '[data-composition-id="logo-outro"] .logo-tl',
            tr: '[data-composition-id="logo-outro"] .logo-tr',
            ml: '[data-composition-id="logo-outro"] .logo-ml',
            mr: '[data-composition-id="logo-outro"] .logo-mr',
            bl: '[data-composition-id="logo-outro"] .logo-bl',
          };

          const pieceArray = [pieces.tl, pieces.tr, pieces.ml, pieces.mr, pieces.bl];
          const logoGlow = '[data-composition-id="logo-outro"] .logo-glow';
          const tagline = '[data-composition-id="logo-outro"] .tagline';
          const urlPill = '[data-composition-id="logo-outro"] .url-pill';

          // 1. Pieces slide in from the right with ripple stagger
          pieceArray.forEach((piece, i) => {
            tl.fromTo(
              piece,
              { x: 1920, opacity: 0 },
              { x: 0, opacity: 1, duration: 1.2, ease: "power4.out" },
              i * 0.08,
            );
          });

          // 2. Expand and close
          const expandTime = 1.2;

          tl.to(
            pieceArray,
            { scale: 1.15, duration: 0.5, ease: "back.out(1.7)", stagger: 0.02 },
            expandTime,
          );

          tl.to(pieceArray, { scale: 1, duration: 0.4, ease: "power2.inOut" }, expandTime + 0.3);

          // 3. Glow bloom
          tl.fromTo(
            logoGlow,
            { opacity: 0, scale: 0.5 },
            { opacity: 1, scale: 1.2, duration: 0.4, ease: "power2.out" },
            expandTime,
          );
          tl.to(
            logoGlow,
            { opacity: 0, scale: 1.8, duration: 1.2, ease: "power2.out" },
            expandTime + 0.4,
          );

          // 4. Tagline and URL pill fade in
          const textStartTime = expandTime + 0.8;
          tl.fromTo(
            tagline,
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 1, ease: "power3.out" },
            textStartTime,
          );

          tl.fromTo(
            urlPill,
            { opacity: 0, y: 15 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            textStartTime + 0.4,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["logo-outro"] = tl;
        })();
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
