<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Shimmer Sweep — Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Animated light sweep across text or elements using a CSS gradient mask — ideal for AI accents and premium reveals",
 "class": "text",
 "tags": [
  "text",
  "shimmer",
  "highlight",
  "effect"
 ],
 "seconds": 4.7,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.3,"cue":"shimmer","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="shimmer-sweep-demo"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div class="demo-canvas">
        
        <div class="shimmer-sweep-target" style="--shimmer-color: rgba(255, 255, 255, 0.5)">
          <div
            class="demo-heading"
            style="font-size: 120px; font-weight: 800; color: #ffffff; opacity: 0"
          >
            AI-Powered
          </div>
        </div>

        
        <div class="shimmer-sweep-target" style="--shimmer-color: rgba(100, 200, 255, 0.4)">
          <div
            class="demo-subheading"
            style="font-size: 48px; font-weight: 400; color: #888888; opacity: 0"
          >
            Video generation, reimagined
          </div>
        </div>

        
        <div
          class="shimmer-sweep-target"
          style="--shimmer-color: rgba(255, 255, 255, 0.3); --shimmer-width: 30%"
        >
          <div
            class="demo-pill"
            style="
              background: linear-gradient(135deg, #1a1a2e, #2a2a4e);
              border: 1px solid #333;
              border-radius: 100px;
              padding: 16px 40px;
              font-size: 20px;
              color: #aaa;
              opacity: 0;
            "
          >
            Try it free →
          </div>
        </div>
      </div>

      
      <style>
        .demo-canvas {
          width: 1920px;
          height: 1080px;
          background: #0a0a0f;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 60px;
          font-family: "Inter", sans-serif;
        }

        .shimmer-sweep-target {
          position: relative;
          display: inline-block;
        }

        .shimmer-sweep-target .shimmer-mask {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          background: linear-gradient(
            var(--shimmer-angle, 120deg),
            transparent 0%,
            transparent calc(var(--shimmer-pos, -20%) - var(--shimmer-width, 20%) / 2),
            var(--shimmer-color, rgba(255, 255, 255, 0.6)) var(--shimmer-pos, -20%),
            transparent calc(var(--shimmer-pos, -20%) + var(--shimmer-width, 20%) / 2),
            transparent 100%
          );
          mix-blend-mode: overlay;
        }
      </style>

      <script>
        (function () {
          // Inject shimmer masks
          document.querySelectorAll(".shimmer-sweep-target").forEach((el) => {
            if (!el.querySelector(".shimmer-mask")) {
              const mask = document.createElement("div");
              mask.className = "shimmer-mask";
              el.appendChild(mask);
            }
          });

          const tl = gsap.timeline({ paused: true });

          // Fade in elements
          tl.to(".demo-heading", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);
          tl.to(".demo-subheading", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6);
          tl.to(".demo-pill", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.9);

          // First shimmer sweep across all targets
          tl.fromTo(
            ".shimmer-sweep-target",
            { "--shimmer-pos": "-20%" },
            {
              "--shimmer-pos": "120%",
              duration: 1.2,
              ease: "power2.inOut",
              stagger: 0.15,
            },
            1.5,
          );

          // Second sweep
          tl.fromTo(
            ".shimmer-sweep-target",
            { "--shimmer-pos": "-20%" },
            {
              "--shimmer-pos": "120%",
              duration: 1.0,
              ease: "power2.inOut",
              stagger: 0.1,
            },
            3.5,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["shimmer-sweep-demo"] = tl;
        })();
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
