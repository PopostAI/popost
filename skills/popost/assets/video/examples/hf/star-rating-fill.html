<html data-composition-variables='[
    { "id": "rating", "type": "number", "role": "content", "label": "Rating", "description": "Target rating in star units from 0 to 5.", "default": 4.8, "min": 0, "max": 5, "step": 0.1 },
    { "id": "starCount", "type": "number", "role": "layout", "label": "Star count", "description": "Number of stars shown in the row.", "default": 5, "min": 1, "max": 10, "step": 1 },
    { "id": "showValue", "type": "enum", "role": "content", "label": "Show value", "description": "Show or hide the synchronized numeric rating.", "default": "yes", "options": [{ "value": "yes", "label": "Yes" }, { "value": "no", "label": "No" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Star Rating Fill Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #root {
        --bg: #090d16;
        --fg: #f4f7fb;
        --muted: #8491a3;
        --surface: #1a2230;
        --border: rgba(244, 247, 251, 0.14);
        --brand: #ffc83d;
        --accent: #79a8ff;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, monospace;
        --radius: 3cqh;
        --space-1: 1cqh;
        --space-2: 2cqh;
        --space-3: 3cqh;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
      }

      .mount-card {
        width: 58%;
        height: 42%;
        left: 21%;
        top: 29%;
        overflow: hidden;
        border: 0.14cqh solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 4cqh 10cqh color-mix(in srgb, var(--fg) 12%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A token-driven star row whose colored layer sweeps to a rating, preserves the fractional final star, and can count the value in sync.",
 "class": "chart",
 "tags": [
  "data",
  "rating",
  "stars",
  "fractional",
  "fill",
  "prove"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "rating",
   "type": "number",
   "default": 4.8,
   "min": 0,
   "max": 5,
   "what": "Target rating in star units from 0 to 5."
  },
  {
   "name": "starCount",
   "type": "number",
   "default": 5,
   "min": 1,
   "max": 10,
   "what": "Number of stars shown in the row."
  },
  {
   "name": "showValue",
   "type": "choice",
   "default": "yes",
   "options": [
    "yes",
    "no"
   ],
   "what": "Show or hide the synchronized numeric rating."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"rating":4.8,"starCount":5,"showValue":"yes"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.2,"cue":"swish","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="star-rating-fill-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="star-rating-fill-mount"
        class="mount-card clip"
        data-composition-id="star-rating-fill"
       
        data-variable-values='{"rating":4.8,"starCount":5,"showValue":"yes"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1114"
        data-height="454"
      >
      <div
        id="root"
        data-composition-id="star-rating-fill"
        data-start="0"
        data-duration="4"
        data-fps="30"
      >
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* INVARIANT: #root owns only the mount boundary. The host owns the
             box, while all internal geometry stays container-relative. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, CanvasText);
            font-family: var(--font-display, system-ui);
          }

          .srf-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, transparent);
          }

          .srf-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2, 3cqw);
          }

          /* EDIT ZONE: the row owns only its responsive presentation size.
             --srf-count is supplied by the clamped public starCount value. */
          .srf-stars {
            --srf-count: 5;
            position: relative;
            width: min(68cqw, calc(72cqh * var(--srf-count)));
          }

          .srf-layer {
            width: 100%;
            display: flex;
            align-items: center;
          }

          .srf-base {
            color: color-mix(in srgb, var(--muted, currentColor) 68%, var(--surface, transparent));
          }

          .srf-fill {
            position: absolute;
            inset: 0;
            color: var(--brand, currentColor);
            clip-path: inset(0 100% 0 0);
          }

          .srf-star-cell {
            display: block;
            flex: 1 1 0;
            min-width: 0;
            aspect-ratio: 1;
            transform-origin: center;
          }

          .srf-star-cell svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
            fill: currentColor;
          }

          .srf-value {
            min-width: 2.2em;
            color: var(--fg, currentColor);
            font-size: min(9cqw, 16cqh);
            font-weight: 720;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            line-height: 1;
            text-align: right;
          }
        </style>

        <div
          id="star-rating-fill-clip"
          class="srf-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="srf-stage">
            <div class="srf-stars" role="img" aria-label="0 out of 5 stars">
              <div class="srf-layer srf-base" aria-hidden="true"></div>
              <div class="srf-layer srf-fill" aria-hidden="true"></div>
            </div>
            <div class="srf-value" aria-hidden="true">0.0</div>
          </div>
        </div>

        <template id="star-rating-fill-star-template">
          <span class="srf-star-cell">
            <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <path
                d="M50 0 61.8 36.2 100 36.2 69.1 58.6 80.9 95 50 72.4 19.1 95 30.9 58.6 0 36.2 38.2 36.2Z"
              />
            </svg>
          </span>
        </template>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".srf-stage");
            var stars = root.querySelector(".srf-stars");
            var baseLayer = root.querySelector(".srf-base");
            var fillLayer = root.querySelector(".srf-fill");
            var valueElement = root.querySelector(".srf-value");
            var starTemplate = root.querySelector("#star-rating-fill-star-template");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            /* INVARIANT: zero is a valid rating. Missing values and zero are
               handled separately, then every public number is clamped once. */
            var ratingValue = vars.rating == null || vars.rating === "" ? NaN : Number(vars.rating);
            var requestedRating = Number.isFinite(ratingValue)
              ? Math.max(0, Math.min(5, ratingValue))
              : 4.8;
            var starCountValue =
              vars.starCount == null || vars.starCount === "" ? NaN : Number(vars.starCount);
            var starCount = Number.isFinite(starCountValue) ? Math.round(starCountValue) : 5;
            starCount = Math.max(1, Math.min(10, starCount));
            var rating = Math.min(requestedRating, starCount);
            var showValue = vars.showValue === "no" ? "no" : "yes";
            var fillPercent = (rating / starCount) * 100;

            stars.style.setProperty("--srf-count", String(starCount));
            stars.setAttribute("aria-label", rating.toFixed(1) + " out of " + starCount + " stars");
            valueElement.hidden = showValue === "no";

            /* The template is the single owner of star geometry. Both paint
               layers clone it so their silhouettes cannot drift. */
            var baseFragment = document.createDocumentFragment();
            var fillFragment = document.createDocumentFragment();
            for (var index = 0; index < starCount; index += 1) {
              baseFragment.appendChild(starTemplate.content.firstElementChild.cloneNode(true));
              fillFragment.appendChild(starTemplate.content.firstElementChild.cloneNode(true));
            }
            baseLayer.replaceChildren(baseFragment);
            fillLayer.replaceChildren(fillFragment);

            var baseCells = baseLayer.querySelectorAll(".srf-star-cell");
            var fillCells = fillLayer.querySelectorAll(".srf-star-cell");
            var valueState = { current: 0 };

            /* RETIME RANGE: these values own the full lifecycle. The sweep
               uses --ease-standard's GSAP owner, power2.out. */
            var IN_BASE = 1.5;
            var OUT_BASE = 0.4;
            var FILL_START_BASE = 0.2;
            var FILL_DURATION_BASE = 1.1;
            var POP_DURATION_BASE = 0.2;
            var durationValue = Number(root.dataset.duration);
            var duration = Number.isFinite(durationValue) && durationValue > 0 ? durationValue : 4;
            var scale = duration < IN_BASE + OUT_BASE ? duration / (IN_BASE + OUT_BASE) : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;
            var FILL_START = FILL_START_BASE * scale;
            var FILL_DURATION = FILL_DURATION_BASE * scale;
            var POP_DURATION = POP_DURATION_BASE * scale;

            var timeline = gsap.timeline({ paused: true });

            timeline.fromTo(
              fillLayer,
              { clipPath: "inset(0 100% 0 0)" },
              {
                clipPath: "inset(0 " + (100 - fillPercent) + "% 0 0)",
                duration: FILL_DURATION,
                ease: "power2.out",
              },
              FILL_START,
            );

            if (showValue === "yes") {
              timeline.to(
                valueState,
                {
                  current: rating,
                  duration: FILL_DURATION,
                  ease: "power2.out",
                  onUpdate: function () {
                    valueElement.textContent = valueState.current.toFixed(1);
                  },
                },
                FILL_START,
              );
            }

            /* Per-star pops are subordinate to the sweep and occur in the
               same left-to-right order. They never change the fill endpoint. */
            var popCount = Math.ceil(rating);
            for (var popIndex = 0; popIndex < popCount; popIndex += 1) {
              var popAt = FILL_START + FILL_DURATION * (popIndex / Math.max(1, rating)) * 0.82;
              var popTargets = [baseCells[popIndex], fillCells[popIndex]];
              timeline.to(
                popTargets,
                { scale: 1.06, duration: POP_DURATION * 0.45, ease: "power2.out" },
                popAt,
              );
              timeline.to(
                popTargets,
                { scale: 1, duration: POP_DURATION * 0.55, ease: "power2.out" },
                popAt + POP_DURATION * 0.45,
              );
            }

            timeline.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            timeline.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["star-rating-fill"] = timeline;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["star-rating-fill-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
