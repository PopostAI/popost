<html data-composition-variables='[
    { "id": "card_count", "type": "number", "role": "content", "label": "Card count", "description": "Number of cards rendered in the rail.", "default": 4, "min": 3, "max": 5, "step": 1 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Active color used by the focused card and contact circle.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "card_label_prefix", "type": "string", "role": "content", "label": "Card label prefix", "description": "Text placed before each card number.", "default": "Feature" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Swipe Rail Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #20232a 0%, #0b0c0e 72%);
      }

      .mount-card {
        width: 76%;
        height: 64%;
        left: 12%;
        top: 18%;
        container-type: size;
        overflow: hidden;
        border: 2px solid rgba(148, 163, 184, 0.24);
        border-radius: 34px;
        background: #111827;
        box-shadow: 0 44px 110px rgba(0, 0, 0, 0.48);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A contact circle leads a horizontal card rail through a fast drag, momentum carry, and settled snap to the next card.",
 "class": "cursor",
 "tags": [
  "motion-primitive",
  "interaction",
  "gesture",
  "swipe",
  "cards",
  "rail"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "card_count",
   "type": "number",
   "default": 4,
   "min": 3,
   "max": 5,
   "what": "Number of cards rendered in the rail."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Active color used by the focused card and contact circle."
  },
  {
   "name": "card_label_prefix",
   "type": "text",
   "default": "Feature",
   "maxLength": 200,
   "what": "Text placed before each card number."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"card_count":5,"accent":"violet","card_label_prefix":"Chapter"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1.59,"cue":"pop","gain":0.65}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="swipe-rail-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="swipe-rail-mount"
        class="mount-card clip"
        data-composition-id="swipe-rail"
       
        data-variable-values='{"card_count":5,"accent":"violet","card_label_prefix":"Chapter"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1460"
        data-height="691"
      >
      <div id="root" data-composition-id="swipe-rail" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            --sr-card-width: 46;
            --sr-card-gap: 4;
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: #f8fafc;
            font-family: Inter, system-ui, sans-serif;
            pointer-events: none;
          }

          .sr-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #1e293b 0%, #0f172a 72%);
          }

          .sr-stage {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
          }

          .sr-rail {
            position: absolute;
            left: 50%;
            top: 18cqh;
            display: flex;
            gap: calc(var(--sr-card-gap) * 1cqw);
            height: 64cqh;
            will-change: transform;
          }

          .sr-card {
            position: relative;
            flex: 0 0 calc(var(--sr-card-width) * 1cqw);
            height: 60cqh;
            overflow: hidden;
            padding: 6cqh 4cqw;
            border: 0.16cqmin solid rgba(148, 163, 184, 0.36);
            border-radius: 3.2cqmin;
            background: #f8fafc;
            color: #0f172a;
            box-shadow: 0 3cqh 7cqh rgba(2, 6, 23, 0.34);
            transform-origin: 50% 50%;
            will-change: transform, border-color, box-shadow;
          }

          .sr-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 1.2cqh;
            background: var(--sr-accent);
            opacity: 0.38;
          }

          .sr-index {
            display: block;
            margin-bottom: 3.2cqh;
            color: var(--sr-accent);
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 2.2cqw;
            font-weight: 700;
            letter-spacing: 0.12em;
          }

          .sr-label {
            display: block;
            overflow: hidden;
            font-size: 4.2cqw;
            font-weight: 760;
            line-height: 1.05;
            letter-spacing: -0.04em;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .sr-rule {
            display: block;
            width: 72%;
            height: 1.4cqh;
            margin-top: 7cqh;
            border-radius: 1cqh;
            background: #cbd5e1;
            box-shadow:
              0 4cqh 0 #e2e8f0,
              0 8cqh 0 #e2e8f0;
          }

          .sr-contact {
            position: absolute;
            left: 50%;
            top: 57%;
            width: 8cqw;
            aspect-ratio: 1;
            margin: -4cqw 0 0 -4cqw;
            border: 0.32cqmin solid rgba(255, 255, 255, 0.88);
            border-radius: 50%;
            background: color-mix(in srgb, var(--sr-accent) 44%, transparent);
            box-shadow:
              0 0 0 1.2cqmin color-mix(in srgb, var(--sr-accent) 16%, transparent),
              0 1.8cqh 4cqh rgba(2, 6, 23, 0.34);
            opacity: 0;
            will-change: transform, opacity;
          }
        </style>

        <div class="sr-clip clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="sr-stage">
            <div class="sr-rail" role="list" aria-label="Feature cards"></div>
            <div class="sr-contact" aria-hidden="true"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".sr-stage");
            var rail = root.querySelector(".sr-rail");
            var contact = root.querySelector(".sr-contact");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var countValue = Number(vars.card_count);
            var cardCount = Number.isFinite(countValue)
              ? Math.max(3, Math.min(5, Math.round(countValue)))
              : 4;
            var prefix =
              vars.card_label_prefix == null ? "Feature" : String(vars.card_label_prefix);
            var accentName =
              vars.accent === "blue" || vars.accent === "violet" ? vars.accent : "green";
            var accentColors = {
              green: "var(--brand, #22c55e)",
              blue: "var(--accent, #38bdf8)",
              violet: "var(--accent-2, #a78bfa)",
            };
            root.style.setProperty("--sr-accent", accentColors[accentName]);
            // GSAP interpolates colors numerically, so tween values need the
            // substituted color rather than the var() form.
            var accentColor = getComputedStyle(root).getPropertyValue("--sr-accent").trim();

            for (var index = 0; index < cardCount; index += 1) {
              var card = document.createElement("article");
              card.className = "sr-card";
              card.setAttribute("role", "listitem");

              var indexEl = document.createElement("span");
              indexEl.className = "sr-index";
              indexEl.textContent = String(index + 1).padStart(2, "0");

              var label = document.createElement("span");
              label.className = "sr-label";
              label.textContent = prefix + " " + String(index + 1);

              var rule = document.createElement("span");
              rule.className = "sr-rule";
              rule.setAttribute("aria-hidden", "true");

              card.append(indexEl, label, rule);
              rail.appendChild(card);
            }

            var cards = rail.querySelectorAll(".sr-card");
            var centerIndex = Math.floor((cardCount - 1) / 2);
            var targetIndex = centerIndex + 1;
            var currentCard = cards[centerIndex];
            var targetCard = cards[targetIndex];

            var rootStyle = getComputedStyle(root);
            var cardWidth = parseFloat(rootStyle.getPropertyValue("--sr-card-width"));
            var cardGap = parseFloat(rootStyle.getPropertyValue("--sr-card-gap"));
            var cardStep = cardWidth + cardGap;
            var initialX = -(centerIndex * cardStep + cardWidth / 2);
            var targetX = initialX - cardStep;

            // Fixed gesture and exit phases compress together only for short mounts.
            var IN_BASE = 2.2;
            var OUT_BASE = 0.45;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var baseTotal = IN_BASE + OUT_BASE;
            var envelopeScale = duration < baseTotal ? duration / baseTotal : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;
            var gestureScale = IN / IN_BASE;

            gsap.set(stage, { opacity: 0, y: "1.5cqh" });
            gsap.set(rail, { x: initialX + "cqw" });
            gsap.set(cards, { scale: 0.94, opacity: 0.74 });
            gsap.set(currentCard, {
              scale: 1.02,
              opacity: 1,
              borderColor: accentColor,
            });
            gsap.set(contact, { x: "0cqw", y: "0cqh", scale: 0.86, opacity: 0 });

            var tl = gsap.timeline({ paused: true });

            tl.to(
              stage,
              { opacity: 1, y: "0cqh", duration: 0.32 * gestureScale, ease: "power2.out" },
              0,
            );
            tl.to(
              contact,
              { opacity: 1, scale: 1, duration: 0.18 * gestureScale, ease: "power2.out" },
              0.4 * gestureScale,
            );

            // Fast initial drag decays under friction while the contact leads the rail.
            tl.to(
              contact,
              { x: "-28cqw", duration: 0.62 * gestureScale, ease: "power3.out" },
              0.66 * gestureScale,
            );
            tl.to(
              rail,
              { x: initialX - 23 + "cqw", duration: 0.62 * gestureScale, ease: "power3.out" },
              0.66 * gestureScale,
            );

            var releaseAt = 1.28 * gestureScale;
            tl.to(
              contact,
              {
                y: "-5cqh",
                scale: 0.82,
                opacity: 0,
                duration: 0.24 * gestureScale,
                ease: "power2.out",
              },
              releaseAt,
            );
            tl.to(
              rail,
              {
                x: initialX - 38 + "cqw",
                duration: 0.28 * gestureScale,
                ease: "power2.out",
              },
              releaseAt,
            );

            // The momentum handoff resolves into one exact card-width snap.
            tl.to(
              rail,
              { x: targetX + "cqw", duration: 0.64 * gestureScale, ease: "back.out(1.7)" },
              1.56 * gestureScale,
            );
            tl.to(
              currentCard,
              {
                scale: 0.94,
                opacity: 0.74,
                borderColor: "rgba(148, 163, 184, 0.36)",
                duration: 0.48 * gestureScale,
                ease: "power2.out",
              },
              1.5 * gestureScale,
            );
            tl.to(
              targetCard,
              {
                scale: 1.02,
                opacity: 1,
                borderColor: accentColor,
                boxShadow: "0 3cqh 9cqh rgba(2, 6, 23, 0.42)",
                duration: 0.64 * gestureScale,
                ease: "back.out(1.7)",
              },
              1.56 * gestureScale,
            );

            if (HOLD > 0.4) {
              var driftHalf = Math.min(0.55, HOLD / 2);
              var driftRepeat = Math.max(0, Math.floor(HOLD / driftHalf) - 1);
              tl.to(
                targetCard,
                {
                  y: "-0.7cqh",
                  duration: driftHalf,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: driftRepeat,
                },
                IN,
              );
            }

            tl.to(stage, { opacity: 0, y: "-1.5cqh", duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["swipe-rail"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["swipe-rail-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
