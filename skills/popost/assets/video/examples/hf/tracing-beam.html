<html data-composition-variables='[
    { "id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "Three comma-separated labels shown in path order.", "default": "Search,Preview,Export" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Beam and active-element color.", "default": "cyan", "options": [{ "value": "cyan", "label": "Cyan" }, { "value": "violet", "label": "Violet" }, { "value": "amber", "label": "Amber" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tracing Beam Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #0b0c0e);
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --surface: #171923;
        --border: #3d4152;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 2.8cqmin;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 44%,
          var(--bg, #1b1830) 0%,
          var(--bg, #0b0c0e) 70%
        );
      }

      .mount-card {
        width: 76%;
        height: 58%;
        left: 12%;
        top: 21%;
        container-type: size;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border, #a78bfa) 22%, transparent);
        border-radius: 34px;
        background: color-mix(in srgb, var(--surface, #13141d) 88%, transparent);
        box-shadow: 0 44px 110px color-mix(in srgb, var(--bg, #000000) 48%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A glowing dash follows one SVG path through three UI elements, lifting and brightening each element in sequence.",
 "class": "shape",
 "tags": [
  "motion-primitive",
  "product-demo",
  "attention",
  "beam",
  "path",
  "spotlight"
 ],
 "seconds": 4.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "labels",
   "type": "text",
   "default": "Search,Preview,Export",
   "maxLength": 200,
   "what": "Three comma-separated labels shown in path order."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "cyan",
   "options": [
    "cyan",
    "violet",
    "amber"
   ],
   "what": "Beam and active-element color."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"labels":"Capture,Compose,Render","accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.35,"cue":"draw","gain":0.45},{"at":3.95,"cue":"draw","gain":0.45}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="tracing-beam-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4.5"
      data-fps="30"
    >
      <div
        id="tracing-beam-mount"
        class="mount-card clip"
        data-composition-id="tracing-beam"
       
        data-variable-values='{"labels":"Capture,Compose,Render","accent":"violet"}'
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
        data-width="1459"
        data-height="626"
      >
      <div id="root" data-composition-id="tracing-beam" data-duration="4.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .tb-clip,
          .tb-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
          }

          .tb-stage {
            opacity: 0;
          }

          .tb-route {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
          }

          .tb-beam {
            fill: none;
            stroke: var(--tb-accent, #5ee7ff);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: url(#tracing-beam-glow);
            opacity: 0;
            will-change: stroke-dashoffset, opacity;
          }

          .tb-anchor {
            position: absolute;
            width: 22cqw;
            height: 24cqh;
            transform: translate(-50%, -50%);
          }

          .tb-anchor:nth-child(1) {
            left: 15%;
            top: 60%;
          }

          .tb-anchor:nth-child(2) {
            left: 50%;
            top: 35%;
          }

          .tb-anchor:nth-child(3) {
            left: 85%;
            top: 58%;
          }

          .tb-node {
            position: relative;
            width: 100%;
            height: 100%;
            will-change: transform;
          }

          .tb-halo {
            position: absolute;
            inset: -24%;
            border-radius: 50%;
            background: radial-gradient(
              circle,
              color-mix(in srgb, var(--tb-accent, #5ee7ff) 42%, transparent) 0%,
              transparent 70%
            );
            opacity: 0;
            will-change: transform, opacity;
          }

          .tb-card {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 2.2cqw;
            padding: 2.4cqh 2.2cqw;
            overflow: hidden;
            border: 0.16cqmin solid color-mix(in srgb, var(--border, #475569) 78%, transparent);
            border-radius: var(--radius, 2.8cqmin);
            background: color-mix(in srgb, var(--surface, #172033) 92%, transparent);
            box-shadow: 0 2.4cqh 6cqh color-mix(in srgb, var(--bg, #0b0c0e) 56%, transparent);
            opacity: 0.48;
            will-change: opacity;
          }

          .tb-icon {
            flex: 0 0 auto;
            width: 7.5cqmin;
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border: 0.14cqmin solid color-mix(in srgb, var(--tb-accent, #5ee7ff) 52%, transparent);
            border-radius: 2cqmin;
            background: color-mix(in srgb, var(--tb-accent, #5ee7ff) 14%, var(--surface, #172033));
            color: var(--tb-accent, #5ee7ff);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
            font-size: clamp(13px, 3.5cqmin, 28px);
            font-weight: 760;
          }

          .tb-copy {
            min-width: 0;
          }

          .tb-kicker {
            margin-bottom: 0.8cqh;
            color: var(--muted, #94a3b8);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
            font-size: clamp(9px, 1.7cqmin, 16px);
            font-weight: 650;
            letter-spacing: 0.14em;
            text-transform: uppercase;
          }

          .tb-label {
            max-width: 100%;
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: clamp(13px, 4.6cqmin, 38px);
            font-weight: 720;
            line-height: 1.05;
            letter-spacing: -0.025em;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
        </style>

        <div
          id="tracing-beam-clip"
          class="tb-clip clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="0"
        >
          <div class="tb-stage">
            <svg
              class="tb-route"
              viewBox="0 0 1000 520"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <defs>
                <filter id="tracing-beam-glow" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="7" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <path
                class="tb-beam"
                d="M 150 312 C 280 312 335 182 500 182 C 665 182 720 302 850 302"
              />
            </svg>

            <div class="tb-nodes">
              <div class="tb-anchor">
                <div class="tb-node">
                  <div class="tb-halo"></div>
                  <div class="tb-card">
                    <div class="tb-icon">01</div>
                    <div class="tb-copy">
                      <div class="tb-kicker">Step one</div>
                      <div class="tb-label"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="tb-anchor">
                <div class="tb-node">
                  <div class="tb-halo"></div>
                  <div class="tb-card">
                    <div class="tb-icon">02</div>
                    <div class="tb-copy">
                      <div class="tb-kicker">Step two</div>
                      <div class="tb-label"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="tb-anchor">
                <div class="tb-node">
                  <div class="tb-halo"></div>
                  <div class="tb-card">
                    <div class="tb-icon">03</div>
                    <div class="tb-copy">
                      <div class="tb-kicker">Step three</div>
                      <div class="tb-label"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".tb-stage");
            var beam = root.querySelector(".tb-beam");
            var nodes = root.querySelectorAll(".tb-node");
            var labels = root.querySelectorAll(".tb-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var defaultLabels = ["Search", "Preview", "Export"];
            var labelValue = vars.labels == null ? defaultLabels.join(",") : String(vars.labels);
            var labelParts = labelValue.split(",");
            for (var i = 0; i < labels.length; i += 1) {
              var part = labelParts[i] == null ? "" : labelParts[i].trim();
              labels[i].textContent = part === "" ? defaultLabels[i] : part;
            }

            var accentName =
              vars.accent === "violet" || vars.accent === "amber" ? vars.accent : "cyan";
            var accentColors = {
              cyan: "var(--accent, #5ee7ff)",
              violet: "var(--accent-2, #a78bfa)",
              amber: "var(--brand, #fbbf24)",
            };
            root.style.setProperty("--tb-accent", accentColors[accentName]);

            var routeLength = beam.getTotalLength();
            var dashLength = routeLength * 0.24;
            beam.style.strokeDasharray = dashLength + " " + routeLength;
            beam.style.strokeDashoffset = String(dashLength);

            var IN_BASE = 3;
            var OUT_BASE = 0.55;
            var BEAM_START_BASE = 0.35;
            var BEAM_TRAVEL_BASE = 2.35;
            var NODE_MOVE_BASE = 0.28;
            var NODE_DIM_DELAY_BASE = 0.65;
            var BEAM_EXIT_BASE = 0.28;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4.5"));
            var fixedDuration = IN_BASE + OUT_BASE;
            var scale = duration < fixedDuration ? duration / fixedDuration : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var BEAM_START = BEAM_START_BASE * scale;
            var BEAM_TRAVEL = BEAM_TRAVEL_BASE * scale;
            var NODE_MOVE = NODE_MOVE_BASE * scale;
            var NODE_DIM_DELAY = NODE_DIM_DELAY_BASE * scale;
            var BEAM_EXIT = BEAM_EXIT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;
            var arrivals = [BEAM_START, BEAM_START + BEAM_TRAVEL * 0.5, BEAM_START + BEAM_TRAVEL];

            gsap.set(stage, { opacity: 0 });
            gsap.set(beam, { opacity: 0 });
            gsap.set(nodes, { y: 0 });
            gsap.set(root.querySelectorAll(".tb-halo"), { scale: 0.82 });

            var tl = gsap.timeline({ paused: true });

            function brighten(node, at) {
              var card = node.querySelector(".tb-card");
              var halo = node.querySelector(".tb-halo");
              tl.to(node, { y: "-2.2cqh", duration: NODE_MOVE, ease: "power3.out" }, at);
              tl.to(card, { opacity: 1, duration: NODE_MOVE, ease: "power2.out" }, at);
              tl.to(halo, { opacity: 0.86, scale: 1, duration: NODE_MOVE, ease: "power3.out" }, at);
            }

            function dim(node, at) {
              var card = node.querySelector(".tb-card");
              var halo = node.querySelector(".tb-halo");
              tl.to(node, { y: 0, duration: NODE_MOVE, ease: "power2.out" }, at);
              tl.to(card, { opacity: 0.48, duration: NODE_MOVE, ease: "power2.out" }, at);
              tl.to(halo, { opacity: 0, scale: 0.82, duration: NODE_MOVE, ease: "power2.out" }, at);
            }

            tl.to(stage, { opacity: 1, duration: Math.min(0.35, IN), ease: "power2.out" }, 0);
            tl.to(beam, { opacity: 1, duration: NODE_MOVE, ease: "power2.out" }, BEAM_START);
            tl.to(
              beam,
              {
                strokeDashoffset: -(routeLength - dashLength),
                duration: BEAM_TRAVEL,
                ease: "sine.inOut",
              },
              BEAM_START,
            );

            brighten(nodes[0], arrivals[0]);
            brighten(nodes[1], arrivals[1]);
            brighten(nodes[2], arrivals[2]);
            dim(nodes[0], arrivals[0] + NODE_DIM_DELAY);
            dim(nodes[1], arrivals[1] + NODE_DIM_DELAY);

            if (HOLD > 0.2) {
              tl.to(
                nodes[2],
                { y: "-2.7cqh", duration: HOLD * 0.5, ease: "sine.inOut" },
                HOLD_START,
              );
              tl.to(
                nodes[2],
                { y: "-2.2cqh", duration: HOLD * 0.5, ease: "sine.inOut" },
                HOLD_START + HOLD * 0.5,
              );
            }

            tl.to(
              beam,
              {
                strokeDashoffset: -routeLength,
                opacity: 0,
                duration: BEAM_EXIT,
                ease: "power2.in",
              },
              OUT_START,
            );
            dim(nodes[2], OUT_START);
            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["tracing-beam"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["tracing-beam-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
