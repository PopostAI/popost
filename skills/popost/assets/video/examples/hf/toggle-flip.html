<html data-composition-variables='[
    { "id": "direction", "type": "enum", "role": "content", "label": "Flip direction", "description": "Target end state the flip lands on.", "default": "on", "options": [{ "value": "on", "label": "Off → On" }, { "value": "off", "label": "On → Off" }] },
    { "id": "label", "type": "string", "role": "content", "label": "Caption", "description": "Optional caption under the toggle. Blank hides the line.", "default": "Auto-save" },
    { "id": "size", "type": "number", "role": "layout", "label": "Size", "description": "Toggle width as a percent of the host box width.", "default": 40, "min": 20, "max": 70, "step": 1, "unit": "%" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Toggle Flip - Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #0d1526 0%, #05070d 70%);
      }

      /* The ~40%-of-frame card the primitive mounts into. A visibly distinct
         panel (rounded, bordered, its own --bg tone) so the mount box reads
         clearly against the page backdrop in a snapshot -- proof the toggle
         stays inside it instead of bleeding past its edges.

         Sized and centered with real percentages against #root's definite
         1920x1080 box, not left to resolve from data-width/data-height
         alone: the mounted primitive sizes its own internals off cqw
         (container query units), and a host box with no definite CSS
         width of its own forces the browser into shrink-to-fit sizing --
         which, feeding back through a size-contained container, collapses
         to the mounted content's tiny intrinsic size instead of the
         intended box. An explicit width/height here sidesteps that
         entirely. data-width/data-height stay in sync below for tooling
         that reads them (lint, per-instance sizing metadata). */
      .mount-card {
        --bg: #131b2e;
        width: 40%;
        height: 40%;
        left: 30%;
        top: 30%;
        border-radius: 28px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "An oversized UI toggle switch that flips with real physicality: thumb overshoot, track color crossfade, and a soft press-compress before release. The reference prop of the ui-props family.",
 "class": "ui",
 "tags": [
  "prop",
  "ui-props",
  "toggle",
  "interaction",
  "reference-prop",
  "demonstrate"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "on",
   "options": [
    "on",
    "off"
   ],
   "what": "Target end state the flip lands on."
  },
  {
   "name": "label",
   "type": "text",
   "default": "Auto-save",
   "maxLength": 200,
   "what": "Optional caption under the toggle. Blank hides the line."
  },
  {
   "name": "size",
   "type": "number",
   "default": 40,
   "min": 20,
   "max": 70,
   "unit": "%",
   "what": "Toggle width as a percent of the host box width."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"direction":"on","label":"Dark mode","size":55};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"click","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="toggle-flip-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="toggle-flip-mount"
        class="mount-card clip"
        data-composition-id="toggle-flip"
       
        data-variable-values='{"direction":"on","label":"Dark mode","size":55}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="768"
        data-height="432"
      >
      <div id="root" data-composition-id="toggle-flip" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root: sized off the HOST box, never a fixed stage. inset:0 fills
             whatever box the host clip gives it -- a 960x540 mounted slot,
             a full 1920x1080 frame, anything in between. container-type
             establishes the cqw/cqh basis every internal measurement below
             is expressed in. Styled by #root, never a class -- see the
             mount-contract note in the header comment. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #0b1120);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
          }

          .tf-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
          }

          .tf-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-3, 3cqh);
            opacity: 0;
          }

          .tf-label {
            color: var(--muted, #94a3b8);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-weight: 650;
            font-size: clamp(12px, 2.4cqw, 28px);
            letter-spacing: 0.01em;
            text-align: center;
          }

          .tf-label:empty {
            display: none;
          }

          /* EDIT ZONE: geometry ratios. Track is a fixed 2.2:1 pill; the knob is
             80% of the track's own height, inset 10% top/bottom. All of it is
             expressed in cqw off --tf-size so it holds proportion at any size. */
          .tf-toggle {
            --tf-track-w: calc(var(--tf-size, 40) * 1cqw);
            width: var(--tf-track-w);
            aspect-ratio: 2.2 / 1;
            position: relative;
            display: block;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: default;
            /* transform is GSAP-owned below (press squeeze); no CSS transform here */
          }

          .tf-track {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            --tf-mix: 0; /* 0..100, GSAP-tweened: 0 = surface/off, 100 = brand/on */
            border: 0.15cqw solid
              color-mix(
                in srgb,
                var(--border, #334155) calc(100% - var(--tf-mix, 0) * 0.4%),
                var(--brand, #22c55e) calc(var(--tf-mix, 0) * 0.4%)
              );
            background: color-mix(
              in srgb,
              var(--surface, #1e293b) calc((100 - var(--tf-mix, 0)) * 1%),
              var(--brand, #22c55e) calc(var(--tf-mix, 0) * 1%)
            );
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--border, #334155) 45%, transparent);
          }

          .tf-glow {
            position: absolute;
            inset: -14%;
            border-radius: 999px;
            background: radial-gradient(
              closest-side,
              color-mix(in srgb, var(--accent, #38bdf8) 55%, transparent),
              transparent 72%
            );
            opacity: 0;
            pointer-events: none;
          }

          .tf-knob {
            position: absolute;
            top: calc(var(--tf-size, 40) * 0.0455cqw);
            left: calc(var(--tf-size, 40) * 0.0455cqw);
            width: calc(var(--tf-size, 40) * 0.3636cqw);
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--surface, #f8fafc);
            box-shadow: 0 0.35cqw 0.7cqw rgba(2, 6, 23, 0.4);
            /* RETIME RANGE ends here for geometry; 150% is the exact travel a
               2.2:1 track / 80%-of-height knob pair produces -- see header. GSAP
               tweens x/scale directly below; no CSS transform authored here. */
          }
        </style>

        <div
          id="toggle-flip-clip"
          class="tf-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="tf-stage">
            <div class="tf-label"></div>
            <button
              class="tf-toggle"
              type="button"
              data-anchor="toggle-flip"
              aria-pressed="false"
              tabindex="-1"
            >
              <span class="tf-glow"></span>
              <span class="tf-track"></span>
              <span class="tf-knob"></span>
            </button>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            // Literal, not read off the DOM: once mounted, the framework's
            // flattening step strips data-composition-id from the mounted
            // root (see FLATTENED_INNER_ROOT_STRIP_ATTRS in
            // packages/core/src/runtime/flattenedRoot.ts), so
            // root.getAttribute("data-composition-id") would read null post-
            // mount and silently register the timeline under the key
            // "null" instead of "toggle-flip" -- the render then waits the
            // full 45s sub-composition poll and gives up. Matches the
            // convention in sub-compositions.md's own example and
            // empty.html: hardcode the id this file is always mounted
            // under.
            var compositionId = "toggle-flip";
            var stage = root.querySelector(".tf-stage");
            var labelEl = root.querySelector(".tf-label");
            var toggleEl = root.querySelector(".tf-toggle");
            var trackEl = root.querySelector(".tf-track");
            var knobEl = root.querySelector(".tf-knob");
            var glowEl = root.querySelector(".tf-glow");

            // EDIT ZONE: variable defaults come from data-composition-variables
            // above (declared on <html>). window.__hyperframes.getVariables()
            // returns those defaults already merged with any per-instance
            // data-variable-values a host sets on the mounting clip -- see
            // sub-compositions.md's "Per-Instance Variables" section. Add a
            // variable in both places together (declaration above + fallback
            // below).
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // INVARIANT: only "on" | "off" ever reaches the renderer, whatever a
            // bad override sends.
            var direction = vars.direction === "off" ? "off" : "on";
            var toOn = direction === "on";
            var labelText = vars.label == null ? "" : String(vars.label);
            // INVARIANT: size always clamps into the declared 20-70% range so an
            // out-of-range override can't blow the toggle past its container.
            var sizePct = Math.max(20, Math.min(70, Number(vars.size) || 40));

            labelEl.textContent = labelText;
            toggleEl.style.setProperty("--tf-size", String(sizePct));

            // A project's own --dur-beat sets this primitive's ambient pace, so
            // the HOLD breathing feels native to whatever theme is compiled in.
            var beat = parseFloat(getComputedStyle(root).getPropertyValue("--dur-beat")) || 0.5;
            var SHEEN_HALF = beat * 1.5;

            // RETIME RANGE: these are the only numbers to touch for a global
            // pacing retune. Do not reach for gsap.timeScale() -- HOLD below is
            // the only elastic phase; IN and OUT are always this long (scaled
            // down together only when D itself is shorter than IN_BASE+OUT_BASE).
            var IN_BASE = 0.9;
            var OUT_BASE = 0.5;
            var STAGE_IN_BASE = 0.4;
            var PRESS_LEAD_BASE = 0.2;
            var FLIP_AT_BASE = 0.5; // sync point: fixed offset into IN, never into HOLD
            var FLIP_DURATION_BASE = 0.25;
            var GLOW_DURATION_BASE = 0.15;

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var STAGE_IN = STAGE_IN_BASE * scale;
            var PRESS_LEAD = PRESS_LEAD_BASE * scale;
            var FLIP_AT = FLIP_AT_BASE * scale;
            var FLIP_DURATION = FLIP_DURATION_BASE * scale;
            var GLOW_DURATION = GLOW_DURATION_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            function fireSfx(id, t) {
              root.dispatchEvent(
                new CustomEvent("hf:sfx", { detail: { id: id, t: t }, bubbles: true }),
              );
            }

            // Explicit both-endpoints state (gsap.set, never gsap.from()) so a
            // seek to t=0 is always correct without playing the timeline.
            var mixFrom = toOn ? 0 : 100;
            var mixTo = toOn ? 100 : 0;
            var xFrom = toOn ? "0%" : "150%";
            var xTo = toOn ? "150%" : "0%";
            gsap.set(stage, { opacity: 0 });
            gsap.set(toggleEl, { scaleX: 1, scaleY: 1 });
            gsap.set(knobEl, { x: xFrom, scale: 1 });
            gsap.set(trackEl, { "--tf-mix": mixFrom });
            gsap.set(glowEl, { opacity: 0 });
            toggleEl.setAttribute("aria-pressed", toOn ? "false" : "true");

            var tl = gsap.timeline({ paused: true });

            // IN: stage settle
            tl.to(stage, { opacity: 1, duration: STAGE_IN, ease: "power2.out" }, 0);

            // anticipation press, resolves exactly as the flip begins
            if (PRESS_LEAD > 0) {
              var pressStart = Math.max(0, FLIP_AT - PRESS_LEAD);
              var pressHalf = PRESS_LEAD / 2;
              tl.to(
                toggleEl,
                { scaleX: 0.94, scaleY: 1.06, duration: pressHalf, ease: "power1.inOut" },
                pressStart,
              );
              tl.to(
                toggleEl,
                { scaleX: 1, scaleY: 1, duration: pressHalf, ease: "power1.inOut" },
                pressStart + pressHalf,
              );
            }

            // the flip: knob travel with overshoot + track color crossfade, one
            // shared sync point (FLIP_AT) so they always land together
            tl.to(knobEl, { x: xTo, duration: FLIP_DURATION, ease: "back.out(1.9)" }, FLIP_AT);
            tl.to(
              trackEl,
              { "--tf-mix": mixTo, duration: FLIP_DURATION, ease: "back.out(1.9)" },
              FLIP_AT,
            );
            tl.fromTo(
              knobEl,
              { scale: 1 },
              {
                scale: 1.08,
                duration: FLIP_DURATION * 0.45,
                ease: "power1.out",
                yoyo: true,
                repeat: 1,
              },
              FLIP_AT,
            );
            tl.set(
              toggleEl,
              { attr: { "aria-pressed": toOn ? "true" : "false" } },
              FLIP_AT + FLIP_DURATION,
            );
            tl.call(
              function () {
                fireSfx("click-soft", FLIP_AT);
              },
              [],
              FLIP_AT,
            );

            // soft glow pulse right as the flip settles
            tl.fromTo(
              glowEl,
              { opacity: 0 },
              {
                opacity: 1,
                duration: GLOW_DURATION * 0.5,
                ease: "power1.out",
                yoyo: true,
                repeat: 1,
              },
              FLIP_AT + FLIP_DURATION,
            );

            // HOLD: gentle ambient breathing so an elastic frame still reads
            // alive; naturally absent when HOLD == 0. Finite repeat count per
            // the determinism rule -- floor, never ceil, so it can't overshoot D.
            if (HOLD > SHEEN_HALF) {
              var breathRepeat = Math.max(0, Math.floor(HOLD / SHEEN_HALF) - 1);
              tl.fromTo(
                glowEl,
                { opacity: 0 },
                {
                  opacity: 0.32,
                  duration: SHEEN_HALF,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: breathRepeat,
                },
                HOLD_START + GLOW_DURATION,
              );
            }

            // OUT: release fade
            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.out" }, OUT_START);

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      // No motion of its own: this demo is a static host for the mounted
      // primitive below, which owns and registers its own timeline. Register
      // an empty paused timeline under this file's own composition id so the
      // runtime's timeline-registry check is satisfied without inventing
      // motion the demo doesn't need.
      window.__timelines = window.__timelines || {};
      window.__timelines["toggle-flip-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
