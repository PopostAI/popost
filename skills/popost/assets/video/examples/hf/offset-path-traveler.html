<html data-composition-variables='[
    { "id": "path", "type": "string", "role": "content", "label": "Path", "description": "SVG path data authored in a 1000 by 500 route viewBox.", "default": "M -90 390 C 150 490 190 70 430 185 C 650 300 720 105 850 145 C 970 180 1030 85 1090 35" },
    { "id": "traveler_label", "type": "string", "role": "content", "label": "Traveler label", "description": "Text displayed inside the default traveler chip.", "default": "Live preview" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Color used by the traveler and route.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Offset Path Traveler Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #0b0c0e);
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --muted: #9aa4b2;
        --surface: #171a20;
        --border: #3c4350;
        --brand: #71f5a7;
        --accent: #61a8ff;
        --accent-2: #c5a3ff;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 3cqmin;
        --space-1: 1.4cqmin;
        --space-2: 2.8cqmin;
        --space-3: 4.2cqmin;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 44%,
          color-mix(in srgb, var(--surface) 72%, var(--accent-2)) 0%,
          var(--bg) 68%
        );
      }

      .mount-card {
        width: 78%;
        height: 54%;
        left: 11%;
        top: 23%;
        container-type: size;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--border) 76%, transparent);
        border-radius: calc(var(--radius) * 1.25);
        background: color-mix(in srgb, var(--surface) 84%, transparent);
        box-shadow: 0 4cqh 12cqh color-mix(in srgb, var(--bg) 58%, transparent);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A slotted traveler follows an authored path with tangent rotation, curved entry, and curved exit.",
 "class": "shape",
 "tags": [
  "motion-primitive",
  "product-demo",
  "path",
  "traveler",
  "auto-rotate"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "path",
   "type": "text",
   "default": "M -90 390 C 150 490 190 70 430 185 C 650 300 720 105 850 145 C 970 180 1030 85 1090 35",
   "maxLength": 200,
   "what": "SVG path data authored in a 1000 by 500 route viewBox."
  },
  {
   "name": "traveler_label",
   "type": "text",
   "default": "Live preview",
   "maxLength": 200,
   "what": "Text displayed inside the default traveler chip."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Color used by the traveler and route."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"path":"M -100 410 C 110 475 190 80 410 145 C 610 205 690 395 820 245 C 940 110 1025 170 1100 55","traveler_label":"Deploying","accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="offset-path-traveler-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="offset-path-traveler-mount"
        class="mount-card clip"
        data-composition-id="offset-path-traveler"
       
        data-variable-values='{"path":"M -100 410 C 110 475 190 80 410 145 C 610 205 690 395 820 245 C 940 110 1025 170 1100 55","traveler_label":"Deploying","accent":"violet"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1498"
        data-height="583"
      >
      <div id="root" data-composition-id="offset-path-traveler" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .opt-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: var(--bg, transparent);
          }

          .opt-route {
            position: absolute;
            inset: 8cqh 4cqw;
          }

          .opt-route svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
          }

          .opt-guide {
            fill: none;
            stroke: color-mix(in srgb, var(--opt-accent) 34%, var(--border, #475569));
            stroke-width: 0.42cqmin;
            stroke-linecap: round;
            stroke-dasharray: 1.1cqmin 1.5cqmin;
            opacity: 0.62;
            vector-effect: non-scaling-stroke;
          }

          .opt-traveler-slot {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          .opt-chip {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1, 1.4cqmin);
            max-width: 34cqw;
            min-height: 8cqh;
            padding: var(--space-1, 1.6cqh) var(--space-2, 2.6cqw);
            overflow: hidden;
            border: 0.18cqmin solid
              color-mix(in srgb, var(--opt-accent) 68%, var(--border, #475569));
            border-radius: var(--radius, 999px);
            background: color-mix(in srgb, var(--surface, #18212f) 88%, var(--opt-accent));
            box-shadow:
              0 2.2cqh 5cqh color-mix(in srgb, var(--bg, #020617) 48%, transparent),
              0 0 3.5cqh color-mix(in srgb, var(--opt-accent) 24%, transparent);
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: clamp(12px, 3.5cqmin, 30px);
            font-weight: 760;
            line-height: 1;
            letter-spacing: -0.01em;
            white-space: nowrap;
          }

          .opt-dot {
            flex: 0 0 auto;
            width: 2.4cqmin;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--opt-accent);
            box-shadow: 0 0 2cqmin color-mix(in srgb, var(--opt-accent) 58%, transparent);
          }

          .opt-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
          }
        </style>

        <div
          id="offset-path-traveler-clip"
          class="opt-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="opt-route">
            <svg viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
              <path class="opt-guide"></path>
            </svg>
            <div class="opt-traveler-slot" data-slot="traveler">
              <div class="opt-chip">
                <span class="opt-dot" aria-hidden="true"></span>
                <span class="opt-label"></span>
              </div>
            </div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var route = root.querySelector(".opt-route");
            var guide = root.querySelector(".opt-guide");
            var traveler = root.querySelector(".opt-traveler-slot");
            var label = root.querySelector(".opt-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var DEFAULT_PATH =
              "M -90 390 C 150 490 190 70 430 185 C 650 300 720 105 850 145 C 970 180 1030 85 1090 35";
            var requestedPath = vars.path == null ? "" : String(vars.path).trim();
            var pathData = requestedPath === "" ? DEFAULT_PATH : requestedPath;
            var travelerLabel =
              vars.traveler_label == null ? "Live preview" : String(vars.traveler_label);
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";

            guide.setAttribute("d", pathData);
            label.textContent = travelerLabel;
            root.style.setProperty("--opt-accent", accentColors[accent]);

            var totalLength;
            try {
              totalLength = guide.getTotalLength();
            } catch (_error) {
              totalLength = 0;
            }
            if (!Number.isFinite(totalLength) || totalLength <= 0) {
              guide.setAttribute("d", DEFAULT_PATH);
              totalLength = guide.getTotalLength();
            }

            var VIEWBOX_WIDTH = 1000;
            var VIEWBOX_HEIGHT = 500;
            var travel = { progress: 0 };

            function renderTraveler() {
              var distance = Math.max(0, Math.min(1, travel.progress)) * totalLength;
              var tangentStep = Math.max(0.5, totalLength * 0.002);
              var before = guide.getPointAtLength(Math.max(0, distance - tangentStep));
              var after = guide.getPointAtLength(Math.min(totalLength, distance + tangentStep));
              var scaleX = route.clientWidth / VIEWBOX_WIDTH;
              var scaleY = route.clientHeight / VIEWBOX_HEIGHT;
              var point = guide.getPointAtLength(distance);
              var rotation =
                (Math.atan2((after.y - before.y) * scaleY, (after.x - before.x) * scaleX) * 180) /
                Math.PI;

              gsap.set(traveler, {
                x: point.x * scaleX,
                y: point.y * scaleY,
                xPercent: -50,
                yPercent: -50,
                rotation: rotation,
              });
            }

            var IN_BASE = 1.2;
            var OUT_BASE = 0.65;
            var STILLNESS = 0.3;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;
            var driftHalf = Math.max(0, HOLD - STILLNESS) / 2;

            gsap.set(traveler, { opacity: 0, scale: 0.9 });
            renderTraveler();

            var tl = gsap.timeline({ paused: true });

            tl.to(
              travel,
              { progress: 0.72, duration: IN, ease: "power3.out", onUpdate: renderTraveler },
              0,
            );
            tl.to(traveler, { opacity: 1, duration: Math.min(0.28, IN), ease: "power2.out" }, 0);
            tl.to(traveler, { scale: 1, duration: Math.min(0.5, IN), ease: "back.out(1.7)" }, 0);

            if (driftHalf > 0) {
              tl.to(
                travel,
                {
                  progress: 0.78,
                  duration: driftHalf,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                  onUpdate: renderTraveler,
                },
                IN,
              );
            }

            tl.to(
              travel,
              { progress: 1, duration: OUT, ease: "power2.in", onUpdate: renderTraveler },
              OUT_START,
            );
            tl.to(traveler, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["offset-path-traveler"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["offset-path-traveler-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
