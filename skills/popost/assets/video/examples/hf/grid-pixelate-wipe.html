<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Grid Pixelate Wipe — Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Transition effect where the screen dissolves into a grid of squares that fade out with staggered timing — use between scenes",
 "class": "transition",
 "tags": [
  "transition",
  "wipe",
  "grid",
  "pixelate"
 ],
 "seconds": 7.3,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":2.133,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="grid-pixelate-wipe-demo"
      data-width="1920"
      data-height="1080"
      data-duration="8"
    >
      
      <div id="scene-a" class="demo-scene scene-a">
        <div style="text-align: center; color: white">
          <div style="font-size: 80px; font-weight: 800">Scene A</div>
          <div style="font-size: 32px; margin-top: 20px; opacity: 0.7">
            The grid wipe dissolves this away
          </div>
        </div>
      </div>

      
      <div id="scene-b" class="demo-scene scene-b">
        <div style="text-align: center; color: white">
          <div style="font-size: 80px; font-weight: 800">Scene B</div>
          <div style="font-size: 32px; margin-top: 20px; opacity: 0.7">Revealed from the grid</div>
        </div>
      </div>

      
      <div
        id="grid-pixelate-overlay"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 999;
          display: grid;
        "
      ></div>

      <style>
        #grid-pixelate-overlay {
          --grid-color: black;
        }

        #grid-pixelate-overlay .grid-cell {
          background: var(--grid-color);
          transform: scale(0);
          transform-origin: center center;
        }
      </style>

      <style>
        .demo-scene {
          position: absolute;
          width: 1920px;
          height: 1080px;
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: "Inter", sans-serif;
        }

        .scene-a {
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .scene-b {
          background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const COLS = 16;
          const ROWS = 9;
          const overlay = document.getElementById("grid-pixelate-overlay");

          overlay.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
          overlay.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

          for (let i = 0; i < COLS * ROWS; i++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            overlay.appendChild(cell);
          }

          const tl = gsap.timeline({ paused: true });

          // Scene A visible for 2 seconds
          // Grid covers screen (transition out of A)
          tl.to(
            ".grid-cell",
            {
              scale: 1,
              duration: 0.6,
              stagger: { amount: 0.6, from: "center" },
              ease: "power2.inOut",
            },
            2.0,
          );

          // Swap scenes at midpoint
          tl.set("#scene-a", { opacity: 0 }, 3.0);
          tl.set("#scene-b", { opacity: 1 }, 3.0);

          // Grid reveals scene B
          tl.to(
            ".grid-cell",
            {
              scale: 0,
              duration: 0.6,
              stagger: { amount: 0.6, from: "edges" },
              ease: "power2.inOut",
            },
            3.0,
          );

          tl.to(
            ".grid-cell",
            {
              scale: 1,
              duration: 0.5,
              stagger: { amount: 0.5, from: "random" },
              ease: "power2.inOut",
            },
            5.5,
          );

          tl.set("#scene-b", { opacity: 0 }, 6.3);
          tl.set("#scene-a", { opacity: 1 }, 6.3);

          tl.to(
            ".grid-cell",
            {
              scale: 0,
              duration: 0.5,
              stagger: { amount: 0.5, from: "random" },
              ease: "power2.inOut",
            },
            6.3,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["grid-pixelate-wipe-demo"] = tl;
        })();
      </script>
    </div>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
