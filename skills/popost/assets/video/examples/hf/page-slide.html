<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Page Slide - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f5f5f4;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale wrapper (not the GSAP target) to fill ~63% of frame */
        transform: scale(2.2);
        transform-origin: center center;
      }
      .hf-transition-page-slide {
        position: relative;
        width: 560px;
        height: 320px;
        overflow: hidden;
        border-radius: 30px;
        background: #111827;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.22);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-page {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .hf-transition-page span {
        padding: 14px 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: 28px;
        font-weight: 900;
      }
      .hf-transition-page.old {
        background: linear-gradient(135deg, #0f172a, #334155);
      }
      .hf-transition-page.new {
        background: linear-gradient(135deg, #155e75, #10b981);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A transitions.dev-inspired page slide primitive with outgoing and incoming panels",
 "class": "transition",
 "tags": [
  "video-primitive",
  "transition-primitive",
  "transitions-dev-port",
  "page",
  "slide"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "label_a",
   "type": "text",
   "default": "Dashboard",
   "maxLength": 200,
   "what": "Label printed on the page that slides out."
  },
  {
   "name": "label_b",
   "type": "text",
   "default": "Analytics",
   "maxLength": 200,
   "what": "Label printed on the page that slides in."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Gradient family painted on the incoming page. The outgoing page stays slate."
  },
  {
   "name": "corner",
   "type": "choice",
   "default": "round",
   "options": [
    "square",
    "soft",
    "round"
   ],
   "what": "Corner radius of the frame the pages slide inside."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.25,"cue":"tick","gain":0.3},{"at":0.78,"cue":"whoosh","gain":0.5},{"at":1.24,"cue":"tick","gain":0.3}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="page-slide-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-transition-page-slide"
          data-composition-variables='[
    { "id": "label_a", "type": "string", "role": "content", "label": "Outgoing label", "description": "Label printed on the page that slides out.", "default": "Dashboard" },
    { "id": "label_b", "type": "string", "role": "content", "label": "Incoming label", "description": "Label printed on the page that slides in.", "default": "Analytics" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Gradient family painted on the incoming page. The outgoing page stays slate.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "corner", "type": "enum", "role": "style", "label": "Corner", "description": "Corner radius of the frame the pages slide inside.", "default": "round", "options": [{ "value": "square", "label": "Square" }, { "value": "soft", "label": "Soft" }, { "value": "round", "label": "Round" }] }
  ]'
        >
          <section class="hf-transition-page old"><span>Dashboard</span></section>
          <section class="hf-transition-page new"><span>Analytics</span></section>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var accents = {
            green: { from: "#155e75", to: "#10b981" },
            blue: { from: "#1e3a8a", to: "#38bdf8" },
            violet: { from: "#4c1d95", to: "#a78bfa" },
          };
          var corners = { square: "0px", soft: "14px", round: "30px" };

          function text(value, fallback) {
            return typeof value === "string" && value !== "" ? value : fallback;
          }
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var labelA = text(vars.label_a, "Dashboard");
          var labelB = text(vars.label_b, "Analytics");
          var accent = accents[pick(accents, vars.accent, "green")];
          var corner = corners[pick(corners, vars.corner, "round")];

          var roots = document.querySelectorAll(".hf-transition-page-slide");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-page-radius", corner);
            root.style.setProperty("--hf-page-from", accent.from);
            root.style.setProperty("--hf-page-to", accent.to);
            var oldLabel = root.querySelector(".hf-transition-page.old span");
            var newLabel = root.querySelector(".hf-transition-page.new span");
            if (oldLabel) oldLabel.textContent = labelA;
            if (newLabel) newLabel.textContent = labelB;
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-page-slide",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          0.25,
        );
        tl.fromTo(
          ".hf-transition-page.new",
          { xPercent: 100 },
          { xPercent: 0, duration: 0.74, ease: "power3.inOut" },
          0.78,
        );
        tl.to(
          ".hf-transition-page.old",
          { xPercent: -28, scale: 0.94, duration: 0.74, ease: "power3.inOut" },
          0.78,
        );
        tl.fromTo(
          ".hf-transition-page.new span",
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.28, ease: "power2.out" },
          1.24,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["page-slide-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-page-slide {
        position: relative;
        width: 560px;
        height: 320px;
        overflow: hidden;
        border-radius: var(--hf-page-radius, 30px);
        background: #111827;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.22);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-page {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .hf-transition-page span {
        padding: 14px 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: 28px;
        font-weight: 900;
      }
      .hf-transition-page.old {
        background: linear-gradient(135deg, #0f172a, #334155);
      }
      .hf-transition-page.new {
        background: linear-gradient(
          135deg,
          var(--hf-page-from, #155e75),
          var(--hf-page-to, #10b981)
        );
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
