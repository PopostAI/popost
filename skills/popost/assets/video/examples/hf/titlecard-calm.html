<html data-composition-variables='[
    { "id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Primary title displayed in the card.", "default": "Less, but better" },
    { "id": "kicker", "type": "string", "role": "content", "label": "Kicker", "description": "Small uppercase label displayed above the headline.", "default": "DESIGN PRINCIPLE" }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Titlecard Calm Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f7f7f2;
        --muted: #aeb6c2;
        --surface: #111318;
        --border: #292d35;
        --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 45%, #12151a 0%, var(--bg) 72%);
      }

      .mount-card {
        width: 78%;
        height: 62%;
        left: 11%;
        top: 19%;
        container-type: size;
        overflow: hidden;
        border: 1px solid rgba(247, 247, 242, 0.08);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 36px 90px rgba(0, 0, 0, 0.32);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A restrained title card where a mono kicker and generous grotesque headline fade upward, drift almost imperceptibly, and exit cleanly.",
 "class": "logo",
 "tags": [
  "motion-primitive",
  "typography",
  "title-card",
  "calm",
  "orient"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "headline",
   "type": "text",
   "default": "Less, but better",
   "maxLength": 200,
   "what": "Primary title displayed in the card."
  },
  {
   "name": "kicker",
   "type": "text",
   "default": "DESIGN PRINCIPLE",
   "maxLength": 200,
   "what": "Small uppercase label displayed above the headline."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"headline":"Clarity over noise","kicker":"QUIET CONFIDENCE"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="titlecard-calm-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="titlecard-calm-mount"
        class="mount-card clip"
        data-composition-id="titlecard-calm"
       
        data-variable-values='{"headline":"Clarity over noise","kicker":"QUIET CONFIDENCE"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1498"
        data-height="670"
      >
      <div id="root" data-composition-id="titlecard-calm" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f7f7f2);
            font-family: var(--font-display, "Helvetica Neue", Helvetica, Arial, sans-serif);
            pointer-events: none;
          }

          .tc-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .tc-lockup {
            display: flex;
            width: 78cqw;
            flex-direction: column;
            align-items: flex-start;
            gap: 6cqh;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          .tc-kicker {
            display: block;
            width: 100%;
            color: var(--muted, #b8c0cc);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
            font-size: 3.2cqmin;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            will-change: transform, opacity;
          }

          .tc-headline {
            display: block;
            width: 100%;
            color: var(--fg, #f7f7f2);
            font-family: var(--font-display, "Helvetica Neue", Helvetica, Arial, sans-serif);
            font-size: 17cqmin;
            font-weight: 600;
            line-height: 0.94;
            letter-spacing: -0.055em;
            overflow-wrap: anywhere;
            text-wrap: balance;
            will-change: transform, opacity;
          }
        </style>

        <div
          id="titlecard-calm-clip"
          class="tc-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="tc-lockup">
            <span class="tc-kicker"></span>
            <span class="tc-headline"></span>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var lockup = root.querySelector(".tc-lockup");
            var kicker = root.querySelector(".tc-kicker");
            var headline = root.querySelector(".tc-headline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var headlineText = vars.headline == null ? "Less, but better" : String(vars.headline);
            var kickerText = vars.kicker == null ? "DESIGN PRINCIPLE" : String(vars.kicker);

            headline.textContent = headlineText;
            kicker.textContent = kickerText;

            var IN_BASE = 1.2;
            var OUT_BASE = 0.55;
            var parsedDuration = Number.parseFloat(root.dataset.duration);
            var duration = Number.isFinite(parsedDuration) ? Math.max(0.001, parsedDuration) : 4;
            var totalBase = IN_BASE + OUT_BASE;
            var phaseScale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;
            var KICKER_IN = 0.5 * phaseScale;
            var HEADLINE_AT = 0.28 * phaseScale;
            var HEADLINE_IN = 0.72 * phaseScale;

            gsap.set(lockup, { opacity: 1, y: "0cqh" });

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              kicker,
              { opacity: 0, y: "2.2cqh" },
              { opacity: 1, y: "0cqh", duration: KICKER_IN, ease: "power2.out" },
              0,
            );
            tl.fromTo(
              headline,
              { opacity: 0, y: "3.2cqh" },
              { opacity: 1, y: "0cqh", duration: HEADLINE_IN, ease: "power3.out" },
              HEADLINE_AT,
            );

            if (HOLD > 0) {
              tl.to(lockup, { y: "-0.65cqh", duration: HOLD, ease: "sine.inOut" }, HOLD_START);
            }

            tl.to(
              lockup,
              { opacity: 0, y: "-2.1cqh", duration: OUT, ease: "power2.in" },
              OUT_START,
            );

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["titlecard-calm"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["titlecard-calm-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
