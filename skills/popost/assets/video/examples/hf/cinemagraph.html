<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../lib/gsap.min.js"></script>
    
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0b0e14;
        overflow: hidden;
      }
      #root-cinemagraph {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0e14;
        --hf-ink: #f8fafc;
      }
      /* ---- the still photograph (placeholder scene, monochrome ink ramp) ---- */
      .cmg-photo {
        position: absolute;
        inset: 0;
      }
      /* window light falling across the scene */
      .cmg-lightfall {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          color-mix(in srgb, var(--hf-ink) 8%, transparent) 0%,
          transparent 46%
        );
      }
      /* table surface */
      .cmg-table {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 320px;
        background: color-mix(in srgb, var(--hf-ink) 8%, transparent);
        border-top: 1px solid color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      /* window frame in the far wall */
      .cmg-pane {
        position: absolute;
        left: 1210px;
        top: 130px;
        width: 420px;
        height: 520px;
        background: color-mix(in srgb, var(--hf-ink) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      .cmg-pane::before,
      .cmg-pane::after {
        content: "";
        position: absolute;
        background: color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      .cmg-pane::before {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .cmg-pane::after {
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
      }
      /* saucer + cup, the photograph's subject */
      .cmg-saucer {
        position: absolute;
        left: 760px;
        bottom: 236px;
        width: 400px;
        height: 56px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--hf-ink) 45%, transparent);
      }
      .cmg-cup {
        position: absolute;
        left: 830px;
        bottom: 262px;
        width: 260px;
        height: 190px;
        border-radius: 0 0 118px 118px;
        background: color-mix(in srgb, var(--hf-ink) 72%, transparent);
      }
      .cmg-cup::after {
        content: "";
        position: absolute;
        right: -64px;
        top: 18px;
        width: 88px;
        height: 96px;
        border: 22px solid color-mix(in srgb, var(--hf-ink) 72%, transparent);
        border-radius: 50%;
      }
      .cmg-rim {
        position: absolute;
        left: 822px;
        bottom: 436px;
        width: 276px;
        height: 34px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--hf-ink) 45%, transparent);
      }
      /* a closed book beside the cup */
      .cmg-book {
        position: absolute;
        left: 1180px;
        bottom: 250px;
        width: 330px;
        height: 44px;
        background: color-mix(in srgb, var(--hf-ink) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--hf-ink) 14%, transparent);
        transform: rotate(-2deg);
      }
      .cmg-book::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        top: 12px;
        height: 1px;
        background: color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      /* skeleton caption lines, bottom left — content lives here */
      .cmg-line {
        position: absolute;
        left: 160px;
        height: 22px;
        border-radius: 11px;
        background: color-mix(in srgb, var(--hf-ink) 18%, transparent);
      }
      /* ---- the ONE living region: a feathered window where steam moves ---- */
      #cmg-window {
        position: absolute;
        left: 790px;
        bottom: 430px;
        width: 340px;
        height: 420px;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 55%, #000 55%, transparent 78%);
        mask-image: radial-gradient(ellipse 50% 50% at 50% 55%, #000 55%, transparent 78%);
      }
      #cmg-canvas {
        position: absolute;
        inset: 0;
        width: 340px;
        height: 420px;
      }
      /* still vignette over everything, part of the photograph */
      .cmg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 78% 72% at 50% 46%,
          transparent 62%,
          rgba(4, 6, 10, 0.5) 100%
        );
        pointer-events: none;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A still photograph with one living region: the frame is frozen while a single feathered window keeps moving - here, steam rising over a cup - drawn from the seek time alone with a period that divides the duration, so the render loops seamlessly. Swap the placeholder scene for a freeze-frame still masked over a looping video to cinemagraph real footage.",
 "class": "motion",
 "tags": [
  "effect",
  "cinemagraph",
  "photo",
  "loop",
  "freeze-frame"
 ],
 "seconds": 10,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root-cinemagraph"
      data-composition-id="cinemagraph"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div class="cmg-photo" id="cmg-photo">
        <div class="cmg-lightfall"></div>
        <div class="cmg-pane"></div>
        <div class="cmg-table"></div>
        <div class="cmg-saucer"></div>
        <div class="cmg-cup"></div>
        <div class="cmg-rim"></div>
        <div class="cmg-book"></div>
        <div class="cmg-line" style="bottom: 150px; width: 460px"></div>
        <div class="cmg-line" style="bottom: 108px; width: 300px"></div>
      </div>
      <div id="cmg-window">
        <canvas id="cmg-canvas" width="340" height="420"></canvas>
      </div>
      <div class="cmg-vignette"></div>
      <div
        id="drv-cinemagraph"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rng = mulberry32(1897);

        var DUR = 10;
        // Each wisp cycles an integer number of times over DUR, so the frame at
        // t = DUR equals the frame at t = 0 and the render loops seamlessly.
        var WISPS = [];
        for (var i = 0; i < 14; i++) {
          WISPS.push({
            x0: 90 + rng() * 160, // birth x inside the window
            cycles: 1 + Math.floor(rng() * 2), // 1 or 2 full rises over DUR
            phase: rng(), // where in its cycle it starts
            sway: 14 + rng() * 26, // horizontal sway amplitude
            swayFreq: 1 + Math.floor(rng() * 2), // integer — keeps the loop seam clean
            width: 10 + rng() * 22, // wisp thickness
            rise: 300 + rng() * 80, // how far it climbs before dissolving
            alpha: 0.05 + rng() * 0.09,
          });
        }

        var canvas = document.getElementById("cmg-canvas");
        var ctx = canvas.getContext("2d");
        var W = 340,
          H = 420;

        // State proxy — GSAP animates t, the render function reads it.
        var st = { t: 0 };

        function renderScene() {
          ctx.clearRect(0, 0, W, H);
          for (var i = 0; i < WISPS.length; i++) {
            var w = WISPS[i];
            // p in [0,1): this wisp's position in its own rise cycle
            var p = (st.t / DUR) * w.cycles + w.phase;
            p = p - Math.floor(p);
            var y = H - 40 - p * w.rise;
            var sway = Math.sin(2 * Math.PI * (p * w.swayFreq + w.phase)) * w.sway * p;
            var x = w.x0 + sway;
            // born faint, fullest mid-rise, dissolves at the top
            var a = w.alpha * Math.sin(Math.PI * p);
            var r = w.width * (0.7 + p * 1.6);
            var g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.4);
            g.addColorStop(0, "rgba(248,250,252," + a.toFixed(4) + ")");
            g.addColorStop(1, "rgba(248,250,252,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(x, y, r * 1.1, r * 2.2, sway * 0.004, 0, 2 * Math.PI);
            ctx.fill();
          }
        }

        var tl = gsap.timeline({ paused: true });
        tl.to(st, { t: DUR, duration: DUR, ease: "none" }, 0);

        window.__timelines["cinemagraph"] = tl;

        tl.eventCallback("onUpdate", renderScene);
        renderScene();
      })();
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
