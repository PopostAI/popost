<html data-composition-variables='[
    { "id": "echoes", "type": "number", "role": "style", "label": "Echoes", "description": "Ghost copy count, clamped 2 to 6.", "default": 4 },
    { "id": "delta", "type": "number", "role": "timing", "label": "Delta", "description": "Lag between successive ghosts in seconds, clamped 0.03 to 0.3.", "default": 0.09 },
    { "id": "path", "type": "enum", "role": "timing", "label": "Path", "description": "Authored traversal preset.", "default": "sweep", "options": [{ "value": "sweep", "label": "Sweep" }, { "value": "rise", "label": "Rise" }, { "value": "arc", "label": "Arc" }] },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Subject accent color: green rides --brand, blue rides --accent, violet rides --accent-2.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "Optional departure. Default none: the settled element holds until the frame cuts.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Echo Trail Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #eef0f3);
      }

      #root {
        --bg: #eef0f3;
        --fg: #14161b;
        --muted: #5b6472;
        --surface: #ffffff;
        --border: #d3d8e0;
        --brand: #3f3f46;
        --accent: #3f3f46;
        --accent-2: #3f3f46;
        --radius: 18px;
        --font-display: "Inter", system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #f7f8fa 0%, var(--bg, #eef0f3) 72%);
      }

      .mount-bleed {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A moving element renders with N ghosted copies of itself at t minus i times delta, opacity stepped down per ghost; one traversal, echoes collapsing into the settled element at rest.",
 "class": "motion",
 "tags": [
  "motion-primitive",
  "demonstrate",
  "trail",
  "onion-skin",
  "ghosts",
  "deterministic"
 ],
 "seconds": 3.5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "echoes",
   "type": "number",
   "default": 4,
   "min": -100000,
   "max": 100000,
   "what": "Ghost copy count, clamped 2 to 6."
  },
  {
   "name": "delta",
   "type": "number",
   "default": 0.09,
   "min": -100000,
   "max": 100000,
   "what": "Lag between successive ghosts in seconds, clamped 0.03 to 0.3."
  },
  {
   "name": "path",
   "type": "choice",
   "default": "sweep",
   "options": [
    "sweep",
    "rise",
    "arc"
   ],
   "what": "Authored traversal preset."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Subject accent color: green rides --brand, blue rides --accent, violet rides --accent-2."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "Optional departure. Default none: the settled element holds until the frame cuts."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"path":"arc","echoes":5,"delta":0.12,"accent":"violet"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="echo-trail-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="echo-trail-mount"
        class="mount-bleed clip"
        data-composition-id="echo-trail"
       
        data-variable-values='{"path":"arc","echoes":5,"delta":0.12,"accent":"violet"}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      >
      <div id="root" data-composition-id="echo-trail" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, "Inter", system-ui, sans-serif);
            pointer-events: none;
          }

          .et-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: var(--bg, transparent);
          }

          .et-stage {
            position: absolute;
            inset: 0;
            will-change: transform, opacity;
          }

          .et-ghost,
          .et-lead {
            position: absolute;
            left: 0;
            top: 0;
            will-change: opacity;
          }

          .et-ghost {
            opacity: 0;
          }

          .et-lead {
            opacity: 0;
          }

          .et-card {
            width: 30cqmin;
            padding: var(--space-3, 3cqmin);
            display: grid;
            gap: var(--space-2, 2cqmin);
            border: 0.18cqmin solid var(--border, #475569);
            border-radius: var(--radius, 2.4cqmin);
            background: var(--surface, #14171c);
            box-shadow: 0 1.6cqmin 5cqmin color-mix(in srgb, var(--bg, #000000) 30%, transparent);
          }

          .et-card-dot {
            width: 3.2cqmin;
            height: 3.2cqmin;
            border-radius: 50%;
            background: var(--et-accent);
          }

          .et-card-line {
            height: 1.6cqmin;
            border-radius: 0.8cqmin;
            background: color-mix(in srgb, var(--fg, #f8fafc) 16%, transparent);
          }

          .et-card-line.short {
            width: 62%;
          }
        </style>

        <div
          id="echo-trail-clip"
          class="et-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="et-stage">
            <div class="et-lead">
              <div class="et-card">
                <div class="et-card-dot"></div>
                <div class="et-card-line"></div>
                <div class="et-card-line short"></div>
              </div>
            </div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".et-stage");
            var lead = root.querySelector(".et-lead");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var echoesRaw = parseFloat(vars.echoes);
            var echoes = isFinite(echoesRaw) ? Math.min(6, Math.max(2, Math.round(echoesRaw))) : 4;
            var deltaRaw = parseFloat(vars.delta);
            var deltaVar = isFinite(deltaRaw) ? Math.min(0.3, Math.max(0.03, deltaRaw)) : 0.09;
            var pathName = vars.path === "rise" || vars.path === "arc" ? vars.path : "sweep";
            // Each enum choice routes to a DIFFERENT contract token so the
            // variable stays meaningful under a theme.
            var accentColors = {
              green: "var(--brand, #52525b)",
              blue: "var(--accent, #52525b)",
              violet: "var(--accent-2, #52525b)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            root.style.setProperty("--et-accent", accentColors[accent]);

            // SLOT. Caller templates live at HOST DOCUMENT level (the mount
            // wipes host-clip children, and templates never render).
            var hostDoc = root.ownerDocument;
            var slotTemplate = null;
            try {
              slotTemplate = hostDoc.querySelector('template[data-slot="echo-trail-subject"]');
            } catch (error) {
              slotTemplate = null;
            }
            if (slotTemplate) {
              lead.querySelector(".et-card").remove();
              lead.appendChild(hostDoc.importNode(slotTemplate.content, true));
            }

            // Ghosts: deep clones of the subject, inserted BEFORE the lead
            // past copy (highest stepped opacity).
            var ghosts = [];
            for (var g = 0; g < echoes; g += 1) {
              var ghost = hostDoc.createElement("div");
              ghost.className = "et-ghost";
              ghost.setAttribute("aria-hidden", "true");
              for (var c = 0; c < lead.children.length; c += 1) {
                ghost.appendChild(lead.children[c].cloneNode(true));
              }
              stage.insertBefore(ghost, lead);
              ghosts.push(ghost);
            }

            // Envelope: fixed IN/OUT, elastic HOLD, never time-scaled.
            var TRAVEL_BASE = 2.1;
            var IN_BASE = TRAVEL_BASE + echoes * deltaVar + 0.2;
            var OUT_BASE = exit === "none" ? 0 : 0.45;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));
            var totalBase = Math.max(0.001, IN_BASE + OUT_BASE);
            var scale = duration < totalBase ? duration / totalBase : 1;
            var TRAVEL = TRAVEL_BASE * scale;
            var delta = deltaVar * scale;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;

            // Path presets in percent-of-stage coordinates; the subject is
            // centered on the point via a one-time -50%/-50% translate.
            function pathPoint(u) {
              if (pathName === "rise") {
                return { x: 50 + 6 * Math.sin(Math.PI * u), y: 76 - 44 * u };
              }
              if (pathName === "arc") {
                return { x: 16 + 68 * u, y: 64 - 34 * Math.sin(Math.PI * u) };
              }
              // sweep: a shallow S from left to right through center.
              return { x: 18 + 64 * u, y: 50 + 10 * Math.cos(Math.PI * u) };
            }

            function easeInOut(t) {
              return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
            }
            function clamp01(v) {
              return v < 0 ? 0 : v > 1 ? 1 : v;
            }

            function posAt(timeSeconds) {
              var u = easeInOut(clamp01(TRAVEL > 0 ? timeSeconds / TRAVEL : 1));
              return pathPoint(u);
            }

            // One-time static transforms: center anchor plus a slight
            // per-ghost scale step for depth. GSAP owns the transform, the
            // per-update writes touch only left/top/opacity.
            gsap.set(lead, { xPercent: -50, yPercent: -50 });
            for (var i = 0; i < ghosts.length; i += 1) {
              gsap.set(ghosts[i], {
                xPercent: -50,
                yPercent: -50,
                scale: 1 - 0.015 * (i + 1),
              });
            }

            // Stepped ghost bases: nearest past copy strongest.
            var bases = [];
            for (var b = 0; b < echoes; b += 1) {
              bases.push(0.55 * (1 - b / echoes));
            }

            // Pure per-update apply: every position and every ghost alpha
            // is a function of tl.time() alone. Ghost alpha is its stepped
            // base times a separation ramp, so echoes are invisible before
            // motion starts and collapse to exactly zero at rest. Writes
            // are idempotent, so the HOLD repaints identically.
            function applyTime(timeSeconds) {
              var leadPos = posAt(timeSeconds);
              gsap.set(lead, {
                left: leadPos.x.toFixed(4) + "%",
                top: leadPos.y.toFixed(4) + "%",
              });
              for (var n = 0; n < ghosts.length; n += 1) {
                var p = posAt(timeSeconds - (n + 1) * delta);
                var dist = Math.hypot(p.x - leadPos.x, p.y - leadPos.y);
                var alpha = bases[n] * clamp01(dist / 2.2);
                gsap.set(ghosts[n], {
                  left: p.x.toFixed(4) + "%",
                  top: p.y.toFixed(4) + "%",
                  opacity: alpha < 0.002 ? 0 : alpha,
                });
              }
            }

            gsap.set(stage, { opacity: 1, y: "0cqh" });

            var tl = gsap.timeline({
              paused: true,
              onUpdate: function () {
                applyTime(tl.time());
              },
            });

            // Anchor tween: an inert plain-object tween spanning the full
            // authored duration so the timeline covers [0, D], onUpdate
            // fires for every eventful seek, and holds never clamp short.
            tl.to({ p: 0 }, { p: 1, duration: duration, ease: "none" }, 0);

            // Lead entrance: both endpoints authored. Ghosts need no
            // entrance; the separation ramp keeps them at zero until the
            // traversal opens a gap.
            tl.fromTo(
              lead,
              { opacity: 0 },
              { opacity: 1, duration: 0.22 * scale, ease: "power2.out" },
              0,
            );

            // HOLD: truly still. The lead rests at path(1) and every ghost
            // is coincident at opacity exactly zero.

            // OUT: optional departure; exit none holds until the frame cuts.
            if (exit === "up") {
              tl.to(stage, { y: "-4cqh", duration: OUT, ease: "power2.in" }, OUT_START);
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            } else if (exit === "fade") {
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            }

            tl.seek(0);
            applyTime(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["echo-trail"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["echo-trail-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
