<html data-composition-variables='[
    { "id": "marks", "type": "string", "role": "content", "label": "Marks", "description": "Comma-separated wordmark texts (3 to 7 recommended).", "default": "Northwind, Acme Corp, Globex, Initech, Umbra" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Mark color: quiet muted or full-contrast ink.", "default": "muted", "options": [{ "value": "muted", "label": "Muted" }, { "value": "ink", "label": "Ink" }] },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated reveal starts in seconds from mount start. Empty uses the authored 0.15s stagger.", "default": "" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Faint palette tint mixed into the mark color.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "End-of-clip behavior. None holds to the last frame.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>trust-strip Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #f4f6f9);
      }

      #root {
        --bg: #f4f6f9;
        --fg: #14161b;
        --surface: #ffffff;
        --border: #dfe4ec;
        --brand: #1d4ed8;
        --accent: #0284c7;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, var(--bg, #f4f6f9) 70%);
      }

      .mount-stage {
        width: 90%;
        height: 50%;
        left: 5%;
        top: 25%;
        container-type: size;
        overflow: hidden;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A monochrome trust row of wide-tracked mono wordmarks that fade in with an opacity-only left-to-right stagger, then hold dead still.",
 "class": "logo",
 "tags": [
  "motion-primitive",
  "proof",
  "trust",
  "logo-strip",
  "wordmarks"
 ],
 "seconds": 1.3,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "marks",
   "type": "text",
   "default": "Northwind, Acme Corp, Globex, Initech, Umbra",
   "maxLength": 200,
   "what": "Comma-separated wordmark texts (3 to 7 recommended)."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "muted",
   "options": [
    "muted",
    "ink"
   ],
   "what": "Mark color: quiet muted or full-contrast ink."
  },
  {
   "name": "cues",
   "type": "text",
   "default": "",
   "maxLength": 200,
   "what": "Comma-separated reveal starts in seconds from mount start. Empty uses the authored 0.15s stagger."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "green",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Faint palette tint mixed into the mark color."
  },
  {
   "name": "exit",
   "type": "choice",
   "default": "none",
   "options": [
    "none",
    "fade",
    "up"
   ],
   "what": "End-of-clip behavior. None holds to the last frame."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"marks":"NORTHWIND,ACME CORP,GLOBEX,INITECH,UMBRA","tone":"muted"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.2,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="trust-strip-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3.5"
      data-fps="30"
    >
      <div
        id="trust-strip-mount"
        class="mount-stage clip"
        data-composition-id="trust-strip"
       
        data-variable-values='{"marks":"NORTHWIND,ACME CORP,GLOBEX,INITECH,UMBRA","tone":"muted"}'
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-width="1728"
        data-height="540"
      >
      <div id="root" data-composition-id="trust-strip" data-duration="3.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, transparent);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
            pointer-events: none;
          }

          .ts-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .ts-strip {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: center;
            width: 86cqw;
            max-width: 86cqw;
            column-gap: var(--space-3, 4.8cqw);
            row-gap: var(--space-2, 4.2cqh);
            will-change: transform, opacity;
          }

          .ts-mark {
            /* Monochrome by law: the tone token carries the color; the accent
               token only tints it 10% so the strip sits in the palette. */
            color: color-mix(in srgb, var(--ts-tone) 90%, var(--ts-accent));
            font-size: min(1.9cqw, 6.4cqh);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            white-space: nowrap;
            will-change: opacity;
          }
        </style>

        <div
          id="trust-strip-clip"
          class="ts-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="ts-strip" role="img"></div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var strip = root.querySelector(".ts-strip");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var marks = String(vars.marks == null ? "" : vars.marks)
              .split(",")
              .map(function (mark) {
                return mark.trim();
              })
              .filter(Boolean);
            if (marks.length === 0)
              marks = ["Northwind", "Acme Corp", "Globex", "Initech", "Umbra"];

            var tone = vars.tone === "ink" ? "ink" : "muted";
            var toneColors = {
              muted: "var(--muted, #93939f)",
              ink: "var(--fg, #f8fafc)",
            };
            // Each enum choice routes to a DIFFERENT contract token so the
            // variable stays meaningful under a theme.
            var accentColors = {
              green: "var(--brand, #71f5a7)",
              blue: "var(--accent, #61a8ff)",
              violet: "var(--accent-2, #c5a3ff)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";

            root.style.setProperty("--ts-tone", toneColors[tone]);
            root.style.setProperty("--ts-accent", accentColors[accent]);
            strip.setAttribute("aria-label", marks.join(", "));

            var spans = marks.map(function (mark) {
              var span = document.createElement("span");
              span.className = "ts-mark";
              span.textContent = mark;
              span.setAttribute("aria-hidden", "true");
              strip.appendChild(span);
              return span;
            });

            var LEAD_BASE = 0.2;
            var GAP_BASE = 0.15;
            var FADE_BASE = 0.5;
            var OUT_BASE = exit === "none" ? 0 : 0.45;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "3.5"));

            // Reveal starts: caller cues win; missing tail entries extend from
            // the last known start by the authored gap.
            var cues = String(vars.cues == null ? "" : vars.cues)
              .split(",")
              .map(function (cue) {
                return parseFloat(cue);
              })
              .filter(function (cue) {
                return isFinite(cue) && cue >= 0;
              });
            var starts = marks.map(function (mark, index) {
              if (index < cues.length) return cues[index];
              if (cues.length > 0)
                return cues[cues.length - 1] + GAP_BASE * (index - cues.length + 1);
              return LEAD_BASE + GAP_BASE * index;
            });

            var IN_BASE = Math.max.apply(null, starts) + FADE_BASE;
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var FADE = FADE_BASE * scale;
            var OUT = OUT_BASE * scale;
            var OUT_START = duration - OUT;

            var tl = gsap.timeline({ paused: true });

            // IN: opacity-only stagger, left to right in reading order.
            spans.forEach(function (span, index) {
              tl.fromTo(
                span,
                { opacity: 0 },
                { opacity: 1, duration: FADE, ease: "power2.out" },
                starts[index] * scale,
              );
            });

            // HOLD: dead still. Nothing is authored here on purpose.

            // OUT: optional whole-strip departure; frame roots own transitions
            // by default, so exit "none" holds to the last frame.
            if (exit === "fade") {
              tl.to(strip, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
            } else if (exit === "up") {
              tl.to(strip, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);
              tl.to(strip, { y: "-1.6cqh", duration: OUT, ease: "power2.in" }, OUT_START);
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["trust-strip"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["trust-strip-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
