<!doctype html>

  Skill's THIRD_PARTY_NOTICES. Changed for the popost Skill (tools/video/port-hyperframes.mjs): its comments removed; GSAP loaded from the project (../lib/gsap.min.js) instead of a CDN; scaled into the canvas; the 1920x1080 composition scaled into the scene's canvas (parameter "fit"); HyperFrames variables declared as parameters; its clips shown and hidden from the scene's time; sound cues derived from its tweens.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Shared Axis Z - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      /* ponytail: demo-frame is not a GSAP target — CSS transform is safe */
      .demo-frame {
        position: relative;
        width: 720px;
        height: 480px;
        transform: scale(1.6);
      }
      /* Shared container that clips both panels */
      .axis-z-stage {
        position: relative;
        width: 720px;
        height: 480px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          0 32px 80px rgba(0, 0, 0, 0.12),
          0 2px 8px rgba(0, 0, 0, 0.06);
        border: 1px solid #e4e4e7;
        background: #ffffff;
      }
      /* Outgoing panel (zooms out + fades) */
      .axis-z-outgoing {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        will-change: transform, opacity;
      }
      .axis-z-outgoing-icon {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .axis-z-outgoing-icon svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .axis-z-outgoing-title {
        font-size: 18px;
        font-weight: 600;
        color: #18181b;
        letter-spacing: -0.02em;
      }
      .axis-z-outgoing-subtitle {
        font-size: 13px;
        font-weight: 400;
        color: #71717a;
      }
      .axis-z-outgoing-row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .axis-z-chip {
        padding: 5px 12px;
        border-radius: 999px;
        background: #f4f4f5;
        border: 1px solid #e4e4e7;
        font-size: 12px;
        font-weight: 500;
        color: #52525b;
      }
      /* Incoming panel (the component output — zooms in from small) */
      .axis-z-incoming {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 40px;
        gap: 24px;
        background: #ffffff;
        will-change: transform, opacity;
      }
      .axis-z-incoming-header {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .axis-z-incoming-eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #71717a;
      }
      /* GSAP animates .hf-catalog-shared-axis-z span — must keep class + span structure */
      .hf-catalog-shared-axis-z {
        display: inline-flex;
        gap: 10px;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #18181b;
      }
      .hf-catalog-shared-axis-z span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
      .axis-z-incoming-meta {
        font-size: 13px;
        color: #71717a;
        font-weight: 400;
        line-height: 1.5;
        max-width: 400px;
      }
      .axis-z-incoming-stats {
        display: flex;
        gap: 16px;
        margin-top: auto;
      }
      .axis-z-stat {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 16px 20px;
        background: #fafafa;
        border: 1px solid #e4e4e7;
        border-radius: 10px;
        flex: 1;
      }
      .axis-z-stat-value {
        font-size: 22px;
        font-weight: 700;
        color: #18181b;
        letter-spacing: -0.03em;
      }
      .axis-z-stat-label {
        font-size: 11px;
        font-weight: 500;
        color: #71717a;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .axis-z-divider {
        width: 100%;
        height: 1px;
        background: #e4e4e7;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Scale-based shared-axis transition for focus shifts and context depth.",
 "class": "transition",
 "tags": [
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "direction",
   "type": "choice",
   "default": "in",
   "options": [
    "in",
    "out"
   ],
   "what": "Which way the words travel along the z axis: in swells up from small, out settles down from large."
  },
  {
   "name": "depth",
   "type": "choice",
   "default": "standard",
   "options": [
    "shallow",
    "standard",
    "deep"
   ],
   "what": "Scales how far the words start from their final size, so the push covers a shorter or longer run in the same time."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Word colour: ink for light frames, paper for dark ones, accent rides --brand."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="shared-axis-z-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="axis-z-stage">
          
          <div class="axis-z-outgoing">
            <div class="axis-z-outgoing-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            </div>
            <div class="axis-z-outgoing-title">Overview</div>
            <div class="axis-z-outgoing-subtitle">Select a context to zoom in</div>
            <div class="axis-z-outgoing-row">
              <div class="axis-z-chip">Analytics</div>
              <div class="axis-z-chip">Reports</div>
              <div class="axis-z-chip">Settings</div>
            </div>
          </div>

          
          <div class="axis-z-incoming">
            <div class="axis-z-incoming-header">
              <div class="axis-z-incoming-eyebrow">Analytics</div>
              <div
                class="hf-catalog-shared-axis-z"
                data-composition-variables='[
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Which way the words travel along the z axis: in swells up from small, out settles down from large.", "default": "in", "options": [{ "value": "in", "label": "In" }, { "value": "out", "label": "Out" }] },
    { "id": "depth", "type": "enum", "role": "motion", "label": "Depth", "description": "Scales how far the words start from their final size, so the push covers a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "shallow", "label": "Shallow" }, { "value": "standard", "label": "Standard" }, { "value": "deep", "label": "Deep" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
              >
                <span>Zoom</span><span>context</span>
              </div>
              <div class="axis-z-incoming-meta">
                Drill into any metric with a shared-axis Z transition — the new view scales in from
                the tap point.
              </div>
            </div>
            <div class="axis-z-divider"></div>
            <div class="axis-z-incoming-stats">
              <div class="axis-z-stat">
                <div class="axis-z-stat-value">24.8k</div>
                <div class="axis-z-stat-label">Sessions</div>
              </div>
              <div class="axis-z-stat">
                <div class="axis-z-stat-value">3.4s</div>
                <div class="axis-z-stat-label">Avg. time</div>
              </div>
              <div class="axis-z-stat">
                <div class="axis-z-stat-value">91%</div>
                <div class="axis-z-stat-label">Retention</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var signs = { in: 1, out: -1 };
          var reaches = { shallow: 0.5, standard: 1, deep: 1.85 };
          var tones = {
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var sign = signs[pick(signs, vars.direction, "in")];
          var reach = reaches[pick(reaches, vars.depth, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];

          var roots = document.querySelectorAll(".hf-catalog-shared-axis-z");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-word-depth", String(sign * reach));
            roots[i].style.setProperty("--hf-word-color", tone);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;

        // Outgoing panel: zoom out + fade (shared-axis Z departure)
        tl.fromTo(
          ".axis-z-outgoing",
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 1.18, duration: 0.4, ease: "power2.in" },
          startTime,
        );

        // Incoming panel: zoom in from small + fade (shared-axis Z arrival)
        tl.fromTo(
          ".axis-z-incoming",
          { opacity: 0, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" },
          startTime + 0.05,
        );

        // Word-by-word reveal on the title
        tl.fromTo(
          ".hf-catalog-shared-axis-z span",
          { opacity: 0, "--hf-word-scale": 0.72 },
          {
            opacity: 1,
            "--hf-word-scale": 1,
            duration: 0.34,
            stagger: 0.06,
            ease: "back.out(1.8)",
          },
          startTime + 0.28,
        );

        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["shared-axis-z-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-shared-axis-z {
        color: var(--hf-word-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-shared-axis-z {
        display: inline-flex;
        gap: 12px;
        font-size: 56px;
        line-height: 1;
      }
      .hf-catalog-shared-axis-z span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(calc(1 + (var(--hf-word-scale, 1) - 1) * var(--hf-word-depth, 1)));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
