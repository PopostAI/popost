<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fade Through - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: Inter, system-ui, sans-serif;
        background: #f5f5f4;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      /* Scene A — light neutral */
      .a {
        background: #fafafa;
      }
      /* Scene B — dark zinc */
      .b {
        background: #18181b;
        opacity: 0;
      }
      /* Shared card */
      .card {
        width: 820px;
        border-radius: 16px;
        padding: 72px 80px 80px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .a .card {
        background: #ffffff;
        border: 1px solid #e4e4e7;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
      }
      .b .card {
        background: #27272a;
        border: 1px solid #3f3f46;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        width: fit-content;
        padding: 10px 22px;
        border-radius: 999px;
      }
      .a .badge {
        background: #f4f4f5;
        color: #71717a;
      }
      .b .badge {
        background: #3f3f46;
        color: #a1a1aa;
      }
      .badge-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .a .badge-dot {
        background: #71717a;
      }
      .b .badge-dot {
        background: #a1a1aa;
      }
      .card-title {
        font-size: 72px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .a .card-title {
        color: #18181b;
      }
      .b .card-title {
        color: #fafafa;
      }
      .card-body {
        font-size: 32px;
        font-weight: 400;
        line-height: 1.5;
        color: #71717a;
      }
      .b .card-body {
        color: #71717a;
      }
      .divider {
        height: 1px;
        background: #e4e4e7;
        border: none;
        margin: 0;
      }
      .b .divider {
        background: #3f3f46;
      }
      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .meta-label {
        font-size: 26px;
        font-weight: 500;
      }
      .a .meta-label {
        color: #71717a;
      }
      .b .meta-label {
        color: #71717a;
      }
      .mode-pill {
        font-size: 26px;
        font-weight: 600;
        padding: 10px 28px;
        border-radius: 999px;
      }
      .a .mode-pill {
        background: #18181b;
        color: #fafafa;
      }
      .b .mode-pill {
        background: #fafafa;
        color: #18181b;
      }
      .hf-fade-through-wash {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        background: #fafafa;
        z-index: 900;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A calm transition primitive that fades one layer out, passes through a wash, and reveals the next layer",
 "class": "transition",
 "tags": [
  "motion-primitive",
  "transition",
  "fade",
  "crossfade",
  "scene"
 ],
 "seconds": 2.2,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "wash",
   "type": "choice",
   "default": "paper",
   "options": [
    "paper",
    "white",
    "ink",
    "accent"
   ],
   "what": "Colour of the mid-transition frame. Paper resolves through --hf-fade-through-wash, accent rides --accent."
  },
  {
   "name": "strength",
   "type": "number",
   "default": 1,
   "min": 0.1,
   "max": 1,
   "what": "How far the wash covers at its peak. 1 is a full flash, 0.3 a light veil."
  },
  {
   "name": "shape",
   "type": "choice",
   "default": "flat",
   "options": [
    "flat",
    "bloom"
   ],
   "what": "Flat fills the frame evenly, bloom concentrates the wash in the centre."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":1.3,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="fade-through-demo"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      
      <div class="scene a hf-fade-through-out">
        <div class="card">
          <div class="badge"><span class="badge-dot"></span>Light Mode</div>
          <h2 class="card-title">Your workspace,<br />beautifully lit.</h2>
          <p class="card-body">
            Clean surfaces, crisp type, and just enough contrast to keep you focused all day long.
          </p>
          <hr class="divider" />
          <div class="meta-row">
            <span class="meta-label">Appearance</span>
            <span class="mode-pill">Light</span>
          </div>
        </div>
      </div>

      
      <div class="scene b hf-fade-through-in">
        <div class="card">
          <div class="badge"><span class="badge-dot"></span>Dark Mode</div>
          <h2 class="card-title">Easy on the eyes,<br />night or day.</h2>
          <p class="card-body">
            Deep backgrounds, refined contrast, and thoughtful color for late-night sessions.
          </p>
          <hr class="divider" />
          <div class="meta-row">
            <span class="meta-label">Appearance</span>
            <span class="mode-pill">Dark</span>
          </div>
        </div>
      </div>

      <div
        class="hf-fade-through-wash"
        aria-hidden="true"
        data-composition-variables='[
    { "id": "wash", "type": "enum", "role": "style", "label": "Wash", "description": "Colour of the mid-transition frame. Paper resolves through --hf-fade-through-wash, accent rides --accent.", "default": "paper", "options": [{ "value": "paper", "label": "Paper" }, { "value": "white", "label": "White" }, { "value": "ink", "label": "Ink" }, { "value": "accent", "label": "Accent" }] },
    { "id": "strength", "type": "number", "role": "style", "label": "Strength", "description": "How far the wash covers at its peak. 1 is a full flash, 0.3 a light veil.", "default": 1, "min": 0.1, "max": 1, "step": 0.05 },
    { "id": "shape", "type": "enum", "role": "style", "label": "Shape", "description": "Flat fills the frame evenly, bloom concentrates the wash in the centre.", "default": "flat", "options": [{ "value": "flat", "label": "Flat" }, { "value": "bloom", "label": "Bloom" }] }
  ]'
      ></div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var washes = {
            paper: "var(--hf-fade-through-wash, #f8f5ec)",
            white: "#ffffff",
            ink: "#0b0b0f",
            accent: "var(--accent, #38bdf8)",
          };

          var wash = Object.prototype.hasOwnProperty.call(washes, vars.wash) ? vars.wash : "paper";
          var shape = vars.shape === "bloom" ? "bloom" : "flat";

          var strength = parseFloat(vars.strength);
          if (!isFinite(strength)) strength = 1;
          strength = Math.min(1, Math.max(0.1, strength));

          var colour = washes[wash];
          var paint =
            shape === "bloom"
              ? "radial-gradient(circle at 50% 50%, " + colour + " 0%, transparent 72%)"
              : colour;

          var overlays = document.querySelectorAll(".hf-fade-through-wash");
          for (var i = 0; i < overlays.length; i += 1) {
            overlays[i].style.setProperty("--hf-fade-through-paint", paint);
            overlays[i].style.setProperty("--hf-fade-through-strength", String(strength));
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to(".hf-fade-through-out", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 1.3);
        tl.to(".hf-fade-through-wash", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 1.3);
        tl.to(".hf-fade-through-wash", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 1.65);
        tl.to(".hf-fade-through-in", { opacity: 1, duration: 0.55, ease: "power2.out" }, 1.65);
        window.__timelines = window.__timelines || {};
        window.__timelines["fade-through-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-fade-through-in {
        opacity: 0;
      }
      .hf-fade-through-wash {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        background: var(--hf-fade-through-paint, var(--hf-fade-through-wash, #f8f5ec));
        filter: opacity(var(--hf-fade-through-strength, 1));
        z-index: 900;
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
