<html data-composition-variables='[
        { "id": "density", "type": "enum", "role": "style", "label": "Density", "description": "Star count across the frame.", "default": "sparse", "options": [{ "value": "sparse", "label": "Sparse" }, { "value": "dense", "label": "Dense" }] },
        { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Star color mix.", "default": "warm", "options": [{ "value": "warm", "label": "Warm (white + yellow)" }, { "value": "cool", "label": "Cool (white + blue)" }, { "value": "white", "label": "White only" }] },
        { "id": "speed", "type": "enum", "role": "style", "label": "Twinkle speed", "description": "How fast stars pulse.", "default": "slow", "options": [{ "value": "slow", "label": "Slow" }, { "value": "fast", "label": "Fast" }] }
      ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../lib/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #starfield-demo {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
      }

      #starfield-demo-backdrop {
        position: absolute;
        inset: 0;
        background: #07080b;
      }

      #starfield-demo-title {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      #starfield-demo-title h1 {
        margin: 0;
        font-size: 144px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #f4f4f5;
      }

      #starfield-demo-title p {
        margin: 24px 0 0;
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: #a1a1aa;
      }

      #starfield-demo-title time {
        margin-top: 40px;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #71717a;
      }

      #starfield-demo-overlay {
        position: absolute;
        inset: 0;
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "Seek-safe night-sky overlay: sparse or dense stars in three size tiers that twinkle and drift in two parallax layers, radial-masked to keep the frame center clear",
 "class": "particles",
 "tags": [
  "starfield",
  "night-sky",
  "stars",
  "twinkle",
  "sky",
  "weather",
  "overlay",
  "ambient",
  "particles",
  "media-treatment-overlay",
  "loopable"
 ],
 "seconds": 6,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "density",
   "type": "choice",
   "default": "sparse",
   "options": [
    "sparse",
    "dense"
   ],
   "what": "Star count across the frame."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "warm",
   "options": [
    "warm",
    "cool",
    "white"
   ],
   "what": "Star color mix."
  },
  {
   "name": "speed",
   "type": "choice",
   "default": "slow",
   "options": [
    "slow",
    "fast"
   ],
   "what": "How fast stars pulse."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"density":"dense"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="starfield-demo"
      data-composition-id="starfield-demo"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="starfield-demo-backdrop"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      ></div>
      <div
        id="starfield-demo-title"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      >
        <h1>Northstar</h1>
        <p>Offline maps for the backcountry</p>
        <time datetime="2026-10-14">October 14, 2026</time>
      </div>
      <div
        id="starfield-demo-overlay"
        data-composition-id="starfield"
       
        data-start="0"
        data-duration="6"
        data-track-index="2"
        data-variable-values='{"density":"dense"}'
        data-width="1920"
        data-height="1080"
      >
    <div
      id="starfield"
      data-composition-id="starfield"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-composition-variables='[
        { "id": "density", "type": "enum", "role": "style", "label": "Density", "description": "Star count across the frame.", "default": "sparse", "options": [{ "value": "sparse", "label": "Sparse" }, { "value": "dense", "label": "Dense" }] },
        { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Star color mix.", "default": "warm", "options": [{ "value": "warm", "label": "Warm (white + yellow)" }, { "value": "cool", "label": "Cool (white + blue)" }, { "value": "white", "label": "White only" }] },
        { "id": "speed", "type": "enum", "role": "style", "label": "Twinkle speed", "description": "How fast stars pulse.", "default": "slow", "options": [{ "value": "slow", "label": "Slow" }, { "value": "fast", "label": "Fast" }] }
      ]'
    >
      <div id="hf-starfield" aria-hidden="true"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      (function () {
        var field = document.getElementById("hf-starfield");
        // Mounted, the runtime strips data-duration off this file's root; the host clip carries it.
        var host = field.closest("[data-composition-id]");
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};

        var TONES = {
          warm: ["#fff7e0", "#ffe08a"],
          cool: ["#f2f8ff", "#a9d6ff"],
          white: ["#ffffff", "#ffffff"],
        };

        var COUNT = vars.density === "dense" ? 420 : 180;
        var palette = Object.prototype.hasOwnProperty.call(TONES, vars.tone)
          ? TONES[vars.tone]
          : TONES.warm;
        var cycleSeconds = vars.speed === "fast" ? 0.9 : 1.6;

        // stop-motion-cadence's rnd(n).
        function rnd(n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        }

        var W = 1920;
        var H = 1080;
        var duration = Number(host.getAttribute("data-duration")) || 6;
        var TAU = 2 * Math.PI;
        var FADE = 0.12; // share of a star's drift spent fading in, and again fading out

        function smooth(x) {
          x = Math.min(1, Math.max(0, x / FADE));
          return x * x * (3 - 2 * x);
        }

        var stars = [];
        for (var i = 0; i < COUNT; i++) {
          // 70% faint 1 px far stars, 25% 1.6 px and 5% bright 2.6 px glowing near stars.
          var r = rnd(i + 7000);
          var tier = r < 0.7 ? 0 : r < 0.95 ? 1 : 2;
          var sizePx = [1, 1.6, 2.6][tier];
          var color = i % 3 === 0 ? palette[1] : palette[0];

          var el = document.createElement("div");
          el.className = "hf-star";
          el.style.width = sizePx + "px";
          el.style.height = sizePx + "px";
          el.style.background = color;
          if (tier === 2) {
            el.style.borderRadius = "50%";
            el.style.boxShadow = "0 0 3px 1px " + color + ", 0 0 8px 2px " + color + "80";
          }
          field.appendChild(el);

          // Whole cycles per star over the mount, drawn independently so the field as a
          // whole repeats only at t = duration, not every cycleSeconds.
          var cycles = Math.max(1, Math.round((duration / cycleSeconds) * (2 + rnd(i + 4000) * 2)));
          stars.push({
            el: el,
            x: rnd(i + 5000) * W - sizePx / 2,
            // Whole-pixel rows keep 1 px stars crisp; x stays fractional so drift is smooth.
            y: Math.round(rnd(i + 6000) * H - sizePx / 2),
            drift: (tier === 0 ? 2 : 5) * duration,
            lag: rnd(i + 8000),
            omega: TAU * cycles,
            phi: TAU * rnd(i + 1000),
            base: 0.75 + rnd(i + 2000) * 0.25,
            amp: tier === 2 ? 0.12 : 0.2 + rnd(i + 3000) * 0.2,
          });
        }

        var state = { phase: 0 };

        function render() {
          var p = state.phase;
          for (var s = 0; s < stars.length; s++) {
            var star = stars[s];
            var u = (p + star.lag) % 1;
            var twinkle = Math.min(1, star.base + star.amp * Math.sin(star.omega * p + star.phi));
            star.el.style.transform =
              "translate3d(" + (star.x - star.drift * (u - 0.5)) + "px," + star.y + "px,0)";
            star.el.style.opacity = twinkle * smooth(u) * smooth(1 - u);
          }
        }

        var tl = gsap.timeline({ paused: true });
        tl.to(state, { phase: 1, duration: duration, ease: "none", onUpdate: render }, 0);
        render();

        window.__timelines["starfield"] = tl;
      })();
    </script>
  </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 6, ease: "none" }, 0);
      window.__timelines["starfield-demo"] = tl;
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
