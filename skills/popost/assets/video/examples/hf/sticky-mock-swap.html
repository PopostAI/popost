<html data-composition-variables='[
    { "id": "captions", "type": "string", "role": "content", "label": "Captions", "description": "Comma-separated feature captions shown beside the pinned mock.", "default": "Instant previews,Zero config,Ship on Friday" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Accent tint used across the mock states.", "default": "violet", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sticky Mock Swap Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --muted: #9ca3af;
        --surface: #151922;
        --border: #3b4352;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(ellipse at 38% 42%, #18211f 0%, #0b0c0e 68%);
      }

      .mount-card {
        width: 84%;
        height: 76%;
        left: 8%;
        top: 12%;
        container-type: size;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 30px;
        background: var(--bg);
        box-shadow: 0 44px 120px rgba(0, 0, 0, 0.5);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A pinned product mock cross-fades through accent-tinted feature states while matching captions rise, hold, and exit beside it.",
 "class": "transition",
 "tags": [
  "motion-primitive",
  "product-demo",
  "sticky",
  "mock",
  "crossfade",
  "feature-tour"
 ],
 "seconds": 6,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "captions",
   "type": "text",
   "default": "Instant previews,Zero config,Ship on Friday",
   "maxLength": 200,
   "what": "Comma-separated feature captions shown beside the pinned mock."
  },
  {
   "name": "accent",
   "type": "choice",
   "default": "violet",
   "options": [
    "green",
    "blue",
    "violet"
   ],
   "what": "Accent tint used across the mock states."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"captions":"Draft instantly,Review together,Publish safely,Measure impact","accent":"green"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="sticky-mock-swap-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
      data-fps="30"
    >
      <div
        id="sticky-mock-swap-mount"
        class="mount-card clip"
        data-composition-id="sticky-mock-swap"
       
        data-variable-values='{"captions":"Draft instantly,Review together,Publish safely,Measure impact","accent":"green"}'
        data-start="0"
        data-duration="6"
        data-track-index="0"
        data-width="1613"
        data-height="821"
      >
      <div id="root" data-composition-id="sticky-mock-swap" data-duration="6" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0b0c0e);
            color: var(--fg, #f8fafc);
            font-family: var(--font-body, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .sms-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .sms-shell {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1.16fr) minmax(0, 0.84fr);
            align-items: center;
            gap: 5cqw;
            padding: 8cqh 7cqw;
          }

          .sms-mock {
            position: relative;
            width: 100%;
            height: 70cqh;
            overflow: hidden;
            border: 0.12cqmin solid color-mix(in srgb, var(--border, #334155) 74%, transparent);
            border-radius: 2.8cqmin;
            background: var(--surface, #121722);
            box-shadow: 0 4cqh 10cqh color-mix(in srgb, #000 46%, transparent);
          }

          .sms-states,
          .sms-state {
            position: absolute;
            inset: 0;
          }

          .sms-state {
            --sms-live: 0.64;
            display: grid;
            grid-template-rows: 8cqh minmax(0, 1fr);
            overflow: hidden;
            opacity: 0;
            background: color-mix(in srgb, var(--surface, #121722) 94%, var(--sms-accent));
          }

          .sms-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.2cqw;
            border-bottom: 0.1cqmin solid
              color-mix(in srgb, var(--border, #334155) 62%, transparent);
            background: color-mix(in srgb, #0f131c 92%, var(--sms-accent));
          }

          .sms-dots {
            display: flex;
            gap: 0.55cqw;
          }

          .sms-dots i {
            width: 0.62cqw;
            aspect-ratio: 1;
            border-radius: 50%;
            background: color-mix(in srgb, var(--muted, #94a3b8) 46%, transparent);
          }

          .sms-status {
            width: 7.4cqw;
            height: 1.2cqh;
            border-radius: 1cqmin;
            opacity: var(--sms-live);
            background: var(--sms-accent);
          }

          .sms-window {
            display: grid;
            grid-template-columns: 24% minmax(0, 1fr);
            min-height: 0;
          }

          .sms-sidebar {
            display: flex;
            flex-direction: column;
            gap: 2.3cqh;
            padding: 3.2cqh 1.8cqw;
            border-right: 0.1cqmin solid color-mix(in srgb, var(--border, #334155) 52%, transparent);
            background: color-mix(in srgb, #0e121a 94%, var(--sms-accent));
          }

          .sms-sidebar i,
          .sms-title,
          .sms-subtitle,
          .sms-block {
            display: block;
            border-radius: 0.7cqmin;
            background: color-mix(in srgb, var(--muted, #94a3b8) 20%, transparent);
          }

          .sms-sidebar i {
            width: 82%;
            height: 1.2cqh;
          }

          .sms-sidebar i:first-child {
            width: 100%;
            background: color-mix(in srgb, var(--sms-accent) 54%, transparent);
          }

          .sms-main {
            position: relative;
            min-width: 0;
            padding: 4.4cqh 2.5cqw;
          }

          .sms-title {
            width: 46%;
            height: 2.1cqh;
            background: color-mix(in srgb, var(--fg, #f8fafc) 44%, transparent);
          }

          .sms-subtitle {
            width: 68%;
            height: 1.2cqh;
            margin-top: 1.8cqh;
          }

          .sms-canvas {
            position: absolute;
            inset: 11.5cqh 2.5cqw 4.2cqh;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 1.5cqmin;
          }

          .sms-block {
            position: relative;
            overflow: hidden;
            border: 0.1cqmin solid color-mix(in srgb, var(--border, #334155) 54%, transparent);
            background: color-mix(in srgb, #263044 54%, transparent);
          }

          .sms-block::after {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            bottom: 16%;
            height: 0.8cqh;
            border-radius: 1cqmin;
            opacity: var(--sms-live);
            background: var(--sms-accent);
          }

          .sms-state--2 .sms-canvas {
            grid-template-columns: 1fr;
            grid-template-rows: repeat(4, minmax(0, 1fr));
          }

          .sms-state--2 .sms-block::after {
            left: 8%;
            right: 35%;
            bottom: 28%;
          }

          .sms-state--3 .sms-canvas {
            grid-template-columns: 1.45fr 0.55fr;
            grid-template-rows: repeat(3, minmax(0, 1fr));
          }

          .sms-state--3 .sms-block:first-child {
            grid-row: 1 / 4;
          }

          .sms-state--3 .sms-block::after {
            left: 10%;
            right: 18%;
            bottom: 18%;
          }

          .sms-captions {
            position: relative;
            width: 100%;
            height: 32cqh;
          }

          .sms-caption {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            max-width: 34cqw;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            font-size: 5.8cqmin;
            font-weight: 720;
            line-height: 1.04;
            letter-spacing: -0.04em;
            overflow-wrap: anywhere;
            opacity: 0;
            will-change: transform, opacity;
          }

          .sms-caption::before {
            content: "";
            flex: 0 0 auto;
            align-self: center;
            width: 0.75cqw;
            height: 9cqh;
            margin-right: 1.5cqw;
            border-radius: 1cqmin;
            background: var(--sms-accent);
            box-shadow: 0 0 2cqmin color-mix(in srgb, var(--sms-accent) 48%, transparent);
          }
        </style>

        <div
          id="sticky-mock-swap-clip"
          class="sms-clip clip"
          data-start="0"
          data-duration="6"
          data-track-index="0"
        >
          <div class="sms-shell">
            <div class="sms-mock" aria-hidden="true">
              <div class="sms-states"></div>
            </div>
            <div class="sms-captions" aria-label="Feature captions"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var captionsHost = root.querySelector(".sms-captions");
            var statesHost = root.querySelector(".sms-states");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var DEFAULT_CAPTIONS = ["Instant previews", "Zero config", "Ship on Friday"];
            var captionsSource =
              vars.captions == null ? DEFAULT_CAPTIONS.join(",") : String(vars.captions);
            var captions = captionsSource.split(",").reduce(function (parsed, token) {
              var caption = token.trim();
              if (caption) parsed.push(caption);
              return parsed;
            }, []);
            if (captions.length === 0) captions = DEFAULT_CAPTIONS.slice();

            var accent =
              vars.accent === "green" || vars.accent === "blue" || vars.accent === "violet"
                ? vars.accent
                : "violet";
            var accentColors = {
              green: "var(--brand, #34d399)",
              blue: "var(--accent, #38bdf8)",
              violet: "var(--accent-2, #a78bfa)",
            };
            root.style.setProperty("--sms-accent", accentColors[accent]);

            var captionElements = [];
            var stateElements = [];

            captions.forEach(function (captionText, index) {
              var caption = document.createElement("div");
              caption.className = "sms-caption";
              caption.textContent = captionText;
              captionsHost.appendChild(caption);
              captionElements.push(caption);

              var state = document.createElement("div");
              state.className = "sms-state sms-state--" + ((index % 3) + 1);
              state.setAttribute("aria-hidden", "true");
              state.innerHTML =
                '<div class="sms-toolbar"><span class="sms-dots"><i></i><i></i><i></i></span><span class="sms-status"></span></div>' +
                '<div class="sms-window"><aside class="sms-sidebar"><i></i><i></i><i></i><i></i></aside>' +
                '<main class="sms-main"><span class="sms-title"></span><span class="sms-subtitle"></span>' +
                '<div class="sms-canvas"><i class="sms-block"></i><i class="sms-block"></i><i class="sms-block"></i><i class="sms-block"></i></div></main></div>';
              statesHost.appendChild(state);
              stateElements.push(state);
            });

            var durationValue = parseFloat(root.dataset.duration || "6");
            var duration = Number.isFinite(durationValue) ? Math.max(0.001, durationValue) : 6;

            // Caption count owns the threshold grid. Longer durations add only
            // to each phase's HOLD, never by scaling the completed timeline.
            var phaseDuration = duration / captions.length;
            var RISE_BASE = 0.38;
            var EXIT_DELAY_BASE = 0.28;
            var EXIT_BASE = 0.32;
            var MOTION_BASE = RISE_BASE + EXIT_DELAY_BASE + EXIT_BASE;
            var motionScale = phaseDuration < MOTION_BASE ? phaseDuration / MOTION_BASE : 1;
            var RISE = RISE_BASE * motionScale;
            var EXIT_DELAY = EXIT_DELAY_BASE * motionScale;
            var EXIT = EXIT_BASE * motionScale;
            var HOLD = Math.max(0, phaseDuration - RISE - EXIT_DELAY - EXIT);
            var SWAP = Math.min(0.28 * motionScale, phaseDuration * 0.4);

            captionElements.forEach(function (caption, index) {
              gsap.set(caption, { opacity: 0, x: "-1.2cqw", y: "3.6cqh" });
              gsap.set(stateElements[index], { opacity: index === 0 ? 1 : 0, "--sms-live": 0.64 });
            });

            var tl = gsap.timeline({ paused: true });

            captionElements.forEach(function (caption, index) {
              var phaseStart = index * phaseDuration;
              var riseArc = RISE * 0.72;
              var exitStart = phaseStart + RISE + HOLD + EXIT_DELAY;
              var exitArc = EXIT * 0.32;

              // IN: two authored segments form a shallow arrival arc.
              tl.fromTo(
                caption,
                { opacity: 0, x: "-1.2cqw", y: "3.6cqh" },
                {
                  opacity: 1,
                  x: "0.45cqw",
                  y: "-0.28cqh",
                  duration: riseArc,
                  ease: "power2.out",
                },
                phaseStart,
              );
              tl.to(
                caption,
                {
                  x: "0cqw",
                  y: "0cqh",
                  duration: RISE - riseArc,
                  ease: "power2.out",
                },
                phaseStart + riseArc,
              );

              if (index > 0) {
                tl.to(
                  stateElements[index - 1],
                  { opacity: 0, duration: SWAP, ease: "power2.in" },
                  phaseStart,
                );
                tl.fromTo(
                  stateElements[index],
                  { opacity: 0 },
                  { opacity: 1, duration: SWAP, ease: "power2.out" },
                  phaseStart,
                );
              }

              // HOLD: the mock content breathes without moving the pinned panel.
              if (HOLD >= 0.4) {
                tl.to(
                  stateElements[index],
                  {
                    "--sms-live": 0.9,
                    duration: HOLD / 2,
                    ease: "sine.inOut",
                    yoyo: true,
                    repeat: 1,
                  },
                  phaseStart + RISE,
                );
              }

              // OUT: EXIT_DELAY is empty stillness, then two segments arc upward.
              tl.to(
                caption,
                {
                  x: "0.42cqw",
                  y: "-0.9cqh",
                  duration: exitArc,
                  ease: "power2.in",
                },
                exitStart,
              );
              tl.to(
                caption,
                {
                  opacity: 0,
                  x: "-1.1cqw",
                  y: "-4.5cqh",
                  duration: EXIT - exitArc,
                  ease: "power2.in",
                },
                exitStart + exitArc,
              );
            });

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["sticky-mock-swap"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["sticky-mock-swap-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
