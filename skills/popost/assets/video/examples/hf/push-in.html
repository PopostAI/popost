<html data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Headline", "description": "Text centered in the camera frame.", "default": "Focus" },
    { "id": "intensity", "type": "enum", "role": "motion", "label": "Push intensity", "description": "Final camera scale reached by the push.", "default": "standard", "options": [{ "value": "subtle", "label": "Subtle" }, { "value": "standard", "label": "Standard" }, { "value": "bold", "label": "Bold" }] }
  ]' lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Push In Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      #root {
        --bg: #0b0c0e;
        --fg: #f8fafc;
        --surface: #343b4d;
        --border: #3f4658;
        --font-display: Inter, system-ui, sans-serif;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0e;
      }

      .mount-card {
        width: 76%;
        height: 72%;
        left: 12%;
        top: 14%;
        container-type: size;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 32px;
        background: var(--bg);
        box-shadow: 0 48px 120px rgba(0, 0, 0, 0.52);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A centered headline gains focus through one slow, continuous camera push and a gentle fade out.",
 "class": "camera",
 "tags": [
  "motion-primitive",
  "camera",
  "push-in",
  "focus",
  "emphasize",
  "holdable"
 ],
 "seconds": 4,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "text",
   "type": "text",
   "default": "Focus",
   "maxLength": 200,
   "what": "Text centered in the camera frame."
  },
  {
   "name": "intensity",
   "type": "choice",
   "default": "standard",
   "options": [
    "subtle",
    "standard",
    "bold"
   ],
   "what": "Final camera scale reached by the push."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {"text":"Look closer","intensity":"bold"};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0,"cue":"whoosh","gain":0.5}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="root"
      data-composition-id="push-in-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-fps="30"
    >
      <div
        id="push-in-mount"
        class="mount-card clip"
        data-composition-id="push-in"
       
        data-variable-values='{"text":"Look closer","intensity":"bold"}'
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1459"
        data-height="778"
      >
      <div id="root" data-composition-id="push-in" data-duration="4" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f8fafc);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
            pointer-events: none;
          }

          .pi-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .pi-camera {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
              radial-gradient(
                ellipse at 50% 48%,
                color-mix(in srgb, var(--surface, #303747) 92%, white) 0%,
                var(--surface, #303747) 27%,
                var(--bg, #0b0c0e) 100%
              ),
              var(--bg, #0b0c0e);
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          .pi-camera::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
              ellipse at 50% 48%,
              transparent 24%,
              color-mix(in srgb, var(--bg, #0b0c0e) 20%, transparent) 58%,
              color-mix(in srgb, var(--bg, #0b0c0e) 88%, transparent) 100%
            );
          }

          .pi-headline {
            position: relative;
            z-index: 1;
            width: min(78cqw, 116cqh);
            color: var(--fg, #f8fafc);
            font-size: clamp(24px, 12cqw, 144px);
            font-weight: 740;
            line-height: 0.94;
            letter-spacing: -0.055em;
            text-align: center;
            overflow-wrap: anywhere;
            text-shadow: 0 1.5cqh 5cqh color-mix(in srgb, var(--bg, #0b0c0e) 62%, transparent);
          }
        </style>

        <div
          id="push-in-clip"
          class="pi-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="pi-camera">
            <div class="pi-headline"></div>
          </div>
        </div>

        <script src="../lib/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var camera = root.querySelector(".pi-camera");
            var headline = root.querySelector(".pi-headline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "Focus" : String(vars.text);
            var intensity =
              vars.intensity === "subtle" || vars.intensity === "bold"
                ? vars.intensity
                : "standard";
            var scales = { subtle: 1.08, standard: 1.12, bold: 1.18 };
            var finalScale = scales[intensity];

            headline.textContent = text;

            var IN_BASE = 0.8;
            var OUT_BASE = 0.65;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var fixedDuration = IN_BASE + OUT_BASE;
            var phaseScale = duration < fixedDuration ? duration / fixedDuration : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;
            var inScale = HOLD > 0 ? 1 + (finalScale - 1) * 0.24 : finalScale;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              camera,
              { scale: 1, opacity: 1 },
              { scale: inScale, opacity: 1, duration: IN, ease: "sine.inOut" },
              0,
            );
            if (HOLD > 0) {
              tl.to(camera, { scale: finalScale, duration: HOLD, ease: "none" }, IN);
            }
            tl.to(camera, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["push-in"] = tl;
          })();
        </script>
      </div>
    </div>
    </div>

    <script src="../lib/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["push-in-demo"] = gsap.timeline({ paused: true });
    </script>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
