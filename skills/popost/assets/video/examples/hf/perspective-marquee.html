<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Perspective Marquee - Demo</title>
    <script src="../lib/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        /* ponytail: scale on wrapper — GSAP only targets the inner div, so CSS transform is safe here */
        transform: scale(3);
      }
      .hf-catalog-perspective-marquee {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-perspective-marquee {
        width: 580px;
        perspective: 900px;
        overflow: hidden;
        transform: rotateX(18deg);
      }
      .hf-catalog-perspective-marquee div {
        display: inline-flex;
        gap: 22px;
        white-space: nowrap;
        transform: translateX(var(--hf-marquee-x, 0px));
      }
      .hf-catalog-perspective-marquee span {
        padding: 12px 18px;
        border-radius: 999px;
        background: #18181b;
        color: #fff;
        font-size: 28px;
        box-shadow: 0 18px 44px rgba(24, 24, 27, 0.18);
      }
    </style>
  <style id="popost-fit">
  html, body { margin: 0 !important; width: 1280px; height: 720px; overflow: hidden !important; background: #000000; }
  #popost-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
</style>
<script type="application/json" id="popost-params">
{
 "about": "A 3D tilted marquee with depth feel as items roll toward the horizon.",
 "class": "3d",
 "tags": [
  "motion-primitive",
  "typography"
 ],
 "seconds": 5,
 "params": [
  {
   "name": "fit",
   "type": "choice",
   "default": "contain",
   "options": [
    "contain",
    "cover"
   ],
   "what": "how the 1920x1080 composition is fitted into the canvas: whole with bars, or filling it and cropped"
  },
  {
   "name": "tilt",
   "type": "choice",
   "default": "standard",
   "options": [
    "flat",
    "standard",
    "steep"
   ],
   "what": "How far the marquee plane leans back toward the horizon."
  },
  {
   "name": "travel",
   "type": "choice",
   "default": "standard",
   "options": [
    "short",
    "standard",
    "long"
   ],
   "what": "Scales the offset the timeline drives, so the strip covers a shorter or longer run in the same time."
  },
  {
   "name": "tone",
   "type": "choice",
   "default": "ink",
   "options": [
    "ink",
    "paper",
    "accent"
   ],
   "what": "Pill colour: ink for light frames, paper for dark ones, accent rides the brand token."
  },
  {
   "name": "words",
   "type": "text",
   "default": "COMPONENTS, PRIMITIVES, TRANSITIONS, AGENTS",
   "maxLength": 200,
   "what": "Comma separated pill labels. The list is laid down twice so the strip still reads as a continuous loop."
  }
 ],
 "values": {}
}
</script>
<script>
  /* popost: the scene's parameters stand in for HyperFrames variables; random numbers are seeded; the composition is
     scaled into the canvas; clips are shown and hidden from the scene's time. */
  (function () {
    var block = document.getElementById('popost-params');
    var values = block ? (JSON.parse(block.textContent).values || {}) : {};
    var vars = {};
    Object.keys(values).forEach(function (k) { if (k !== 'fit') vars[k] = values[k] === 'true' ? true : values[k] === 'false' ? false : values[k]; });
    window.__hyperframes = { getVariables: function () { return vars; } };
    var seed = 20240229;
    window.__popostRandom = function () { seed = (seed + 0x6d2b79f5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    window.__popostFit = function () {
      // The canvas, from the size this file declares: a scene of a later shot loads in a layer that is not displayed, where the page measures 0.
      var size = /width: (\d+)px; height: (\d+)px;/.exec(document.getElementById('popost-fit').textContent);
      var W = 1920, H = 1080, s = document.getElementById('popost-stage'), cw = Number(size[1]), ch = Number(size[2]);
      var k = (values.fit === 'cover' ? Math.max : Math.min)(cw / W, ch / H);
      s.style.transform = 'translate(' + (cw - W * k) / 2 + 'px,' + (ch - H * k) / 2 + 'px) scale(' + k + ')';
      var clips = Array.prototype.slice.call(s.querySelectorAll('.clip[data-start]')).filter(function (c) { return isFinite(parseFloat(c.getAttribute('data-start'))) && c.parentNode !== s; });
      // A mounted composition that starts later in its host runs on its own time.
      [].forEach(function (m) {
        var tl = window.__timelines && window.__timelines[m.id];
        if (tl) window.__timelines[m.id] = { pause: function () { tl.pause(); }, seek: function (t) { tl.seek(Math.max(0, t - m.start)); }, duration: function () { return tl.duration() + m.start; } };
      });
      var scene = (window.__popostScene = window.__popostScene || {}), before = scene.render;
      scene.render = function (seconds, fps) {
        if (before) before(seconds, fps);
        for (var i = 0; i < clips.length; i++) {
          var a = parseFloat(clips[i].getAttribute('data-start')), d = parseFloat(clips[i].getAttribute('data-duration'));
          clips[i].style.visibility = seconds >= a && (!isFinite(d) || seconds < a + d) ? 'visible' : 'hidden';
        }
      };
    };
  })();
</script>
<script type="application/json" id="popost-cues">[{"at":0.5,"cue":"swish","gain":0.4}]</script>
</head>
  <body>
<div id="popost-stage">
    <div
      id="demo"
      data-composition-id="perspective-marquee-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-catalog-perspective-marquee"
          data-composition-variables='[
    { "id": "tilt", "type": "enum", "role": "style", "label": "Tilt", "description": "How far the marquee plane leans back toward the horizon.", "default": "standard", "options": [{ "value": "flat", "label": "Flat" }, { "value": "standard", "label": "Standard" }, { "value": "steep", "label": "Steep" }] },
    { "id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "Scales the offset the timeline drives, so the strip covers a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "short", "label": "Short" }, { "value": "standard", "label": "Standard" }, { "value": "long", "label": "Long" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Pill colour: ink for light frames, paper for dark ones, accent rides the brand token.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "Comma separated pill labels. The list is laid down twice so the strip still reads as a continuous loop.", "default": "COMPONENTS, PRIMITIVES, TRANSITIONS, AGENTS" }
  ]'
        >
          <div>
            <span>COMPONENTS</span><span>PRIMITIVES</span><span>TRANSITIONS</span><span>AGENTS</span
            ><span>COMPONENTS</span><span>PRIMITIVES</span><span>TRANSITIONS</span
            ><span>AGENTS</span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var tilts = { flat: "6deg", standard: "18deg", steep: "34deg" };
          var reaches = { short: 0.55, standard: 1, long: 1.8 };
          var tones = {
            ink: { bg: "#18181b", fg: "#fff" },
            paper: { bg: "#fafafa", fg: "#18181b" },
            accent: { bg: "var(--brand, #34d399)", fg: "#fff" },
          };
          var defaultWords = "COMPONENTS, PRIMITIVES, TRANSITIONS, AGENTS";

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          function parseWords(value) {
            var source = typeof value === "string" ? value : "";
            var parts = source.split(",");
            var words = [];
            for (var i = 0; i < parts.length; i += 1) {
              var word = parts[i].trim();
              if (word) words.push(word);
            }
            return words.length ? words : parseWords(defaultWords);
          }

          var tilt = tilts[pick(tilts, vars.tilt, "standard")];
          var reach = reaches[pick(reaches, vars.travel, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];
          var words = parseWords(vars.words);

          var roots = document.querySelectorAll(".hf-catalog-perspective-marquee");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-marquee-tilt", tilt);
            roots[i].style.setProperty("--hf-marquee-reach", String(reach));
            roots[i].style.setProperty("--hf-marquee-pill-bg", tone.bg);
            roots[i].style.setProperty("--hf-marquee-pill-fg", tone.fg);

            var strip = roots[i].querySelector("div");
            if (!strip) continue;
            var markup = "";
            for (var pass = 0; pass < 2; pass += 1) {
              for (var w = 0; w < words.length; w += 1) {
                markup +=
                  "<span>" + words[w].replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
              }
            }
            strip.innerHTML = markup;
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-perspective-marquee div",
          { "--hf-marquee-x": "0px" },
          { "--hf-marquee-x": "-360px", duration: 4.5, ease: "none" },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["perspective-marquee-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-perspective-marquee {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-perspective-marquee {
        width: 720px;
        perspective: 900px;
        overflow: hidden;
        transform: rotateX(var(--hf-marquee-tilt, 18deg));
      }
      .hf-catalog-perspective-marquee div {
        display: inline-flex;
        gap: 22px;
        white-space: nowrap;
        transform: translateX(calc(var(--hf-marquee-x, 0px) * var(--hf-marquee-reach, 1)));
      }
      .hf-catalog-perspective-marquee span {
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--hf-marquee-pill-bg, #18181b);
        color: var(--hf-marquee-pill-fg, #fff);
        font-size: 28px;
        box-shadow: 0 18px 44px rgba(24, 24, 27, 0.18);
      }
    </style>
  </div>
<script>window.__popostFit();</script>
</body>
</html>
