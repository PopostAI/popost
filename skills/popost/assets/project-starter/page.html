<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--paper:#f6f3ec;--ink:#183c31;--font-display:system-ui,sans-serif;--font-body:system-ui,sans-serif}
.post{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;background:var(--paper);color:var(--ink);overflow:hidden}
.title{position:absolute;left:80px;top:100px;width:880px;font:700 64px/1.15 var(--font-display)}
.lede{position:absolute;left:80px;top:340px;width:860px;font:28px/1.5 var(--font-body)}
</style></head><body><div class="post" data-canvas-width="{{WIDTH}}" data-canvas-height="{{HEIGHT}}">
<h1 class="title" data-layer-id="{{ID}}.title"><span data-slot>{{NAME}}</span></h1>
<p class="lede" data-layer-id="{{ID}}.lede"><span data-slot>Edit this live text layer. Replace the starter before delivery.</span></p>
</div></body></html>
